<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconnect Monarch · Cohen</title>
<style>body{margin:0;background:#0b1220;color:#e5edf7;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{max-width:440px;padding:36px;background:#152033;border-radius:18px;margin:24px}h1{font-size:25px}p{color:#afbed2;line-height:1.6}label{display:block;margin-top:20px}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin-top:8px;border-radius:8px;border:1px solid #43516b;background:#0b1220;color:inherit;font:inherit}button{background:#8275e9;border:0;cursor:pointer;margin-top:24px}a{color:#a69aff}#status{white-space:pre-line}</style>
<main><h1>Reconnect Monarch</h1><p>Monarch requires a verification code for this session. Verify once here; the planner will save the session and handle ordinary expiry automatically.</p><form id="verifyForm">
<label for="method">Code type</label><select id="method" name="method"><option value="email">Code sent by email</option><option value="totp">Authenticator code</option></select>
<label for="code">Verification code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
<input type="hidden" id="nonce" value="__NONCE__"><button type="submit">Verify and catch up</button></form><p id="status" role="status"></p><a href="/">Back to planner</a></main>
<script>document.getElementById('verifyForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button'),s=document.getElementById('status'),c=document.getElementById('code');b.disabled=true;s.textContent='Verifying with Monarch…';try{const r=await fetch('/api/monarch-session/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c.value,method:document.getElementById('method').value,nonce:document.getElementById('nonce').value})});c.value='';const d=await r.json();if(!r.ok)throw new Error(d.error||'Verification failed.');s.textContent=d.importError?'Session saved. Transaction import stopped: '+d.importError:'Monarch reconnected and transactions caught up. Automatic session renewal is enabled.';if(!d.importError)e.target.hidden=true;}catch(err){s.textContent=err.message;}finally{b.disabled=false;}});</script></html>
