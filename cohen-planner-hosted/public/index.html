<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f9fc;
  --s1:#ffffff;
  --s2:#fafbfc;
  --s3:#f0f4f8;
  --bd:#e6ebf1;
  --bd2:#d0d7de;
  --tx:#0a2540;
  --t2:#425466;
  --t3:#8898aa;
  --t4:#adbdcc;
  --accent:#635bff;
  --accent-d:#4f48cc;
  --accent-soft:#eeecff;
  --g:#1a8754;
  --g-soft:#e7f4ed;
  --r:#cd3d64;
  --r-soft:#fceaee;
  --a:#bf6900;
  --a-soft:#fdf3e3;
  --b:#0073e6;
  --b-soft:#e6f1ff;
  --c:#0891b2;
  --p:#7c3aed;
  --shadow-sm:0 1px 2px rgba(50,71,92,.04);
  --shadow:0 2px 5px rgba(50,71,92,.06),0 1px 2px rgba(50,71,92,.04);
  --shadow-lg:0 8px 20px rgba(50,71,92,.08),0 2px 6px rgba(50,71,92,.04);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);padding:14px 18px;min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv11'}
body[data-view=inputs] #heroBand,body[data-view=inputs] #kpis,body[data-view=inputs] #scenarioBar,body[data-view=inputs] #snapshotBar,
body[data-view=advisor] #heroBand,body[data-view=advisor] #kpis{display:none}
body[data-view=inputs] #chartArea{background:transparent;border:0;box-shadow:none;padding:0}
body[data-view=inputs] #controls{display:block!important;max-height:none;width:100%;margin:0;padding:22px;border-radius:14px}
.demo-banner{display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(90deg,#4038a7,#635bff);color:#fff;
  padding:8px 14px;margin:-14px -18px 12px;font-size:11px;font-weight:650;letter-spacing:.15px;position:sticky;top:0;z-index:80}
.demo-banner button{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:7px;padding:4px 9px;font:inherit;cursor:pointer}
.mono{font-family:'SF Mono','Fira Code','Courier New',monospace}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:14px}
.hdr h1{font-size:16px;font-weight:600;color:var(--tx);letter-spacing:-.3px}
.hdr-right{display:flex;align-items:center;gap:10px}
.sync-pill{font-size:9px;font-family:'SF Mono',monospace;color:var(--t3);transition:color .2s}
.sync-pill.saving{color:var(--a)}
.sync-pill.synced{color:var(--g)}
.sync-pill.error{color:var(--r)}
.logout-btn{font-size:10px;padding:5px 11px;background:rgba(255,255,255,.55);border:1px solid var(--bd);border-radius:7px;cursor:pointer;font-family:inherit;color:var(--t3);transition:all .14s}
.logout-btn:hover{border-color:var(--r);color:var(--r)}
.layout{display:grid;grid-template-columns:268px 1fr;gap:12px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;max-height:calc(100vh - 70px);overflow-y:auto;box-shadow:var(--shadow-sm)}
.panel::-webkit-scrollbar{width:5px}.panel::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.st{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin:12px 0 6px}
.sr{margin-bottom:8px}.sr .sh{display:flex;justify-content:space-between;margin-bottom:2px}
.sr .sl{font-size:10px;color:var(--t2);font-weight:500}.sr .sv{font-size:10px;color:var(--tx);font-family:'SF Mono',monospace;font-weight:600}
.sr input[type=range]{width:100%;accent-color:var(--accent);height:3px;cursor:pointer}
.kpi-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.kpi:hover{box-shadow:var(--shadow)}
.kpi-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px}
.kpi-v{font-size:16px;font-weight:700;font-family:'SF Mono',monospace;letter-spacing:-.5px;color:var(--tx)}
.kpi-s{font-size:9.5px;color:var(--t2);margin-top:2px}
.tabs{display:flex;gap:3px;margin-bottom:10px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:3px;box-shadow:var(--shadow-sm)}
.tabs button{padding:6px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:inherit;transition:all .12s}
.tabs button:hover{color:var(--tx);background:var(--s3)}
.tabs button.active{background:linear-gradient(135deg,#6e66ff,#5048d6);color:#fff;font-weight:600}
.snap-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.snap-chip{padding:4px 9px;border-radius:6px;font-size:9.5px;font-weight:500;cursor:pointer;border:1px solid rgba(8,145,178,.3);background:#e0f7fa;color:var(--c);display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .12s}
.snap-chip.active{background:var(--c);color:#fff}
.snap-chip .x{font-size:8px;opacity:.6;margin-left:3px}.snap-chip .x:hover{opacity:1;color:var(--r)}
@media print{
  body{padding:0;font-size:11px}
  .panel,#subToggle,#moreBtn,#moreMenu,.logout-btn,.sync-pill,.adv-input-area,.scenario-bar,.snap-bar{display:none!important}
  .tabs button:not(.active){display:none}
  .layout{grid-template-columns:1fr;display:block}
  .cc,.kpi,.sc{box-shadow:none;border-color:#ccc}
  @page{margin:1.2cm}
}
.cc{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:11px;box-shadow:var(--shadow-sm)}
.sc h3{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:4px}
.sc p{font-size:10.5px;color:var(--t2);line-height:1.55}
.tw{max-height:340px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:-.1px}
th{padding:8px 9px;text-align:right;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);border-bottom:1px solid var(--bd);font-family:'Inter',sans-serif;position:sticky;top:0;background:var(--s2);z-index:1}
td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--bd);color:var(--t2)}
tr:hover td{background:var(--s2)}
.btn{padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--s1);color:var(--t2);font-size:10px;font-weight:500;cursor:pointer;width:100%;margin-top:3px;font-family:inherit;transition:all .12s}
.btn:hover{border-color:var(--bd2);color:var(--tx);background:var(--s2)}
.btn-g{border-color:rgba(99,91,255,.3);color:var(--accent);background:var(--accent-soft)}
.btn-g:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.scenario-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.scenario-chip{padding:4px 10px;border-radius:6px;font-size:9.5px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--s1);color:var(--t2);display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .12s}
.scenario-chip:hover{border-color:var(--bd2);color:var(--tx);background:var(--s2)}
.scenario-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.scenario-chip .x{font-size:8px;opacity:.5;margin-left:3px;cursor:pointer}.scenario-chip .x:hover{opacity:1;color:var(--r)}
.solo-box{background:var(--g-soft);border:1px solid rgba(26,135,84,.2);border-radius:6px;padding:8px 10px;margin:5px 0 7px;font-size:10px;color:var(--t2)}
/* Norm's per-year comp grid: year | cash | stripe stock | derived total */
.comp-grid{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:3px;align-items:center;margin-bottom:3px}
.comp-head{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);margin-bottom:4px}
.comp-head span:last-child{text-align:right}
.comp-yr{font-size:8.5px;font-weight:600;color:var(--t3);font-variant-numeric:tabular-nums}
.comp-in{width:100%;min-width:0;padding:4px 5px;border:1px solid var(--bd);border-radius:5px;background:var(--s1);color:var(--tx);font-family:'SF Mono',ui-monospace,monospace;font-size:9.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.comp-in:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(99,91,255,.12)}
/* Stripe keeps a distinct violet identity everywhere it appears, so equity never reads
   as part of the diversified portfolio. */
.comp-in.comp-stock{border-color:rgba(103,114,229,.35);background:rgba(103,114,229,.05);color:#4c3fd6}
.comp-in.comp-stock:focus{border-color:#6772e5;box-shadow:0 0 0 2px rgba(103,114,229,.15)}
.comp-tot{font-size:8.5px;font-weight:600;color:var(--t2);text-align:right;font-variant-numeric:tabular-nums}
.stripe-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(103,114,229,.08);border:1px solid rgba(103,114,229,.25);border-radius:5px;padding:5px 7px;font-size:8px;line-height:1.45;color:var(--t2);width:100%;margin-bottom:4px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(3,1fr)}.sg{grid-template-columns:1fr}}
@media(max-width:640px){
  body{padding:8px 10px}
  .hdr{flex-direction:column;align-items:flex-start;gap:6px;padding-bottom:8px;margin-bottom:8px}
  .hdr h1{font-size:13px}
  .hdr-right{flex-wrap:wrap;gap:5px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:8px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;padding:5px 8px;font-size:10px}
  .layout{display:block}
  .panel{display:none;margin-bottom:10px;max-height:70vh;overflow-y:auto}
  .panel.mob-open{display:block}
  #mobileControlsToggle{display:flex}
  .tw{overflow-x:auto}
  .cc{padding:10px}
  .snap-bar{gap:4px}
  .scenario-bar{gap:4px}
}
@media(min-width:641px){#mobileControlsToggle{display:none}}
/* The advisor's visual design now lives entirely in ui.css, with the rest of the system.
   What remains here is only the structure the markdown renderer and the proposal panel
   need — shapes with no styling opinion of their own. */
.adv-msgs::-webkit-scrollbar{width:6px}
.adv-msgs::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.adv-bubble pre{background:var(--bg);padding:10px 12px;border-radius:7px;overflow-x:auto;
  margin:10px 0;font-size:12px;border:1px solid var(--bd)}
.adv-bubble table{border-collapse:collapse;margin:12px 0;font-size:13px;width:100%}
.adv-bubble th,.adv-bubble td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left}
.adv-bubble th{font-weight:650;font-size:11px;text-transform:uppercase;color:var(--t3);letter-spacing:.08em}
.adv-bubble h3{font-size:16px;font-weight:600;margin:16px 0 6px;color:var(--tx)}
.adv-bubble h4{font-size:14px;font-weight:600;margin:12px 0 4px;color:var(--t2)}

/* A staged proposal: the one place the advisor produces something you can act on. */
.adv-proposals{border:1px solid color-mix(in srgb,var(--link) 34%,transparent);
  border-radius:14px;background:var(--s1);padding:16px 18px;margin:12px 0}
.adv-proposals-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.adv-proposals-hdr h4{font-size:11px;font-weight:650;color:var(--link);text-transform:uppercase;
  letter-spacing:.12em;margin:0}
.adv-proposals-hdr button{background:none;border:0;color:var(--t3);cursor:pointer;font-size:15px;line-height:1;padding:0}
.adv-proposals-hdr button:hover{color:var(--tx)}
.adv-proposal-list{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.adv-proposal-row{display:flex;align-items:center;gap:9px;font-size:13px;padding:8px 11px;
  background:var(--s2);border-radius:9px;flex-wrap:wrap}
.adv-proposal-key{font-family:'SF Mono','Fira Code',monospace;color:var(--tx);font-weight:600;min-width:120px}
.adv-proposal-arrow{color:var(--t4);font-size:11px}
.adv-proposal-old{color:var(--t4);text-decoration:line-through}
.adv-proposal-new{color:var(--link);font-weight:600}
.adv-proposal-reason{color:var(--t3);font-size:12px;margin-left:auto;text-align:right;max-width:230px}
.adv-proposal-dimension{display:flex;gap:6px;align-items:center;min-width:230px}
.adv-proposal-dimension select{appearance:none;background:var(--s2);border:1px solid var(--bd);color:var(--tx);
  border-radius:8px;padding:6px 24px 6px 8px;font:600 12px/1.2 inherit;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);
  background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.adv-proposal-dimension select:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 2px color-mix(in srgb,var(--link) 18%,transparent)}
.adv-proposals-target{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.adv-proposals-target select,.adv-proposals-target input{font-size:13px;padding:8px 10px;
  border-radius:8px;border:1px solid var(--bd2);background:var(--s2);color:var(--tx);font-family:inherit}
.adv-proposals-target select{flex:0 0 auto;min-width:140px}
.adv-proposals-target input{flex:1;min-width:0}
.adv-proposals-actions{display:flex;gap:7px;flex-wrap:wrap}
.adv-proposals-actions button{padding:9px 14px;border-radius:9px;font-size:13px;font-weight:500;
  cursor:pointer;font-family:inherit;min-height:38px;border:1px solid var(--bd2);
  background:var(--s2);color:var(--t2);transition:all .15s}
.adv-proposals-actions button:hover{border-color:var(--bd2);background:var(--s3);color:var(--tx)}
.adv-proposals-apply{background:var(--link)!important;border-color:var(--link)!important;

.adv-proposals-apply:hover{background:var(--link-hover)!important;border-color:var(--link-hover)!important}
.adv-rail-actions{display:flex;gap:3px}
.adv-rail-actions button{width:24px;height:24px;border:0;background:none;color:var(--t4);

.adv-rail-actions button:hover{background:var(--s3);color:var(--tx)}
/* ── Accessibility: visible keyboard focus everywhere ── */

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ── Portfolio responsive grids (replace inline fixed-px so they collapse on mobile) ── */
.pf-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pf-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pf-cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-quad{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.pf-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.glass-card{background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(165%);-webkit-backdrop-filter:blur(18px) saturate(165%);border:1px solid rgba(255,255,255,.65);border-radius:12px;box-shadow:0 1px 1px rgba(10,37,64,.04),0 14px 32px -20px rgba(10,37,64,.28)}
/* Shimmer loading skeleton */
.skel{background:linear-gradient(100deg,rgba(10,37,64,.06) 28%,rgba(10,37,64,.12) 50%,rgba(10,37,64,.06) 72%);background-size:200% 100%;border-radius:8px;animation:shimmer 1.5s ease-in-out infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
@media(max-width:760px){
  .pf-split{grid-template-columns:1fr}
  .pf-kpis{grid-template-columns:repeat(2,1fr)}

}
@media(max-width:480px){
  .pf-kpis{grid-template-columns:1fr 1fr}

/* ═══════════════════════════════════════════════════════════════
   NEXT-GEN VISUAL FOUNDATION — glass / spatial design system
   (1) ambient mesh canvas  (2) glass material + elevation
   (3) typographic scale + tabular numerals  (4) motion layer
   (5) hero net-worth band
   ═══════════════════════════════════════════════════════════════ */

/* (1) Ambient gradient-mesh canvas behind everything ─────────── */
body{background:transparent}
.mesh-bg{position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 42% at 10% 2%, rgba(99,91,255,.16), transparent 62%),
    radial-gradient(34% 40% at 96% 6%, rgba(8,145,178,.13), transparent 60%),
    radial-gradient(40% 42% at 82% 96%, rgba(230,73,128,.09), transparent 62%),
    radial-gradient(42% 46% at 22% 100%, rgba(124,58,237,.10), transparent 64%),
    linear-gradient(180deg,#f7f9fd 0%,#eef2f9 100%);
  filter:saturate(112%);will-change:transform;
  animation:meshDrift 26s ease-in-out infinite alternate}
@keyframes meshDrift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(0,-2.2%,0) scale(1.05)}}

/* (2) Glass material — frosted surfaces + layered elevation ──── */
/* The last of the light-theme glass is gone. This rule painted rgba(255,255,255,.72) on
   .panel, .cc, .kpi, .sc, .tabs and .tw. Dark overrides had been added for most of them one
   at a time — .adv and .adv-wrap were pulled out of it when it covered the advisor header —
   but .panel never got one, so the settings panel stayed a white sheet with dark-theme grey
   text on it: legible only as a smear.
   Every selector here already carries token-based styling of its own (.panel at the top of
   this file, .cc/.kpi/.sc and .tabs in cockpit.css), so removing the override is the whole
   fix rather than the start of another round of patches.
   It also takes a backdrop-filter off six containers. That is not cosmetic: backdrop-filter
   creates a containing block, which is what trapped position:fixed inside #chartArea and
   broke the conversations sheet on a phone. */
.kpi{transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s ease, border-color .2s ease}
.kpi:hover{transform:translateY(-3px);
  box-shadow:0 1px 1px rgba(10,37,64,.04), 0 22px 44px -22px rgba(99,91,255,.45);
  border-color:rgba(99,91,255,.28)}
.cc{transition:box-shadow .25s ease}
.cc:hover{box-shadow:0 1px 1px rgba(10,37,64,.04), 0 22px 48px -26px rgba(10,37,64,.34)}
.tabs button.active{box-shadow:0 6px 16px -6px rgba(99,91,255,.6)}
/* Secondary buttons & chips lift subtly on hover */
.btn,.scenario-chip,.snap-chip,.logout-btn{transition:transform .15s cubic-bezier(.22,1,.36,1),box-shadow .15s ease,border-color .15s ease,background .15s ease,color .15s ease}

.btn-g:hover{box-shadow:0 8px 18px -8px rgba(99,91,255,.7)}

/* (3) Typographic scale + tabular numerals ──────────────────── */
.kpi-v,.hero-v,.sv,.mono,table,td,th,.adv-rail-meta,.sync-pill{font-variant-numeric:tabular-nums;font-feature-settings:'tnum','ss01','cv11'}

.hdr{position:relative;border-bottom:none;padding-bottom:12px}

/* Cohesive thin scrollbars across the app */
*{scrollbar-width:thin;scrollbar-color:rgba(10,37,64,.18) transparent}

::-webkit-scrollbar-thumb{background:rgba(10,37,64,.16);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(99,91,255,.4);background-clip:padding-box}
/* Brand lockup — gradient mark + wordmark */
.brand{display:flex;align-items:center;gap:12px}

/* (4) Motion layer — entrance, count-up, tab cross-fade ─────── */
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* `backwards`, not `both`: a finished animation whose last keyframe is transform:none
   still computes to the identity matrix under `both`, and that creates a containing block
   for every position:fixed descendant. See the same fix on .ui-rise in ui.css. */
.reveal{animation:riseIn .6s cubic-bezier(.22,1,.36,1) backwards}
.tab-fade{animation:fadeIn .4s ease backwards}

/* (5) Hero net-worth band ───────────────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 26px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;

.sr input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;width:100%;cursor:pointer;margin:2px 0}
/* A near-black track at 11% opacity was drawn for a white panel. On the dark one it is

.sr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;

  box-shadow:0 1px 1px rgba(10,37,64,.05),0 40px 80px -24px rgba(99,91,255,.5)}

.story-spark{margin-bottom:18px;display:flex;justify-content:center}

.story-nav{display:flex;gap:10px;margin-top:26px}
.story-nav button{padding:9px 20px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--bd);background:rgba(255,255,255,.7);color:var(--t2);transition:all .15s}

#storyNext:hover{color:#fff}

/* (9) Milestone celebration confetti ──────────────────────────── */
@keyframes confettiFall{

<script>
const COLORS=['#ff6b6b','#ffd43b','#ff922b','#e64980','#20c997','#845ef7','#339af0','#f783ac'];

// ═══ TAX ENGINE + PROJECTION MODEL — see /model.js (loaded above) ═══

// ═══ DEFAULTS ═══
const D={
  planStartYear:2026,
  kid1Birth:2027,kid2Birth:2030,kid3Birth:2034,kid4Birth:2037,numKids:3,
  childcareMonthly:2800,childcareStartMonths:0,
  tuitionInflation:.035,yeshivaStartAge:2,yeshivaEndAge:17,kid1YeshivaStartAge:3,
  housingMode:'buy',rentInflation:0.03,rentCap:15000,startingLiquid:1100000,nycRent:5500,
  // Norm — compensation, split into the two streams that behave differently AFTER tax.
  // Both are ordinary W2 income at vest (identical tax), but cash is spendable while stock
  // arrives as a Stripe asset that only becomes spendable if sold. 11 explicit years,
  // Y0=planStartYear through Y10; each stream compounds at its own growth rate past Y10.
  // Per-year totals match the previous combined figures exactly, so tax is unchanged.
  normCashY0:280000,normCashY1:260000,normCashY2:275000,normCashY3:265000,
  normCashY4:277000,normCashY5:282000,normCashY6:286000,normCashY7:290000,
  normCashY8:295000,normCashY9:299000,normCashY10:304000,
  normStockY0:197000,normStockY1:162000,normStockY2:153000,normStockY3:158000,
  normStockY4:150000,normStockY5:150000,normStockY6:150000,normStockY7:150000,
  normStockY8:150000,normStockY9:150000,normStockY10:150000,
  normGrowth:.01,normStockGrowth:.01,
  // Stripe equity. startingStripeEquity is deliberately 0: every saved plan already holds
  // its whole net worth inside startingLiquid, so seeding this automatically — from a
  // migration or a synced balance — would double-count. Reclassifying is an explicit act.
  startingStripeEquity:0,stripeStartingBasisPct:1,
  // Month (1-12) the Stripe balance above was observed, or null for the start of the year.
  // Vests that had already landed by then are inside that number and must not be added again.
  stripeObservedMonth:null,
  // When the opening balances above were true. Set on first load and whenever they are
  // reconciled against accounts; the first plan year models only what is still ahead of it.
  observedOn:null,
  // Blank means "derive the marginal rate from the tax engine". Set it from a vest paystub
  // to model the employer's actual flat supplemental withholding instead.
  stripeVestWithholdingRate:null,
  stripeRetY0:.15,stripeRetY1:.15,stripeRetY2:.12,stripeRetY3:.12,stripeRetY4:.10,
  stripeRetY5:.10,stripeRetY6:.09,stripeRetY7:.09,stripeRetY8:.08,stripeRetY9:.08,
  stripeLongTermReturn:.08,
  stripePolicy:'deficit',liquidReserveFloor:500000,stripeSellPct:.30,
  pretax401k:23500,pretaxBenefits:11700,
  company401kMatch:8750,
  // Nancy — 4 rolling specific W2 years (ignored once yr >= nancyRampYear)
  nancyW2Y0:130000,nancyW2Y1:80000,nancyW2Y2:100000,nancyW2Y3:75000,
  nancyHourlyRate:300,nancyRampYear:2030,nancyRampClients:5,nancyMaxClients:18,nancyRampYears:6,nancyWeeksPerYear:46,
  nancySoloPractice:1,nancyPracticeOverhead:15000,nancyQBIRate:.20,nancyHomeOfficeDeduct:8000,
  baseGroceries:7000,baseDining:14000,baseShopping:22000,clothingShare:0.30,baseVacations:20000,
  baseAuto:3500,baseInsurance:1500,baseMisc:10000,baseEntertainment:4500,
  baseCharity:8500,baseMedical:4500,baseTransit:4000,baseUtilsPhoneNet:5500,
  expenseInflation:.03,postKidVacations:10000,
  homePrice:2000000,downPctg:50,mortgageRate:5.0,homePurchaseYear:2030,
  propTaxRate:.012,propTaxBase:18000,maintBase:10000,homeAppreciation:.03,
  suburbAutoBoost:3500,suburbInsBoost:1500,suburbUtilBoost:2500,
  investReturn:.06,capGainsTaxRate:.345,costBasisPct:.55,
  k401Start:210000,
  // Revolving (non-mortgage) balance carried, held flat across every year — see the note at
  // `nw` in model.js. Zero until reconciled against real accounts; never defaulted to an
  // observed figure, because the projection must not move because a card posted.
  otherDebt:0,
  taxInflation:.025,
  planEndYear:2058,
};
let P={...D};let scenarios=[];let compareMode=false;let _demoMode=false;let _livePlanParams=null;
// Which saved case is loaded, and whether it has been edited since. These are deliberately
// separate: editing a case must NOT eject you from it, or there is no way to save back into
// the case you are working in — the only offer left would be "save as new".
let activeScenarioIdx=-1;let scenarioDirty=false;
// Called by every input handler. Cheap on the hot path: only touches the DOM on the first
// edit after a clean load, since slider drags fire this continuously.
// Saved cases keep their results, and a shared figure moves all of them at once — so when one
// does, the results are rebuilt shortly after the last change. Only a view that is showing them
// is redrawn, so typing in an input is never interrupted.
let _sharedRebuildTimer=null;
function markDirty(){
  if(window.PlannerShared&&typeof scenarios!=='undefined'&&scenarios.length&&PlannerShared.config(P).any){
    clearTimeout(_sharedRebuildTimer);
    _sharedRebuildTimer=setTimeout(()=>{
      rebuildScenarioResults();
      if(compareMode||(activeTab==='home'&&_homeView==='compare'))render();
    },400);
  }
  if(activeScenarioIdx<0||scenarioDirty)return;
  scenarioDirty=true;
  renderCaseControl();
}

// ── The case control ─────────────────────────────────────────────────────────
// One place, in the header on every screen, that says which case is being looked at, whether it
// has been edited, and how to save it. "Plan saved" beside it is the working plan being kept for
// next time; saving a CASE is a separate act, and until now the only button for it lived in a
// panel that no screen showed. Edits to a case are never lost by switching away from it without
// being asked: the menu says what is unsaved and offers to save or discard first.
let _caseMenu=false,_caseNaming=false,_archivedCases=[];
function caseMenuToggle(e){if(e)e.stopPropagation();_caseMenu=!_caseMenu;_caseNaming=false;renderCaseControl();if(_caseMenu)setTimeout(()=>document.querySelector('.case-menu button')?.focus(),0)}
function caseMenuClose(){if(!_caseMenu&&!_caseNaming)return;_caseMenu=false;_caseNaming=false;renderCaseControl()}
document.addEventListener('click',e=>{if(_caseMenu&&!e.target.closest('.case-wrap'))caseMenuClose()});

// ═══ SYNC STATUS ═══
function setSyncStatus(status){
  const el=document.getElementById('syncStatus');
  if(!el)return;
  el.className='sync-pill '+status;
  if(status==='saving')el.textContent='Saving plan…';
  else if(status==='synced')el.textContent='Plan saved';
  else if(status==='error')el.textContent='Plan not saved';
  else el.textContent='';
}

// ═══ PERSISTENCE — backed by server API ═══
let _saveTimer=null;
let _saveQueue=Promise.resolve();
let _saveRevision=0;
let _planLoaded=false;
function savePlannerState(){
  if(typeof _demoMode!=='undefined'&&_demoMode)return;
  if(!_planLoaded){setSyncStatus('error');return;}
  if(typeof activeScenarioIdx==='number'&&activeScenarioIdx<0&&typeof _livePlanParams!=='undefined')_livePlanParams={...P};
  setSyncStatus('saving');
  const revision=++_saveRevision;
  const livePlanParams=typeof _livePlanParams!=='undefined'?_livePlanParams:null;
  const payload=JSON.stringify({state:{P,livePlanParams,compareMode,activeTab,_projView,_todayView,_homeView,cockpitNwBasis:cockpitExRet?'exRetirement':'total',activeScenarioIdx,activeScenarioId:scenarios[activeScenarioIdx]?.id||null,scenarioDirty,monarchSnapshot,experienceVersion:7}});
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    // Serialize writes so a slower earlier request cannot overwrite newer state.
    _saveQueue=_saveQueue.catch(()=>{}).then(async()=>{
      try{
        const response=await fetch('/api/planner-state',{
          method:'PUT',headers:{'Content-Type':'application/json'},body:payload
        });
        if(!response.ok)throw new Error('HTTP '+response.status);
        if(revision===_saveRevision)setSyncStatus('synced');
      }catch(e){
        if(revision===_saveRevision)setSyncStatus('error');
      }
    });
  },500);
}

function migrateP(raw){return PlanMigrate.migrateP(raw)}

async function loadFromServer(){
  try{
    let loadedCaseId;
    const [stRes,scRes]=await Promise.all([
      fetch('/api/planner-state'),
      fetch('/api/scenarios')
    ]);
    if(stRes.ok){
      const d=await stRes.json();
      const s=d.state||{};
      if(s.P)P={...D,...migrateP(s.P)};
      if(s.compareMode!==undefined)compareMode=s.compareMode;
      if(s.experienceVersion>=6&&s.activeTab)activeTab=s.experienceVersion>=7?s.activeTab:'cockpit';
      _planLoaded=true;
      if(s._projView!==undefined)_projView=s._projView;
      if(s._todayView!==undefined)_todayView=s._todayView;
      if(s._homeView!==undefined)_homeView=s._homeView;
      if(s.cockpitNwBasis!==undefined)cockpitExRet=s.cockpitNwBasis!=='total';
      if(s.activeScenarioIdx!==undefined)activeScenarioIdx=s.activeScenarioIdx;
      loadedCaseId=s.activeScenarioId;
      if(s.livePlanParams)_livePlanParams={...D,...migrateP(s.livePlanParams)};
      else if(activeScenarioIdx<0)_livePlanParams={...P};
      if(s.scenarioDirty!==undefined)scenarioDirty=!!s.scenarioDirty;
      if(PlannerDecisions.usableSnapshot(s.monarchSnapshot)&&!monarchSnapshot)monarchSnapshot=s.monarchSnapshot; // don't clobber a fresh auto-sync
    }else{
      showToast('⚠️ Could not load plan state (HTTP '+stRes.status+')','red');
    }
    if(scRes.ok){
      const sc=await scRes.json();
      _archivedCases=sc.filter(s=>s.params&&s.params._archived);
      scenarios=sc.filter(s=>!s.params?true:!s.params._archived).map((s,i)=>{
        const params=keepAssumptions(migrateP(attachObserved(s.params||{})));
        let results;
        try{results=run(scenarioPlan(params));}
        catch(e){console.warn('scenario rehydrate failed:',s.name,e);results=run({...D});}
        return{id:s.id,name:s.name,color:s.color||COLORS[i%COLORS.length],params,results};
      });
      if(loadedCaseId!==undefined)activeScenarioIdx=scenarios.findIndex(s=>s.id===loadedCaseId);
      console.log('Loaded',scenarios.length,'scenarios from server');
    }else{
      showToast('⚠️ Could not load scenarios (HTTP '+scRes.status+')','red');
    }
  }catch(e){
    console.error('loadFromServer error:',e);
    showToast('⚠️ Network error loading data: '+e.message,'red');
  }
  if(!_planLoaded){
    document.getElementById('controls').innerHTML='';
    document.getElementById('chartArea').innerHTML='<div role="alert" style="padding:24px">Could not load your saved plan. Saving is disabled to protect your data. <button class="btn" onclick="location.reload()">Reload saved plan</button></div>';
    return;
  }
  // migrateP only runs on a SAVED plan, so a plan that has never been saved — a first run,
  // or one whose state came back empty — never got an observation date and silently modelled
  // its first year as a full twelve months. The stamp belongs on whatever P we ended up with.
  if(window.PlanMigrate&&PlanMigrate.migrateObservedOn)P=PlanMigrate.migrateObservedOn(P);
  buildControls();render();
  checkMonarchStatus();
}

function showToast(msg,type){
  const d=document.createElement('div');
  // The last light-theme surface in the app, and the one that appears over every screen.
  // Amber exists because a consequence worth stating is not a success and not an error.
  const c=type==='green'?'var(--gain)':type==='red'?'var(--loss)'
    :type==='amber'?'var(--warn)':'var(--link)';
  d.style.cssText=`position:fixed;top:18px;right:18px;background:var(--s1);color:var(--tx);`
    +`padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.55;font-weight:450;`
    +`z-index:9999;box-shadow:0 18px 44px #0007;max-width:340px;border:1px solid var(--bd2);`
    +`border-left:3px solid ${c};opacity:0;transform:translateY(-8px) scale(.98);`
    +`transition:opacity .35s cubic-bezier(.22,1,.36,1),transform .35s cubic-bezier(.22,1,.36,1)`;
  d.textContent=msg;document.body.appendChild(d);
  requestAnimationFrame(()=>{d.style.opacity='1';d.style.transform='none'});
  setTimeout(()=>{d.style.opacity='0';d.style.transform='translateY(-8px) scale(.98)';setTimeout(()=>d.remove(),350)},type==='amber'?6000:3000);
}

async function syncMonarch({quiet=false}={}){
  if(_demoMode)return;
  if(_monarchSyncInFlight)return;
  _monarchSyncInFlight=true;
  const btn=document.getElementById('monarchSyncBtn');
  if(btn){btn.textContent='⟳ Syncing…';btn.disabled=true;}
  try{
    const r=await fetch('/api/monarch-snapshot',{cache:'no-store'});
    if(r.status===401)throw new Error('Your planner session expired. Sign in again.');
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'HTTP '+r.status);}
    const d=await r.json();
    const nw=d.netWorth?.value;
    const ret=d.retirement?.value??0;
    const nextSnapshot={
      netWorth:nw,
      liquid:d.liquid?.value??(nw-ret),
      retirement:ret,
      assets:d.assets?.value,
      liabilities:d.liabilities?.value,
      accountCount:d.accounts?.length||0,
      syncedAt:d.netWorth?.updatedAt,
      source:d.source,stale:d.stale,warning:d.warning,partial:!!d.partial,missingAccounts:d.missingAccounts||[],
    };
    if(!nextSnapshot.accountCount||!PlannerDecisions.usableSnapshot({...nextSnapshot,partial:false}))throw new Error('No verified balances returned. Previous data retained.');
    if(monarchSnapshot&&Date.parse(nextSnapshot.syncedAt)<Date.parse(monarchSnapshot.syncedAt))throw new Error('Source returned older balances. Previous data retained.');
    monarchSnapshot=nextSnapshot;
    monarchAccounts=d.accounts;
    const freshness=document.getElementById('monarchFreshness');
    // "Incomplete" has to be able to name what is missing. A partial flag carrying no
    // missing accounts said "Incomplete totals" in the header and "0 account(s) have no
    // balance" in its own tooltip — a warning that contradicted itself on hover.
    const missing=(d.missingAccounts||[]).length;
    const reallyPartial=!!d.partial&&missing>0;
    if(freshness){freshness.textContent=(reallyPartial?'Incomplete totals · ':d.stale||d.warning?'Older balances · ':'Observed · ')+PlannerTime.formatTime(nextSnapshot.syncedAt,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});freshness.title=reallyPartial?`${missing} account${missing===1?'':'s'} ${missing===1?'has':'have'} no balance in Monarch. Totals include available balances only.`:d.warning||'Latest balance observation from NormOS. Bank refresh times may differ.';}
    if(btn){btn.textContent=reallyPartial?'📍 Refresh available balances':d.stale||d.warning?'📍 Check sync':'📍 Refresh balances';btn.disabled=false;btn.style.display='';}
    const connBtn=document.getElementById('monarchConnectBtn');if(connBtn)connBtn.style.display='none';
    if(!quiet)showToast((reallyPartial?`${d.accounts.length} accounts synced; ${missing} balance unavailable. Totals are incomplete.`:null)||d.warning||(d.stale?'Showing older balances from NormOS. Run the Monarch sync to update them.':`Monarch via NormOS · Liquid ${fmt(monarchSnapshot.liquid)} · 401k ${fmt(monarchSnapshot.retirement)}`),d.stale||d.warning?'red':'green');
    savePlannerState(); // persist last sync so it shows instantly next open
    render();
  }catch(e){
    if(btn){btn.textContent='📍 Sync Monarch';btn.disabled=false;}
    const freshness=document.getElementById('monarchFreshness');
    if(freshness){freshness.textContent='Sync unavailable · previous balances retained';freshness.title=e.message;}
    if(!quiet)showToast('Monarch sync failed: '+e.message,'red');
  }finally{_monarchSyncInFlight=false;}
}

function anchorToToday(){
  if(!monarchSnapshot){showToast('Sync Monarch first','red');return;}
  if(monarchSnapshot.partial){showToast('Totals are incomplete. Review the missing account in Portfolio before comparing with your plan.','red');return;}
  const curYr=PlannerTime.year();
  const todayLiq=monarchSnapshot.liquid;
  const totalNw=monarchSnapshot.netWorth;
  const ret=monarchSnapshot.retirement;
  const syncDate=PlannerTime.formatDate(monarchSnapshot.syncedAt,{month:'short',day:'numeric',year:'numeric'});
  // Pro-rate plan's liquid target to today for comparison
  let planLiqToday=null;
  try{
    const{R}=run(P);
    const row=R.find(x=>x.yr===curYr)||R[0];
    const prev=R.find(x=>x.yr===curYr-1);
    const jan1=prev?planLiquidComparable(prev):((P.startingLiquid||0)+(P.startingStripeEquity||0));
    const _ys=new Date(curYr,0,1),_ye=new Date(curYr+1,0,1);
    const frac=Math.min(1,Math.max(0,(new Date()-_ys)/(_ye-_ys)));
    if(row)planLiqToday=Math.round(jan1+frac*(planLiquidComparable(row)-jan1));
  }catch(e){}

function destroyCharts(){Object.values(charts).forEach(c=>c&&c.destroy());charts={};_lastChartKey=''}
// _projView must be in the key: the projection views share one activeTab but use
// different Chart.js `options` (stacked scales vs not) — and _updateChart() only syncs
// datasets/labels on reuse, never options, so omitting it left stale stacked-axis config
// applied to whichever view was rendered second.
function _chartKey(){return activeTab+'|'+inflationView+'|'+compareMode+'|'+(overlaySnapId||'')+'|'+_projView}
function _updateChart(datasets,labels){
  if(!charts.main)return false;
  charts.main.data.labels=labels;
  for(let i=0;i<datasets.length;i++){
    // Sync FULL styling (not just data/label) so reused datasets don't keep stale point/fill config.
    if(charts.main.data.datasets[i]){Object.assign(charts.main.data.datasets[i],datasets[i])}
    else{charts.main.data.datasets.push(datasets[i])}
  }
  while(charts.main.data.datasets.length>datasets.length)charts.main.data.datasets.pop();
  // Normal update — 'active' mode would force every point into its hover state (big dots).
  charts.main.update();return true;
}
// Real-dollar conversion, in dollars. Every surface that shows a projected figure has to go
// through this or it silently disagrees with the ones that do: the Trajectory tab honoured
// `inflationView` and the cockpit did not, so with the toggle on the same plan read 2.6x
// apart by 2058 — purely because one chart was in real dollars and the other in nominal.
function deflate(v,yr){if(!inflationView)return v;const sy=P.planStartYear||2026;return v/Math.pow(1+(P.expenseInflation||.03),yr-sy)}
function deflK(v,yr){return Math.round(deflate(v,yr)/1000)}
function toggleInflation(){inflationView=!inflationView;render();savePlannerState()}

async function saveSnapshot(silent,labelOverride){
  const RES=run(P);const{R,tT}=RES;const last=R[R.length-1];
  const def=RES.drawYears;
  const dflt=`${P.planStartYear||2026} plan · ${PlannerTime.formatDate(new Date(),{month:'short',day:'numeric',year:'numeric'})}`;
  const label=labelOverride||dflt;
  const summary={finalNW:last.netWorth,final401k:last.k401,totalTuition:tT,deficitYears:def,startingLiquid:P.startingLiquid,liqFloor:Math.min(...R.map(r=>r.liq))};
  const snap={id:advUuid(),label,planYear:P.planStartYear||2026,params:{...P},summary};
  // Whether it REACHED the server, reported rather than swallowed. The snapshot is still kept
  // locally either way — a session's work is not thrown away because the network blinked — but
  // a caller that must not proceed without a durable copy can now tell. The year-end roll
  // forward is exactly that caller: it rewrites the projection the closing year is scored
  // against, so a snapshot that never saved destroys the comparison with no way back.
  let ok=true;
  try{
    const r=await fetch('/api/snapshots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap)});
    ok=r.ok;
  }catch(e){ok=false}
  snapshots.push({...snap,plan_year:snap.planYear,created_at:new Date().toISOString(),unsaved:!ok});
  renderSnapshotBar();
  if(!silent)showToast(ok?`📸 Snapshot saved: "${label}"`:`Snapshot kept for this session only — it did not reach the server.`,ok?'green':'red');
  return ok;
}
async function deleteSnapshot(id){
  const s=snapshots.find(x=>x.id===id);if(!s)return;
  if(!showConfirm(`Delete snapshot "${s.label}"?`))return;
  try{await fetch('/api/snapshots/'+id,{method:'DELETE'});}catch(e){}
  snapshots=snapshots.filter(x=>x.id!==id);
  if(overlaySnapId===id)overlaySnapId=null;
  renderSnapshotBar();render();
}
function toggleOverlaySnap(id){overlaySnapId=overlaySnapId===id?null:id;if(activeTab!=='projection'||_projView!=='nw'){activeTab='projection';_projView='nw';document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='projection'))}render()}
function renderSnapshotBar(){
  const el=document.getElementById('snapshotBar');if(!el)return;
  // Snapshots are overlays for the net-worth chart, so the chips live above that chart and
  // nowhere else; on every other screen they were a row of tiny labels about something not shown.
  if(!snapshots.length||activeTab!=='projection'||_projView!=='nw'){el.innerHTML='';return}
  let h='<div class="snap-bar"><span style="font-size:7px;color:var(--t3);font-weight:600">📸 SNAPSHOTS:</span>';
  [...snapshots].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(s=>{
    const sum=s.summary||{};const isA=overlaySnapId===s.id;
    h+=`<div class="snap-chip ${isA?'active':''}" onclick="toggleOverlaySnap('${s.id}')" title="NW @2058: ${sum.finalNW?fmt(sum.finalNW):'—'} · click to ${isA?'hide':'overlay on chart'}">${advEscape(s.label)}${isA?' ✓':''}<span class="x" onclick="event.stopPropagation();deleteSnapshot('${s.id}')">✕</span></div>`;
  });
  h+='</div>';el.innerHTML=h;
}

// Synced Stripe balance vs. the planning assumption. A synced value NEVER overwrites a
// planning input on its own — this only ever offers the move, and the reclassify itself is
// value-neutral: it shifts dollars from startingLiquid to startingStripeEquity so total
// starting net worth is unchanged to the dollar.
function syncedStripeBalance(){
  const a=(monarchAccounts||[]).find(x=>x&&typeof x.name==='string'&&x.name.toLowerCase().includes('stripe'));
  return a&&a.balance>0?Math.round(a.balance):0;
}
function renderReclassifyRow(){
  const actual=syncedStripeBalance();
  if(!actual)return'';
  const planned=Math.round(P.startingStripeEquity||0);
  if(Math.abs(actual-planned)<1000){
    return`<div class="stripe-chip">✓ Matches your synced Stripe balance of ${fmt(actual)}.</div>`;
  }
  const move=actual-planned;
  const room=Math.round(P.startingLiquid||0);
  const canMove=move<=0||room>=move;
  return`<div class="stripe-chip" style="flex-direction:column;align-items:flex-start;gap:3px">
    <div>Monarch shows <strong style="color:#4c3fd6">${fmt(actual)}</strong> in Stripe; your plan assumes <strong>${fmt(planned)}</strong>.</div>
    ${canMove
      ? `<button onclick="reclassifyStripe(${actual})" style="background:#6772e5;color:#fff;border:none;border-radius:5px;padding:4px 8px;font-family:inherit;font-size:8px;font-weight:600;cursor:pointer">${move>0?`Move ${fmtF(move)} from Starting Liquid → Stripe`:`Move ${fmtF(-move)} from Stripe → Starting Liquid`}</button>`
      : `<span style="color:var(--t3)">Starting Liquid (${fmt(room)}) is too small to reclassify ${fmtF(move)} without inventing wealth — adjust it first.</span>`}
  </div>`;
}
function reclassifyStripe(actual){
  const planned=Math.round(P.startingStripeEquity||0);
  const move=actual-planned;
  const before=Math.round((P.startingLiquid||0)+planned);
  if(move>0&&(P.startingLiquid||0)<move){showToast('Starting Liquid is too small to reclassify that amount','red');return}
  if(!showConfirm(`Reclassify ${fmtF(Math.abs(move))} ${move>0?'from Starting Liquid into Stripe equity':'from Stripe equity back into Starting Liquid'}?\n\nYour total starting net worth stays exactly ${fmt(before)} — this only changes which pool it sits in.`))return;
  P.startingLiquid=Math.round((P.startingLiquid||0)-move);
  P.startingStripeEquity=actual;
  markDirty();buildControls();render();savePlannerState();
  showToast(`Reclassified — starting net worth unchanged at ${fmt(before)}`,'green');
}

// ── What the year has actually cost so far ──────────────────────────────────
// A projection for the year you are standing in is checkable, and nothing else on this page
// checks it. Actual is the imported ledger's own spending total for the year INCLUDING the
// month in progress — "so far" means so far.
//
// The two taxonomies are not the same and this does not pretend they are: it compares totals
// and says so. The pace figure divides by the share of the year actually elapsed, because
// eight and a bit months of spending measured against twelve months of plan is not a
// comparison, it is a subtraction with a month missing.
function expActualYTD(year){
  if(year!==PlannerTime.year())return null;
  if(_spendLoading)return{loading:true};
  const d=_spend;
  if(!d||d.error||!Array.isArray(d.months))return null;
  const rows=d.months.filter(m=>String(m.month).slice(0,4)===String(year));
  if(!rows.length)return null;
  const asOf=d.endDate||PlannerTime.day();
  const partial=(d.coverage||{}).partial;
  const closed=rows.filter(m=>m.month!==partial);
  const spent=rows.reduce((t,m)=>t+(Number(m.expense)||0),0);
  // Months elapsed, counting the one in progress for the part of it that has passed.
  const elapsed=closed.length+(rows.length>closed.length?(Number((d.coverage||{}).fractionElapsed)||0):0);
  return{spent,elapsed,asOf,months:rows.length,
    through:partial&&rows.some(m=>m.month===partial)?partial:(closed.length?closed[closed.length-1].month:null),
    pace:elapsed>0?spent/elapsed*12:null};
}

// over it pins that line for that year (livingXxxY<i>). The toggle decides whether the change

function expCatApply(yr,cat,n){
  // n === null removes the override, so the line goes back to what the model works out.
  //
  // A carried change is a DIFFERENCE, not a new level. Misc in 2042 is not 2027's Misc grown
  // at inflation — the children have aged and the model has said so — so pinning it to the
  // edited figure would quietly delete that. Each later year keeps its own figure and takes

  const sy=P.planStartYear||2026,end=P.planEndYear||2058,infl=Number(P.expenseInflation)||0;

// Scenarios saved before a schema change still carry the old keys, so migrate the
// scenario's OWN params before letting D fill in the gaps — merging D first would leave
// current-generation defaults sitting alongside the scenario's superseded keys.
// A case supplies assumptions; the opening balances come from the accounts, every time.
// Loading used to replace them with whatever the case froze on the day it was saved, which
// is how a case could project 2026 ending BELOW today — it was still starting from a balance
// sheet months out of date, with the hero beside it reading the live one.
function loadScenario(i){
  if(activeScenarioIdx<0)_livePlanParams={...P};
  P={...D,...migrateP(attachObserved(scenarios[i].params))};
  activeScenarioIdx=i;scenarioDirty=false;buildControls();render();savePlannerState();
}
// The observed half of the current plan: what the accounts last reported, and when. Pulled
// out so every path that swaps the plan re-attaches the same thing.
function openingFromLivePlan(){
  const live={observedOn:P.observedOn};
  for(const k of (window.PlannerOpening?PlannerOpening.VALUE_KEYS:[]))live[k]=P[k];
  return live;
}
// If opening.js ever fails to load, a case should still save and load — degraded to the old
// behaviour of carrying its own balances, rather than throwing and losing the case entirely.
// Two kinds of fact get stripped on the way into a case and re-attached on the way out: the
// opening balances (what you own) and the grant ledger (what you have been awarded, at what
// prices). Both are the same in every case; only the assumptions around them differ.
function keepAssumptions(params){
  let out=window.PlannerOpening?PlannerOpening.stripObserved(params):params;
  out=window.StripeGrants?StripeGrants.stripFacts(out):out;
  // A third kind of fact: expense groups the household has said are the same in every case. They
  // live in the live plan only, so a saved case cannot drift from them.
  return window.PlannerShared?PlannerShared.strip(out):out;
}
function attachObserved(params){
  let out=window.PlannerOpening?PlannerOpening.withObserved(params,openingFromLivePlan()):params;
  out=window.StripeGrants?StripeGrants.withFacts(out,P&&P.stripeGrants):out;
  return window.PlannerShared&&P?PlannerShared.attach(out,P):out;
}
// A case's assumptions, made runnable against today's balance sheet. Every place that
// projects a saved case goes through here, so a comparison compares futures rather than
// the balance sheets each case happened to be saved on.
function scenarioPlan(params){
  return{...D,...migrateP(attachObserved(params))};
}
// A case's stored results are a projection FROM today's balances, so they go stale the
// moment those balances move. Recomputed whenever they do.
function rebuildScenarioResults(){
  for(const s of scenarios){
    try{s.results=run(scenarioPlan(s.params));}
    catch(e){console.warn('scenario recompute failed:',s.name,e);}
  }
}

async function saveScenario(n){
  if(!n){n='Scenario '+(scenarios.length+1);}
  const id=advUuid();
  if(activeScenarioIdx<0)_livePlanParams={...P};
  const s={id,name:n,params:keepAssumptions({...P}),results:run(P),color:COLORS[scenarios.length%COLORS.length]};
  scenarios.push(s);
  activeScenarioIdx=scenarios.length-1;scenarioDirty=false;
  buildControls();render();savePlannerState();
  try{
    const r=await fetch('/api/scenarios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:s.id,name:s.name,color:s.color,params:s.params,results:s.results})});
    if(!r.ok)throw new Error('HTTP '+r.status);

    console.error('saveScenario failed:',e);

    const errDiv=document.createElement('div');
    errDiv.style.cssText='position:fixed;top:16px;right:16px;background:#fceaee;border:1px solid rgba(205,61,100,.3);color:#cd3d64;padding:12px 16px;border-radius:8px;font-size:12px;z-index:9999;max-width:300px;box-shadow:0 4px 12px rgba(0,0,0,.1)';
    errDiv.innerHTML=`<strong>⚠️ Save failed</strong><br>Scenario is visible this session but won't survive a reload.<br><small style="opacity:.7">${e.message}</small><br><br><button onclick="this.parentElement.remove()" style="background:#cd3d64;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px">Dismiss</button>`;

}

async function updateScenario(i){
  scenarios[i].params=keepAssumptions({...P});scenarios[i].results=run(P);
  activeScenarioIdx=i;scenarioDirty=false;
  const s=scenarios[i];
  buildControls();render();savePlannerState();
  try{
    const r=await fetch('/api/scenarios/'+s.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({params:s.params,results:s.results})});
    if(!r.ok)throw new Error('HTTP '+r.status);
  }catch(e){
    // The edits are still in the page; saying so beats a silent amber pill that never clears.
    console.error('updateScenario failed:',e);setSyncStatus('error');
    scenarioDirty=true;renderCaseControl();

  }

async function deleteScenario(i,archived=false){
  const s=scenarios[i];
  scenarios.splice(i,1);
  if(!scenarios.length)compareMode=false;
  if(activeScenarioIdx===i){
    // Deleting the selected case should return to the real unsaved plan, not leave the
    // deleted case's assumptions masquerading as "Current plan" in Inputs.
    if(_livePlanParams)P={...D,...migrateP(attachObserved(_livePlanParams))};
    activeScenarioIdx=-1;scenarioDirty=false;
  }
  else if(activeScenarioIdx>i)activeScenarioIdx--;
  // Compare tab's diff-view selector holds a scenario index too — without this it goes
  // stale after a delete (either points past the end, silently hiding the diff table, or
  // — worse — points at a scenario that shifted down and now shows the wrong one's data).
  if(_compareDiffIdx===i)_compareDiffIdx=-1;
  else if(_compareDiffIdx>i)_compareDiffIdx--;
  buildControls();render();savePlannerState();
  if(s.id&&!archived){
    try{
      const r=await fetch('/api/scenarios/'+s.id,{method:'DELETE'});
      if(!r.ok)throw new Error('HTTP '+r.status);
    }catch(e){console.error('deleteScenario failed:',e);setSyncStatus('error')}
  }
}

function fmtK(v){const a=Math.abs(v);const s=v<0?'-':'';if(a>=1000)return s+'$'+(a/1000).toFixed(1).replace(/\.0$/,'')+'M';return s+'$'+a+'K'}
// Bespoke chart styling — glass tooltip, near-invisible gridlines, point-style legend
const _GLASS_TOOLTIP={enabled:true,backgroundColor:'rgba(255,255,255,.94)',titleColor:'#0a2540',bodyColor:'#425466',borderColor:'rgba(10,37,64,.08)',borderWidth:1,cornerRadius:11,padding:{top:10,bottom:10,left:13,right:13},titleFont:{size:11.5,family:'Inter',weight:'700'},bodyFont:{size:11,family:'Inter'},boxPadding:6,usePointStyle:true,caretSize:6,titleMarginBottom:7};

// ── Today, named and numbered ──────────────────────────────────────────────
// The trajectory's first point has always BEEN today's net worth — prepended at sy-1, the
// same figure the cockpit shows. But unlabelled, at the bottom of an axis that has to reach
// the 2050s, it reads as where a line starts rather than where you actually are: the one
// number on the chart you already know, and the only one you can check the rest against.
//
// Drawn rather than added as a dataset, so it cannot appear in the legend, shift the axis,
// or be mistaken for a fourth series.
const todayMarker={
  id:'todayMarker',
  afterDatasetsDraw(chart){
    // Anchored to the ex-retirement line, not the total: retirement is locked until 59½, so
    // a "today" that silently includes $297K you cannot reach is not the figure anyone is
    // checking the chart against — and it is not what the cockpit hero beside it reports.
    // Nothing is drawn in the ordinary case. The plan starts from today's balances, the axis
    // tick carries the date they were read, and the line visibly begins there — a pill
    // repeating it is one more thing to read for a fact already on the page.
    //
    // It survives for the case it is actually needed in: when the plan's opening is NOT what
    // you hold, the anchor is a different figure from the cockpit hero, and it says so rather
    // than leaving two numbers to be discovered.
    if(chart.$anchorIsToday!==false)return;
    const want=/^Net worth ex-retirement/;
    let i=chart.data.datasets.findIndex(d=>want.test(d.label||''));
    if(i<0)i=chart.data.datasets.findIndex(d=>/^Total net worth/.test(d.label||''));
    if(i<0)return;
    const meta=chart.getDatasetMeta(i);
    if(!meta||meta.hidden)return;
    const pt=meta.data&&meta.data[0], v=chart.data.datasets[i].data[0];
    if(!pt||v==null)return;
    // `v` is already in thousands, which is what fmtK expects. Scaling it here is what
    // turned $1.28M into $1284M the last time this existed.
    const text='Plan start · '+fmtK(v);
    const ctx=chart.ctx, area=chart.chartArea;
    ctx.save();
    ctx.font='600 11px Inter, system-ui, sans-serif';
    const w=ctx.measureText(text).width+14, h=20, r=6;
    // Stay inside the plot: at the left edge the pill goes right of the dot, and it drops
    // below when there is no room above.
    let x=pt.x+10, y=pt.y-h-8;
    if(x+w>area.right)x=pt.x-10-w;
    if(x<area.left)x=area.left+2;
    if(y<area.top)y=pt.y+10;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
    ctx.fillStyle='rgba(216,122,32,.20)';ctx.fill();
    ctx.strokeStyle='#e08a3c';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#ffd9b0';ctx.textBaseline='middle';ctx.textAlign='left';
    ctx.fillText(text,x+7,y+h/2+.5);
    ctx.beginPath();ctx.arc(pt.x,pt.y,5,0,Math.PI*2);
    ctx.fillStyle='#e08a3c';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }
};

// ═══ MOTION + HERO HELPERS (next-gen visual layer) ═══
let _firstPaint=true;
const _reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
// Tween a formatted number element ("$1.2M", "34.5%", "+$450K") from 0 → its value
function _animEl(el){
  if(!el)return;
  const final=el.textContent.trim();
  const m=final.match(/^([^\d-]*)(-?[\d,]*\.?\d+)(.*)$/);
  if(!m||_reduceMotion()){return}
  const prefix=m[1],numStr=m[2],suffix=m[3];
  const grouped=numStr.includes(',');
  const decimals=(numStr.split('.')[1]||'').length;
  const target=parseFloat(numStr.replace(/,/g,''));
  if(!isFinite(target))return;
  const fmtNum=v=>{let s=v.toFixed(decimals);if(grouped)s=Number(s).toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});return prefix+s+suffix};
  const dur=850,t0=performance.now();
  function step(now){const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,3);el.textContent=fmtNum(target*e);if(p<1)requestAnimationFrame(step);else el.textContent=final}
  requestAnimationFrame(step);
}
// Crisp inline sparkline (bespoke, no Chart.js) for the hero band
function _sparkSVG(vals,w,h,color){
  if(!vals||vals.length<2)return'';
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1,pad=4;
  const pts=vals.map((v,i)=>[pad+i/(vals.length-1)*(w-2*pad), h-pad-((v-min)/rng)*(h-2*pad)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${(w-pad).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
  const lastPt=pts[pts.length-1],gid='sp'+(''+color).replace(/[^a-z0-9]/gi,'');
  return `<svg class="hero-spark-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3.4" fill="${color}"/>
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="6" fill="${color}" opacity=".22"/>
  </svg>`;
}
// ═══ MILESTONE CELEBRATIONS — real (Monarch-synced) net-worth crossings ═══
const _MILESTONE_KEY='cohenPlannerNWMilestone';
function _milestoneThresholds(){
  const th=[];
  for(let v=250000;v<1e6;v+=250000)th.push(v);
  for(let v=1e6;v<=10e6;v+=1e6)th.push(v);
  for(let v=15e6;v<=50e6;v+=5e6)th.push(v);
  return th;
}
function _checkMilestone(nw){
  if(nw==null||!isFinite(nw))return;
  const thresholds=_milestoneThresholds();
  let hit=null;
  for(const t of thresholds){if(nw>=t)hit=t;else break}
  if(hit==null)return;
  let stored=NaN;
  try{stored=parseFloat(localStorage.getItem(_MILESTONE_KEY));}catch(e){}
  if(!isFinite(stored)){
    // First time ever checking on this browser — seed silently, don't celebrate
    // whatever the number already happens to be on first load.
    try{localStorage.setItem(_MILESTONE_KEY,String(hit));}catch(e){}
    return;
  }
  if(hit>stored){
    try{localStorage.setItem(_MILESTONE_KEY,String(hit));}catch(e){}
    _celebrateMilestone(hit);
  }
}
function _celebrateMilestone(v){
  showToast(`🎉 Crossed ${fmt(v)} in real net worth!`,'green');
  if(!_reduceMotion())_confettiBurst();
}
function _confettiBurst(){

  document.body.appendChild(root);

    const p=document.createElement('div');
    const x=30+Math.random()*40;
    const size=5+Math.random()*5;
    const color=colors[i%colors.length];

    root.appendChild(p);

}

function setVestWithholding(v){
  const t=String(v).replace(/[%\s,]/g,'');
  if(t===''){delete P.stripeVestWithholdingRate}
  else{
    const n=parseFloat(t);
