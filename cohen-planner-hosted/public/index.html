<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohen Family — Interactive Financial Planner v5</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="/model.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f9fc;
  --s1:#ffffff;
  --s2:#fafbfc;
  --s3:#f0f4f8;
  --bd:#e6ebf1;
  --bd2:#d0d7de;
  --tx:#0a2540;
  --t2:#425466;
  --t3:#8898aa;
  --t4:#adbdcc;
  --accent:#635bff;
  --accent-d:#4f48cc;
  --accent-soft:#eeecff;
  --g:#1a8754;
  --g-soft:#e7f4ed;
  --r:#cd3d64;
  --r-soft:#fceaee;
  --a:#bf6900;
  --a-soft:#fdf3e3;
  --b:#0073e6;
  --b-soft:#e6f1ff;
  --c:#0891b2;
  --p:#7c3aed;
  --shadow-sm:0 1px 2px rgba(50,71,92,.04);
  --shadow:0 2px 5px rgba(50,71,92,.06),0 1px 2px rgba(50,71,92,.04);
  --shadow-lg:0 8px 20px rgba(50,71,92,.08),0 2px 6px rgba(50,71,92,.04);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);padding:14px 18px;min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv11'}
.mono{font-family:'SF Mono','Fira Code','Courier New',monospace}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:14px}
.hdr h1{font-size:16px;font-weight:600;color:var(--tx);letter-spacing:-.3px}
.hdr-right{display:flex;align-items:center;gap:10px}
.sync-pill{font-size:9px;font-family:'SF Mono',monospace;color:var(--t3);transition:color .2s}
.sync-pill.saving{color:var(--a)}
.sync-pill.synced{color:var(--g)}
.sync-pill.error{color:var(--r)}
.logout-btn{font-size:9px;padding:3px 9px;background:var(--s2);border:1px solid var(--bd);border-radius:4px;cursor:pointer;font-family:inherit;color:var(--t3);transition:all .12s}
.logout-btn:hover{border-color:var(--r);color:var(--r)}
.layout{display:grid;grid-template-columns:268px 1fr;gap:12px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;max-height:calc(100vh - 70px);overflow-y:auto;box-shadow:var(--shadow-sm)}
.panel::-webkit-scrollbar{width:5px}.panel::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.st{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin:12px 0 6px}
.sr{margin-bottom:8px}.sr .sh{display:flex;justify-content:space-between;margin-bottom:2px}
.sr .sl{font-size:10px;color:var(--t2);font-weight:500}.sr .sv{font-size:10px;color:var(--tx);font-family:'SF Mono',monospace;font-weight:600}
.sr input[type=range]{width:100%;accent-color:var(--accent);height:3px;cursor:pointer}
.kpi-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.kpi:hover{box-shadow:var(--shadow)}
.kpi-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px}
.kpi-v{font-size:16px;font-weight:700;font-family:'SF Mono',monospace;letter-spacing:-.5px;color:var(--tx)}
.kpi-s{font-size:9.5px;color:var(--t2);margin-top:2px}
.tabs{display:flex;gap:3px;margin-bottom:10px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:3px;box-shadow:var(--shadow-sm)}
.tabs button{padding:6px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:inherit;transition:all .12s}
.tabs button:hover{color:var(--tx);background:var(--s3)}
.tabs button.active{background:linear-gradient(135deg,#6e66ff,#5048d6);color:#fff;font-weight:600}
.snap-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.snap-chip{padding:4px 9px;border-radius:6px;font-size:9.5px;font-weight:500;cursor:pointer;border:1px solid rgba(8,145,178,.3);background:#e0f7fa;color:var(--c);display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .12s}
.snap-chip.active{background:var(--c);color:#fff}
.snap-chip .x{font-size:8px;opacity:.6;margin-left:3px}.snap-chip .x:hover{opacity:1;color:var(--r)}
@media print{
  body{padding:0;font-size:11px}
  .panel,.tabs button#inflBtn,.logout-btn,.sync-pill,.adv-input-area,.scenario-bar,.snap-bar{display:none!important}
  .tabs button:not(.active){display:none}
  .layout{grid-template-columns:1fr;display:block}
  .cc,.kpi,.sc{box-shadow:none;border-color:#ccc}
  @page{margin:1.2cm}
}
.cc{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:11px;box-shadow:var(--shadow-sm)}
.sc h3{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:4px}
.sc p{font-size:10.5px;color:var(--t2);line-height:1.55}
.tw{max-height:340px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:10px;font-family:'SF Mono',monospace}
th{padding:6px 4px;text-align:right;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--t3);border-bottom:1px solid var(--bd);font-family:'Inter',sans-serif;position:sticky;top:0;background:var(--s2);z-index:1}
td{padding:3px 4px;text-align:right;border-bottom:1px solid var(--bd);color:var(--t2)}
tr:hover td{background:var(--s2)}
.btn{padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--s1);color:var(--t2);font-size:10px;font-weight:500;cursor:pointer;width:100%;margin-top:3px;font-family:inherit;transition:all .12s}
.btn:hover{border-color:var(--bd2);color:var(--tx);background:var(--s2)}
.btn-g{border-color:rgba(99,91,255,.3);color:var(--accent);background:var(--accent-soft)}
.btn-g:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.scenario-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.scenario-chip{padding:4px 10px;border-radius:6px;font-size:9.5px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--s1);color:var(--t2);display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .12s}
.scenario-chip:hover{border-color:var(--bd2);color:var(--tx);background:var(--s2)}
.scenario-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.scenario-chip .x{font-size:8px;opacity:.5;margin-left:3px;cursor:pointer}.scenario-chip .x:hover{opacity:1;color:var(--r)}
.solo-box{background:var(--g-soft);border:1px solid rgba(26,135,84,.2);border-radius:6px;padding:8px 10px;margin:5px 0 7px;font-size:10px;color:var(--t2)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(3,1fr)}.sg{grid-template-columns:1fr}}
@media(max-width:640px){
  body{padding:8px 10px}
  .hdr{flex-direction:column;align-items:flex-start;gap:6px;padding-bottom:8px;margin-bottom:8px}
  .hdr h1{font-size:13px}
  .hdr-right{flex-wrap:wrap;gap:5px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:8px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;padding:5px 8px;font-size:10px}
  .layout{display:block}
  .panel{display:none;margin-bottom:10px;max-height:70vh;overflow-y:auto}
  .panel.mob-open{display:block}
  #mobileControlsToggle{display:flex}
  .tw{overflow-x:auto}
  .cc{padding:10px}
  .snap-bar{gap:4px}
  .scenario-bar{gap:4px}
}
@media(min-width:641px){#mobileControlsToggle{display:none}}
.adv{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:500px;background:var(--s1);border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.adv-msgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.adv-msgs::-webkit-scrollbar{width:6px}.adv-msgs::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.adv-msg{display:flex;gap:10px;max-width:760px}
.adv-msg.user{flex-direction:row-reverse;align-self:flex-end;max-width:560px}
.adv-avatar{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:'SF Mono',monospace}
.adv-avatar.ai{background:var(--accent);color:#fff}
.adv-avatar.user{background:var(--s3);color:var(--tx);border:1px solid var(--bd2)}
.adv-bubble{padding:10px 14px;border-radius:8px;font-size:12.5px;line-height:1.6;color:var(--tx)}
.adv-msg.user .adv-bubble{background:var(--accent-soft);border:1px solid rgba(99,91,255,.15);color:var(--tx)}
.adv-msg.ai .adv-bubble{background:var(--s1);border:1px solid var(--bd);box-shadow:var(--shadow-sm)}
.adv-bubble p{margin-bottom:8px}.adv-bubble p:last-child{margin-bottom:0}
.adv-bubble ul,.adv-bubble ol{margin:6px 0 6px 20px}.adv-bubble li{margin-bottom:3px}
.adv-bubble strong{color:var(--tx);font-weight:600}
.adv-bubble code{font-family:'SF Mono',monospace;background:var(--accent-soft);padding:1px 5px;border-radius:3px;font-size:11px;color:var(--accent)}
.adv-bubble pre{background:var(--bg);padding:8px 10px;border-radius:5px;overflow-x:auto;margin:6px 0;font-size:11px;border:1px solid var(--bd)}
.adv-bubble table{border-collapse:collapse;margin:8px 0;font-size:11px;width:100%}
.adv-bubble th,.adv-bubble td{padding:5px 9px;border-bottom:1px solid var(--bd);text-align:left}
.adv-bubble th{font-weight:700;font-size:9.5px;text-transform:uppercase;color:var(--t3);letter-spacing:.5px}
.adv-bubble h3{font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--tx)}
.adv-bubble h4{font-size:12px;font-weight:600;margin:8px 0 3px;color:var(--t2)}
.adv-input-area{padding:12px 18px 14px;border-top:1px solid var(--bd);background:var(--s1)}
.adv-input-wrap{display:flex;gap:6px;align-items:flex-end;background:var(--s2);border:1px solid var(--bd2);border-radius:8px;padding:6px}
.adv-input-wrap:focus-within{border-color:var(--accent)}
.adv-input{flex:1;background:transparent;border:none;color:var(--tx);font-family:inherit;font-size:12.5px;resize:none;outline:none;padding:6px;min-height:20px;max-height:140px;line-height:1.5}
.adv-send{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:5px;cursor:pointer;font-weight:600;font-size:11.5px;font-family:inherit;height:32px}
.adv-send:hover{background:var(--accent-d)}.adv-send:disabled{background:var(--bd2);cursor:not-allowed}
.adv-agentic-btn{background:var(--s2);border:1px solid var(--bd);color:var(--t2);padding:5px 9px;border-radius:5px;cursor:pointer;font-size:11px;font-family:inherit;height:32px;transition:all .12s;white-space:nowrap}
.adv-agentic-btn:hover{border-color:var(--p);color:var(--p)}
.adv-agentic-btn.active{background:var(--p);color:#fff;border-color:var(--p)}
.adv-tool-call{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;background:#f3f0ff;border:1px solid rgba(124,58,237,.2);border-radius:6px;font-size:10.5px;color:var(--p);margin:4px 0}
.adv-tool-call .tc-icon{font-size:13px;flex-shrink:0}
.adv-tool-call .tc-body{flex:1;line-height:1.45}
.adv-tool-call strong{color:var(--p)}
.adv-proposals{background:var(--s1);border:1px solid rgba(124,58,237,.3);border-radius:8px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 8px rgba(124,58,237,.08)}
.adv-proposals-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.adv-proposals-hdr h4{font-size:11px;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:.5px;margin:0}
.adv-proposals-hdr button{background:transparent;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:0;line-height:1}
.adv-proposals-hdr button:hover{color:var(--tx)}
.adv-proposal-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.adv-proposal-row{display:flex;align-items:center;gap:6px;font-size:11px;padding:5px 8px;background:var(--s2);border-radius:5px}
.adv-proposal-key{font-family:'SF Mono',monospace;color:var(--tx);font-weight:600;min-width:110px}
.adv-proposal-arrow{color:var(--t3);font-size:9px}
.adv-proposal-old{color:var(--t3);text-decoration:line-through}
.adv-proposal-new{color:var(--p);font-weight:600}
.adv-proposal-reason{color:var(--t2);font-size:9.5px;margin-left:auto;text-align:right;max-width:200px}
.adv-proposals-actions{display:flex;gap:6px}
.adv-proposals-actions button{padding:6px 11px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.adv-proposals-save{background:var(--p);color:#fff;border:none}
.adv-proposals-save:hover{background:#6d28d9}
.adv-proposals-view{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}
.adv-proposals-view:hover{border-color:var(--bd2)}
.adv-thinking{display:flex;gap:3px;padding:3px 0}
.adv-thinking span{width:5px;height:5px;border-radius:50%;background:var(--t3);animation:advblink 1.4s infinite}
.adv-thinking span:nth-child(2){animation-delay:.2s}.adv-thinking span:nth-child(3){animation-delay:.4s}
@keyframes advblink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.adv-welcome{padding:20px;text-align:center;color:var(--t2);font-size:13px;line-height:1.6}
.adv-welcome h3{color:var(--tx);font-size:16px;margin-bottom:8px;font-weight:700}
.adv-starters{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:14px;text-align:left;max-width:600px;margin-left:auto;margin-right:auto}
.adv-starter{padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;cursor:pointer;font-size:11.5px;color:var(--t2);line-height:1.4;transition:all .15s}
.adv-starter:hover{border-color:var(--accent);color:var(--tx)}
.adv-starter strong{display:block;color:var(--tx);font-size:12px;margin-bottom:2px}
.adv-toolbar{display:flex;gap:6px;padding:8px 18px;border-bottom:1px solid var(--bd);background:var(--s1);align-items:center}
.adv-toolbar .ctx-pill{background:var(--s2);border:1px solid var(--bd);padding:3px 8px;border-radius:4px;font-size:9.5px;color:var(--t2);font-family:'SF Mono',monospace}
.adv-toolbar .ctx-pill strong{color:var(--g)}
.adv-toolbar button{background:var(--s2);border:1px solid var(--bd);color:var(--t2);padding:4px 9px;border-radius:4px;cursor:pointer;font-size:10px;font-family:inherit;font-weight:500;margin-left:auto}
.adv-toolbar button:hover{border-color:var(--bd2);color:var(--tx)}
.adv-wrap{display:grid;grid-template-columns:240px 1fr;gap:0;height:calc(100vh - 220px);min-height:500px;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--s1)}
.adv-rail{background:var(--s2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.adv-rail-hdr{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:var(--s2)}
.adv-rail-hdr h4{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;color:var(--t3);margin:0}
.adv-rail-new{background:var(--accent);color:#fff;border:none;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10.5px;font-weight:600;font-family:inherit;transition:background .12s}
.adv-rail-new:hover{background:var(--accent-d)}
.adv-rail-list{flex:1;overflow-y:auto;padding:8px}
.adv-rail-list::-webkit-scrollbar{width:5px}.adv-rail-list::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.adv-rail-item{padding:9px 11px;border-radius:6px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;font-size:11.5px;color:var(--t2);position:relative;transition:all .12s}
.adv-rail-item:hover{background:var(--s1);border-color:var(--bd)}
.adv-rail-item.active{background:var(--s1);border-color:var(--accent)}
.adv-rail-title{font-weight:600;color:var(--tx);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:22px;font-size:11.5px;line-height:1.3}
.adv-rail-meta{font-size:9.5px;color:var(--t3);font-family:'SF Mono',monospace;display:flex;justify-content:space-between}
.adv-rail-actions{position:absolute;top:6px;right:6px;display:none;gap:2px}
.adv-rail-item:hover .adv-rail-actions{display:flex}
.adv-rail-actions button{background:var(--s2);border:1px solid var(--bd);width:20px;height:20px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;padding:0;color:var(--t2);transition:all .1s}
.adv-rail-actions button:hover{background:var(--s3);color:var(--tx)}
.adv-rail-actions button.del:hover{color:var(--r);border-color:var(--r)}
.adv-rail-empty{color:var(--t3);font-size:11px;text-align:center;padding:18px 8px;line-height:1.5}
.adv-rail-footer{padding:8px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.adv-rail-footer button{background:var(--s1);border:1px solid var(--bd);color:var(--t2);padding:6px 9px;border-radius:5px;cursor:pointer;font-size:10.5px;font-family:inherit;font-weight:500;text-align:left;transition:all .12s}
.adv-rail-footer button:hover{border-color:var(--bd2);color:var(--tx)}
.adv-main{display:flex;flex-direction:column;overflow:hidden;background:var(--s1)}
@media(max-width:900px){.adv-wrap{grid-template-columns:1fr}.adv-rail{display:none}}
@media(max-width:640px){.adv-wrap{height:auto;min-height:350px}.adv{height:auto;min-height:350px}.adv-starters{grid-template-columns:1fr}}
/* ── Accessibility: visible keyboard focus everywhere ── */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ── Portfolio responsive grids (replace inline fixed-px so they collapse on mobile) ── */
.pf-split{display:grid;grid-template-columns:260px 1fr;gap:10px;margin-bottom:12px}
.pf-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pf-cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-quad{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.pf-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:760px){
  .pf-split{grid-template-columns:1fr}
  .pf-kpis{grid-template-columns:repeat(2,1fr)}
  .pf-quad{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .pf-kpis{grid-template-columns:1fr 1fr}
  .pf-quad{grid-template-columns:1fr}
}
/* ═══════════════════════════════════════════════════════════════
   NEXT-GEN VISUAL FOUNDATION — glass / spatial design system
   (1) ambient mesh canvas  (2) glass material + elevation
   (3) typographic scale + tabular numerals  (4) motion layer
   (5) hero net-worth band
   ═══════════════════════════════════════════════════════════════ */

/* (1) Ambient gradient-mesh canvas behind everything ─────────── */
body{background:transparent}
.mesh-bg{position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 42% at 10% 2%, rgba(99,91,255,.16), transparent 62%),
    radial-gradient(34% 40% at 96% 6%, rgba(8,145,178,.13), transparent 60%),
    radial-gradient(40% 42% at 82% 96%, rgba(230,73,128,.09), transparent 62%),
    radial-gradient(42% 46% at 22% 100%, rgba(124,58,237,.10), transparent 64%),
    linear-gradient(180deg,#f7f9fd 0%,#eef2f9 100%);
  filter:saturate(112%);will-change:transform;
  animation:meshDrift 26s ease-in-out infinite alternate}
@keyframes meshDrift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(0,-2.2%,0) scale(1.05)}}

/* (2) Glass material — frosted surfaces + layered elevation ──── */
.panel,.cc,.kpi,.sc,.tabs,.tw,.adv,.adv-wrap{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px) saturate(165%);
  -webkit-backdrop-filter:blur(18px) saturate(165%);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 1px 1px rgba(10,37,64,.04), 0 14px 32px -20px rgba(10,37,64,.28);
}
.kpi{transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s ease, border-color .2s ease}
.kpi:hover{transform:translateY(-3px);
  box-shadow:0 1px 1px rgba(10,37,64,.04), 0 22px 44px -22px rgba(99,91,255,.45);
  border-color:rgba(99,91,255,.28)}
.cc{transition:box-shadow .25s ease}
.cc:hover{box-shadow:0 1px 1px rgba(10,37,64,.04), 0 22px 48px -26px rgba(10,37,64,.34)}
.tabs button.active{box-shadow:0 6px 16px -6px rgba(99,91,255,.6)}

/* (3) Typographic scale + tabular numerals ──────────────────── */
.kpi-v,.hero-v,.sv,.mono,table,td,th,.adv-rail-meta,.sync-pill{font-variant-numeric:tabular-nums;font-feature-settings:'tnum','ss01','cv11'}
.kpi-v{font-size:17px}
.hdr{position:relative;border-bottom:none;padding-bottom:12px}
.hdr::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--accent) 0%,rgba(8,145,178,.5) 35%,rgba(230,73,128,.25) 70%,transparent 100%)}
.hdr h1{font-size:18px;letter-spacing:-.5px;font-weight:700}
.logout-btn,#monarchSyncBtn,#monarchConnectBtn{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* (4) Motion layer — entrance, count-up, tab cross-fade ─────── */
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.reveal{animation:riseIn .6s cubic-bezier(.22,1,.36,1) both}
.tab-fade{animation:fadeIn .4s ease both}

/* (5) Hero net-worth band ───────────────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 26px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  background:linear-gradient(118deg, rgba(99,91,255,.13) 0%, rgba(8,145,178,.07) 55%, rgba(230,73,128,.06) 100%);
  border:1px solid rgba(255,255,255,.6);
  backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:0 1px 1px rgba(10,37,64,.05), 0 26px 56px -30px rgba(99,91,255,.5)}
.hero::before{content:'';position:absolute;top:-60%;right:-10%;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,91,255,.22),transparent 68%);pointer-events:none}
.hero-main{position:relative;z-index:1}
.hero-eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);
  margin-bottom:8px;display:flex;align-items:center;gap:7px}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(26,135,84,.18);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero-v{font-size:48px;font-weight:800;letter-spacing:-1.8px;line-height:.95;color:var(--tx)}
.hero-sub{font-size:12.5px;color:var(--t2);margin-top:10px;line-height:1.5}
.hero-sub b{color:var(--tx);font-weight:600}
.hero-spark{position:relative;z-index:1;flex-shrink:0}
@media(max-width:640px){.hero{flex-direction:column;align-items:flex-start;padding:18px 18px}.hero-v{font-size:36px;letter-spacing:-1.2px}.hero-spark{width:100%}.hero-spark svg{width:100%}}

/* Respect reduced-motion preference ─────────────────────────── */
@media(prefers-reduced-motion:reduce){
  .mesh-bg,.hero-eyebrow .dot{animation:none}
  .reveal,.tab-fade{animation:none}
  .kpi{transition:none}
}
</style>
</head>
<body>
<div class="mesh-bg"></div>
<div class="hdr">
  <h1>💰 Cohen Family — Financial Planner v5</h1>
  <div class="hdr-right">
      <button id="monarchSyncBtn" onclick="syncMonarch()" style="font-size:9px;padding:3px 9px;background:var(--a-soft);border:1px solid rgba(191,105,0,.3);border-radius:4px;cursor:pointer;font-family:inherit;color:var(--a);transition:all .12s;display:none">📍 Sync Monarch</button>
      <button id="monarchConnectBtn" onclick="connectMonarch()" style="font-size:9px;padding:3px 9px;background:var(--s2);border:1px solid var(--bd);border-radius:4px;cursor:pointer;font-family:inherit;color:var(--t2);transition:all .12s">🔗 Connect Monarch</button>
    <span class="sync-pill" id="syncStatus"></span>
    <button class="logout-btn" onclick="doLogout()">Log out</button>
  </div>
</div>
<button id="mobileControlsToggle" onclick="toggleMobileControls()" style="margin-bottom:8px;padding:7px 13px;background:var(--s1);border:1px solid var(--bd);border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--t2);align-items:center;gap:5px">⚙️ <span id="mobileControlsLabel">Settings</span></button>
<div class="layout">
  <div class="panel" id="controls"></div>
  <div id="main"></div>
</div>
<script>
const COLORS=['#ff6b6b','#ffd43b','#ff922b','#e64980','#20c997','#845ef7','#339af0','#f783ac'];

// ═══ TAX ENGINE + PROJECTION MODEL — see /model.js (loaded above) ═══

// ═══ DEFAULTS ═══
const D={
  planStartYear:2026,
  kid1Birth:2027,kid2Birth:2030,kid3Birth:2034,kid4Birth:2037,numKids:3,
  nannyEndAge:1.5,nannyHourlyRate:30,nannyDaysPerWeek:4,daycareMonthly:2800,
  tuitionInflation:.035,yeshivaStartAge:2,yeshivaEndAge:17,kid1YeshivaStartAge:3,
  startingLiquid:1100000,nycRent:5500,
  // Norm — 4 rolling specific years (Y0=planStartYear, Y1=+1, Y2=+2, Y3=+3)
  normCashY0:280000,normCashY1:260000,normCashY2:275000,normCashY3:265000,
  normStockY0:197000,normStockY1:162000,normStockY2:153000,normStockY3:158000,
  normCashBase:275000,normGrowth:.01,normStockBase:150000,
  pretax401k:23500,pretaxBenefits:11700,
  company401kMatch:8750,
  // Nancy — 4 rolling specific W2 years (ignored once yr >= nancyRampYear)
  nancyW2Y0:130000,nancyW2Y1:80000,nancyW2Y2:100000,nancyW2Y3:75000,
  nancyHourlyRate:300,nancyRampYear:2030,nancyRampClients:5,nancyMaxClients:18,nancyRampYears:6,nancyWeeksPerYear:46,
  nancySoloPractice:1,nancyPracticeOverhead:15000,nancyQBIRate:.20,nancyHomeOfficeDeduct:8000,
  baseGroceries:7000,baseDining:14000,baseShopping:22000,baseVacations:20000,
  baseAuto:3500,baseInsurance:1500,baseMisc:10000,baseEntertainment:4500,
  baseCharity:8500,baseMedical:4500,baseTransit:4000,baseUtilsPhoneNet:5500,
  expenseInflation:.03,postKidVacations:10000,
  homePrice:2000000,downPctg:50,mortgageRate:5.0,homePurchaseYear:2030,
  propTaxRate:.012,propTaxBase:18000,maintBase:10000,homeAppreciation:.03,
  suburbAutoBoost:3500,suburbInsBoost:1500,suburbUtilBoost:2500,
  investReturn:.06,capGainsTaxRate:.345,costBasisPct:.55,
  k401Start:210000,
  taxInflation:.025,
  planEndYear:2058,
};
let P={...D};let scenarios=[];let compareMode=false;let activeScenarioIdx=-1;

// ═══ SYNC STATUS ═══
function setSyncStatus(status){
  const el=document.getElementById('syncStatus');
  if(!el)return;
  el.className='sync-pill '+status;
  if(status==='saving')el.textContent='Saving…';
  else if(status==='synced')el.textContent='✓ Synced';
  else if(status==='error')el.textContent='⚠ Save failed';
  else el.textContent='';
}

// ═══ PERSISTENCE — backed by server API ═══
let _saveTimer=null;
function savePlannerState(){
  setSyncStatus('saving');
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{
    try{
      await fetch('/api/planner-state',{
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({state:{P,compareMode,activeTab,activeScenarioIdx,monarchSnapshot}})
      });
      setSyncStatus('synced');
    }catch(e){setSyncStatus('error')}
  },500);
}

// Migrate old year-keyed format (normCash2026…) to rolling Y0-Y3 format
function migrateP(raw){
  if(raw.normCashY0!==undefined)return raw; // already new format
  const sy=raw.planStartYear||raw.startYear||2026;
  const m={...raw,planStartYear:sy};
  const oldNormCash={2026:280000,2027:260000,2028:275000,2029:265000};
  const oldNormStock={2026:197000,2027:162000,2028:153000,2029:158000};
  const oldNancyW2={2026:130000,2027:80000,2028:100000,2029:75000};
  for(let i=0;i<4;i++){
    const yr=sy+i;
    m['normCashY'+i]=raw['normCash'+yr]??oldNormCash[yr]??275000;
    m['normStockY'+i]=raw['normStock'+yr]??oldNormStock[yr]??150000;
    m['nancyW2Y'+i]=raw['nancyW2_'+yr]??oldNancyW2[yr]??100000;
  }
  m.normCashBase=raw.normCash2030Base??raw.normCashBase??275000;
  m.normStockBase=raw.normStock2030??raw.normStockBase??150000;
  return m;
}

async function loadFromServer(){
  try{
    const [stRes,scRes]=await Promise.all([
      fetch('/api/planner-state'),
      fetch('/api/scenarios')
    ]);
    if(stRes.ok){
      const d=await stRes.json();
      const s=d.state||{};
      if(s.P)P={...D,...migrateP(s.P)};
      if(s.compareMode!==undefined)compareMode=s.compareMode;
      if(s.activeTab)activeTab=s.activeTab;
      if(s.activeScenarioIdx!==undefined)activeScenarioIdx=s.activeScenarioIdx;
      if(s.monarchSnapshot&&!monarchSnapshot)monarchSnapshot=s.monarchSnapshot; // don't clobber a fresh auto-sync
    }else{
      showToast('⚠️ Could not load plan state (HTTP '+stRes.status+')','red');
    }
    if(scRes.ok){
      const sc=await scRes.json();
      scenarios=sc.map((s,i)=>{
        const params=migrateP(s.params||{});
        let results;
        try{results=run({...D,...params});}
        catch(e){console.warn('scenario rehydrate failed:',s.name,e);results=run({...D});}
        return{id:s.id,name:s.name,color:s.color||COLORS[i%COLORS.length],params,results};
      });
      console.log('Loaded',scenarios.length,'scenarios from server');
    }else{
      showToast('⚠️ Could not load scenarios (HTTP '+scRes.status+')','red');
    }
  }catch(e){
    console.error('loadFromServer error:',e);
    showToast('⚠️ Network error loading data: '+e.message,'red');
  }
  buildControls();render();
}

function exportJSON(){const b=new Blob([JSON.stringify({P,scenarios:scenarios.map(s=>({name:s.name,params:s.params}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cohen_planner.json';a.click()}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.P)P={...D,...d.P};if(d.scenarios)scenarios=d.scenarios.map((s,i)=>({...s,color:COLORS[i%COLORS.length],results:run({...D,...s.params})}));buildControls();render()}catch(err){alert('Invalid file')}};r.readAsText(f)};i.click()}

async function doLogout(){
  await fetch('/api/logout',{method:'POST'}).catch(()=>{});
  window.location.href='/login';
}

const fmt=n=>Math.abs(n)>=1e6?`$${(n/1e6).toFixed(2)}M`:Math.abs(n)>=1e3?`$${(n/1e3).toFixed(0)}K`:`$${Math.round(n)}`;
const fmtF=n=>`$${Math.round(n).toLocaleString()}`;

function showToast(msg,type){
  const d=document.createElement('div');
  const c=type==='green'?'#1a8754':type==='red'?'#cd3d64':'#0a2540';
  d.style.cssText=`position:fixed;top:16px;right:16px;background:${c};color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:500;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:300px`;
  d.textContent=msg;document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300)},3000);
}
function showConfirm(msg){return window.confirm?window.confirm(msg):true;}
function toggleMobileControls(){
  const panel=document.getElementById('controls');
  const label=document.getElementById('mobileControlsLabel');
  if(!panel)return;
  const open=panel.classList.toggle('mob-open');
  if(label)label.textContent=open?'Hide Settings':'Settings';
}

function connectMonarch(){window.location.href='/api/monarch-connect';}

async function checkMonarchStatus(){
  try{
    const r=await fetch('/api/monarch-status');
    const d=await r.json();
    const syncBtn=document.getElementById('monarchSyncBtn');
    const connBtn=document.getElementById('monarchConnectBtn');
    if(d.connected){
      if(syncBtn)syncBtn.style.display='';
      if(connBtn)connBtn.style.display='none';
      // Auto-sync on open — token is stored server-side and auto-refreshes
      if(!monarchSnapshot)syncMonarch();
    }else{
      if(syncBtn)syncBtn.style.display='none';
      if(connBtn)connBtn.style.display='';
    }
  }catch(e){/* ignore */}
}

async function loadMonarchInvestments(period){
  if(_investLoading)return; // prevent concurrent fetches causing jump/flicker
  if(period){_investPeriod=period;monarchInvestments=null;}
  _investLoading=true;
  // Don't call render() here — the caller (renderPortfolioTab) already shows loading state
  try{
    const r=await fetch('/api/monarch-investments?period='+_investPeriod);
    if(!r.ok){const e=await r.json().catch(()=>({}));monarchInvestments=false;showToast('Investments: '+(e.error||'failed'),'red');}
    else{monarchInvestments=await r.json();}
  }catch(e){monarchInvestments=false;showToast('Investments fetch error: '+e.message,'red');}
  _investLoading=false;
  if(activeTab==='portfolio')render(); // single render once data is ready
}

async function syncMonarch(){
  const btn=document.getElementById('monarchSyncBtn');
  if(btn){btn.textContent='⟳ Syncing…';btn.disabled=true;}
  try{
    const r=await fetch('/api/monarch-snapshot');
    if(r.status===401){
      // Not connected — show connect button
      const syncBtn=document.getElementById('monarchSyncBtn');
      const connBtn=document.getElementById('monarchConnectBtn');
      if(syncBtn)syncBtn.style.display='none';
      if(connBtn)connBtn.style.display='';
      showToast('Monarch disconnected — click Connect Monarch','red');
      return;
    }
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'HTTP '+r.status);}
    const d=await r.json();
    const nw=d.netWorth?.value||0;
    const ret=d.retirement?.value||0;
    monarchSnapshot={
      netWorth:nw,
      liquid:d.liquid?.value??(nw-ret),
      retirement:ret,
      assets:d.assets?.value||0,
      liabilities:d.liabilities?.value||0,
      syncedAt:d.netWorth?.updatedAt||new Date().toISOString(),
    };
    monarchAccounts=d.accounts||[];
    if(btn){btn.textContent='📍 Synced';btn.disabled=false;}
    showToast(`📍 Monarch synced · Liquid ${fmt(monarchSnapshot.liquid)} · 401k ${fmt(monarchSnapshot.retirement)}`,'green');
    savePlannerState(); // persist last sync so it shows instantly next open
    render();
  }catch(e){
    if(btn){btn.textContent='📍 Sync Monarch';btn.disabled=false;}
    showToast('Monarch sync failed: '+e.message,'red');
  }
}

function anchorToToday(){
  if(!monarchSnapshot){showToast('Sync Monarch first','red');return;}
  const curYr=new Date().getFullYear();
  const todayLiq=monarchSnapshot.liquid;
  const totalNw=monarchSnapshot.netWorth;
  const ret=monarchSnapshot.retirement;
  const syncDate=new Date(monarchSnapshot.syncedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  // Pro-rate plan's liquid target to today for comparison
  let planLiqToday=null;
  try{
    const{R}=run(P);
    const row=R.find(x=>x.yr===curYr)||R[0];
    const prev=R.find(x=>x.yr===curYr-1);
    const jan1=prev?prev.liq:(P.startingLiquid||0);
    const _ys=new Date(curYr,0,1),_ye=new Date(curYr+1,0,1);
    const frac=Math.min(1,Math.max(0,(new Date()-_ys)/(_ye-_ys)));
    if(row)planLiqToday=Math.round(jan1+frac*(row.liq-jan1));
  }catch(e){}
  const liqDiff=planLiqToday!=null?todayLiq-planLiqToday:null;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(10,37,64,.4);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML=`<div style="background:#fff;border-radius:12px;padding:22px 24px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2)">
    <div style="font-size:15px;font-weight:700;color:var(--tx);margin-bottom:2px">📍 Net Worth as of Today</div>
    <div style="font-size:10px;color:var(--t3);margin-bottom:16px">Monarch · synced ${syncDate}</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:8px">
        <span style="font-size:12px;color:var(--t2)">Liquid</span>
        <span style="font-size:16px;font-weight:700;font-family:'SF Mono',monospace;color:var(--b)">${fmtF(todayLiq)}</span>
      </div>
      ${ret>0?`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:8px">
        <span style="font-size:12px;color:var(--t2)">Retirement (401k)</span>
        <span style="font-size:16px;font-weight:700;font-family:'SF Mono',monospace;color:var(--p)">${fmtF(ret)}</span>
      </div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:8px">
        <span style="font-size:12px;color:var(--t2)">Total NW (Monarch)</span>
        <span style="font-size:16px;font-weight:700;font-family:'SF Mono',monospace;color:var(--tx)">${fmtF(totalNw)}</span>
      </div>
      ${liqDiff!=null?`<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:${liqDiff>=0?'rgba(26,135,84,.07)':'rgba(205,61,100,.05)'};border:1px solid ${liqDiff>=0?'rgba(26,135,84,.2)':'rgba(205,61,100,.2)'}">
        <span style="font-size:18px">${liqDiff>=0?'▲':'▼'}</span>
        <div>
          <div style="font-size:12px;font-weight:700;color:${liqDiff>=0?'var(--g)':'var(--r)'}">${liqDiff>=0?'Ahead':'Behind'} plan by ${fmtF(Math.abs(liqDiff))}</div>
          <div style="font-size:10px;color:var(--t2)">Plan pace: ${fmtF(planLiqToday)} liquid · Actual: ${fmtF(todayLiq)}</div>
        </div>
      </div>`:''}
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:16px">
      <button onclick="this.closest('div[style*=fixed]').remove()" style="font-size:12px;font-weight:600;padding:8px 18px;background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:inherit">Done</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}

function showSnapshotInput(){
  const dflt=`${P.planStartYear||2026} plan · ${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;
  const d=document.createElement('div');
  d.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,37,64,.4);z-index:9998;display:flex;align-items:center;justify-content:center';
  d.innerHTML=`<div style="background:#fff;border-radius:12px;padding:24px 28px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.15)">
    <div style="font-size:14px;font-weight:700;color:#0a2540;margin-bottom:4px">📸 Save Snapshot</div>
    <div style="font-size:11px;color:#8898aa;margin-bottom:14px">A dated copy of this plan for comparing projected vs. actual over time.</div>
    <input id="snapshotLabelInput" type="text" value="${dflt.replace(/"/g,'&quot;')}"
      style="width:100%;padding:9px 11px;border:1px solid #635bff;border-radius:7px;font-size:12px;font-family:inherit;color:#0a2540;outline:none;margin-bottom:12px"
      onkeydown="if(event.key==='Enter')confirmSnapshot(this.closest('div[style*=fixed]'));if(event.key==='Escape')this.closest('div[style*=fixed]').remove()">
    <div style="display:flex;gap:8px">
      <button onclick="confirmSnapshot(this.closest('div[style*=fixed]'))" style="flex:1;background:#635bff;color:#fff;border:none;padding:9px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12px;font-family:inherit">Save</button>
      <button onclick="this.closest('div[style*=fixed]').remove()" style="flex:1;background:#f0f4f8;color:#425466;border:1px solid #e6ebf1;padding:9px;border-radius:7px;cursor:pointer;font-size:12px;font-family:inherit">Cancel</button>
    </div>
  </div>`;
  d.addEventListener('click',e=>{if(e.target===d)d.remove()});
  document.body.appendChild(d);
  setTimeout(()=>{const inp=document.getElementById('snapshotLabelInput');if(inp){inp.focus();inp.select();}},50);
}
async function confirmSnapshot(overlay){
  const inp=document.getElementById('snapshotLabelInput');
  const label=inp?inp.value.trim():'';
  if(overlay)overlay.remove();
  await saveSnapshot(false,label||undefined);
}

function _updateChart(datasets,labels){
  if(!charts.main)return false;
  charts.main.data.labels=labels;
  for(let i=0;i<datasets.length;i++){
    if(charts.main.data.datasets[i]){Object.assign(charts.main.data.datasets[i],{data:datasets[i].data,label:datasets[i].label})}

  charts.main.update('active');return true;

function exportCSV(){
  const{R}=run(P);
  const cols=['Year','Norm Gross','Nancy Gross','Total Gross','All-in Tax','Eff Rate %','Net Income','Housing','Living','Childcare','Tuition','Total Expenses','Surplus','Stock Sold','Tax on Sales','Liquid','Home Equity','Net Worth','401k'];
  const rows=R.map(r=>[r.yr,r.normG,r.nancyG,r.gross,r.tax,(r.effRate*100).toFixed(2),r.inc,r.h,r.liv,r.cc,r.tu,r.totE,r.surp,r.sold,r.txS,r.liq,r.eq,r.nw,r.k401]);
  const csv=[cols.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`cohen-planner-${(P.planStartYear||2026)}-projection.csv`;a.click();
}

// ═══ ANNUAL SNAPSHOT HISTORY ═══
async function loadSnapshots(){
  try{const res=await fetch('/api/snapshots');if(res.ok)snapshots=await res.json()}catch(e){snapshots=[]}
}
async function saveSnapshot(silent,labelOverride){
  const{R,tT}=run(P);const last=R[R.length-1];
  const def=R.filter(r=>r.surp<0).length;
  const dflt=`${P.planStartYear||2026} plan · ${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;
  const label=labelOverride||dflt;
  const summary={finalNW:last.nw,final401k:last.k401,totalTuition:tT,deficitYears:def,startingLiquid:P.startingLiquid,liqFloor:Math.min(...R.map(r=>r.liq))};
  const snap={id:advUuid(),label,planYear:P.planStartYear||2026,params:{...P},summary};
  try{await fetch('/api/snapshots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap)});}catch(e){}
  snapshots.push({...snap,plan_year:snap.planYear,created_at:new Date().toISOString()});
  renderSnapshotBar();
  if(!silent)showToast(`📸 Snapshot saved: "${label}"`,'green');
}
async function deleteSnapshot(id){
  const s=snapshots.find(x=>x.id===id);if(!s)return;
  if(!showConfirm(`Delete snapshot "${s.label}"?`))return;
  try{await fetch('/api/snapshots/'+id,{method:'DELETE'});}catch(e){}
  snapshots=snapshots.filter(x=>x.id!==id);
  if(overlaySnapId===id)overlaySnapId=null;
  renderSnapshotBar();render();
}
function toggleOverlaySnap(id){overlaySnapId=overlaySnapId===id?null:id;if(activeTab!=='nw'){activeTab='nw';document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='nw'))}render()}
function renderSnapshotBar(){
  const el=document.getElementById('snapshotBar');if(!el)return;
  if(!snapshots.length){el.innerHTML='';return}
  let h='<div class="snap-bar"><span style="font-size:7px;color:var(--t3);font-weight:600">📸 SNAPSHOTS:</span>';
  [...snapshots].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(s=>{
    const sum=s.summary||{};const isA=overlaySnapId===s.id;
    h+=`<div class="snap-chip ${isA?'active':''}" onclick="toggleOverlaySnap('${s.id}')" title="NW @2058: ${sum.finalNW?fmt(sum.finalNW):'—'} · click to ${isA?'hide':'overlay on chart'}">${advEscape(s.label)}${isA?' ✓':''}<span class="x" onclick="event.stopPropagation();deleteSnapshot('${s.id}')">✕</span></div>`;
  });
  h+='</div>';el.innerHTML=h;
}

function buildControls(){

  const ST=(label,key,body)=>{const c=_collapsedSections.has(key);return`<div class="st" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none" onclick="toggleSection('${key}')"><span>${label}</span><span style="font-size:9px;color:var(--t3);opacity:.6">${c?'▶':'▼'}</span></div>${c?'':body}`};
  const sy=P.planStartYear||2026;

  let h=`<div style="font-size:10px;font-weight:700;margin-bottom:8px">⚙️ Parameters</div>`;
  h+=`<div style="margin-bottom:8px">

    </div>
    <div id="scenarioSaveForm" style="display:none;margin-bottom:3px">

      <div style="display:flex;gap:4px">
        <button class="btn btn-g" onclick="confirmSaveScenario()" style="flex:1;font-size:10px">Save</button>
        <button class="btn" onclick="hideSaveInput()" style="flex:1;font-size:10px">Cancel</button>

    ${scenarios.length>0?`<button class="btn" onclick="toggleCompare()" style="margin-bottom:3px">${compareMode?'Exit Compare':'📊 Compare'}</button>`:''}

  </div>`;

  // Kids
  let kidsBody=s('# of kids','numKids',1,4,1)+s('Kid 1 born','kid1Birth',2026,2030,1);

  if(P.numKids>=4)kidsBody+=s('Kid 4 born','kid4Birth',2034,2044,1);

  const childcareBody=s('Nanny until age','nannyEndAge',.5,3,.5,v=>v+' yrs')+s('Nanny $/hr','nannyHourlyRate',20,45,1,v=>'$'+v)+s('Nanny days/wk','nannyDaysPerWeek',2,5,1)+s('Daycare $/mo','daycareMonthly',1500,4500,100,v=>'$'+v.toLocaleString())+s('Kid 1 yeshiva start','kid1YeshivaStartAge',2,5,1,v=>v+' (uses daycare)')+s('Kids 2+ yeshiva start','yeshivaStartAge',2,5,1,v=>v+' (no daycare)');
  h+=ST('🍼 Childcare','childcare',childcareBody);

  // Tuition
  h+=ST('🎓 Tuition','tuition',s('Tuition inflation','tuitionInflation',.02,.06,.005,v=>(v*100).toFixed(1)+'%'));

  // Plan start
  const planBody=s('Start year','planStartYear',2026,2035,1)+`<div style="font-size:7.5px;color:var(--t3);margin-bottom:6px">Advance each Jan to roll inputs forward. Update Starting Liquid to reflect actual wealth.</div>`;

async function deleteScenario(i){
  const s=scenarios[i];
  scenarios.splice(i,1);

  if(activeScenarioIdx===i)activeScenarioIdx=-1;

let _firstPaint=true;
const _reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
// Tween a formatted number element ("$1.2M", "34.5%", "+$450K") from 0 → its value
function _animEl(el){
  if(!el)return;
  const final=el.textContent.trim();
  const m=final.match(/^([^\d-]*)(-?[\d,]*\.?\d+)(.*)$/);
  if(!m||_reduceMotion()){return}
  const prefix=m[1],numStr=m[2],suffix=m[3];
  const grouped=numStr.includes(',');
  const decimals=(numStr.split('.')[1]||'').length;
  const target=parseFloat(numStr.replace(/,/g,''));
  if(!isFinite(target))return;
  const fmtNum=v=>{let s=v.toFixed(decimals);if(grouped)s=Number(s).toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});return prefix+s+suffix};
  const dur=850,t0=performance.now();
  function step(now){const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,3);el.textContent=fmtNum(target*e);if(p<1)requestAnimationFrame(step);else el.textContent=final}
  requestAnimationFrame(step);
}
// Crisp inline sparkline (bespoke, no Chart.js) for the hero band
function _sparkSVG(vals,w,h,color){
  if(!vals||vals.length<2)return'';
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1,pad=4;
  const pts=vals.map((v,i)=>[pad+i/(vals.length-1)*(w-2*pad), h-pad-((v-min)/rng)*(h-2*pad)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${(w-pad).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
  const lastPt=pts[pts.length-1],gid='sp'+(''+color).replace(/[^a-z0-9]/gi,'');
  return `<svg class="hero-spark-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3.4" fill="${color}"/>
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="6" fill="${color}" opacity=".22"/>
  </svg>`;
}

function renderMonarchAccountsCard(){

  const catOrder=['cash','investment','retirement','other_asset','other','liability'];
  const catLabel={cash:'Cash & Savings',investment:'Investments',retirement:'Retirement',other_asset:'Other Assets',other:'Other',liability:'Liabilities'};
  const catColor={cash:'var(--b)',investment:'var(--accent)',retirement:'var(--p)',other_asset:'var(--t2)',other:'var(--t2)',liability:'var(--r)'};
  const groups={};
  for(const a of monarchAccounts){
    const c=a.category||'other';
    if(!groups[c])groups[c]=[];
    groups[c].push(a);
  }
  const rows=catOrder.filter(c=>groups[c]).map(c=>{

        <span style="font-size:11px;font-weight:700;font-family:'SF Mono',monospace;color:${isLiab?'var(--r)':'var(--tx)'}">${isLiab?'−':''}${fmt(Math.abs(total))}</span>
      </div>
      ${accts.map(a=>{
        const nm=a.name||'';
        const isStripe=nm.toLowerCase().includes('stripe');
        return`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:${isStripe?'rgba(99,91,255,.06)':'var(--s2)'};border:1px solid ${isStripe?'rgba(99,91,255,.2)':'var(--bd)'};border-radius:6px;margin-bottom:3px">
          <div>
            <span style="font-size:10.5px;font-weight:${isStripe?700:500};color:var(--tx)">${advEscape(nm)}</span>

  }).join('');
  const totalNw=monarchAccounts.reduce((s,a)=>s+(a.balance||0),0);
  return`<div style="margin-top:12px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px">

}

    <div style="display:grid;grid-template-columns:90px 70px 1fr 90px 90px 90px 90px;gap:0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);padding:7px 12px;border-bottom:1px solid var(--bd);background:var(--s2)">
      <div>Ticker</div><div>Type</div><div>Value</div><div style="text-align:right">% Portfolio</div><div style="text-align:right">Period Δ$</div><div style="text-align:right">Period Δ%</div><div style="text-align:right">All-time Δ%</div>
    </div>
    ${holdings.map((h,i)=>{

        <div style="font-size:10.5px;font-weight:600;color:${isCash?'var(--t2)':'var(--tx)'};font-family:'SF Mono',monospace">${advEscape(h.ticker||"")}</div>
        <div style="font-size:8.5px;color:var(--t3)">${typeLabel[h.securityType]||h.securityType||'—'}</div>
        <div>
          <div style="font-size:10px;font-family:'SF Mono',monospace;font-weight:500;color:var(--tx)">${fmt(h.value)}</div>
          <div style="height:3px;background:var(--s3);border-radius:2px;margin-top:3px;max-width:120px"><div style="height:100%;width:${Math.min(100,pct*2)}%;background:${isCash?'var(--t4)':'var(--accent)'};border-radius:2px"></div></div>
        </div>
        <div style="text-align:right;font-size:9.5px;font-family:'SF Mono',monospace;color:var(--t2)">${pct.toFixed(1)}%</div>
        <div style="text-align:right;font-size:9.5px;font-family:'SF Mono',monospace;font-weight:600;color:${isCash?'var(--t3)':colorPct(h.periodChange)}">${isCash?'—':signFmt(h.periodChange)}</div>
        <div style="text-align:right;font-size:9.5px;font-family:'SF Mono',monospace;font-weight:600;color:${isCash?'var(--t3)':colorPct(h.periodChangePct)}">${isCash?'—':signPct(h.periodChangePct)}</div>
        <div style="text-align:right;font-size:9.5px;font-family:'SF Mono',monospace;font-weight:600;color:${isCash?'var(--t3)':colorPct(h.allTimePct)}">${isCash?'—':signPct(h.allTimePct)}</div>
      </div>`;
    }).join('')}
   </div>
  </div>
  <div style="font-size:9px;color:var(--t3);padding:0 2px">Holdings sourced from Monarch via GetInvestments. Period: ${inv.periodStart} → ${inv.periodEnd}. Values are Monarch's last-synced prices.</div>

  ${(()=>{
    // ── Portfolio analysis blurb ─────────────────────────────────────────────
    const observations=[];
    const flags=[];

    // Concentration
    const topH=holdings[0];
    const top3Val=holdings.slice(0,3).reduce((s,h)=>s+h.value,0);
    const top3Pct=totalVal>0?top3Val/totalVal*100:0;
    const topPct=totalVal>0&&topH?(topH.value/totalVal*100):0;
    if(topPct>25)flags.push({c:'var(--a)',t:`⚠ ${topH.ticker} is ${topPct.toFixed(0)}% of portfolio — heavy single-stock concentration.`});
    else observations.push({c:'var(--g)',t:`✓ Top holding ${topH?.ticker||'—'} is ${topPct.toFixed(0)}% — concentration is manageable.`});

    if(top3Pct>60)flags.push({c:'var(--a)',t:`Top 3 positions (${holdings.slice(0,3).map(h=>h.ticker).join(', ')}) = ${top3Pct.toFixed(0)}% of portfolio.`});

    // Cash drag
    const cashHoldings=holdings.filter(h=>h.securityType==='cash');
    const cashVal=cashHoldings.reduce((s,h)=>s+h.value,0);
    const cashPct=totalVal>0?cashVal/totalVal*100:0;
    if(cashPct>12)flags.push({c:'var(--r)',t:`Cash is ${cashPct.toFixed(0)}% of investment portfolio — potential drag on long-run returns.`});
    else if(cashPct>0)observations.push({c:'var(--t2)',t:`Cash position: ${cashPct.toFixed(0)}% — within normal range.`});

    // Stripe account
    if(stripeBalance>0){
      const stripePct=donutTotal>0?stripeBalance/donutTotal*100:0;
      observations.push({c:'#6772e5',t:`Stripe account: ${fmt(stripeBalance)} (${stripePct.toFixed(1)}% of total including accounts).`});
    }

    // Period performance
    const periodPct=inv.periodChangePct||0;
    if(Math.abs(periodPct)>5)observations.push({c:colorPct(periodPct),t:`${periodPct>0?'Strong':'Weak'} period: ${signPct(periodPct)} over ${_investPeriod}. ${periodPct>0?'Broad momentum intact.':'Monitor for continuation.'}`});

    // All-time
    const allPct=inv.allTimePct||0;
    if(allPct>0)observations.push({c:'var(--g)',t:`All-time return: ${signPct(allPct)} — portfolio is in the green overall.`});
    else if(allPct<0)flags.push({c:'var(--r)',t:`Portfolio is down ${signPct(allPct)} all-time — cost-basis is above current value.`});

    // Type diversity
    const types=[...new Set(holdings.filter(h=>h.securityType!=='cash').map(h=>h.securityType))];
    const typeNames=types.map(t=>({equity:'Equities',etf:'ETFs',mutual_fund:'Funds',bond:'Bonds',crypto:'Crypto',option:'Options'}[t]||t));
    if(types.length>=2)observations.push({c:'var(--t2)',t:`Spread across ${typeNames.join(', ')} — ${holdings.length} total positions.`});

    const allItems=[...flags,...observations];
    if(allItems.length===0)return'';
    return`<div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:10px">Portfolio Analysis</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${allItems.map(o=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 10px;background:var(--s2);border-radius:7px">
          <div style="font-size:11px;color:${o.c};line-height:1.45">${o.t}</div>
        </div>`).join('')}
      </div>
    </div>`;
  })()}

  ${renderMonarchAccountsCard()}
  </div>`;

  if(donutData.length>0){
    const dCtx=document.getElementById('portfolioDonut').getContext('2d');
    charts.main=new Chart(dCtx,{
      type:'doughnut',
      data:{labels:donutLabels,datasets:[{data:donutData,backgroundColor:donutColors.slice(0,donutData.length),borderWidth:0,hoverOffset:4}]},
      options:{
        responsive:true,maintainAspectRatio:false,cutout:'58%',
        plugins:{
          legend:{position:'bottom',labels:{
            font:{size:10,family:"'Inter',sans-serif"},color:'#425466',padding:8,boxWidth:8,
            generateLabels:chart=>{
              const ds=chart.data.datasets[0];
              return chart.data.labels.map((lbl,i)=>{
                const val=ds.data[i];
                const pct=donutTotal>0?(val/donutTotal*100).toFixed(1):'0';
                return{text:`${lbl} ${pct}%`,fillStyle:ds.backgroundColor[i],strokeStyle:'transparent',hidden:false,index:i};
              });
            }
          }},
          tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmt(ctx.raw)} (${donutTotal>0?(ctx.raw/donutTotal*100).toFixed(1):'0'}%)`}},
          datalabels:{
            color:'#fff',
            font:{size:10,weight:'bold',family:"'Inter',sans-serif"},
            formatter:(val,ctx)=>{
              const pct=donutTotal>0?val/donutTotal*100:0;
              return pct>=5?pct.toFixed(0)+'%':'';
            },
            anchor:'center',align:'center',
          }
        }
      },
      plugins:[ChartDataLabels]
    });
  }
}

function renderHousingTab(R,P){
  const ca=document.getElementById('chartArea');
  destroyCharts();

  const py=P.homePurchaseYear||2030;
  const ptRate=P.propTaxRate??0.012;
  const maintAnn=P.maintBase||10000;
  const endYr=P.planEndYear||2058;

  const pyRow=R.find(r=>r.yr===py)||R[0];
  const netInc=pyRow?.inc||0;

  // All-in annual housing cost for any price/down/rate
  function calcH(hp,dp,mr){
    const loan=hp*(1-dp/100);
    const moR=mr/100/12;
    const moPI=loan>0&&moR>0?loan*(moR*(1+moR)**360)/((1+moR)**360-1):0;
    const annTax=ptRate*hp;
    const annM=Math.round(maintAnn*(hp/P.homePrice));
    const total=moPI*12+annTax+annM;
    return{loan,moPI,annPI:moPI*12,annTax,annM,total,moTotal:total/12};
  }
  // Run the live model with overrides → final NW+401k and deficit count
  function proj(ov){
    try{const r=run({...P,...ov});const l=r.R[r.R.length-1];return{nw:l.nw,k401:l.k401,total:l.nw+l.k401,defYrs:r.R.filter(x=>x.surp<0).length};}catch(e){return null;}
  }

  const cur=calcH(P.homePrice,P.downPctg,P.mortgageRate);
  const curPct=netInc>0?cur.total/netInc:0;
  const K=cur.total/P.homePrice;               // housing $/yr per $ of home (current dp & rate)
  const priceFor=f=>K>0?netInc*f/K:0;          // home price that lands housing at f of net
  const target25=netInc*0.25;

  // Purchase-year snapshot — keep everything in the SAME year's dollars.
  // (Averaging nominal expenses across the whole horizon would inflate them
  // ~3%/yr and unfairly dwarf a single year's income.) Model fields: liv is
  // living ex-housing/ex-tuition/ex-childcare; cc childcare; tu tuition; h housing.
  const pyLiv=pyRow.liv||0;
  const pyTuCc=(pyRow.tu||0)+(pyRow.cc||0);
  const buffer=30000;
  const availHousing=netInc-pyLiv-pyTuCc-buffer;
  // Peak crunch year (max tuition+childcare) for the warning
  const peakRow=R.reduce((a,b)=>((b.tu+b.cc)>(a.tu+a.cc)?b:a),R[0]);
  const peakTuCc=peakRow.tu+peakRow.cc;
  const peakAvail=peakRow.inc-peakRow.liv-peakTuCc-buffer;

  const kY=v=>'$'+Math.round(v/1000)+'K';
  const kMo=v=>'$'+(v/12/1000).toFixed(1)+'K';
  const mM=v=>'$'+(v/1e6).toFixed(2)+'M';
  const fmtM=v=>v>=1e6?'$'+(v/1e6).toFixed(2)+'M':fmt(v);

  // ── Tradeoff data (live model at 7 price points) ──
  const tPrices=[1000000,1200000,1400000,1600000,1700000,1800000,2000000];
  const tNW=tPrices.map(hp=>{const p=proj({homePrice:hp});return p?+(p.total/1e6).toFixed(2):0;});
  const tCost=tPrices.map(hp=>+(calcH(hp,P.downPctg,P.mortgageRate).total/1000).toFixed(1));
  const tColors=tPrices.map(hp=>hp===P.homePrice?'rgba(99,91,255,.75)':(hp===1700000?'rgba(26,135,84,.65)':'rgba(0,115,230,.4)'));

  // ── Five paths (exact combos from the analysis), live NW ──
  const PATHS=[
    {label:'A · Smaller home, low down', hp:1300000,dp:30,mr:5.5,col:'#1a8754',note:'Most NW upside, smallest home'},
    {label:'B · Smaller home, low rate', hp:1400000,dp:25,mr:4.0,col:'#1a8754',note:'Best NW, requires low-rate environment'},
    {label:'C · Mid-size, big down',     hp:1600000,dp:50,mr:6.0,col:'#0073e6',note:'Solid balance · likely scenario',hi:true},
    {label:'D · Larger home, low rate',  hp:1800000,dp:50,mr:4.5,col:'#bf6900',note:'Bigger home, more $ tied up'},
    {label:'E · Original $2M, huge down',hp:2000000,dp:60,mr:5.0,col:'#cd3d64',note:'Largest home, most capital locked up'},
  ];
  const pathData=PATHS.map(pd=>{const h=calcH(pd.hp,pd.dp,pd.mr);const p=proj({homePrice:pd.hp,downPctg:pd.dp,mortgageRate:pd.mr});return{...pd,...h,finalNW:p?p.total:0,defYrs:p?p.defYrs:0};});
  const bestNW=Math.max(...pathData.map(d=>d.finalNW));

  // Recommendation deltas (live)
  const nw17=proj({homePrice:1700000})?.total||0;
  const nw20=proj({homePrice:2000000})?.total||0;
  const recGain=nw17-nw20;

  let pathRows='';
  pathData.forEach((pd,i)=>{
    const rowBg=pd.hi?'background:var(--g-soft)':(i%2===0?'background:var(--s1)':'background:var(--s2)');
    const nwCol=pd.finalNW>=bestNW?'var(--g)':pd.finalNW>=bestNW*.92?'var(--tx)':'var(--r)';
    pathRows+=`<tr style="${rowBg}${pd.hi?';outline:1px solid var(--g)':''}">

      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace">${mM(pd.hp)}</td>
      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace">${pd.dp}%</td>
      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace">${fmtM(pd.hp*pd.dp/100)}</td>
      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace;color:${pd.mr<=4.5?'var(--g)':pd.mr>=6?'var(--r)':'var(--a)'}">${pd.mr.toFixed(1)}%</td>
      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace">${fmtM(pd.loan)}</td>
      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace">${fmtF(Math.round(pd.moPI))}</td>
      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace">${fmtF(Math.round(pd.annTax))}</td>
      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace">${fmtF(Math.round(pd.annM))}</td>
      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace;font-weight:700;color:var(--g)">${kY(pd.total)}</td>
      <td style="padding:9px 10px;font-size:11px;font-family:'SF Mono',monospace;font-weight:700;color:${nwCol}">${mM(pd.finalNW)}</td>
      <td style="padding:9px 10px;font-size:10px;color:var(--t2)">${pd.note}</td>
    </tr>`;
  });

  const ST='font-size:14px;font-weight:600;color:var(--tx);margin:8px 0 2px';
  const IB=(border,html)=>`<div style="background:var(--s2);border-left:3px solid ${border};padding:12px 14px;border-radius:0 7px 7px 0;margin-top:10px;font-size:12px;line-height:1.5;color:var(--t2)">${html}</div>`;

  ca.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px;padding:2px">

  <!-- Header -->
  <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--bd);padding-bottom:12px">
    <div style="font-size:18px;font-weight:700;color:var(--tx)">🏠 Ideal Housing Budget Analysis</div>
    <div style="font-size:11px;color:var(--t3);font-family:'SF Mono',monospace">Cohen Family · ${py} Purchase</div>
  </div>

  <!-- THE FRAMING -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
    <div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px">📊 ${py} Net Income</div>
      <div style="font-size:28px;font-weight:700;font-family:'SF Mono',monospace;letter-spacing:-1px;color:var(--c)">${kY(netInc)}</div>
      <div style="font-size:11px;color:var(--t2);margin-top:3px">Combined household after taxes</div>
    </div>
    <div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px">🎯 Housing Target (25%)</div>
      <div style="font-size:28px;font-weight:700;font-family:'SF Mono',monospace;letter-spacing:-1px;color:var(--g)">${kY(target25)}/yr</div>
      <div style="font-size:11px;color:var(--t2);margin-top:3px">${kMo(target25)}/mo all-in (mortgage + tax + maint)</div>
    </div>
    <div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px">${curPct>0.28?'⚠️':'✅'} Current Plan (${mM(P.homePrice)})</div>
      <div style="font-size:28px;font-weight:700;font-family:'SF Mono',monospace;letter-spacing:-1px;color:${curPct>0.28?'var(--a)':curPct>0.25?'var(--a)':'var(--g)'}">${kY(cur.total)}/yr</div>
      <div style="font-size:11px;color:var(--t2);margin-top:3px">${kMo(cur.total)}/mo · ~${(curPct*100).toFixed(0)}% of net income</div>
    </div>
  </div>

  <!-- WHY 25% -->
  <div style="${ST}">📐 What's an "ideal" housing cost?</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px">The Math</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr><td style="padding:8px 4px;color:var(--t2);border-bottom:1px solid var(--bd)">${py} Net income</td><td style="padding:8px 4px;text-align:right;font-family:'SF Mono',monospace;border-bottom:1px solid var(--bd)"><strong>${kY(netInc)}</strong></td></tr>
        <tr><td style="padding:8px 4px;color:var(--t2);border-bottom:1px solid var(--bd)">${py} Living expenses (ex-housing, ex-tuition, ex-childcare)</td><td style="padding:8px 4px;text-align:right;font-family:'SF Mono',monospace;border-bottom:1px solid var(--bd)">${kY(pyLiv)}</td></tr>

      </table>
      ${IB('var(--b)',`<strong style="color:var(--tx)">The hard truth:</strong> ${py} has room, but by peak tuition (<strong style="color:var(--tx)">${peakRow.yr}</strong>) tuition + childcare alone hits <strong style="color:var(--tx)">${kY(peakTuCc)}</strong> — leaving only <strong style="color:${peakAvail>=0?'var(--a)':'var(--r)'}">${kY(Math.max(0,peakAvail))}</strong> for housing that year${peakAvail<0?' (a deficit before housing is even counted)':''}. Housing is fixed, so the crunch years are funded by drawing down savings. Keeping all-in housing modest is what protects those years.`)}

    <div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px">Three Reasonable Targets</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr><td style="padding:8px 4px;border-bottom:1px solid var(--bd)"><strong style="color:var(--g)">Conservative (22% of net)</strong></td><td style="padding:8px 4px;text-align:right;font-family:'SF Mono',monospace;border-bottom:1px solid var(--bd)"><strong>${mM(priceFor(.22))} → ${kY(netInc*.22)}/yr</strong></td></tr>
        <tr><td style="padding:8px 4px;border-bottom:1px solid var(--bd)"><strong style="color:var(--a)">Moderate (25% of net)</strong></td><td style="padding:8px 4px;text-align:right;font-family:'SF Mono',monospace;border-bottom:1px solid var(--bd)"><strong>${mM(priceFor(.25))} → ${kY(netInc*.25)}/yr</strong></td></tr>
        <tr><td style="padding:8px 4px;border-bottom:1px solid var(--bd)"><strong style="color:var(--b)">Stretch (28% of net)</strong></td><td style="padding:8px 4px;text-align:right;font-family:'SF Mono',monospace;border-bottom:1px solid var(--bd)"><strong>${mM(priceFor(.28))} → ${kY(netInc*.28)}/yr</strong></td></tr>
        <tr><td style="padding:8px 4px;color:var(--t2)">Current plan (${(curPct*100).toFixed(0)}%)</td><td style="padding:8px 4px;text-align:right;font-family:'SF Mono',monospace;color:var(--t2)">${mM(P.homePrice)} → ${kY(cur.total)}/yr</td></tr>
      </table>
      ${IB('var(--g)',`<strong style="color:var(--tx)">Recommendation: ~$1.7M target.</strong> Adds roughly <strong style="color:var(--g)">${mM(recGain)}</strong> to long-term NW vs a $2M home, while staying realistic for a 4-bed home (rather than $1.5M, which may force compromises on size or quality).`)}
    </div>
  </div>

  <!-- TRADEOFF CHART -->
  <div style="${ST}">📈 The Tradeoff: Home Price vs Lifecycle NW</div>
  <div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px">
    <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px">Lower home price → more compounding capital → bigger lifetime NW</div>
    <div style="position:relative;width:100%;height:300px"><canvas id="housingTradeoff"></canvas></div>
    ${IB('var(--bd2)',`<strong style="color:var(--tx)">Reading the chart:</strong> Each ~$100K reduction in home price adds roughly ${mM(Math.abs((tNW[6]-tNW[2])/6)*1e6)} to your final NW (NW + 401k at ${endYr}). Roughly linear because the saved capital compounds at ${(P.investReturn*100).toFixed(0)}%/yr for decades.`)}
  </div>

    housing:{label:'Housing',keys:['homePrice','downPctg','startingLiquid','homeAppreciation']},

  const preset=PRESETS[_sensiPreset]||PRESETS.all;

  const results=PARAMS.map(p=>{
    const delta=_sensiDeltas[p.key]??p.delta;
    const vBase=P[p.key];
    const hiV=vBase+delta;
    const loV=Math.max(0,vBase-delta);
    const hiP={...P,[p.key]:hiV};
    const loP={...P,[p.key]:loV};
    const hiR=run(hiP).R;const loR=run(loP).R;
    const hiNW=hiR[hiR.length-1].nw;
    const loNW=loR[loR.length-1].nw;
    const hiDelta=hiNW-baseNW;
    const loDelta=loNW-baseNW;
    const impact=Math.max(Math.abs(hiDelta),Math.abs(loDelta));
    return{...p,delta,vBase,hiDelta,loDelta,impact};
  });

  results.sort((a,b)=>Math.abs(b.hiDelta-b.loDelta)-Math.abs(a.hiDelta-a.loDelta));

  const presetBtns=Object.entries(PRESETS).map(([k,v])=>

  results.forEach((r,i)=>{
    const upsideVal=r.better===1?r.hiDelta:r.loDelta;

    const uColor=upsideVal>=0?'var(--g)':'var(--r)';

    const rowBg=i%2===0?'var(--s1)':'var(--s2)';
    const deltaDisplay=r.key==='investReturn'||r.key==='expenseInflation'||r.key==='taxInflation'||r.key==='homeAppreciation'

      :r.delta>=1000?'$'+(r.delta/1000).toFixed(0)+'K':String(r.delta);
    const uSign=upsideVal>=0?'+':'';const dSign=downsideVal>=0?'+':'';
    h+=`<div style="display:grid;grid-template-columns:148px 56px 1fr 1fr;align-items:center;padding:5px 12px;border-bottom:1px solid var(--bd);background:${rowBg}">
      <div>
        <div style="font-size:10px;font-weight:600;color:var(--tx)">${r.label}</div>
        <div style="font-size:8px;color:var(--t3);font-family:'SF Mono',monospace">${r.fmtV(r.vBase)} base</div>
      </div>
      <div style="padding:0 4px">
        <input type="text" value="${deltaDisplay}" data-key="${r.key}" data-rawdelta="${r.delta}"
          onchange="sensiUpdateDelta(this)"
          style="width:100%;font-size:9px;font-family:'SF Mono',monospace;text-align:center;padding:3px 4px;border:1px solid var(--bd);border-radius:4px;background:var(--s1);color:var(--tx);outline:none"
          title="Change step size for ${r.label}">
      </div>
      <div style="text-align:right;padding-right:12px;font-size:9.5px;font-family:'SF Mono',monospace;font-weight:600;color:${dColor}">${dSign}${fmt(downsideVal)}</div>
      <div style="text-align:right;padding-right:4px;font-size:9.5px;font-family:'SF Mono',monospace;font-weight:600;color:${uColor}">${uSign}${fmt(upsideVal)}</div>
    </div>`;
  });

  h+=`</div>
  <div style="margin-top:10px;font-size:9px;color:var(--t3);display:flex;gap:14px;flex-wrap:wrap;padding:0 2px">
    <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:10px;height:6px;background:var(--g);border-radius:2px;opacity:.85"></span>Increases final NW</span>

    <span>Edit ± column to change step size. Sorted by total swing.</span>

  ca.innerHTML=h;
  document.getElementById('summaries').innerHTML='';

  const tlabels=results.map(r=>r.label);
  const upsideData=results.map(r=>Math.round(Math.max(0,r.better===1?r.hiDelta:r.loDelta)/1000));
  const downsideData=results.map(r=>Math.round(Math.min(0,r.better===1?r.loDelta:r.hiDelta)/1000));
  const tCtx=document.getElementById('tornadoChart').getContext('2d');
  charts.main=new Chart(tCtx,{

          title:{display:true,text:`Impact on ${ey} Net Worth ($K)`,font:{size:10},color:'#8898aa'}
        },
        y:{
          grid:{display:false},
          ticks:{font:{size:11,family:"'Inter',sans-serif"},color:'#0a2540'}
        }
      }
    }
  });
}

function sensiUpdateDelta(input){
  const key=input.dataset.key;
  const raw=input.value.trim().replace(/[$%K,]/gi,'');
  let val=parseFloat(raw);
  if(isNaN(val)||val<=0){input.value=input.dataset.rawdelta;return;}
  // Handle % suffix
  if(input.value.includes('%'))val=val/100;
  // Handle K suffix
  else if(input.value.toUpperCase().includes('K'))val=val*1000;
  _sensiDeltas[key]=val;
  input.dataset.rawdelta=val;
  renderSensitivityTab(window._lastR,window._lastP);
}

  return `<span data-goal-key="${key}" data-goal-parse="${parseAs}" onclick="goalInlineEdit(this)" style="cursor:pointer;border-bottom:1px dashed var(--t3);padding:0 1px;white-space:nowrap" title="Click to edit">${display}</span>`;
}
function goalInlineEdit(span){
  const key=span.dataset.goalKey;
  const parseAs=span.dataset.goalParse;
  const cur=P[key];
  let dflt;
  if(parseAs==='dollar-m')dflt=(cur/1e6).toFixed(2)+'M';
  else if(parseAs==='dollar-k')dflt=cur>=1000?Math.round(cur/1000)+'K':String(cur);
  else if(parseAs==='pct-decimal')dflt=(cur*100).toFixed(1)+'%';
  else if(parseAs==='pct')dflt=String(cur);
  else dflt=String(cur);
  const inp=document.createElement('input');
  inp.type='text';inp.value=dflt;
  inp.style.cssText='width:72px;font-size:inherit;font-family:inherit;color:var(--tx);background:var(--s1);border:1px solid var(--accent);border-radius:3px;padding:0 3px;outline:none';
  let committed=false;
  const commit=()=>{
    if(committed)return;
    committed=true;
    const s=inp.value.trim().toUpperCase();
    let v=parseFloat(s.replace(/[$,MK%]/g,''));
    if(isNaN(v)){committed=false;if(inp.parentNode)inp.parentNode.replaceChild(span,inp);return;}
    if(s.includes('M'))v=v*1e6;
    else if(s.includes('K'))v=v*1000;
    else if(parseAs==='dollar-m'&&v<10000)v=v*1e6;
    else if(parseAs==='pct-decimal')v=v>1?v/100:v;
    // Restore span before U() so render() doesn't tear down a live input
    if(inp.parentNode)inp.parentNode.replaceChild(span,inp);
    U(key,v);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit();}if(e.key==='Escape'){committed=true;if(inp.parentNode)inp.parentNode.replaceChild(span,inp);}};
  span.parentNode.replaceChild(inp,span);
  inp.focus();inp.select();
}
