  }).join('');
  h+=`<div class="glass-card" style="padding:16px 18px"><div style="${lbl};margin-bottom:8px">What would change the answer</div>
    <ul style="margin:0;padding-left:18px;font-size:11.5px;line-height:1.8;color:var(--t2)">${shown}</ul>
    <div style="font-size:9.5px;color:var(--t3);margin-top:6px">Each is solved on its own with everything else as set above, judged at ${horizon}.</div></div>`;

  // ── What is in it ──
  h+=`<div style="font-size:10.5px;color:var(--t3);line-height:1.6;padding:0 4px">
    <strong style="color:var(--t2)">Included:</strong> rent rising in both cases at the rate above (capped at ${fmtF(P.rentCap??D.rentCap)}/mo), mortgage, property tax, insurance and maintenance, closing costs, taxes on whatever is sold to fund the purchase, and the suburban move the model attaches to buying. Net worth counts the home after the cost to sell it.
    <strong style="color:var(--t2)">Not included:</strong> the tax the renter would owe on gains if the portfolio were sold — they stay deferred, as they would in life — mortgage-interest deductions, and the value of living in a home you own. Your saved buy plan keeps flat rent before the purchase; this comparison raises it in both, so the two runs are like for like.
  </div>`;
  h+='</div>';
  ca.innerHTML=h;

  // ── Chart ──
  if(typeof Chart==='undefined')return;
  const rows=c.rows.filter(r=>r.yr<=horizon);
  const o=chartOpts();
  o.scales.y.ticks.callback=x=>fmt(x);delete o.scales.y.ticks.stepSize;
  o.plugins.tooltip.callbacks={label:t=>'  '+t.dataset.label+': '+fmt(t.raw)};
  const ds=cash?[
    {label:'Renting',data:rows.map(r=>r.rentCum),borderColor:'#00d4aa',backgroundColor:'#00d4aa',borderWidth:2,pointRadius:0,tension:.25},
    {label:'Buying',data:rows.map(r=>r.buyCum),borderColor:'#7a73ff',backgroundColor:'#7a73ff',borderWidth:2,pointRadius:0,tension:.25},
  ]:[
    {label:'Renting',data:rows.map(r=>r.rent),borderColor:'#00d4aa',backgroundColor:'#00d4aa',borderWidth:2,pointRadius:0,tension:.25},
    {label:'Buying, after selling costs',data:rows.map(r=>r.buy),borderColor:'#7a73ff',backgroundColor:'#7a73ff',borderWidth:2,pointRadius:0,tension:.25},
    {label:'Buying, on paper',data:rows.map(r=>r.buyPaper),borderColor:'rgba(122,115,255,.5)',backgroundColor:'rgba(122,115,255,.5)',borderWidth:1.5,borderDash:[5,4],pointRadius:0,tension:.25},
  ];
  charts.main=new Chart(document.getElementById('rbChart').getContext('2d'),{type:'line',data:{labels:rows.map(r=>r.yr),datasets:ds},options:o});
}

// ── Housing: an affordability tool, not a report ───────────────────────────
// The tab answered "is my current plan sensible" across three charts, three tables and a
// five-path comparison. The question actually being asked is "how much can I afford, and how
// does that move when the rate or the down payment moves" — so it leads with one number and
// the levers that change it.
//
// Levers here are exploratory: they do not touch the plan until explicitly applied, so you
// can test a rate you have been quoted without disturbing your saved assumptions.
// One set of levers drives the whole Home screen. Rate, down payment and purchase year are the
// rent-or-buy overrides (_rbOv), so the verdict, the affordable price, the rates grid and the monthly
// cost all answer for the same assumptions, and one Apply puts them in the plan. Only the comfort
// share — how much of income housing may take — is the affordability screen's own.
let _afShare=0.28;
let _afQuarter=null,_afTenderCap=null,_afPauseMonths=0;
function afSet2(k,v){if(k==='q')_afQuarter=parseInt(v,10);else if(k==='cap')_afTenderCap=v===''||v==='none'?null:Number(v);else _afPauseMonths=Number(v);render()}
function afSet(k,v){
  if(k==='rate')rbSet('mortgageRate',v);
  else if(k==='down')rbSet('downPctg',v);
  else if(k==='year')rbSet('homePurchaseYear',v);
  else{_afShare=parseFloat(v);render()}
}
function afReset(){_afShare=0.28;rbReset()}
function afParams(){return rbParams()}

// ── Down payment readiness and the mortgage's whole life (these lived on the Goals tab) ──────────
// Both answer questions about the home, so they sit with the home. Readiness asks whether the cash
// will be there in the year before the purchase; the payoff view shows what the loan costs over its
// life and how equity builds. Neither has inputs of its own — the levers above move them.
function housingReadinessHtml(R,P){
  const dp=P.homePrice*(P.downPctg/100),sy=P.planStartYear||2026;
  const prior=R.find(r=>r.yr===P.homePurchaseYear-1);
  // Everything that can fund the purchase, not just the diversified pool: the waterfall sells held
  // Stripe for the down payment once the portfolio reaches its reserve floor.
  const start=(P.startingLiquid||0)+(P.startingStripeEquity||0);
  const proj=prior?prior.liq+prior.sEnd:start;
  const yearsLeft=P.homePurchaseYear-sy;
  const pct=v=>dp>0?Math.min(100,Math.round(v/dp*100)):100;
  const ok=proj>=dp,short=Math.max(0,dp-proj);
  const moNeed=short>0&&yearsLeft>0?Math.round(short/yearsLeft/12):0;
  const tile=(k,v,sub,col)=>`<div class="ps-tile"><span>${k}</span><strong style="${col?`color:${col}`:''}">${v}</strong><small>${sub}</small></div>`;
  return `<section class="cp-card"><div class="ps-head"><div><h3>Down payment readiness</h3>
    <p>${fmt(dp)} down on a ${P.homePrice>=1e6?'$'+(P.homePrice/1e6).toFixed(2)+'M':fmt(P.homePrice)} home in ${P.homePurchaseYear}, ${yearsLeft} year${yearsLeft===1?'':'s'} away.</p></div></div>
    <div class="ps-tiles">${tile('Assets today',fmt(start),`${pct(start)}% of the down payment`)}
      ${tile(`Projected, ${P.homePurchaseYear-1}`,fmt(proj),`${pct(proj)}% of the down payment`,ok?'var(--g)':'var(--a)')}
      ${tile(ok?'On track':'Shortfall',ok?`+${fmt(proj-dp)}`:fmt(short),ok?'buffer above the down payment':'needed on top of what is projected',ok?'var(--g)':'var(--a)')}</div>
    <div class="cl-track" style="margin-top:12px"><i style="width:${pct(proj)}%;--tier:${ok?'#7ae3c3':'#ecc183'}"></i></div>
    ${moNeed>0?`<p class="spend-caption" style="margin-top:8px">Closing that gap by saving would take about ${fmtF(moNeed)} a month more, from now.</p>`:''}
  </section>`;
}
function mortgagePayoffHtml(R,P){
  const loan=P.homePrice*(1-P.downPctg/100),rate=P.mortgageRate/100,mr=rate/12,n=360;
  const mo=loan>0&&mr>0?loan*(mr*(1+mr)**n)/((1+mr)**n-1):0;
  const ptRate=P.propTaxRate??.012,tax0=ptRate*P.homePrice/12,maint0=(P.maintBase||D.maintBase)/12,allIn=mo+tax0+maint0;
  const interest=mo*n-loan,payoff=P.homePurchaseYear+30;
  const hv30=P.homePrice*(1+P.homeAppreciation)**30,tax30=ptRate*hv30/12;
  const rows=[];
  for(let y=1;y<=30;y++){
    const a=mBal(loan,rate,y-1),b=mBal(loan,rate,y),princ=a-b,int=mo*12-princ,hv=P.homePrice*(1+P.homeAppreciation)**y;
    rows.push({yr:P.homePurchaseYear+y,princ,int,equity:hv-b,hv});
  }
  const eq=i=>rows[i],maxEq=Math.max(...rows.map(r=>r.equity),1);
  const tile=(k,v,sub,col)=>`<div class="ps-tile"><span>${k}</span><strong style="${col?`color:${col}`:''}">${v}</strong><small>${sub}</small></div>`;
  return `<details class="polish-fold refine-fold"><summary>Mortgage payoff & amortization</summary><div>
    <p class="spend-caption" style="margin:0 0 12px">${fmt(loan)} borrowed at ${P.mortgageRate}% for 30 years, paid off in ${payoff}. All-in monthly cost in ${P.homePurchaseYear} is <strong style="color:var(--tx)">${fmtF(Math.round(allIn))}</strong>.</p>
    <div class="ps-tiles">${tile('Principal & interest',fmtF(Math.round(mo))+'/mo',`${P.mortgageRate}% · 30 yr`)}
      ${tile('Property tax',fmtF(Math.round(tax0))+'/mo',`${(ptRate*100).toFixed(2)}% · ${fmtF(Math.round(tax30))}/mo by ${payoff}`)}
      ${tile('Maintenance',fmtF(Math.round(maint0))+'/mo','+2% a year')}
      ${tile('All-in',fmtF(Math.round(allIn))+'/mo',`${fmtF(Math.round(allIn*12))}/yr`,'var(--accent)')}</div>
    <div class="ps-tiles" style="margin-top:10px">${tile('Total interest',fmt(interest),`${Math.round(interest/P.homePrice*100)}% of the price`,'var(--r)')}
      ${tile('Equity, year 10',fmt(eq(9).equity),String(eq(9).yr))}${tile('Equity, year 20',fmt(eq(19).equity),String(eq(19).yr))}
      ${tile('Equity, year 30',fmt(eq(29).equity),`home worth ${fmt(eq(29).hv)}`,'var(--g)')}</div>
    <div class="cl-legend" style="margin:14px 0 6px"><span><i style="background:#7ae3c3"></i>Principal</span><span><i style="background:#ff9caf"></i>Interest</span><span>Each bar is a year of payments</span></div>
    <div class="bd-amort" role="img" aria-label="Principal and interest paid each year of the loan">${rows.map(r=>{const t=r.princ+r.int;return `<div title="${r.yr}: ${fmt(r.princ)} principal, ${fmt(r.int)} interest"><span style="height:${(r.princ/t*100).toFixed(1)}%;background:#7ae3c3"></span><span style="height:${(r.int/t*100).toFixed(1)}%;background:#ff9caf"></span></div>`}).join('')}</div>
    <div class="spend-caption" style="display:flex;justify-content:space-between;margin-top:4px"><span>${P.homePurchaseYear+1}</span><span>${payoff}</span></div>
  </div></details>`;
}

// ── Home: one screen for the whole decision ──────────────────────────────────
// Rent or buy comes first, because it is the question; if buying, how much and when follows, then what
// it costs, whether the cash is there, and what it looks like over thirty years. Every part answers for
// the same levers (see _afShare / rbParams), so nothing on the page disagrees with anything else on it.
function renderHomeTab(R,P){
  const ca=document.getElementById('chartArea');
  destroyCharts();
  const renting=P.housingMode==='rent';
  ca.innerHTML=`<div id="homeRB"></div>
    <div class="home-sec"><div class="hero-eyebrow">${renting?'If you keep renting':'If you buy'}</div><h2>${renting?'Your rent, year by year':'How much house, and when'}</h2></div>
    <div id="homeHS"></div>`;
  renderRentBuyTab(R,P,'homeRB');
  renderHousingTab(R,P,'homeHS');
  document.getElementById('summaries').innerHTML='';
}

function renderHousingTab(R,P,host){
  const ca=document.getElementById(host||'chartArea');
  if(!host)destroyCharts();
  if(P.housingMode==='rent'){
    ca.innerHTML=`<div class="ui-head"><div><h2>Rent your home</h2><p>Rent is modeled for the full plan, with annual increases.</p></div></div>${host?'':housingModeControl()}
      <label>Monthly rent in ${P.planStartYear} <input type="number" min="0" step="100" value="${P.nycRent}" onchange="U('nycRent',this.value)"></label>
      <label>Annual rent inflation (%) <input type="number" min="0" max="100" step="0.5" value="${((P.rentInflation??.03)*100).toFixed(1)}" onchange="U('rentInflation',Math.max(0,Number(this.value))/100)"></label>
      <label>Monthly rent cap <input type="number" min="0" step="500" value="${P.rentCap??0}" onchange="U('rentCap',Math.max(0,Number(this.value)))"></label>
      <p>Rent assumes you remain in your current location. The purchase, closing costs, mortgage, property tax, home maintenance, home equity and suburban expense increases are excluded. Money retained stays in the investment projection.</p>
      <table><thead><tr><th>Year</th><th>Annual rent</th><th>Monthly rent</th></tr></thead><tbody>${R.map(r=>`<tr><td>${r.yr}</td><td>${fmtF(r.hFull??r.h)}</td><td>${fmtF(Math.round((r.hFull??r.h)/12))}</td></tr>`).join('')}</tbody></table>`;
    return;
  }
  const q=afParams();
  const a=affordability(q,_afShare);
  const py=q.homePurchaseYear;
  const perDollar=housingCostPerDollar(q);
  const buyRow=R.find(r=>r.yr===py)||R[R.length-1];

  const money=v=>v>=1e6?'$'+(v/1e6).toFixed(2)+'M':fmt(v);
  const over=q.homePrice-a.max;

  // What the CURRENT price actually costs each month
  const cost=price=>{
    const loan=price*(1-q.downPctg/100);
    const mr=q.mortgageRate/100/12;
    const pi=loan>0&&mr>0?loan*(mr*(1+mr)**360)/((1+mr)**360-1):0;
    const tax=(q.propTaxRate??.012)*price/12;
    const maint=(q.maintBase||0)*(price/q.homePrice)/12;
    return{pi,tax,maint,all:pi+tax+maint};
  };
  const cur=cost(q.homePrice),atMax=cost(a.max);

  let h=`<div style="display:flex;flex-direction:column;gap:14px;padding:2px">`;

  // ── The answer ──
  h+=`<div class="glass-card" style="padding:22px 24px;background:linear-gradient(135deg,rgba(99,91,255,.07),rgba(103,114,229,.03))">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)">How much house can you afford?</div>
    <div style="font-size:40px;font-weight:800;letter-spacing:-1.5px;color:var(--tx);font-family:'SF Mono',ui-monospace,monospace;margin:4px 0 2px">${money(a.max)}</div>
    <div style="font-size:12px;color:var(--t2);line-height:1.6">
      at <strong>${q.mortgageRate}%</strong> with <strong>${q.downPctg}%</strong> down — about <strong>${fmtF(Math.round(atMax.all))}/mo</strong> all-in.<br>
      ${a.binding==='comfort'
        ? `Limited by <strong>carrying cost</strong>: above this, housing eats more than ${(_afShare*100).toFixed(0)}% of your after-tax income in ${py}. Your balance sheet could actually fund up to ${money(a.plan)}.`
        : `Limited by your <strong>balance sheet</strong>: above this, funding the purchase would break your ${fmt(q.liquidReserveFloor??D.liquidReserveFloor)} reserve floor. Cash flow alone could carry up to ${money(a.comfort)}.`}
    </div>
  </div>`;

  // ── The two limits vs. where you are ──
  const limitCard=(lbl,val,sub,binds,warn)=>`<div class="glass-card" style="padding:14px 16px;border-color:${binds?'rgba(99,91,255,.4)':warn?'rgba(205,61,100,.35)':'var(--bd)'}">
    <div style="font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:4px">${lbl}${binds?' <span style="color:var(--accent)">· binds</span>':''}</div>
    <div style="font-size:21px;font-weight:800;font-family:'SF Mono',monospace;color:${warn?'var(--r)':binds?'var(--accent)':'var(--tx)'};letter-spacing:-.5px">${money(val)}</div>
    <div style="font-size:9.5px;color:var(--t2);margin-top:3px;line-height:1.45">${sub}</div>
  </div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
    ${limitCard('Carrying-cost limit',a.comfort,`All-in housing stays under ${(_afShare*100).toFixed(0)}% of ${py} after-tax income (${fmt(buyRow.netTC)})`,a.binding==='comfort',false)}
    ${limitCard('Balance-sheet limit',a.plan,`The most you can fund with the ${fmt(q.liquidReserveFloor??D.liquidReserveFloor)} reserve floor still intact, selling Stripe as needed`,a.binding==='plan',false)}
    ${limitCard('Your current plan',q.homePrice,over>0?`${money(over)} above what you can afford — ${fmtF(Math.round(cur.all))}/mo, ${(cur.all*12/buyRow.netTC*100).toFixed(0)}% of income`:`Within budget — ${fmtF(Math.round(cur.all))}/mo, ${(cur.all*12/buyRow.netTC*100).toFixed(0)}% of income`,false,over>0)}
  </div>`;

  // ── Levers ──
  // A percentage is not a budget until it is a number of dollars. The share lever now
  // answers "28% of what?" in the place where it is being moved, rather than leaving the
  // reader to find the figure in the card above and do the arithmetic.
  const shareBudget=_afShare*buyRow.netTC;
  const lever=(id,label,val,min,max,step,fmtv,key,sub)=>`<div>
    <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:3px"><span style="font-size:10px;color:var(--t2)">${label}</span><span style="font-size:11px;font-weight:700;font-family:'SF Mono',monospace;color:var(--tx)">${fmtv}</span></div>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" oninput="afSet('${key}',this.value)" style="width:100%">
    ${sub?`<div style="font-size:9.5px;color:var(--t3);margin-top:3px;line-height:1.45">${sub}</div>`:''}
  </div>`;
  const lastYr=R[R.length-1].yr;
  h+=`<div class="glass-card" style="padding:16px 18px">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:12px">How much of income housing may take — the number above updates (rate, down payment and year are set under Rent or buy)</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px">
      ${lever('afShare','Max share of income',_afShare,.15,.45,.01,(_afShare*100).toFixed(0)+'%','share',
        `<strong style="color:var(--t2)">${fmtF(Math.round(shareBudget/12))}/mo</strong> · ${fmt(Math.round(shareBudget))}/yr — ${(_afShare*100).toFixed(0)}% of ${fmt(buyRow.netTC)} after-tax income in ${py}`)}
    </div>
  </div>`;

  // ── What waiting buys you ──────────────────────────────────────────────
  // "How much house can I afford" and "what if I buy later" are the same question asked
  // twice, so they belong on the same screen. Each year is the full model re-run, not the
  // headline figure grown at a rate.
  const YEARS=[];
  for(let y=R[0].yr;y<=Math.min(lastYr,R[0].yr+12);y++)YEARS.push(y);
  const byYear=YEARS.map(y=>{
    const py2={...q,homePurchaseYear:y};
    const row=R.find(r=>r.yr===y)||buyRow;
    const af=affordability(py2,_afShare);
    return{y,...af,netTC:row.netTC};
  });
  const yMax=Math.max(...byYear.map(v=>v.max));
  const nowMax=byYear.find(v=>v.y===py);
  h+=`<div class="glass-card" style="padding:16px 18px">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">What you can afford, by purchase year</div>
    <div style="font-size:10px;color:var(--t2);margin-bottom:11px">Each row re-runs the whole plan buying in that year, at ${q.mortgageRate}% with ${q.downPctg}% down. Click a year to explore it.</div>
    <div class="tw" style="max-height:none"><table style="font-size:11px">
      <thead><tr><th style="text-align:left">Buy in</th><th>Max price</th><th>vs. ${py}</th><th>What binds</th></tr></thead>
      <tbody>${byYear.map(v=>{
        const here=v.y===py;
        const delta=nowMax?v.max-nowMax.max:0;
        return `<tr onclick="afSet('year',${v.y})" style="cursor:pointer${here?';outline:1.5px solid var(--accent);outline-offset:-2px':''}">
          <td style="font-weight:${here?800:600};color:${here?'var(--accent)':'var(--tx)'}">${v.y}${here?' ←':''}</td>
          <td style="background:rgba(99,91,255,${(0.05+(yMax>0?v.max/yMax:0)*0.2).toFixed(3)});font-family:'SF Mono',monospace;font-weight:${here?800:500};color:${here?'var(--accent)':'var(--tx)'}">${money(v.max)}</td>
          <td style="font-family:'SF Mono',monospace;color:${delta>0?'var(--g)':delta<0?'var(--r)':'var(--t3)'}">${here?'—':(delta>0?'+':'')+money(Math.abs(delta)).replace('$',delta<0?'−$':'$')}</td>
          <td style="font-size:10px;color:var(--t2)">${v.binding==='comfort'?'Carrying cost':'Balance sheet'}</td>
        </tr>`;}).join('')}</tbody>
    </table></div>
    <div style="font-size:9.5px;color:var(--t3);margin-top:9px;line-height:1.5">
      Waiting raises the balance-sheet limit as savings and vests accumulate, and moves the carrying-cost limit with your income. Where the two cross, the binding constraint changes — and buying later stops helping.
    </div>
  </div>`;

  // ── The matrix: the artefact that actually answers "what if rates move" ──
  const RATES=[q.mortgageRate-1,q.mortgageRate-0.5,q.mortgageRate,q.mortgageRate+0.5,q.mortgageRate+1,q.mortgageRate+2]
    .filter(r=>r>=1).map(r=>Math.round(r*1000)/1000);
  const DOWNS=[20,30,40,50,60].filter(d=>d<=80);
  const cellMax=(r,d)=>{
    const pp={...q,mortgageRate:r,downPctg:d};
    return Math.min(planAffordablePrice(pp),comfortAffordablePrice(pp,_afShare));
  };
  const grid=RATES.map(r=>({r,cells:DOWNS.map(d=>cellMax(r,d))}));
  const allVals=grid.flatMap(g=>g.cells);
  const gMin=Math.min(...allVals),gMax=Math.max(...allVals);
  const shade=v=>{const t=gMax>gMin?(v-gMin)/(gMax-gMin):0.5;return `rgba(99,91,255,${(0.05+t*0.22).toFixed(3)})`};
  h+=`<details class="polish-fold refine-fold"><summary>Compare mortgage rates & down payments</summary><div>
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">What you can afford, by rate and down payment</div>
    <div style="font-size:10px;color:var(--t2);margin-bottom:11px">Each cell is the lower of the two limits, run through the full model.</div>
    <div class="tw" style="max-height:none"><table style="font-size:11px">
      <thead><tr><th style="text-align:left">Rate</th>${DOWNS.map(d=>`<th>${d}% down</th>`).join('')}</tr></thead>
      <tbody>${grid.map(g=>`<tr>
        <td style="font-weight:700;color:${g.r===q.mortgageRate?'var(--accent)':'var(--tx)'}">${g.r}%${g.r===q.mortgageRate?' ←':''}</td>
        ${g.cells.map((v,i)=>{const here=g.r===q.mortgageRate&&DOWNS[i]===q.downPctg;
          return `<td style="background:${shade(v)};font-family:'SF Mono',monospace;font-weight:${here?800:500};color:${here?'var(--accent)':'var(--tx)'};${here?'outline:1.5px solid var(--accent);outline-offset:-2px':''}">${money(v)}</td>`;}).join('')}
      </tr>`).join('')}</tbody>
    </table></div>
    <div style="font-size:9.5px;color:var(--t3);margin-top:9px;line-height:1.5">
      ${(()=>{const base=cellMax(q.mortgageRate,q.downPctg),up=cellMax(Math.round((q.mortgageRate+1)*1000)/1000,q.downPctg);
        return `A 1-point rise in rates costs you about <strong style="color:var(--tx)">${money(Math.max(0,base-up))}</strong> of purchasing power at ${q.downPctg}% down.`})()}
    </div>
  </div></details>`;

  // ── What the current price costs, month by month ──
  const line=(lbl,v,col)=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid var(--bd)"><span style="color:var(--t2)">${lbl}</span><span style="font-family:'SF Mono',monospace;font-weight:600;color:${col||'var(--tx)'}">${fmtF(Math.round(v))}/mo</span></div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px">
    <div class="glass-card" style="padding:16px 18px">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:9px">Monthly cost at ${money(q.homePrice)}</div>
      ${line('Principal &amp; interest',cur.pi)}
      ${line('Property tax',cur.tax)}
      ${line('Maintenance',cur.maint)}
      <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0 0"><strong style="color:var(--tx)">All-in</strong><strong style="font-family:'SF Mono',monospace;color:${over>0?'var(--r)':'var(--g)'}">${fmtF(Math.round(cur.all))}/mo</strong></div>
      <div style="font-size:9.5px;color:var(--t3);margin-top:5px">${(cur.all*12/buyRow.netTC*100).toFixed(0)}% of ${py} after-tax income · down payment ${fmt(q.homePrice*q.downPctg/100)}</div>
    </div>
    <div class="glass-card" style="padding:16px 18px">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:9px">Monthly cost at ${money(a.max)}</div>
      ${line('Principal &amp; interest',atMax.pi)}
      ${line('Property tax',atMax.tax)}
      ${line('Maintenance',atMax.maint)}
      <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0 0"><strong style="color:var(--tx)">All-in</strong><strong style="font-family:'SF Mono',monospace;color:var(--g)">${fmtF(Math.round(atMax.all))}/mo</strong></div>
      <div style="font-size:9.5px;color:var(--t3);margin-top:5px">${(atMax.all*12/buyRow.netTC*100).toFixed(0)}% of ${py} after-tax income · down payment ${fmt(a.max*q.downPctg/100)}</div>
    </div>
  </div>`;

  // ── Getting in: what closing actually costs, and whether the cash can be there ──
  // The affordability maths above is about the ONGOING cost. This is the separate question
  // of the day itself: a purchase can be affordable for thirty years and still fail to close
  // because the money is in stock that cannot be sold that month.
  {
    const L=window.PlannerLiquidity;
    const cash=cashToClose(q.homePrice,q);
    const cc=cash.breakdown;
    const prev=R.find(r=>r.yr===py-1),buyRow=R.find(r=>r.yr===py);
    const quarter=_afQuarter||L.purchaseQuarter(q);
    const floor=q.liquidReserveFloor??D.liquidReserveFloor;
    const held=prev?prev.sEnd:(q.startingStripeEquity||0);
    const vestQ=(buyRow?buyRow.sNew:0)/4;
    const pauseCost=_afPauseMonths>0&&buyRow?buyRow.totE/12*_afPauseMonths:0;
    const otherCash=Math.max(0,(prev?prev.liq:q.startingLiquid||0)-floor-pauseCost);
    const capP={...q,...(_afTenderCap!=null?{stripeTenderCapPerEvent:_afTenderCap}:{})};
    const check=L.fundingCheck({year:py,quarter,need:cash.total,heldValue:held,vestPerQuarter:vestQ,otherCash},capP);

    const row=(l,v,note)=>`<div style="display:flex;justify-content:space-between;font-size:10.5px;padding:4px 0;border-bottom:1px solid var(--bd)">
      <span style="color:var(--t2)">${l}${note?` <span style="font-size:8.5px;color:var(--t3)">· ${note}</span>`:''}</span>
      <span style="font-family:'SF Mono',monospace;color:var(--tx)">${fmtF(Math.round(v))}</span></div>`;
    h+=`<div class="glass-card" style="padding:16px 18px">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">Cash to close</div>
      <div style="font-size:10px;color:var(--t2);margin-bottom:9px">One-time, due on the day. Separate from whether you can carry the house afterwards.</div>
      ${row('Down payment',cash.down,`${q.downPctg}%`)}
      ${row('Mansion tax',cc.mansion,'NYC band')}
      ${row('Mortgage recording tax',cc.recording,'on the loan')}
      ${row('Title insurance',cc.title)}
      ${row('Legal & other',cc.legal+cc.other)}
      ${row('Moving',cash.moving)}
      <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0 0"><strong style="color:var(--tx)">Total</strong>
        <strong style="font-family:'SF Mono',monospace;color:var(--tx)">${fmtF(Math.round(cash.total))}</strong></div>
      <div style="font-size:9.5px;color:var(--t3);margin-top:4px">${fmtF(Math.round(cash.total-cash.down))} beyond the deposit — ${(cc.pctOfPrice*100).toFixed(2)}% of price in closing costs.</div>
    </div>`;

    // ── Can the money be there, in that quarter? ──
    h+=`<div class="glass-card" style="padding:16px 18px;border-color:${check.fundable?'var(--bd)':'rgba(205,61,100,.4)'}">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">Can the cash be there?</div>
      <div style="font-size:10px;color:var(--t2);margin-bottom:10px">Stripe sells in <strong>Q1 and Q4 tenders</strong>, plus a standing <strong>$20K/quarter</strong> cash election (about $80K a year). An annual total can look ample while the money is unreachable in the month you close.</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:11px">
        <label style="font-size:10px;color:var(--t2)">Closing quarter
          <select onchange="afSet2('q',this.value)" style="margin-left:5px;font-size:10px;padding:3px 6px;border:1px solid var(--bd);border-radius:5px;background:var(--s1);color:var(--tx);font-family:inherit">
            ${[1,2,3,4].map(x=>`<option value="${x}"${quarter===x?' selected':''}>Q${x}</option>`).join('')}</select></label>
        <label style="font-size:10px;color:var(--t2)">Tender cap
          <select onchange="afSet2('cap',this.value)" style="margin-left:5px;font-size:10px;padding:3px 6px;border:1px solid var(--bd);border-radius:5px;background:var(--s1);color:var(--tx);font-family:inherit">
            ${[['none','Uncapped (confirmed)'],[100000,'Stress $100K'],[250000,'Stress $250K'],[500000,'Stress $500K'],[1000000,'Stress $1M']].map(([v,l])=>`<option value="${v}"${String(_afTenderCap??'none')===String(v)?' selected':''}>${l}</option>`).join('')}</select></label>
        <label style="font-size:10px;color:var(--t2)">Income pause
          <select onchange="afSet2('pause',this.value)" style="margin-left:5px;font-size:10px;padding:3px 6px;border:1px solid var(--bd);border-radius:5px;background:var(--s1);color:var(--tx);font-family:inherit">
            ${[0,3,6,12].map(m=>`<option value="${m}"${_afPauseMonths===m?' selected':''}>${m?m+' months':'none'}</option>`).join('')}</select></label>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px">
        ${[['Needed',cash.total,'var(--tx)'],['Reachable from Stripe',check.fromStripe,'#6772e5'],
           ['Portfolio above floor',otherCash,'var(--b)'],
           [check.fundable?'Surplus':'Short by',Math.abs(check.available-cash.total),check.fundable?'var(--g)':'var(--r)']]
          .map(([l,v,c])=>`<div style="background:var(--s2);border-radius:7px;padding:9px 11px">
            <div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3)">${l}</div>
            <div style="font-size:15px;font-weight:800;font-family:'SF Mono',monospace;color:${c}">${fmtF(Math.round(v))}</div></div>`).join('')}
      </div>
      ${check.fundable
        ? `<div style="font-size:10px;color:var(--g);margin-top:9px">✓ A Q${quarter} close is fundable${_afPauseMonths?` even with ${_afPauseMonths} months of no income`:''}, leaving the ${fmtF(floor)} reserve intact.</div>`
        : `<div style="font-size:10px;color:var(--r);margin-top:9px">✗ A Q${quarter} close falls ${fmtF(Math.round(check.shortfall))} short. ${advEscape(check.remedy||'')}</div>`}
      <div style="font-size:9px;color:var(--t3);margin-top:7px;line-height:1.5">Windows reachable by Q${quarter}: ${check.windowsUsed.map(w=>`Q${w.quarter} ${w.kind}`).join(' · ')||'none'}. Money raised in an earlier quarter is still available later.</div>
    </div>`;

    // ── Downside and the assumption that flips it ──
    const scenarios=[
      ['As planned',{},0],
      ['Stress: tender capped at $250K',{stripeTenderCapPerEvent:250000},0],
      ['6 months without income',{},6],
      ['Stress: both together',{stripeTenderCapPerEvent:250000},6],
    ].map(([label,cp,pause])=>{
      const pc=pause>0&&buyRow?buyRow.totE/12*pause:0;
      const oc=Math.max(0,(prev?prev.liq:0)-floor-pc);
      const r=L.fundingCheck({year:py,quarter,need:cash.total,heldValue:held,vestPerQuarter:vestQ,otherCash:oc},cp);
      return{label,r};
    });
    h+=`<div class="glass-card" style="padding:16px 18px">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">Downside, and what would change the answer</div>
      <div style="font-size:10px;color:var(--t2);margin-bottom:9px">Each row is the same purchase under a different assumption. Ranges, not probabilities — none of these is claimed to be likely.</div>
      ${scenarios.map(sc=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:9px;font-size:10.5px;padding:6px 0;border-top:1px solid var(--bd)">
        <span style="color:var(--t2);flex:1">${sc.label}</span>
        <span style="font-family:'SF Mono',monospace;color:var(--t3)">${fmtF(Math.round(sc.r.available))} available</span>
        <span style="font-weight:700;color:${sc.r.fundable?'var(--g)':'var(--r)'};min-width:96px;text-align:right">${sc.r.fundable?'fundable':'short '+fmtF(Math.round(sc.r.shortfall))}</span>
      </div>`).join('')}
      <div style="font-size:9.5px;color:var(--t3);margin-top:9px;line-height:1.55">
        <strong style="color:var(--tx)">Confirmed:</strong> tenders are uncapped, so participation is limited only by vested stock — which is why this purchase funds comfortably. The capped rows above are a stress test, not a live risk. The assumption still worth watching is <strong style="color:var(--tx)">timing</strong>: a close between the Q1 and Q4 windows leans on cash raised earlier, so the closing quarter matters more than the annual total suggests.
      </div>
    </div>`;
  }

  h+=housingReadinessHtml(R,P);
  h+=mortgagePayoffHtml(R,P);

  // ── Refi calculator: a different question, kept but folded away ──
  h+=`<details class="glass-card" style="padding:14px 18px">
    <summary style="cursor:pointer;font-size:11px;font-weight:700;color:var(--tx)">🔄 Refinance break-even calculator</summary>
    <div style="margin-top:12px">
  <div class="glass-card" style="padding:16px 18px">
    <div style="font-size:11px;color:var(--t2);line-height:1.5;margin-bottom:12px">At your current ${P.mortgageRate}% rate on a ${fmt(P.homePrice*(1-P.downPctg/100))} loan, how many months until a lower rate pays for its own closing costs?</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px">
      <div class="sr" style="flex:1;min-width:160px">
        <div class="sh"><span class="sl">New rate</span><span class="sv" id="refiRateVal">${Math.max(2.5,P.mortgageRate-1).toFixed(2)}%</span></div>
        <input type="range" id="refiRateInput" min="2.5" max="${P.mortgageRate}" step="0.05" value="${Math.max(2.5,P.mortgageRate-1)}" oninput="document.getElementById('refiRateVal').textContent=parseFloat(this.value).toFixed(2)+'%';updateRefiCalc()">
      </div>
      <div class="sr" style="flex:1;min-width:160px">
        <div class="sh"><span class="sl">Closing costs</span><span class="sv" id="refiCostVal">${fmtF(6000)}</span></div>
        <input type="range" id="refiCostInput" min="1000" max="20000" step="500" value="6000" oninput="document.getElementById('refiCostVal').textContent=fmtF(parseFloat(this.value));updateRefiCalc()">
      </div>
    </div>
    <div id="refiResult" style="margin-top:10px"></div>
  </div>
    </div>
  </details>`;

  h+=`<div style="font-size:9.5px;color:var(--t3);line-height:1.6;padding:0 2px">
    Both limits run your full projection, so they already include tuition, childcare, Nancy's practice and the Stripe waterfall. Neither includes closing costs, and the balance-sheet limit spends Stripe equity down to your reserve floor — affordable is not the same as advisable.
  </div>`;

  h+=`</div>`;
  ca.innerHTML=(host?'':housingModeControl())+h;
  updateRefiCalc();
  document.getElementById('summaries').innerHTML='';
}
// Refi break-even calc — reads the two sliders, uses mPmt() from model.js for P&I.
function updateRefiCalc(){
  const rateInp=document.getElementById('refiRateInput');
  const costInp=document.getElementById('refiCostInput');
  const out=document.getElementById('refiResult');
  if(!rateInp||!costInp||!out)return;
  const newRate=parseFloat(rateInp.value);
  const closingCost=parseFloat(costInp.value)||0;
  const loan=P.homePrice*(1-P.downPctg/100);
  const curPI=mPmt(loan,P.mortgageRate/100)/12;
  const newPI=mPmt(loan,newRate/100)/12;
  const monthlySavings=curPI-newPI;
  if(monthlySavings<=0){
    out.innerHTML=`<div style="font-size:11px;color:var(--r);padding:8px 0">New rate (${newRate.toFixed(2)}%) isn't lower than your current ${P.mortgageRate}% — no savings to break even on.</div>`;
    return;
  }
  const breakEvenMo=closingCost/monthlySavings;
  out.innerHTML=`<div class="pf-quad">
    <div class="kpi"><div class="kpi-l">Monthly Savings</div><div class="kpi-v" style="color:var(--g);font-size:14px">${fmt(monthlySavings)}</div><div class="kpi-s">${fmtF(curPI)} → ${fmtF(newPI)}</div></div>
    <div class="kpi"><div class="kpi-l">Break-even</div><div class="kpi-v" style="color:${breakEvenMo<=24?'var(--g)':breakEvenMo<=48?'var(--a)':'var(--r)'};font-size:14px">${breakEvenMo.toFixed(0)} mo</div><div class="kpi-s">${(breakEvenMo/12).toFixed(1)} years</div></div>
    <div class="kpi"><div class="kpi-l">Closing Costs</div><div class="kpi-v" style="font-size:14px">${fmt(closingCost)}</div><div class="kpi-s">one-time</div></div>
    <div class="kpi"><div class="kpi-l">Rate Drop</div><div class="kpi-v" style="color:var(--b);font-size:14px">${(P.mortgageRate-newRate).toFixed(2)}pt</div><div class="kpi-s">${P.mortgageRate}% → ${newRate.toFixed(2)}%</div></div>
  </div>
  <div style="font-size:9.5px;color:var(--t3);margin-top:8px;line-height:1.5">If you stay in the home past the break-even point, refinancing is a net win. Assumes ${fmt(loan)} loan balance — recalculate near the actual refi date since your balance will have amortized down.</div>`;
}

// ── What-if: try a change, then see which assumptions matter most ────────────────────────────────
// Two depths of one activity. The first lets you combine changes and see what each does; the second
// ranks the assumptions by how much the plan moves when each is nudged, so you know which to try.
function renderWhatIfTab(R,P){
  const ca=document.getElementById('chartArea');
  destroyCharts();
  ca.innerHTML=`<div id="wiDR"></div><div class="home-sec"><div class="hero-eyebrow">Then</div><h2>Which assumptions matter most</h2></div><div id="wiKL"></div>`;
  window._lastR=R;window._lastP=P;
  renderDecisionRoom(R,'wiDR');
  renderSensitivityTab(R,P,'wiKL');
  document.getElementById('summaries').innerHTML='';
}

let _slHost=null;
function renderSensitivityTab(R,P,host){
  if(host)_slHost=host;
  const ca=document.getElementById(_slHost||'chartArea');
  if(!_slHost)destroyCharts();
  // Impact is measured on the TOTAL. On the ex-retirement basis a lever that moves
  // retirement — a contribution rate, say — showed almost no impact at all.
  const baseNW=R[R.length-1].netWorth;
  const ey=P.planEndYear||2058;

  const ALL_PARAMS=[
    {key:'investReturn',label:'Portfolio Return',delta:0.01,hi:'+1%',lo:'−1%',fmtV:v=>(v*100).toFixed(1)+'%',better:1},
    {key:'normCash',label:'Norm Cash Comp',delta:25000,hi:'+$25K/yr',lo:'−$25K/yr',fmtV:v=>fmt(v),better:1},
    {key:'normStock',label:StripeGrants.active(P)?(Number.isFinite(StripeGrants.throughYear(P))?'Manual stock income':'PEG target dollars'):'Norm stock compensation',delta:25000,hi:'+$25K/yr',lo:'−$25K/yr',fmtV:v=>fmt(v),better:1},
    {key:'stripeRet',label:'Stripe Return',delta:.03,hi:'+3%/yr',lo:'−3%/yr',fmtV:v=>(v*100).toFixed(0)+'%',better:1},
    {key:'nancyHourlyRate',label:'Nancy Rate',delta:25,hi:'+$25/hr',lo:'−$25/hr',fmtV:v=>'$'+v+'/hr',better:1},
    {key:'nancyMaxClients',label:'Nancy Clients',delta:5,hi:'+5',lo:'−5',fmtV:v=>v+' clients',better:1},
    {key:'pretax401k',label:'401k Contribution',delta:5000,hi:'+$5K/yr',lo:'−$5K/yr',fmtV:v=>fmt(v),better:1},
    {key:'expenseInflation',label:'Expense Inflation',delta:0.005,hi:'+0.5%',lo:'−0.5%',fmtV:v=>(v*100).toFixed(1)+'%',better:-1},
    {key:'taxInflation',label:'Bracket Inflation',delta:0.005,hi:'+0.5%',lo:'−0.5%',fmtV:v=>(v*100).toFixed(1)+'%',better:1},
    {key:'homePrice',label:'Home Price',delta:200000,hi:'+$200K',lo:'−$200K',fmtV:v=>'$'+(v/1e6).toFixed(2)+'M',better:-1},
    {key:'downPctg',label:'Down Payment %',delta:10,hi:'+10%',lo:'−10%',fmtV:v=>v+'%',better:-1},
    {key:'startingLiquid',label:'Starting Liquid',delta:100000,hi:'+$100K',lo:'−$100K',fmtV:v=>fmt(v),better:1},
    {key:'nancyRampYears',label:'Nancy Ramp',delta:2,hi:'+2 yrs',lo:'−2 yrs',fmtV:v=>v+' yrs',better:-1},
    {key:'homeAppreciation',label:'Home Appreciation',delta:0.01,hi:'+1%',lo:'−1%',fmtV:v=>(v*100).toFixed(1)+'%',better:1},
  ];

  const PRESETS={
    all:{label:'All factors',keys:ALL_PARAMS.map(p=>p.key)},
    income:{label:'Income levers',keys:['investReturn','normCash','normStock','stripeRet','nancyHourlyRate','nancyMaxClients','pretax401k']},
    housing:{label:'Housing',keys:['homePrice','downPctg','startingLiquid','homeAppreciation']},
    costs:{label:'Cost control',keys:['expenseInflation','taxInflation','nancyRampYears','pretax401k']},
  };

  const preset=PRESETS[_sensiPreset]||PRESETS.all;
  const PARAMS=ALL_PARAMS.filter(p=>preset.keys.includes(p.key));

  const results=PARAMS.map(p=>{
    const delta=_sensiDeltas[p.key]??p.delta;
    let vBase,hiP,loP;
    // Synthetic multi-field levers: a single P.key perturbation can't express "this runs
    // $25K higher across the board" when the value is spread over an 11-year window.
    if(p.key==='normStock'&&StripeGrants.active(P)&&!Number.isFinite(StripeGrants.throughYear(P))){
      vBase=StripeGrants.award(P,P.planStartYear||2026).peg;hiP=structuredClone(P);loP=structuredClone(P);
      for(let y=P.planStartYear||2026;y<=(P.planEndYear||2058);y++){const a=StripeGrants.award(P,y);hiP.stripeGrants.years[y]={...a,...P.stripeGrants.years[y],peg:a.peg+delta};loP.stripeGrants.years[y]={...a,...P.stripeGrants.years[y],peg:Math.max(0,a.peg-delta)};}
    } else if((p.key==='normCash'||p.key==='normStock')&&StripeGrants.active(P)&&Number.isFinite(StripeGrants.throughYear(P))){
      const key=p.key==='normCash'?'cash':'stock';vBase=normComp(P,0)[key];hiP=structuredClone(P);loP=structuredClone(P);
      for(let y=P.planStartYear||2026;y<=(P.planEndYear||2058);y++){
        if(!StripeGrants.usesGrants(P,y)){const n=StripeGrants.manualComp(P,y);hiP.stripeGrants.manualComp[y]={...n,[key]:n[key]+delta};loP.stripeGrants.manualComp[y]={...n,[key]:Math.max(0,n[key]-delta)};}
        else if(key==='cash'){const k='normCashY'+(y-(P.planStartYear||2026));hiP[k]=(P[k]??D[k])+delta;loP[k]=Math.max(0,(P[k]??D[k])-delta);}
      }
    } else if(p.key==='normCash'||p.key==='normStock'){
      const f=p.key==='normCash'?'normCashY':'normStockY';
      vBase=P[f+'0'];
      hiP=structuredClone(P);loP=structuredClone(P);
      for(const [y,n] of Object.entries(P.stripeManualLater||{})){const k=p.key==='normCash'?'cash':'stock';hiP.stripeManualLater[y][k]=n[k]+delta;loP.stripeManualLater[y][k]=Math.max(0,n[k]-delta);}
      for(let i=0;i<11;i++){hiP[f+i]=(P[f+i]||0)+delta;loP[f+i]=Math.max(0,(P[f+i]||0)-delta)}
    } else if(p.key==='stripeRet'){
      vBase=P.stripeLongTermReturn??.08;
      hiP={...P,stripeLongTermReturn:vBase+delta};loP={...P,stripeLongTermReturn:vBase-delta};
      for(let i=0;i<10;i++){const v=P['stripeRetY'+i]??vBase;hiP['stripeRetY'+i]=v+delta;loP['stripeRetY'+i]=v-delta}
    } else {
      vBase=P[p.key];
      const hiV=vBase+delta;
      const loV=Math.max(0,vBase-delta);
      hiP={...P,[p.key]:hiV};
      loP={...P,[p.key]:loV};
    }
    const hiR=run(hiP).R;const loR=run(loP).R;
    const hiNW=hiR[hiR.length-1].netWorth;
    const loNW=loR[loR.length-1].netWorth;
    const hiDelta=hiNW-baseNW;
    const loDelta=loNW-baseNW;
    const impact=Math.max(Math.abs(hiDelta),Math.abs(loDelta));
    return{...p,delta,vBase,hiDelta,loDelta,impact};
  });

  results.sort((a,b)=>Math.abs(b.hiDelta-b.loDelta)-Math.abs(a.hiDelta-a.loDelta));

  const presetBtns=Object.entries(PRESETS).map(([k,v])=>

    const upsideVal=r.better===1?r.hiDelta:r.loDelta;

    const uSign=upsideVal>=0?'+':'';const dSign=downsideVal>=0?'+':'';

        <div style="font-size:8px;color:var(--t3);font-variant-numeric:tabular-nums">${r.fmtV(r.vBase)} base</div>

    </div>`;
  });

  h+=`</div></div></details>
  <div style="margin-top:10px;font-size:9px;color:var(--t3);display:flex;gap:14px;flex-wrap:wrap;padding:0 2px">

          ticks:{font:{size:13,family:"'Inter',sans-serif",weight:'500'},color:'#eef3fc'}

function sensiUpdateDelta(input){
  const key=input.dataset.key;
  const raw=input.value.trim().replace(/[$%K,]/gi,'');
  let val=parseFloat(raw);
  if(isNaN(val)||val<=0){input.value=input.dataset.rawdelta;return;}
  // Handle % suffix
  if(input.value.includes('%'))val=val/100;
  // Handle K suffix
  else if(input.value.toUpperCase().includes('K'))val=val*1000;
  _sensiDeltas[key]=val;
  input.dataset.rawdelta=val;
  renderSensitivityTab(window._lastR,window._lastP);
}

function setMCMode(mode){

function runGoalsRiskAnalysis(){
  const out=document.getElementById('goalsRiskOut');
  if(!out)return;
  out.innerHTML='<div style="font-size:11px;color:var(--t3);padding:12px 0">Running 800 market scenarios…</div>';
  // Defer the heavy compute so the loading state paints first.
  setTimeout(()=>{
    let mc;
    try{mc=runMonteCarlo(P,800,_mcMode);}catch(e){out.innerHTML=`<div style="font-size:11px;color:var(--r);padding:8px 0">Simulation failed: ${advEscape(e.message)}</div>`;return;}
    const horizon=P.planEndYear||2058;
    const geomPct=(mc.geomMean*100).toFixed(1);
    const ruin=mc.ruinPct,dpFail=mc.dpFailPct;
    const ruinCol=ruin<5?'var(--g)':ruin<15?'var(--a)':'var(--r)';
    const dpCol=dpFail==null?'var(--t3)':dpFail<10?'var(--g)':dpFail<25?'var(--a)':'var(--r)';
    const floorCol=mc.liqFloorP10>=0?'var(--g)':'var(--r)';
    const stat=(label,val,sub,col)=>`<div style="background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:9px 11px">
      <div style="font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:3px">${label}</div>
      <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:${col||'var(--tx)'}">${val}</div>
      <div style="font-size:8.5px;color:var(--t2);margin-top:1px">${sub}</div>
    </div>`;
    out.innerHTML=`<div style="margin-top:10px">
      <div style="font-size:10px;color:var(--t2);margin-bottom:8px">Net worth at ${horizon} across 800 scenarios — your single-line plan is roughly the median (P50):</div>
      <div class="pf-quad" style="margin-bottom:10px">
        ${stat('Pessimistic (P10)',fmt(mc.finalP10),'1-in-10 downside','var(--r)')}
        ${stat('Median (P50)',fmt(mc.finalP50),'expected path','var(--tx)')}
        ${stat('Optimistic (P90)',fmt(mc.finalP90),'1-in-10 upside','var(--g)')}
        ${stat('Geo. return',geomPct+'%','compounded/yr','var(--b)')}
      </div>
      <div class="pf-quad">
        ${stat('Liquid floor (P10)',fmt(mc.liqFloorP10),'lowest liquid, bad case',floorCol)}
        ${stat('Cash-crunch risk',ruin.toFixed(0)+'%',ruin<5?'very unlikely':ruin<15?'watch closely':'elevated',ruinCol)}
        ${dpFail!=null?stat('Down-payment risk',dpFail.toFixed(0)+'%',`can't cover ${P.homePurchaseYear} DP`,dpCol):stat('Down-payment risk','—','no purchase set','var(--t3)')}
        ${stat('Volatility',Math.round((mc.vol)*100)+'%','annual std dev','var(--t3)')}
      </div>
      <div style="font-size:9px;color:var(--t3);margin-top:8px;line-height:1.5">${mc.mode==='historical'?'Historical bootstrap: each trial replays a real contiguous run of actual annual S&P 500 returns (1928–2023, dividends included), preserving how bad decades cluster.':`Lognormal returns calibrated so the simulated compounded growth matches your ${Math.round((P.investReturn||.06)*100)}% assumption.`} "Cash-crunch risk" = share of scenarios where liquid goes negative at any point; "down-payment risk" = share where liquid can't cover the down payment the year before purchase.</div>
    </div>`;
  },30);
}

  // Parameter diffs

  const fmtPv=(k,v)=>{if(['investReturn','expenseInflation','normGrowth','rentInflation'].includes(k))return(v*100).toFixed(1)+'%';if(['homePrice','startingLiquid','normCashY0','normStockY0','startingStripeEquity','pretax401k'].includes(k))return fmt(v);

// ── The rail, alive ─────────────────────────────────────────────────────────
// Six nav items and then an empty column. Ambient state is what makes something feel
// like an instrument panel rather than a website, so the rail now carries the three
// things worth knowing without changing screens: what needs you, how fresh the numbers
// are, and the shape of the curve.
//
// Every figure here is read from state that already exists. Nothing is computed twice,
// and nothing is invented — when the watchlist has not loaded the badge stays hidden
// rather than showing a reassuring zero.
function renderNavLive(){
  const badge=document.getElementById('navAlertBadge');
  if(badge){
    const open=_inbox&&_inbox.counts?Number(_inbox.counts.open)||0:null;
    // A zero badge and an absent badge look the same to a reader, so only a real count
    // is ever drawn. An unloaded watchlist shows nothing at all.
    if(open){badge.hidden=false;badge.textContent=open;
      badge.setAttribute('aria-label',`${open} item${open===1?'':'s'} need your attention`);}
    else badge.hidden=true;
  }

  const rail=document.getElementById('navLive');
  if(!rail)return;
  // No projection is run here any more. It existed only to draw the sparkline; with that
  // gone, nothing in this rail depends on it, and running the whole plan on every render to
  // decide whether to show a freshness dot is work for nothing.

  // Freshness. The dot states which of three things is true, and the text never claims
  // more than the dot: connected and current, connected and stale, or not connected.
  // Only a SUCCESSFUL read dates the balances. Falling through to the legacy sync's timestamp
  // when _ovw is an error object painted a green "Balances read today" over a failed read —
  // the freshness dot claiming currency precisely when there is none.
  const balanceDate=(_ovw&&!_ovw.error&&_ovw.asOf)||monarchSnapshot?.syncedAt;
  const asOf=balanceDate?new Date(balanceDate):null;
  const dated=asOf&&Number.isFinite(asOf.getTime());
  const days=dated?Math.round((Date.now()-asOf.getTime())/86400000):null;
  const tone=!dated?'missing':days>7?'stale':'fresh';
  const freshness=!dated?'Accounts not connected'
    :days<=0?'Balances read today'
    :`Balances ${days} day${days===1?'':'s'} old`;

  // The sparkline that used to sit here is gone. Rescaled to its own min and max, thirty
  // years of compounding flattened into a line that looked the same whatever the plan said —
  // a picture of a shape with no number on it, in a corner, beside a chart that shows the
  // same projection properly. What is left is the two things this rail can actually tell
  // you at that size: how fresh the balances are, and the way in.
  rail.hidden=false;
  rail.innerHTML=`
    <div class="nav-fresh" data-tone="${tone}"><span></span>${advEscape(freshness)}</div>
    <button class="nav-spark" onclick="setTab('cockpit')" aria-label="Open your financial overview.">
      <span>Open your financial overview ↗</span>
    </button>`;
}

let _cachedBand=null; // {mode, sig, band:{p10,p50,p90}} — last-computed band, avoids recompute on every render
// Signature of every P field the projection actually reads. runMonteCarlo()/run() depend on
// nearly all of P (return rate, vol, home price/down/rate/year, income assumptions, etc.), so
// keying staleness on just {mode, planStartYear} let the band silently go stale — and stay
// stale looking authoritative — the moment any OTHER slider (e.g. Investment Return) moved.

function _recomputeBandIfStale(){
  const sig=_bandParamSig();
  if(!_cachedBand||_cachedBand.sig!==sig){
    showToast('Running 500 market scenarios for confidence band…','blue');
    setTimeout(()=>{
      try{const mc=runMonteCarlo(P,500,_mcMode);_cachedBand={sig,mode:_mcMode,band:mc.band};}
      catch(e){showToast('Simulation failed: '+e.message,'red');_bandMode=false;}
      render();
    },30);
    return true; // async recompute kicked off
  }
  return false;
}

// Like _sparkSVG, but highlights a specific index (not just the last point) with a guide line.
function _sparkSVGAt(vals,w,h,color,idx){
  if(!vals||vals.length<2)return'';
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1,pad=4;
  const pts=vals.map((v,i)=>[pad+i/(vals.length-1)*(w-2*pad), h-pad-((v-min)/rng)*(h-2*pad)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${(w-pad).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
  const hi=idx>=0&&idx<pts.length?pts[idx]:pts[pts.length-1];
  const gid='sa'+(''+color).replace(/[^a-z0-9]/gi,'');
  return `<svg class="story-spark-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${hi[0].toFixed(1)}" y1="${pad}" x2="${hi[0].toFixed(1)}" y2="${h-pad}" stroke="${color}" stroke-width="1" stroke-dasharray="2,2" opacity=".4"/>
    <circle cx="${hi[0].toFixed(1)}" cy="${hi[1].toFixed(1)}" r="4.5" fill="${color}"/>
    <circle cx="${hi[0].toFixed(1)}" cy="${hi[1].toFixed(1)}" r="8" fill="${color}" opacity=".2"/>
  </svg>`;
}
let _storyState=null;
function openStoryMode(){
  const{R}=run(P);
  const milestones=_storyMilestones(R,P);
  if(!milestones.length){showToast('Not enough plan data yet','red');return;}
  _storyState={R,milestones,idx:0};
  const ov=document.createElement('div');
  ov.id='storyOverlay';
  ov.innerHTML=`<button class="story-close" onclick="closeStoryMode()" aria-label="Close story">✕</button>
    <div class="story-dots" id="storyDots"></div>
    <div class="story-stage" id="storyStage"></div>
    <div class="story-nav">
      <button id="storyPrev" onclick="storyStep(-1)">← Back</button>
      <button id="storyNext" onclick="storyStep(1)">Next →</button>
    </div>`;
  document.body.appendChild(ov);
  document.addEventListener('keydown',_storyKeyHandler);
  _renderStory();
}
function closeStoryMode(){
  const ov=document.getElementById('storyOverlay');if(ov)ov.remove();
  document.removeEventListener('keydown',_storyKeyHandler);
  _storyState=null;
}
function _storyKeyHandler(e){
  if(!_storyState)return;
  if(e.key==='Escape')closeStoryMode();
  else if(e.key==='ArrowRight')storyStep(1);
  else if(e.key==='ArrowLeft')storyStep(-1);
}
function storyStep(dir){
  if(!_storyState)return;
  const n=_storyState.milestones.length;
  _storyState.idx=Math.max(0,Math.min(n-1,_storyState.idx+dir));
  _renderStory();
}
function _renderStory(){
  if(!_storyState)return;
  const{R,milestones,idx}=_storyState;
  const m=milestones[idx];
  const stage=document.getElementById('storyStage');
  const dots=document.getElementById('storyDots');
  if(!stage)return;
  // Prepend the true starting point (before any year of growth/spending) so "Today"
  // highlights day zero rather than 2026's year-end value, matching the hero chart.
  // Same measure as the "Net worth" figure under it, and the same opening anchor as the
  // "Today" card — a line plotting one thing beneath a number naming another is the defect
  // the cockpit spent this whole session removing.
  const open=Math.round((P.startingLiquid||0)+(P.startingStripeEquity||0)
    -Math.abs(Number(P.otherDebt||0)));
  const sparkVals=[open,...R.map(r=>r.nwExRetHome)];
  const rIdx=m.yr===(P.planStartYear||2026)?0:1+R.findIndex(r=>r.yr===m.yr);
  const spark=_sparkSVGAt(sparkVals,320,110,'#b6a8ff',rIdx);
  stage.innerHTML=`<div class="story-card reveal">
    <div class="story-icon">${m.icon}</div>
    <div class="story-year">${m.yr}</div>
    <div class="story-title">${advEscape(m.title)}</div>
    <div class="story-sub">${advEscape(m.sub)}</div>
    <div class="story-spark">${spark}</div>
    <div class="story-stats">
      <div><div class="story-stat-l">Net worth<small>ex-retirement &amp; home</small></div><div class="story-stat-v">${fmt(m.row.nwExRetHome)}</div></div>
      <div><div class="story-stat-l">Liquid</div><div class="story-stat-v">${fmt(m.row.liq)}</div></div>
    </div>
  </div>`;
  if(dots)dots.innerHTML=milestones.map((_,i)=>`<span class="story-dot ${i===idx?'active':''}" onclick="_storyState.idx=${i};_renderStory()"></span>`).join('');
  const prevBtn=document.getElementById('storyPrev'),nextBtn=document.getElementById('storyNext');
  if(prevBtn)prevBtn.disabled=idx===0;
  if(nextBtn){
    const isLast=idx===milestones.length-1;
    nextBtn.textContent=isLast?'Done ✓':'Next →';
    nextBtn.onclick=isLast?closeStoryMode:()=>storyStep(1);
  }
}

async function loadAdvisorState(){
  try{
    const res=await fetch('/api/chats');
    if(!res.ok)return;
    const raw=await res.json();
    const chats=Array.isArray(raw)?raw:[];
    advisorChats={};
    chats.forEach(c=>{
      advisorChats[c.id]={
        id:c.id,title:c.title,messages:[],
        messageCount:parseInt(c.message_count)||0,
        createdAt:new Date(c.created_at).getTime(),
        updatedAt:new Date(c.updated_at).getTime()
      };
    });
    if(chats.length>0&&!advisorActiveChatId){
      advisorActiveChatId=chats[0].id;
      await advLoadMessages(advisorActiveChatId);
    }
  }catch(e){console.error('loadAdvisorState error:',e)}
}

async function advLoadMessages(id){
  if(!id||!advisorChats[id])return;
  try{
    const res=await fetch('/api/chats/'+id);
    if(res.ok){
      const data=await res.json();
      advisorChats[id].messages=data.messages||[];
      if(id===advisorActiveChatId)advisorConversation=advisorChats[id].messages;
    }
  }catch(e){}
}

function advUuid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function advEscape(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function advMarkdown(text){
  // Escape the ENTIRE input first so any raw HTML in the model output or reloaded
  // chat history is inert (prevents stored XSS). Markdown tokens (* ` # | -) are
  // unaffected by escaping, so the rules below still match; inner advEscape calls
  // are no longer needed since everything is already escaped.
  let h=advEscape(text);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre>${c.trim()}</pre>`);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\n((?:\|.+\|\n)+)/g,(m,tbl)=>{
    const rows=tbl.trim().split('\n');if(rows.length<2)return m;
    const hdr=rows[0].split('|').slice(1,-1).map(c=>c.trim());
    const isSep=rows[1].match(/^[\s|:\-]+$/);
    const body=isSep?rows.slice(2):rows.slice(1);
    let t='<table><thead><tr>'+hdr.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
    body.forEach(r=>{const cells=r.split('|').slice(1,-1).map(c=>c.trim());t+='<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>'});
    return '\n'+t+'</tbody></table>';
  });
  h=h.replace(/^### (.+)$/gm,(m,t)=>`<h3>${t}</h3>`);
  h=h.replace(/^#### (.+)$/gm,(m,t)=>`<h4>${t}</h4>`);
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?:^|\n)((?:[\-\*] .+\n?)+)/g,(m,l)=>{const items=l.trim().split('\n').map(x=>x.replace(/^[\-\*] /,''));return '\n<ul>'+items.map(i=>`<li>${i}</li>`).join('')+'</ul>'});
  h=h.split('\n\n').map(p=>{p=p.trim();if(!p)return '';if(p.startsWith('<'))return p;return '<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('\n');
  return h;
}

// The rail is a drawer, not a permanent column. An empty 300px panel saying "no
// conversations yet" is the most expensive way to say nothing.
//
// On a phone it is a SHEET fixed to the viewport. It was previously positioned absolutely
// inside .adv-wrap, whose bottom sits below the fold once the page is taller than the
// screen — so it opened correctly, 1,200px down, and looked to the reader like the button
// did nothing at all.
function advToggleRail(force){
  const rail=document.getElementById('advRail'),btn=document.getElementById('advRailBtn');
  const scrim=document.getElementById('advScrim');
  if(!rail)return;
  const open=force!=null?force:rail.hidden;
  rail.hidden=!open;
  if(scrim)scrim.hidden=!open;
  if(btn)btn.setAttribute('aria-expanded',String(open));
  document.body.classList.toggle('adv-sheet-open',open);
  if(open){
    advRenderRail();
    // Focus moves into the sheet so a keyboard or screen-reader user lands where the
    // content now is, and Escape closes it from anywhere.
    const first=rail.querySelector('.adv-rail-item,button');
    if(first&&typeof first.focus==='function')first.focus({preventScroll:true});
  } else if(btn&&typeof btn.focus==='function')btn.focus({preventScroll:true});
}
function advToggleRailMobile(){advToggleRail()}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const rail=document.getElementById('advRail');
  if(rail&&!rail.hidden)advToggleRail(false);
});

  msg.appendChild(avatar);msg.appendChild(bubble);
  msgs.appendChild(msg);

async function advAutoBrief(){
  if(!advisorActiveChatId||!advisorChats[advisorActiveChatId])return;
  const msgs=document.getElementById('advMsgs');
  if(!msgs)return;
  const thinking=advAddMessage('ai','',true);
  const _res=run(P);const R=_res.R;
  const liveContext=buildLiveContext(R,P,_res);
  const briefPrompt='Give me a concise quarterly check-in on my financial plan: 3-4 specific things to flag right now. Mix of what\'s on track, what needs attention, and any quick wins. Be direct and specific to my actual numbers — no generic advice.';
  const chat=advisorChats[advisorActiveChatId];
  try{
    const res=await fetch('/api/advisor/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chatId:advisorActiveChatId,message:briefPrompt,systemPrompt:liveContext,messages:[]})
    });
    if(!res.ok)throw new Error('API error '+res.status);
    thinking.innerHTML='';
    let fullReply='';
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    outer:while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        let payload;try{payload=JSON.parse(line.slice(6))}catch{continue}
        if(payload.error)throw new Error(payload.error);
        if(payload.delta){fullReply+=payload.delta;thinking.innerHTML=advMarkdown(fullReply);const m=document.getElementById('advMsgs');if(m)m.scrollTop=m.scrollHeight;}
        if(payload.done)break outer;
      }
    }
    const answer=fullReply||'(no response)';
    thinking.innerHTML=advMarkdown(answer);
    advisorConversation=[{role:'user',content:briefPrompt,hidden:true},{role:'assistant',content:answer}];
    chat.messages=advisorConversation;
    chat.title='📋 Quarterly brief';
    chat.updatedAt=Date.now();
    advRenderRail();
  }catch(e){
    if(thinking)thinking.innerHTML=`<p style="color:var(--r);font-size:11px">Couldn't connect to AI advisor. ${e.message}</p>`;
  }
}

function advRenderRail(){

    return `<div class="adv-rail-item ${c.id===advisorActiveChatId?'active':''}" onclick="advSwitchChat('${c.id}')">

function advRelTime(ts){
  const diff=Date.now()-ts;
  const min=Math.floor(diff/60000);
  if(min<1)return 'now';
  if(min<60)return min+'m';
  const hr=Math.floor(min/60);
  if(hr<24)return hr+'h';
  const d=Math.floor(hr/24);
  if(d<7)return d+'d';
  const w=Math.floor(d/7);
  if(w<4)return w+'w';
  return PlannerTime.formatDate(ts,{month:'short',day:'numeric'});
}

function advImportChats(){
  const input=document.createElement('input');
  input.type='file';input.accept='application/json,.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.chats||typeof data.chats!=='object')throw new Error('Invalid file format');
        const incoming=Object.values(data.chats);
        if(!confirm(`Import ${incoming.length} conversation${incoming.length===1?'':'s'}? Merges with existing chats.`))return;
        let imported=0;
        const promises=[];
        Object.entries(data.chats).forEach(([id,chat])=>{
          if(chat.id&&chat.messages&&Array.isArray(chat.messages)){
            const newId=advisorChats[id]?advUuid():id;
            advisorChats[newId]={...chat,id:newId,messages:chat.messages,messageCount:chat.messages.length,createdAt:chat.createdAt||Date.now(),updatedAt:chat.updatedAt||Date.now()};
            promises.push(fetch('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:newId,title:chat.title||'Imported chat'})})
              .then(()=>fetch('/api/chats/'+newId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chat.messages})}))
              .catch(()=>{}));
            imported++;
          }
        });
        Promise.all(promises).then(()=>{advRenderRail();alert(`Imported ${imported} conversation${imported===1?'':'s'}.`)});
      }catch(err){alert('Failed to import: '+err.message)}
    };
    reader.readAsText(file);
  };
  input.click();
}

async function advSendStream(text,chat,liveContext,thinking){
  try{
    const res=await fetch('/api/advisor/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chatId:advisorActiveChatId,message:text,systemPrompt:liveContext,messages:advisorConversation})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||`HTTP ${res.status}`)}
    let fullReply='';let toolNote='';const structuredResults=[];
    const _renderBubble=(status)=>{
      thinking.innerHTML=fullReply
        ? toolNote+advMarkdown(fullReply)
        : advThinkingMarkup(status||'Thinking with your plan')+toolNote;
      const m=document.getElementById('advMsgs');if(m)m.scrollTop=m.scrollHeight;
    };
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    outer:while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        let payload;try{payload=JSON.parse(line.slice(6))}catch{continue}
        if(payload.error)throw new Error(payload.error);
        if(payload.tool_call){
          const nm=(payload.tool_call.name||'').replace(/^monarch_/,'');
          toolNote=`<div class="adv-tool">${advEscape(nm)}</div>`;
          _renderBubble(advToolStatus(payload.tool_call.name));
        }
        if(payload.tool_result)structuredResults.push(payload.tool_result);
        if(payload.delta){
          fullReply+=payload.delta;
          _renderBubble();
        }
        if(payload.done)break outer;
      }
    }
    const answer=fullReply||'Sorry, no response. Try again?';
    thinking.innerHTML=(fullReply?'':toolNote)+advMarkdown(answer);
    advisorConversation.push({role:'assistant',content:answer,structuredResults});
    advRestoreStructured(structuredResults);
    chat.messages=advisorConversation;chat.updatedAt=Date.now();
    advRenderRail();
  }catch(err){
    thinking.innerHTML=`<p style="color:var(--r)"><strong>Error:</strong> ${advEscape(err.message)}</p><p style="font-size:11px;color:var(--t3);margin-top:4px">Check your connection and try again.</p>`;
    advisorConversation.pop();chat.messages=advisorConversation;
  }finally{
    document.getElementById('advSend').disabled=false;
    const inp=document.getElementById('advInput');if(inp)inp.focus();
  }
}
