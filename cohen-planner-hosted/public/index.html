}

let _acctDonutSpec=null;
function mountAccountDonut(){
  if(!_acctDonutSpec||!document.getElementById('acctDonut'))return;
  const panel=document.getElementById('monarchAccountsPanel');
  if(panel&&!panel.open)return;
  if(charts.acct)charts.acct.destroy();
  charts.acct=makeDonut('acctDonut',_acctDonutSpec.labels,_acctDonutSpec.data,_acctDonutSpec.colors);
}
function renderMonarchAccountsCard(){
  if(!monarchAccounts||monarchAccounts.length===0)return'';
  const catOrder=['cash','investment','retirement','other_asset','other','liability'];
  const catLabel={cash:'Cash & Savings',investment:'Investments',retirement:'Retirement',other_asset:'Other Assets',other:'Other',liability:'Liabilities'};
  const catColor={cash:'var(--b)',investment:'var(--accent)',retirement:'var(--p)',other_asset:'var(--t2)',other:'var(--t2)',liability:'var(--r)'};
  const groups={};
  for(const a of monarchAccounts){
    const c=a.category||'other';
    if(!groups[c])groups[c]=[];
    groups[c].push(a);
  }
  // Asset side only — a liability share of a pie is meaningless, so debts stay in the list.
  const assetTotal=monarchAccounts.filter(a=>(a.balance||0)>0).reduce((s,a)=>s+a.balance,0);
  const rows=catOrder.filter(c=>groups[c]).map(c=>{
    const accts=groups[c];
    const total=accts.reduce((s,a)=>s+(a.balance||0),0);
    const isLiab=c==='liability';
    const share=!isLiab&&assetTotal>0?Math.max(0,total)/assetTotal*100:0;
    return`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3)">${catLabel[c]}${!isLiab?` <span style="color:var(--t3);font-weight:600;letter-spacing:0">· ${share.toFixed(0)}%</span>`:''}</span>
        <span style="font-size:11px;font-weight:700;font-family:'SF Mono',monospace;color:${isLiab?'var(--r)':'var(--tx)'}">${isLiab?'−':''}${fmt(Math.abs(total))}</span>
      </div>
      ${!isLiab?`<div style="height:4px;border-radius:2px;background:var(--s2);margin-bottom:6px;overflow:hidden"><div style="width:${share}%;height:100%;background:${catColor[c]};border-radius:2px"></div></div>`:''}
      ${accts.map(a=>{
        const nm=a.name||'';
        const isStripe=nm.toLowerCase().includes('stripe');
        return`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:${isStripe?'rgba(99,91,255,.06)':'var(--s2)'};border:1px solid ${isStripe?'rgba(99,91,255,.2)':'var(--bd)'};border-radius:6px;margin-bottom:3px">
          <div>
            <span style="font-size:10.5px;font-weight:${isStripe?700:500};color:var(--tx)">${advEscape(nm)}</span>
            ${a.institution?`<span style="font-size:8px;color:var(--t3);margin-left:5px">${advEscape(a.institution)}</span>`:''}
          </div>
          <span style="font-size:11px;font-weight:600;font-family:'SF Mono',monospace;color:${a.balance<0?'var(--r)':catColor[c]}">${a.balance<0?'−':''}${fmt(Math.abs(a.balance||0))}</span>
        </div>
        ${isStripe?renderStripeReconcile(a.balance||0):''}`;
      }).join('')}
    </div>`;
  }).join('');
  // Stripe gets its own slice rather than hiding inside Investments — the plan treats it as
  // a separate asset class, so the picture of where the money sits should too.
  const isStripeAcct=a=>typeof a.name==='string'&&a.name.toLowerCase().includes('stripe');
  const stripeTot=monarchAccounts.filter(a=>isStripeAcct(a)&&(a.balance||0)>0).reduce((s,a)=>s+a.balance,0);
  const acctSeries=[];
  for(const c of catOrder){
    if(c==='liability'||!groups[c])continue;
    const t=groups[c].filter(a=>!isStripeAcct(a)&&(a.balance||0)>0).reduce((s,a)=>s+a.balance,0);
    // Label the investments slice "ex-Stripe": the account LIST groups by Monarch's own
    // categories (where Stripe is an investment account), but this donut breaks Stripe out as
    // its own asset class. Without the qualifier the same word reads 44% here and 78% below.
    const lbl=c==='investment'&&stripeTot>0?catLabel[c]+' (ex-Stripe)':catLabel[c];
    // Investments must not sit next to Stripe in near-identical violet — Stripe keeps its
    // brand colour, so the diversified slice moves to teal.
    if(t>0)acctSeries.push([lbl,t,{cash:'#0073e6',investment:'#14b8a6',retirement:'#7c3aed',other_asset:'#8898aa',other:'#8898aa'}[c]||'#8898aa']);
  }
  if(stripeTot>0)acctSeries.push(['Stripe',stripeTot,'#6772e5']);
  acctSeries.sort((a,b)=>b[1]-a[1]);
  const acctDonutLabels=acctSeries.map(x=>x[0]),acctDonutData=acctSeries.map(x=>x[1]),acctDonutColors=acctSeries.map(x=>x[2]);
  // The card returns markup; the canvas can only be bound once the caller has inserted it.
  _acctDonutSpec=acctDonutData.length>1?{labels:acctDonutLabels,data:acctDonutData,colors:acctDonutColors}:null;
  const totalNw=monarchAccounts.reduce((s,a)=>s+(a.balance||0),0);
  return`<details id="monarchAccountsPanel" class="monarch-accounts" ontoggle="if(this.open)requestAnimationFrame(mountAccountDonut)">
    <summary>
      <span><strong>All Accounts · Monarch</strong><small>${monarchAccounts.length} accounts</small></span>
      <span class="monarch-accounts-total">${fmt(totalNw)} ${monarchSnapshot?.partial?'known subtotal':'NW'}</span>
      <span class="accounts-chevron" aria-hidden="true">⌄</span>
    </summary>
    <div class="monarch-accounts-body">
    ${acctDonutData.length>1?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;margin-bottom:14px">
      <div style="height:190px;position:relative"><canvas id="acctDonut"></canvas></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${acctDonutData.map((v,i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:10px">
          <span style="width:9px;height:9px;border-radius:2px;background:${acctDonutColors[i]};flex:none"></span>
          <span style="color:var(--t2);flex:1">${acctDonutLabels[i]}</span>
          <span style="font-family:'SF Mono',monospace;font-weight:600;color:var(--tx)">${fmt(v)}</span>
        </div>`).join('')}
        <div style="border-top:1px solid var(--bd);margin-top:3px;padding-top:6px;display:flex;font-size:10px">
          <span style="color:var(--t3);flex:1">Total assets</span>
          <span style="font-family:'SF Mono',monospace;font-weight:700;color:var(--tx)">${fmt(assetTotal)}</span>
        </div>
      </div>
    </div>`:''}
    ${(()=>{
      // Only warn about what can actually be named. A partial flag carrying no missing
      // accounts printed "no balance for:" followed by nothing — a warning with nothing to
      // point at, which reads as a fault in the page rather than in the data.
      const miss=(monarchSnapshot&&monarchSnapshot.missingAccounts)||[];
      if(!monarchSnapshot?.partial||!miss.length)return '';
      return `<div role="status" style="padding:12px;margin-bottom:12px;background:var(--a-soft);border-radius:8px"><strong>Incomplete totals</strong><br>${monarchAccounts.length} accounts have balances. Monarch returned no balance for: ${miss.map(a=>advEscape(a.name||a)).join(', ')}. Subtotals below exclude these accounts; no $0 balance has been substituted.</div>`;
    })()}
      ${rows}
    </div>
  </details>`;
}

        <div style="text-align:right;font-size:9.5px;font-family:'SF Mono',monospace;color:var(--t2)">${pct.toFixed(1)}%</div>

        <div style="text-align:right;font-size:9.5px;font-family:'SF Mono',monospace;font-weight:600;color:${isCash?'var(--t3)':colorPct(h.periodChangePct)}">${isCash?'—':signPct(h.periodChangePct)}</div>
        <div style="text-align:right;font-size:9.5px;font-family:'SF Mono',monospace;font-weight:600;color:${isCash?'var(--t3)':colorPct(h.allTimePct)}">${isCash?'—':signPct(h.allTimePct)}</div>
      </div>`;
    }).join('')}
   </div>
  </div>
  <div style="font-size:9px;color:var(--t3);padding:0 2px">Holdings sourced from Monarch. Period: ${inv.periodStart} → ${inv.periodEnd}. ${periodIsReturn?'Portfolio return is Monarch’s contribution-aware performance for this window.':'Monarch did not provide portfolio performance, so growth reprices today’s positions over the window and does not adjust for deposits or withdrawals.'} Holding movers show price movement applied to today’s position size.</div>

  ${(()=>{
    // ── Portfolio analysis blurb ─────────────────────────────────────────────
    const observations=[];
    const flags=[];

    // Concentration — only single-name positions (equity/crypto/option/bond) carry
    // concentration risk. A diversified fund/ETF (e.g. an S&P 500 fund) being a large
    // slice is normal allocation, not single-stock risk, so it's tracked separately.
    const isDiversified=h=>h.securityType==='etf'||h.securityType==='mutual_fund';
    const topFund=holdings.find(isDiversified);
    const topFundPct=totalVal>0&&topFund?(topFund.value/totalVal*100):0;
    if(topFund&&topFundPct>15)observations.push({c:'var(--t2)',t:`${topFund.ticker} (diversified fund) is ${topFundPct.toFixed(0)}% of portfolio — broad-market exposure, not single-stock risk.`});

    const singleNames=holdings.filter(h=>!isDiversified(h)&&h.securityType!=='cash');
    const topSingle=singleNames[0];
    const topSinglePct=totalVal>0&&topSingle?(topSingle.value/totalVal*100):0;
    if(topSingle){
      if(topSinglePct>25)flags.push({c:'var(--a)',t:`⚠ ${topSingle.ticker} is ${topSinglePct.toFixed(0)}% of portfolio — heavy single-stock concentration.`});
      else observations.push({c:'var(--g)',t:`✓ Largest single-stock position (${topSingle.ticker}) is ${topSinglePct.toFixed(0)}% — concentration is manageable.`});
    }

    const top3Single=singleNames.slice(0,3);
    const top3SinglePct=totalVal>0?top3Single.reduce((s,h)=>s+h.value,0)/totalVal*100:0;
    if(top3SinglePct>40)flags.push({c:'var(--a)',t:`Top 3 single-stock positions (${top3Single.map(h=>h.ticker).join(', ')}) = ${top3SinglePct.toFixed(0)}% of portfolio.`});

    // Cash drag
    const cashHoldings=holdings.filter(h=>h.securityType==='cash');
    const cashVal=cashHoldings.reduce((s,h)=>s+h.value,0);
    const cashPct=totalVal>0?cashVal/totalVal*100:0;
    if(cashPct>12)flags.push({c:'var(--r)',t:`Cash is ${cashPct.toFixed(0)}% of investment portfolio — potential drag on long-run returns.`});
    else if(cashPct>0)observations.push({c:'var(--t2)',t:`Cash position: ${cashPct.toFixed(0)}% — within normal range.`});

    // Stripe account
    if(stripeBalance>0){
      const stripePct=donutTotal>0?stripeBalance/donutTotal*100:0;
      observations.push({c:'#6772e5',t:`Stripe account: ${fmt(stripeBalance)} (${stripePct.toFixed(1)}% of total including accounts).`});
    }

    // Period performance
    const periodPct=inv.periodChangePct||0;
    if(Math.abs(periodPct)>5)observations.push({c:colorPct(periodPct),t:`${periodPct>0?'Strong':'Weak'} period: ${signPct(periodPct)} over ${_investPeriod}. ${periodPct>0?'Broad momentum intact.':'Monitor for continuation.'}`});

    // All-time
    const allPct=inv.allTimePct||0;
    if(allPct>0)observations.push({c:'var(--g)',t:`All-time return: ${signPct(allPct)} — portfolio is in the green overall.`});
    else if(allPct<0)flags.push({c:'var(--r)',t:`Portfolio is down ${signPct(allPct)} all-time — cost-basis is above current value.`});

    // Type diversity
    const types=[...new Set(holdings.filter(h=>h.securityType!=='cash').map(h=>h.securityType))];
    const typeNames=types.map(t=>({equity:'Equities',etf:'ETFs',mutual_fund:'Funds',bond:'Bonds',crypto:'Crypto',option:'Options'}[t]||t));
    if(types.length>=2)observations.push({c:'var(--t2)',t:`Spread across ${typeNames.join(', ')} — ${holdings.length} total positions.`});

    const allItems=[...flags,...observations];
    if(allItems.length===0)return'';
    return`<div class="glass-card" style="padding:14px;margin-bottom:10px">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:10px">Portfolio Analysis</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${allItems.map(o=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 10px;background:rgba(10,37,64,.03);border-radius:7px;border-left:2px solid ${o.c}">
          <div style="font-size:11px;color:${o.c};line-height:1.45">${o.t}</div>
        </div>`).join('')}
      </div>
    </div>`;
  })()}

  ${(()=>{
    // ── Tax-loss harvesting scanner ─────────────────────────────────────────
    // allTimeChange = unrealized gain/loss vs. cost basis (Monarch's variation_dollars).
    const lossHoldings=holdings.filter(h=>h.securityType!=='cash'&&(h.allTimeChange||0)<0).sort((a,b)=>a.allTimeChange-b.allTimeChange);
    if(lossHoldings.length===0)return'';
    const totalLoss=lossHoldings.reduce((s,h)=>s+h.allTimeChange,0); // negative
    const taxRate=P.capGainsTaxRate??.345;
    const estSavings=Math.abs(totalLoss)*taxRate;
    return`<div class="glass-card" style="padding:14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3)">🧾 Tax-Loss Harvesting Opportunities</div>
        <div style="font-size:10px;color:var(--t2)">Est. tax savings if harvested: <strong style="color:var(--g)">${fmt(estSavings)}</strong></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:8px">
        ${lossHoldings.map(h=>{
          const pct=totalVal>0?(h.value/totalVal*100):0;
          return`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:rgba(205,61,100,.05);border-radius:7px;border-left:2px solid var(--r)">
            <div>
              <span style="font-size:11px;font-weight:600;color:var(--tx);font-family:'SF Mono',monospace">${advEscape(h.ticker||'')}</span>
              <span style="font-size:8.5px;color:var(--t3);margin-left:5px">${typeLabel[h.securityType]||''} · ${pct.toFixed(1)}% of portfolio</span>
            </div>
            <div style="text-align:right">
              <div style="font-size:10.5px;font-weight:700;color:var(--r);font-family:'SF Mono',monospace">${fmt(h.allTimeChange)}</div>
              <div style="font-size:8.5px;color:var(--t3)">~${fmt(Math.abs(h.allTimeChange)*taxRate)} tax savings</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="font-size:9px;color:var(--t3);line-height:1.5">Unrealized loss vs. cost basis (all-time), at your ${(taxRate*100).toFixed(1)}% capital-gains rate. Harvesting realizes the loss to offset gains elsewhere — but the IRS wash-sale rule disallows the deduction if you buy the same or a "substantially identical" security within 30 days before or after the sale. Consider a similar (not identical) fund if you want to stay invested.</div>
    </div>`;
  })()}

  ${renderMonarchAccountsCard()}
  </div>`;
  mountAccountDonut();
  if(mixData.length>1)charts.mix=makeDonut('mixDonut',mixLabels,mixData,mixColors);

  if(donutData.length>0){
    const legend=document.getElementById('portfolioHoldingLegend');
    if(legend)legend.innerHTML=donutLabels.map((label,i)=>{
      const value=donutData[i],pct=donutTotal>0?value/donutTotal*100:0;
      return `<div class="portfolio-holding-legend-row"><span class="portfolio-holding-swatch" style="background:${donutColors[i]}"></span><span class="portfolio-holding-name">${advEscape(label)}</span><strong>${fmt(value)}</strong><small>${pct.toFixed(1)}%</small></div>`;
    }).join('');
    const dCtx=document.getElementById('portfolioDonut').getContext('2d');
    charts.main=new Chart(dCtx,{
      type:'doughnut',
      data:{labels:donutLabels,datasets:[{data:donutData,backgroundColor:donutColors.slice(0,donutData.length),borderWidth:2,borderColor:'rgba(255,255,255,.85)',hoverOffset:7,hoverBorderColor:'#fff'}]},
      options:{
        responsive:true,maintainAspectRatio:false,cutout:'62%',
        plugins:{
          legend:{display:false},
          tooltip:{..._GLASS_TOOLTIP,callbacks:{label:ctx=>`  ${ctx.label}: ${fmt(ctx.raw)} (${donutTotal>0?(ctx.raw/donutTotal*100).toFixed(1):'0'}%)`}},
          datalabels:{
            color:'#fff',
            font:{size:10,weight:'bold',family:"'Inter',sans-serif"},
            formatter:(val,ctx)=>{
              const pct=donutTotal>0?val/donutTotal*100:0;
              return pct>=5?pct.toFixed(0)+'%':'';
            },
            anchor:'center',align:'center',
          }
        }
      },
      plugins:[ChartDataLabels]
    });
  }
}

// ── Housing: an affordability tool, not a report ───────────────────────────
// The tab answered "is my current plan sensible" across three charts, three tables and a
// five-path comparison. The question actually being asked is "how much can I afford, and how
// does that move when the rate or the down payment moves" — so it leads with one number and
// the levers that change it.
//
// Levers here are exploratory: they do not touch the plan until explicitly applied, so you
// can test a rate you have been quoted without disturbing your saved assumptions.
let _afRate=null,_afDown=null,_afShare=0.28,_afYear=null;
let _afQuarter=null,_afTenderCap=null,_afPauseMonths=0;
function afSet2(k,v){if(k==='q')_afQuarter=parseInt(v,10);else if(k==='cap')_afTenderCap=v===''||v==='none'?null:Number(v);else _afPauseMonths=Number(v);render()}
function afSet(k,v){
  if(k==='rate')_afRate=parseFloat(v);
  else if(k==='down')_afDown=parseFloat(v);
  else if(k==='year')_afYear=parseInt(v,10);
  else _afShare=parseFloat(v);
  render();
}
function afReset(){_afRate=null;_afDown=null;_afYear=null;_afShare=0.28;render()}
function afApply(){
  const q=afParams();
  // Moving the purchase year is a bigger change than a rate tweak — it shifts a down
  // payment, and every year of the plan after it — so it is named in the confirmation
  // rather than folded in silently with the other two.
  const moves=q.homePurchaseYear!==P.homePurchaseYear;
  if(!showConfirm(`Set your plan's mortgage rate to ${q.mortgageRate}% and down payment to ${q.downPctg}%${moves?`, and move your purchase to ${q.homePurchaseYear}`:''}?`))return;
  P.mortgageRate=q.mortgageRate;P.downPctg=q.downPctg;P.homePurchaseYear=q.homePurchaseYear;
  _afRate=null;_afDown=null;_afYear=null;
  markDirty();buildControls();render();savePlannerState();
  showToast('Applied to your plan','green');
}
function afParams(){
  return{...P,mortgageRate:_afRate??P.mortgageRate,downPctg:_afDown??P.downPctg,
    homePurchaseYear:_afYear??P.homePurchaseYear};
}

function renderHousingTab(R,P){
  const ca=document.getElementById('chartArea');
  destroyCharts();
  const q=afParams();
  const dirty=(_afRate!==null&&_afRate!==P.mortgageRate)||(_afDown!==null&&_afDown!==P.downPctg)||(_afYear!==null&&_afYear!==P.homePurchaseYear);
  const a=affordability(q,_afShare);
  const py=q.homePurchaseYear;
  const perDollar=housingCostPerDollar(q);
  const buyRow=R.find(r=>r.yr===py)||R[R.length-1];

  const money=v=>v>=1e6?'$'+(v/1e6).toFixed(2)+'M':fmt(v);
  const over=q.homePrice-a.max;

  // What the CURRENT price actually costs each month
  const cost=price=>{
    const loan=price*(1-q.downPctg/100);
    const mr=q.mortgageRate/100/12;
    const pi=loan>0&&mr>0?loan*(mr*(1+mr)**360)/((1+mr)**360-1):0;
    const tax=(q.propTaxRate??.012)*price/12;
    const maint=(q.maintBase||0)*(price/q.homePrice)/12;
    return{pi,tax,maint,all:pi+tax+maint};
  };
  const cur=cost(q.homePrice),atMax=cost(a.max);

  let h=`<div style="display:flex;flex-direction:column;gap:14px;padding:2px">`;

  // ── The answer ──
  h+=`<div class="glass-card" style="padding:22px 24px;background:linear-gradient(135deg,rgba(99,91,255,.07),rgba(103,114,229,.03))">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)">How much house can you afford?</div>
    <div style="font-size:40px;font-weight:800;letter-spacing:-1.5px;color:var(--tx);font-family:'SF Mono',ui-monospace,monospace;margin:4px 0 2px">${money(a.max)}</div>
    <div style="font-size:12px;color:var(--t2);line-height:1.6">
      at <strong>${q.mortgageRate}%</strong> with <strong>${q.downPctg}%</strong> down — about <strong>${fmtF(Math.round(atMax.all))}/mo</strong> all-in.<br>
      ${a.binding==='comfort'
        ? `Limited by <strong>carrying cost</strong>: above this, housing eats more than ${(_afShare*100).toFixed(0)}% of your after-tax income in ${py}. Your balance sheet could actually fund up to ${money(a.plan)}.`
        : `Limited by your <strong>balance sheet</strong>: above this, funding the purchase would break your ${fmt(q.liquidReserveFloor??500000)} reserve floor. Cash flow alone could carry up to ${money(a.comfort)}.`}
    </div>
    ${dirty?`<div style="margin-top:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <span style="font-size:9.5px;color:var(--a)">● Exploring — your plan still says ${P.mortgageRate}% / ${P.downPctg}% down, buying in ${P.homePurchaseYear}</span>
      <button onclick="afApply()" style="font-size:9.5px;padding:4px 10px;border-radius:5px;border:none;background:var(--accent);color:#fff;font-family:inherit;cursor:pointer">Apply to my plan</button>
      <button onclick="afReset()" style="font-size:9.5px;padding:4px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);font-family:inherit;cursor:pointer">Reset</button>
    </div>`:''}
  </div>`;

  // ── The two limits vs. where you are ──
  const limitCard=(lbl,val,sub,binds,warn)=>`<div class="glass-card" style="padding:14px 16px;border-color:${binds?'rgba(99,91,255,.4)':warn?'rgba(205,61,100,.35)':'var(--bd)'}">
    <div style="font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:4px">${lbl}${binds?' <span style="color:var(--accent)">· binds</span>':''}</div>
    <div style="font-size:21px;font-weight:800;font-family:'SF Mono',monospace;color:${warn?'var(--r)':binds?'var(--accent)':'var(--tx)'};letter-spacing:-.5px">${money(val)}</div>
    <div style="font-size:9.5px;color:var(--t2);margin-top:3px;line-height:1.45">${sub}</div>
  </div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
    ${limitCard('Carrying-cost limit',a.comfort,`All-in housing stays under ${(_afShare*100).toFixed(0)}% of ${py} after-tax income (${fmt(buyRow.netTC)})`,a.binding==='comfort',false)}
    ${limitCard('Balance-sheet limit',a.plan,`The most you can fund with the ${fmt(q.liquidReserveFloor??500000)} reserve floor still intact, selling Stripe as needed`,a.binding==='plan',false)}
    ${limitCard('Your current plan',q.homePrice,over>0?`${money(over)} above what you can afford — ${fmtF(Math.round(cur.all))}/mo, ${(cur.all*12/buyRow.netTC*100).toFixed(0)}% of income`:`Within budget — ${fmtF(Math.round(cur.all))}/mo, ${(cur.all*12/buyRow.netTC*100).toFixed(0)}% of income`,false,over>0)}
  </div>`;

  // ── Levers ──
  // A percentage is not a budget until it is a number of dollars. The share lever now
  // answers "28% of what?" in the place where it is being moved, rather than leaving the
  // reader to find the figure in the card above and do the arithmetic.
  const shareBudget=_afShare*buyRow.netTC;
  const lever=(id,label,val,min,max,step,fmtv,key,sub)=>`<div>
    <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:3px"><span style="font-size:10px;color:var(--t2)">${label}</span><span style="font-size:11px;font-weight:700;font-family:'SF Mono',monospace;color:var(--tx)">${fmtv}</span></div>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" oninput="afSet('${key}',this.value)" style="width:100%">
    ${sub?`<div style="font-size:9.5px;color:var(--t3);margin-top:3px;line-height:1.45">${sub}</div>`:''}
  </div>`;
  const lastYr=R[R.length-1].yr;
  h+=`<div class="glass-card" style="padding:16px 18px">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:12px">Move a lever — the number above updates</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px">
      ${lever('afRate','Mortgage rate',q.mortgageRate,3,9,.125,q.mortgageRate+'%','rate')}
      ${lever('afDown','Down payment',q.downPctg,10,80,5,q.downPctg+'%','down')}
      ${lever('afShare','Max share of income',_afShare,.15,.45,.01,(_afShare*100).toFixed(0)+'%','share',
        `<strong style="color:var(--t2)">${fmtF(Math.round(shareBudget/12))}/mo</strong> · ${fmt(Math.round(shareBudget))}/yr — ${(_afShare*100).toFixed(0)}% of ${fmt(buyRow.netTC)} after-tax income in ${py}`)}
      ${lever('afYear','Purchase year',py,R[0].yr,lastYr,1,String(py),'year',
        py===P.homePurchaseYear?`Your plan buys in ${P.homePurchaseYear}`:`Your plan says ${P.homePurchaseYear}`)}
    </div>
  </div>`;

  // ── What waiting buys you ──────────────────────────────────────────────
  // "How much house can I afford" and "what if I buy later" are the same question asked
  // twice, so they belong on the same screen. Each year is the full model re-run, not the
  // headline figure grown at a rate.
  const YEARS=[];
  for(let y=R[0].yr;y<=Math.min(lastYr,R[0].yr+12);y++)YEARS.push(y);
  const byYear=YEARS.map(y=>{
    const py2={...q,homePurchaseYear:y};
    const row=R.find(r=>r.yr===y)||buyRow;
    const af=affordability(py2,_afShare);
    return{y,...af,netTC:row.netTC};
  });
  const yMax=Math.max(...byYear.map(v=>v.max));
  const nowMax=byYear.find(v=>v.y===py);
  h+=`<div class="glass-card" style="padding:16px 18px">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">What you can afford, by purchase year</div>
    <div style="font-size:10px;color:var(--t2);margin-bottom:11px">Each row re-runs the whole plan buying in that year, at ${q.mortgageRate}% with ${q.downPctg}% down. Click a year to explore it.</div>
    <div class="tw" style="max-height:none"><table style="font-size:11px">
      <thead><tr><th style="text-align:left">Buy in</th><th>Max price</th><th>vs. ${py}</th><th>What binds</th></tr></thead>
      <tbody>${byYear.map(v=>{
        const here=v.y===py;
        const delta=nowMax?v.max-nowMax.max:0;
        return `<tr onclick="afSet('year',${v.y})" style="cursor:pointer${here?';outline:1.5px solid var(--accent);outline-offset:-2px':''}">
          <td style="font-weight:${here?800:600};color:${here?'var(--accent)':'var(--tx)'}">${v.y}${here?' ←':''}</td>
          <td style="background:rgba(99,91,255,${(0.05+(yMax>0?v.max/yMax:0)*0.2).toFixed(3)});font-family:'SF Mono',monospace;font-weight:${here?800:500};color:${here?'var(--accent)':'var(--tx)'}">${money(v.max)}</td>
          <td style="font-family:'SF Mono',monospace;color:${delta>0?'var(--g)':delta<0?'var(--r)':'var(--t3)'}">${here?'—':(delta>0?'+':'')+money(Math.abs(delta)).replace('$',delta<0?'−$':'$')}</td>
          <td style="font-size:10px;color:var(--t2)">${v.binding==='comfort'?'Carrying cost':'Balance sheet'}</td>
        </tr>`;}).join('')}</tbody>
    </table></div>
    <div style="font-size:9.5px;color:var(--t3);margin-top:9px;line-height:1.5">
      Waiting raises the balance-sheet limit as savings and vests accumulate, and moves the carrying-cost limit with your income. Where the two cross, the binding constraint changes — and buying later stops helping.
    </div>
  </div>`;

  // ── The matrix: the artefact that actually answers "what if rates move" ──
  const RATES=[q.mortgageRate-1,q.mortgageRate-0.5,q.mortgageRate,q.mortgageRate+0.5,q.mortgageRate+1,q.mortgageRate+2]
    .filter(r=>r>=1).map(r=>Math.round(r*1000)/1000);
  const DOWNS=[20,30,40,50,60].filter(d=>d<=80);
  const cellMax=(r,d)=>{
    const pp={...q,mortgageRate:r,downPctg:d};
    return Math.min(planAffordablePrice(pp),comfortAffordablePrice(pp,_afShare));
  };
  const grid=RATES.map(r=>({r,cells:DOWNS.map(d=>cellMax(r,d))}));
  const allVals=grid.flatMap(g=>g.cells);
  const gMin=Math.min(...allVals),gMax=Math.max(...allVals);
  const shade=v=>{const t=gMax>gMin?(v-gMin)/(gMax-gMin):0.5;return `rgba(99,91,255,${(0.05+t*0.22).toFixed(3)})`};
  h+=`<div class="glass-card" style="padding:16px 18px">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">What you can afford, by rate and down payment</div>
    <div style="font-size:10px;color:var(--t2);margin-bottom:11px">Each cell is the lower of the two limits, run through the full model.</div>
    <div class="tw" style="max-height:none"><table style="font-size:11px">
      <thead><tr><th style="text-align:left">Rate</th>${DOWNS.map(d=>`<th>${d}% down</th>`).join('')}</tr></thead>
      <tbody>${grid.map(g=>`<tr>
        <td style="font-weight:700;color:${g.r===q.mortgageRate?'var(--accent)':'var(--tx)'}">${g.r}%${g.r===q.mortgageRate?' ←':''}</td>
        ${g.cells.map((v,i)=>{const here=g.r===q.mortgageRate&&DOWNS[i]===q.downPctg;
          return `<td style="background:${shade(v)};font-family:'SF Mono',monospace;font-weight:${here?800:500};color:${here?'var(--accent)':'var(--tx)'};${here?'outline:1.5px solid var(--accent);outline-offset:-2px':''}">${money(v)}</td>`;}).join('')}

    </table></div>
    <div style="font-size:9.5px;color:var(--t3);margin-top:9px;line-height:1.5">
      ${(()=>{const base=cellMax(q.mortgageRate,q.downPctg),up=cellMax(Math.round((q.mortgageRate+1)*1000)/1000,q.downPctg);
        return `A 1-point rise in rates costs you about <strong style="color:var(--tx)">${money(Math.max(0,base-up))}</strong> of purchasing power at ${q.downPctg}% down.`})()}
    </div>
  </div>`;

  // ── What the current price costs, month by month ──
  const line=(lbl,v,col)=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid var(--bd)"><span style="color:var(--t2)">${lbl}</span><span style="font-family:'SF Mono',monospace;font-weight:600;color:${col||'var(--tx)'}">${fmtF(Math.round(v))}/mo</span></div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px">
    <div class="glass-card" style="padding:16px 18px">

      <div style="font-size:9.5px;color:var(--t3);margin-top:5px">${(cur.all*12/buyRow.netTC*100).toFixed(0)}% of ${py} after-tax income · down payment ${fmt(q.homePrice*q.downPctg/100)}</div>
    </div>
    <div class="glass-card" style="padding:16px 18px">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:9px">Monthly cost at ${money(a.max)}</div>
      ${line('Principal &amp; interest',atMax.pi)}
      ${line('Property tax',atMax.tax)}
      ${line('Maintenance',atMax.maint)}
      <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0 0"><strong style="color:var(--tx)">All-in</strong><strong style="font-family:'SF Mono',monospace;color:var(--g)">${fmtF(Math.round(atMax.all))}/mo</strong></div>
      <div style="font-size:9.5px;color:var(--t3);margin-top:5px">${(atMax.all*12/buyRow.netTC*100).toFixed(0)}% of ${py} after-tax income · down payment ${fmt(a.max*q.downPctg/100)}</div>
    </div>
  </div>`;

  // ── Getting in: what closing actually costs, and whether the cash can be there ──
  // The affordability maths above is about the ONGOING cost. This is the separate question
  // of the day itself: a purchase can be affordable for thirty years and still fail to close
  // because the money is in stock that cannot be sold that month.
  {
    const L=window.PlannerLiquidity;
    const cash=cashToClose(q.homePrice,q);
    const cc=cash.breakdown;
    const prev=R.find(r=>r.yr===py-1),buyRow=R.find(r=>r.yr===py);
    const quarter=_afQuarter||L.purchaseQuarter(q);
    const floor=q.liquidReserveFloor??500000;
    const held=prev?prev.sEnd:(q.startingStripeEquity||0);
    const vestQ=(buyRow?buyRow.sNew:0)/4;
    const pauseCost=_afPauseMonths>0&&buyRow?buyRow.totE/12*_afPauseMonths:0;
    const otherCash=Math.max(0,(prev?prev.liq:q.startingLiquid||0)-floor-pauseCost);
    const capP={...q,...(_afTenderCap!=null?{stripeTenderCapPerEvent:_afTenderCap}:{})};
    const check=L.fundingCheck({year:py,quarter,need:cash.total,heldValue:held,vestPerQuarter:vestQ,otherCash},capP);

    const row=(l,v,note)=>`<div style="display:flex;justify-content:space-between;font-size:10.5px;padding:4px 0;border-bottom:1px solid var(--bd)">
      <span style="color:var(--t2)">${l}${note?` <span style="font-size:8.5px;color:var(--t3)">· ${note}</span>`:''}</span>

    h+=`<div class="glass-card" style="padding:16px 18px">

      <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0 0"><strong style="color:var(--tx)">Total</strong>
        <strong style="font-family:'SF Mono',monospace;color:var(--tx)">${fmtF(Math.round(cash.total))}</strong></div>
      <div style="font-size:9.5px;color:var(--t3);margin-top:4px">${fmtF(Math.round(cash.total-cash.down))} beyond the deposit — ${(cc.pctOfPrice*100).toFixed(2)}% of price in closing costs.</div>
    </div>`;

    // ── Can the money be there, in that quarter? ──
    h+=`<div class="glass-card" style="padding:16px 18px;border-color:${check.fundable?'var(--bd)':'rgba(205,61,100,.4)'}">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">Can the cash be there?</div>
      <div style="font-size:10px;color:var(--t2);margin-bottom:10px">Stripe sells in <strong>Q1 and Q4 tenders</strong>, plus a standing <strong>$20K/quarter</strong> cash election (about $80K a year). An annual total can look ample while the money is unreachable in the month you close.</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:11px">
        <label style="font-size:10px;color:var(--t2)">Closing quarter

            ${[1,2,3,4].map(x=>`<option value="${x}"${quarter===x?' selected':''}>Q${x}</option>`).join('')}</select></label>
        <label style="font-size:10px;color:var(--t2)">Tender cap
          <select onchange="afSet2('cap',this.value)" style="margin-left:5px;font-size:10px;padding:3px 6px;border:1px solid var(--bd);border-radius:5px;background:var(--s1);color:var(--tx);font-family:inherit">
            ${[['none','Uncapped (confirmed)'],[100000,'Stress $100K'],[250000,'Stress $250K'],[500000,'Stress $500K'],[1000000,'Stress $1M']].map(([v,l])=>`<option value="${v}"${String(_afTenderCap??'none')===String(v)?' selected':''}>${l}</option>`).join('')}</select></label>
        <label style="font-size:10px;color:var(--t2)">Income pause
          <select onchange="afSet2('pause',this.value)" style="margin-left:5px;font-size:10px;padding:3px 6px;border:1px solid var(--bd);border-radius:5px;background:var(--s1);color:var(--tx);font-family:inherit">
            ${[0,3,6,12].map(m=>`<option value="${m}"${_afPauseMonths===m?' selected':''}>${m?m+' months':'none'}</option>`).join('')}</select></label>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px">
        ${[['Needed',cash.total,'var(--tx)'],['Reachable from Stripe',check.fromStripe,'#6772e5'],
           ['Portfolio above floor',otherCash,'var(--b)'],
           [check.fundable?'Surplus':'Short by',Math.abs(check.available-cash.total),check.fundable?'var(--g)':'var(--r)']]
          .map(([l,v,c])=>`<div style="background:var(--s2);border-radius:7px;padding:9px 11px">
            <div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3)">${l}</div>
            <div style="font-size:15px;font-weight:800;font-family:'SF Mono',monospace;color:${c}">${fmtF(Math.round(v))}</div></div>`).join('')}
      </div>
      ${check.fundable
        ? `<div style="font-size:10px;color:var(--g);margin-top:9px">✓ A Q${quarter} close is fundable${_afPauseMonths?` even with ${_afPauseMonths} months of no income`:''}, leaving the ${fmtF(floor)} reserve intact.</div>`
        : `<div style="font-size:10px;color:var(--r);margin-top:9px">✗ A Q${quarter} close falls ${fmtF(Math.round(check.shortfall))} short. ${advEscape(check.remedy||'')}</div>`}
      <div style="font-size:9px;color:var(--t3);margin-top:7px;line-height:1.5">Windows reachable by Q${quarter}: ${check.windowsUsed.map(w=>`Q${w.quarter} ${w.kind}`).join(' · ')||'none'}. Money raised in an earlier quarter is still available later.</div>
    </div>`;

    // ── Downside and the assumption that flips it ──
    const scenarios=[
      ['As planned',{},0],
      ['Stress: tender capped at $250K',{stripeTenderCapPerEvent:250000},0],
      ['6 months without income',{},6],
      ['Stress: both together',{stripeTenderCapPerEvent:250000},6],
    ].map(([label,cp,pause])=>{
      const pc=pause>0&&buyRow?buyRow.totE/12*pause:0;
      const oc=Math.max(0,(prev?prev.liq:0)-floor-pc);
      const r=L.fundingCheck({year:py,quarter,need:cash.total,heldValue:held,vestPerQuarter:vestQ,otherCash:oc},cp);
      return{label,r};
    });
    h+=`<div class="glass-card" style="padding:16px 18px">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">Downside, and what would change the answer</div>
      <div style="font-size:10px;color:var(--t2);margin-bottom:9px">Each row is the same purchase under a different assumption. Ranges, not probabilities — none of these is claimed to be likely.</div>
      ${scenarios.map(sc=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:9px;font-size:10.5px;padding:6px 0;border-top:1px solid var(--bd)">
        <span style="color:var(--t2);flex:1">${sc.label}</span>
        <span style="font-family:'SF Mono',monospace;color:var(--t3)">${fmtF(Math.round(sc.r.available))} available</span>
        <span style="font-weight:700;color:${sc.r.fundable?'var(--g)':'var(--r)'};min-width:96px;text-align:right">${sc.r.fundable?'fundable':'short '+fmtF(Math.round(sc.r.shortfall))}</span>
      </div>`).join('')}
      <div style="font-size:9.5px;color:var(--t3);margin-top:9px;line-height:1.55">
        <strong style="color:var(--tx)">Confirmed:</strong> tenders are uncapped, so participation is limited only by vested stock — which is why this purchase funds comfortably. The capped rows above are a stress test, not a live risk. The assumption still worth watching is <strong style="color:var(--tx)">timing</strong>: a close between the Q1 and Q4 windows leans on cash raised earlier, so the closing quarter matters more than the annual total suggests.
      </div>
    </div>`;
  }

  // ── Refi calculator: a different question, kept but folded away ──
  h+=`<details class="glass-card" style="padding:14px 18px">
    <summary style="cursor:pointer;font-size:11px;font-weight:700;color:var(--tx)">🔄 Refinance break-even calculator</summary>
    <div style="margin-top:12px">
  <div class="glass-card" style="padding:16px 18px">
    <div style="font-size:11px;color:var(--t2);line-height:1.5;margin-bottom:12px">At your current ${P.mortgageRate}% rate on a ${fmt(P.homePrice*(1-P.downPctg/100))} loan, how many months until a lower rate pays for its own closing costs?</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px">
      <div class="sr" style="flex:1;min-width:160px">
        <div class="sh"><span class="sl">New rate</span><span class="sv" id="refiRateVal">${Math.max(2.5,P.mortgageRate-1).toFixed(2)}%</span></div>
        <input type="range" id="refiRateInput" min="2.5" max="${P.mortgageRate}" step="0.05" value="${Math.max(2.5,P.mortgageRate-1)}" oninput="document.getElementById('refiRateVal').textContent=parseFloat(this.value).toFixed(2)+'%';updateRefiCalc()">
      </div>
      <div class="sr" style="flex:1;min-width:160px">
        <div class="sh"><span class="sl">Closing costs</span><span class="sv" id="refiCostVal">${fmtF(6000)}</span></div>
        <input type="range" id="refiCostInput" min="1000" max="20000" step="500" value="6000" oninput="document.getElementById('refiCostVal').textContent=fmtF(parseFloat(this.value));updateRefiCalc()">
      </div>
    </div>
    <div id="refiResult" style="margin-top:10px"></div>
  </div>
    </div>
  </details>`;

  h+=`<div style="font-size:9.5px;color:var(--t3);line-height:1.6;padding:0 2px">
    Both limits run your full projection, so they already include tuition, childcare, Nancy's practice and the Stripe waterfall. Neither includes closing costs, and the balance-sheet limit spends Stripe equity down to your reserve floor — affordable is not the same as advisable.
  </div>`;

  h+=`</div>`;
  ca.innerHTML=h;
  updateRefiCalc();
  document.getElementById('summaries').innerHTML='';
}
// Refi break-even calc — reads the two sliders, uses mPmt() from model.js for P&I.
function updateRefiCalc(){
  const rateInp=document.getElementById('refiRateInput');
  const costInp=document.getElementById('refiCostInput');
  const out=document.getElementById('refiResult');
  if(!rateInp||!costInp||!out)return;
  const newRate=parseFloat(rateInp.value);
  const closingCost=parseFloat(costInp.value)||0;
  const loan=P.homePrice*(1-P.downPctg/100);
  const curPI=mPmt(loan,P.mortgageRate/100)/12;
  const newPI=mPmt(loan,newRate/100)/12;
  const monthlySavings=curPI-newPI;
  if(monthlySavings<=0){
    out.innerHTML=`<div style="font-size:11px;color:var(--r);padding:8px 0">New rate (${newRate.toFixed(2)}%) isn't lower than your current ${P.mortgageRate}% — no savings to break even on.</div>`;
    return;
  }
  const breakEvenMo=closingCost/monthlySavings;
  out.innerHTML=`<div class="pf-quad">
    <div class="kpi"><div class="kpi-l">Monthly Savings</div><div class="kpi-v" style="color:var(--g);font-size:14px">${fmt(monthlySavings)}</div><div class="kpi-s">${fmtF(curPI)} → ${fmtF(newPI)}</div></div>
    <div class="kpi"><div class="kpi-l">Break-even</div><div class="kpi-v" style="color:${breakEvenMo<=24?'var(--g)':breakEvenMo<=48?'var(--a)':'var(--r)'};font-size:14px">${breakEvenMo.toFixed(0)} mo</div><div class="kpi-s">${(breakEvenMo/12).toFixed(1)} years</div></div>
    <div class="kpi"><div class="kpi-l">Closing Costs</div><div class="kpi-v" style="font-size:14px">${fmt(closingCost)}</div><div class="kpi-s">one-time</div></div>
    <div class="kpi"><div class="kpi-l">Rate Drop</div><div class="kpi-v" style="color:var(--b);font-size:14px">${(P.mortgageRate-newRate).toFixed(2)}pt</div><div class="kpi-s">${P.mortgageRate}% → ${newRate.toFixed(2)}%</div></div>
  </div>
  <div style="font-size:9.5px;color:var(--t3);margin-top:8px;line-height:1.5">If you stay in the home past the break-even point, refinancing is a net win. Assumes ${fmt(loan)} loan balance — recalculate near the actual refi date since your balance will have amortized down.</div>`;
}

function renderSensitivityTab(R,P){
  const ca=document.getElementById('chartArea');
  destroyCharts();
  // Impact is measured on the TOTAL. On the ex-retirement basis a lever that moves
  // retirement — a contribution rate, say — showed almost no impact at all.
  const baseNW=R[R.length-1].netWorth;
  const ey=P.planEndYear||2058;

  const ALL_PARAMS=[
    {key:'investReturn',label:'Portfolio Return',delta:0.01,hi:'+1%',lo:'−1%',fmtV:v=>(v*100).toFixed(1)+'%',better:1},
    {key:'normCash',label:'Norm Cash Comp',delta:25000,hi:'+$25K/yr',lo:'−$25K/yr',fmtV:v=>fmt(v),better:1},
    {key:'normStock',label:'Norm Stripe Grant',delta:25000,hi:'+$25K/yr',lo:'−$25K/yr',fmtV:v=>fmt(v),better:1},
    {key:'stripeRet',label:'Stripe Return',delta:.03,hi:'+3%/yr',lo:'−3%/yr',fmtV:v=>(v*100).toFixed(0)+'%',better:1},
    {key:'nancyHourlyRate',label:'Nancy Rate',delta:25,hi:'+$25/hr',lo:'−$25/hr',fmtV:v=>'$'+v+'/hr',better:1},
    {key:'nancyMaxClients',label:'Nancy Clients',delta:5,hi:'+5',lo:'−5',fmtV:v=>v+' clients',better:1},
    {key:'pretax401k',label:'401k Contribution',delta:5000,hi:'+$5K/yr',lo:'−$5K/yr',fmtV:v=>fmt(v),better:1},
    {key:'expenseInflation',label:'Expense Inflation',delta:0.005,hi:'+0.5%',lo:'−0.5%',fmtV:v=>(v*100).toFixed(1)+'%',better:-1},
    {key:'taxInflation',label:'Bracket Inflation',delta:0.005,hi:'+0.5%',lo:'−0.5%',fmtV:v=>(v*100).toFixed(1)+'%',better:1},
    {key:'homePrice',label:'Home Price',delta:200000,hi:'+$200K',lo:'−$200K',fmtV:v=>'$'+(v/1e6).toFixed(2)+'M',better:-1},
    {key:'downPctg',label:'Down Payment %',delta:10,hi:'+10%',lo:'−10%',fmtV:v=>v+'%',better:-1},
    {key:'startingLiquid',label:'Starting Liquid',delta:100000,hi:'+$100K',lo:'−$100K',fmtV:v=>fmt(v),better:1},
    {key:'nancyRampYears',label:'Nancy Ramp',delta:2,hi:'+2 yrs',lo:'−2 yrs',fmtV:v=>v+' yrs',better:-1},
    {key:'homeAppreciation',label:'Home Appreciation',delta:0.01,hi:'+1%',lo:'−1%',fmtV:v=>(v*100).toFixed(1)+'%',better:1},
  ];

  const PRESETS={
    all:{label:'All factors',keys:ALL_PARAMS.map(p=>p.key)},
    income:{label:'Income levers',keys:['investReturn','normCash','normStock','stripeRet','nancyHourlyRate','nancyMaxClients','pretax401k']},
    housing:{label:'Housing',keys:['homePrice','downPctg','startingLiquid','homeAppreciation']},
    costs:{label:'Cost control',keys:['expenseInflation','taxInflation','nancyRampYears','pretax401k']},
  };

  const preset=PRESETS[_sensiPreset]||PRESETS.all;
  const PARAMS=ALL_PARAMS.filter(p=>preset.keys.includes(p.key));

  const results=PARAMS.map(p=>{
    const delta=_sensiDeltas[p.key]??p.delta;
    let vBase,hiP,loP;
    // Synthetic multi-field levers: a single P.key perturbation can't express "this runs
    // $25K higher across the board" when the value is spread over an 11-year window.
    if(p.key==='normCash'||p.key==='normStock'){
      const f=p.key==='normCash'?'normCashY':'normStockY';
      vBase=P[f+'0'];
      hiP={...P};loP={...P};
      for(let i=0;i<11;i++){hiP[f+i]=(P[f+i]||0)+delta;loP[f+i]=Math.max(0,(P[f+i]||0)-delta)}
    } else if(p.key==='stripeRet'){
      vBase=P.stripeLongTermReturn??.08;
      hiP={...P,stripeLongTermReturn:vBase+delta};loP={...P,stripeLongTermReturn:vBase-delta};
      for(let i=0;i<10;i++){const v=P['stripeRetY'+i]??vBase;hiP['stripeRetY'+i]=v+delta;loP['stripeRetY'+i]=v-delta}
    } else {
      vBase=P[p.key];
      const hiV=vBase+delta;
      const loV=Math.max(0,vBase-delta);
      hiP={...P,[p.key]:hiV};
      loP={...P,[p.key]:loV};
    }
    const hiR=run(hiP).R;const loR=run(loP).R;
    const hiNW=hiR[hiR.length-1].netWorth;
    const loNW=loR[loR.length-1].netWorth;
    const hiDelta=hiNW-baseNW;
    const loDelta=loNW-baseNW;
    const impact=Math.max(Math.abs(hiDelta),Math.abs(loDelta));
    return{...p,delta,vBase,hiDelta,loDelta,impact};
  });

  results.sort((a,b)=>Math.abs(b.hiDelta-b.loDelta)-Math.abs(a.hiDelta-a.loDelta));

  const presetBtns=Object.entries(PRESETS).map(([k,v])=>
    `<button onclick="_sensiPreset='${k}';renderSensitivityTab(window._lastR,window._lastP)" style="font-size:10px;padding:4px 10px;border-radius:5px;border:1px solid var(--bd);background:${_sensiPreset===k?'var(--accent)':'var(--s2)'};color:${_sensiPreset===k?'#fff':'var(--t2)'};cursor:pointer;font-family:inherit;font-weight:${_sensiPreset===k?'600':'400'}">${v.label}</button>`
  ).join('');

  const chartH=Math.max(220,results.length*38+60);

  let h=`<div style="padding:2px">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    <div>
      <div style="font-size:13px;font-weight:700;color:var(--tx)">🌪 Sensitivity — Tornado Chart</div>
      <div style="font-size:10px;color:var(--t2);margin-top:2px">Impact on ${ey} NW per one-step change. Base: <strong>${fmt(baseNW)}</strong></div>
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${presetBtns}</div>
  </div>
  <div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px">
    <canvas id="tornadoChart" style="height:${chartH}px"></canvas>
  </div>
  <div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;overflow:hidden">
    <div style="display:grid;grid-template-columns:148px 56px 1fr 1fr;font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--s2)">

    </div>`;

  results.forEach((r,i)=>{
    const upsideVal=r.better===1?r.hiDelta:r.loDelta;

      <div>
        <div style="font-size:10px;font-weight:600;color:var(--tx)">${r.label}</div>

      </div>
      <div style="padding:0 4px">
        <input type="text" value="${deltaDisplay}" data-key="${r.key}" data-rawdelta="${r.delta}"
          onchange="sensiUpdateDelta(this)"
          style="width:100%;font-size:9px;font-family:'SF Mono',monospace;text-align:center;padding:3px 4px;border:1px solid var(--bd);border-radius:4px;background:var(--s1);color:var(--tx);outline:none"
          title="Change step size for ${r.label}">
      </div>
      <div style="text-align:right;padding-right:12px;font-size:9.5px;font-family:'SF Mono',monospace;font-weight:600;color:${dColor}">${dSign}${fmt(downsideVal)}</div>

  });

  h+=`</div>
  <div style="margin-top:10px;font-size:9px;color:var(--t3);display:flex;gap:14px;flex-wrap:wrap;padding:0 2px">

    <span>Edit ± column to change step size. Sorted by total swing.</span>

  ca.innerHTML=h;

  const downsideData=results.map(r=>Math.round(Math.min(0,r.better===1?r.loDelta:r.hiDelta)/1000));
  const tCtx=document.getElementById('tornadoChart').getContext('2d');
  charts.main=new Chart(tCtx,{
    type:'bar',

}

function sensiUpdateDelta(input){
  const key=input.dataset.key;
  const raw=input.value.trim().replace(/[$%K,]/gi,'');
  let val=parseFloat(raw);
  if(isNaN(val)||val<=0){input.value=input.dataset.rawdelta;return;}
  // Handle % suffix
  if(input.value.includes('%'))val=val/100;
  // Handle K suffix
  else if(input.value.toUpperCase().includes('K'))val=val*1000;
  _sensiDeltas[key]=val;
  input.dataset.rawdelta=val;
  renderSensitivityTab(window._lastR,window._lastP);
}

function goalInlineEl(key,display,parseAs){
  return `<span data-goal-key="${key}" data-goal-parse="${parseAs}" onclick="goalInlineEdit(this)" style="cursor:pointer;border-bottom:1px dashed var(--t3);padding:0 1px;white-space:nowrap" title="Click to edit">${display}</span>`;
}
function goalInlineEdit(span){
  const key=span.dataset.goalKey;
  const parseAs=span.dataset.goalParse;
  const cur=P[key];
  let dflt;
  if(parseAs==='dollar-m')dflt=(cur/1e6).toFixed(2)+'M';
  else if(parseAs==='dollar-k')dflt=cur>=1000?Math.round(cur/1000)+'K':String(cur);
  else if(parseAs==='pct-decimal')dflt=(cur*100).toFixed(1)+'%';
  else if(parseAs==='pct')dflt=String(cur);
  else dflt=String(cur);
  const inp=document.createElement('input');
  inp.type='text';inp.value=dflt;
  inp.style.cssText='width:72px;font-size:inherit;font-family:inherit;color:var(--tx);background:var(--s1);border:1px solid var(--accent);border-radius:3px;padding:0 3px;outline:none';
  let committed=false;
  const commit=()=>{
    if(committed)return;
    committed=true;
    const s=inp.value.trim().toUpperCase();
    let v=parseFloat(s.replace(/[$,MK%]/g,''));
    if(isNaN(v)){committed=false;if(inp.parentNode)inp.parentNode.replaceChild(span,inp);return;}
    if(s.includes('M'))v=v*1e6;
    else if(s.includes('K'))v=v*1000;
    else if(parseAs==='dollar-m'&&v<10000)v=v*1e6;
    else if(parseAs==='pct-decimal')v=v>1?v/100:v;
    // Restore span before U() so render() doesn't tear down a live input
    if(inp.parentNode)inp.parentNode.replaceChild(span,inp);
    U(key,v);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit();}if(e.key==='Escape'){committed=true;if(inp.parentNode)inp.parentNode.replaceChild(span,inp);}};
  span.parentNode.replaceChild(inp,span);
  inp.focus();inp.select();
}

      <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:${col||'var(--tx)'}">${val}</div>
      <div style="font-size:8.5px;color:var(--t2);margin-top:1px">${sub}</div>
    </div>`;
    out.innerHTML=`<div style="margin-top:10px">
      <div style="font-size:10px;color:var(--t2);margin-bottom:8px">Net worth at ${horizon} across 800 scenarios — your single-line plan is roughly the median (P50):</div>
      <div class="pf-quad" style="margin-bottom:10px">
        ${stat('Pessimistic (P10)',fmt(mc.finalP10),'1-in-10 downside','var(--r)')}
        ${stat('Median (P50)',fmt(mc.finalP50),'expected path','var(--tx)')}
        ${stat('Optimistic (P90)',fmt(mc.finalP90),'1-in-10 upside','var(--g)')}
        ${stat('Geo. return',geomPct+'%','compounded/yr','var(--b)')}
      </div>
      <div class="pf-quad">
        ${stat('Liquid floor (P10)',fmt(mc.liqFloorP10),'lowest liquid, bad case',floorCol)}
        ${stat('Cash-crunch risk',ruin.toFixed(0)+'%',ruin<5?'very unlikely':ruin<15?'watch closely':'elevated',ruinCol)}
        ${dpFail!=null?stat('Down-payment risk',dpFail.toFixed(0)+'%',`can't cover ${P.homePurchaseYear} DP`,dpCol):stat('Down-payment risk','—','no purchase set','var(--t3)')}
        ${stat('Volatility',Math.round((mc.vol)*100)+'%','annual std dev','var(--t3)')}
      </div>
      <div style="font-size:9px;color:var(--t3);margin-top:8px;line-height:1.5">${mc.mode==='historical'?'Historical bootstrap: each trial replays a real contiguous run of actual annual S&P 500 returns (1928–2023, dividends included), preserving how bad decades cluster.':`Lognormal returns calibrated so the simulated compounded growth matches your ${Math.round((P.investReturn||.06)*100)}% assumption.`} "Cash-crunch risk" = share of scenarios where liquid goes negative at any point; "down-payment risk" = share where liquid can't cover the down payment the year before purchase.</div>
    </div>`;
  },30);
}

function renderGoalsTab(R,P,tT){
  const ca=document.getElementById('chartArea');
  destroyCharts();
  const sy=P.planStartYear||2026;
  const now=sy; // plan start = "today" for goal countdowns

  // ── Home Purchase ──
  const dp=P.homePrice*(P.downPctg/100);
  const yearsLeft=P.homePurchaseYear-now;
  const priorRow=R.find(r=>r.yr===P.homePurchaseYear-1);
  // Everything that can fund the purchase, not just the diversified pool. The waterfall
  // sells held Stripe for the down payment once the portfolio hits its reserve floor.
  const startAssets=(P.startingLiquid||0)+(P.startingStripeEquity||0);
  const projLiq=priorRow?priorRow.liq+priorRow.sEnd:startAssets;
  const projStripeShare=priorRow?priorRow.sEnd:(P.startingStripeEquity||0);
  const dpPct=Math.min(100,Math.round(startAssets/dp*100));
  const dpProjPct=Math.min(100,Math.round(projLiq/dp*100));
  const dpShortfall=Math.max(0,dp-projLiq);
  const dpOnTrack=projLiq>=dp;
  const dpMoNeeded=dpShortfall>0&&yearsLeft>0?Math.round(dpShortfall/yearsLeft/12):0;

  // ── Tuition ──
  const firstTuRow=R.find(r=>r.tu>0);
  const lastTuRow=[...R].reverse().find(r=>r.tu>0);
  const peakTuRow=R.reduce((a,b)=>b.tu>a.tu?b:a,R[0]);
  const yearsToTu=firstTuRow?firstTuRow.yr-now:null;
  const tuLiq=R.find(r=>r.yr===peakTuRow.yr);
  const kids=[P.kid1Birth];
  if(P.numKids>=2)kids.push(P.kid2Birth);
  if(P.numKids>=3)kids.push(P.kid3Birth);
  if(P.numKids>=4)kids.push(P.kid4Birth);

  // per-kid school windows (years only, not dollar split)
  const kidWindows=kids.map((kb,ki)=>{
    const startAge=ki===0?P.kid1YeshivaStartAge:P.yeshivaStartAge;
    const endAge=P.yeshivaEndAge;
    return{kb,startYr:kb+startAge,endYr:kb+endAge,years:endAge-startAge+1};
  });

  // ── progress bar helper ──
  function pbar(pct,color,bg){
    return `<div style="height:10px;border-radius:5px;background:${bg||'var(--s3)'};overflow:hidden;position:relative">
      <div style="height:100%;width:${pct}%;background:${color};border-radius:5px;transition:width .4s"></div>
    </div>`;
  }

  // ── surplus years liquid ladder (condensed view) ──
  const surpYrs=R.filter(r=>r.flow>=0).length;
  const defYrs=drawYears(R);

  // ── build HTML ──
  let h=`<div style="display:flex;flex-direction:column;gap:14px;padding:2px">`;

  // Priority action items
  const _actions=[];
  // 1. Down payment
  if(!dpOnTrack){_actions.push({icon:'🏠',color:'var(--a)',text:`Need ${fmt(dpShortfall)} more for down payment — save ~${fmt(dpMoNeeded)}/mo for ${yearsLeft} yr${yearsLeft!==1?'s':''}`});}
  else{_actions.push({icon:'🏠',color:'var(--g)',text:`Down payment funded — ${fmt(projLiq)} available by ${P.homePurchaseYear-1} covers the ${fmt(dp)} needed${projStripeShare>0?` (incl. ${fmt(projStripeShare)} Stripe)`:''}`});}
  // 2. Nancy trajectory
  const nancyMatYr=P.nancyRampYear+P.nancyRampYears;
  const nancyMatRow=R.find(r=>r.yr===nancyMatYr);
  if(nancyMatRow){_actions.push({icon:'👩‍⚕️',color:'var(--p)',text:`Nancy hits full capacity (~${fmt(Math.round(P.nancyMaxClients*P.nancyHourlyRate*P.nancyWeeksPerYear))}/yr) in ${nancyMatYr}`});}
  // 3. Liquid floor
  const minLiqRow=R.reduce((a,b)=>b.liq<a.liq?b:a,R[0]);
  if(minLiqRow.liq<500000){_actions.push({icon:'⚠️',color:'var(--r)',text:`Liquid hits floor of ${fmt(minLiqRow.liq)} in ${minLiqRow.yr} — consider increasing savings rate or deferring home purchase`});}
  else{_actions.push({icon:'💧',color:'var(--g)',text:`Liquid floor ${fmt(minLiqRow.liq)} in ${minLiqRow.yr} — above $500K safety cushion`});}
  // 4. Deficit years
  const defCount=drawYears(R);
  if(defCount>5){_actions.push({icon:'📉',color:'var(--r)',text:`${defCount} of ${R.length} years draw on savings or held Stripe — the rest are covered by that year's vest. Return assumptions matter a lot here`});}

  h+=`<div style="background:linear-gradient(135deg,var(--s1),var(--s2));border:1px solid var(--bd);border-radius:10px;padding:14px 16px">
    <div style="font-size:11px;font-weight:700;color:var(--tx);margin-bottom:10px;display:flex;align-items:center;gap:6px"><span>🎯</span><span>Priority Action Items</span></div>
    <div style="display:flex;flex-direction:column;gap:7px">
      ${_actions.map((a,i)=>`<div style="display:flex;align-items:flex-start;gap:8px">
        <span style="font-size:13px;flex-shrink:0;margin-top:1px">${a.icon}</span>
        <span style="font-size:11px;line-height:1.5;color:var(--t2)">${a.text}</span>
      </div>`).join('')}
    </div>
  </div>`;

  // GOAL 0: Compare only complete totals.
  if(monarchSnapshot&&!monarchSnapshot.partial){
    const curYr=new Date().getFullYear();
    const projRow=R.find(r=>r.yr===curYr)||R[0];
    const prevRow=R.find(r=>r.yr===curYr-1);
    const impliedLiq=monarchSnapshot.liquid;
    // The model emits year-END values, but a live snapshot is mid-year. Pro-rate the
    // plan to today: start-of-year baseline + (fraction of year elapsed) × this year's
    // projected growth. Without this, a June snapshot is measured against a Dec-31
    // finish line and always reads "behind".
    const _now=new Date(),_ys=new Date(curYr,0,1),_ye=new Date(curYr+1,0,1);
    const yrFrac=Math.min(1,Math.max(0,(_now-_ys)/(_ye-_ys)));
    const pctElapsed=Math.round(yrFrac*100);
    // Annual NW growth the plan projects for curYr — the INCREMENT only, not the absolute level.
    // This is driven purely by the plan's income/expense model for this year and is reliable
    // regardless of what starting point we use for the comparison.
    // Jan-1 baseline: always use P.startingLiquid (the user's slider input).
    // For the growth increment, use the model's prior-year row if available (multi-year plan),
    // so we capture only this year's projected change, not a stale absolute.
    const jan1Liq=(P.startingLiquid||0)+(P.startingStripeEquity||0);
    const jan1LiqBase=prevRow?planLiquidComparable(prevRow):jan1Liq;
    const annualLiqGrowth=planLiquidComparable(projRow)-jan1LiqBase;
    // Pro-rated plan target: user's starting liquid + this year's pro-rated growth
    const planLiq=Math.round(jan1Liq+yrFrac*annualLiqGrowth);
    // 401k: informational only (not used in headline comparison)
    const has401k=monarchSnapshot.retirement>0;
    const live401k=has401k?monarchSnapshot.retirement:(P.k401Start||0);
    const jan1_401=prevRow?prevRow.k401:(P.k401Start||0);
    const annual401Growth=projRow.k401-jan1_401;
    const plan401=Math.round(jan1_401+yrFrac*annual401Growth);
    const diff401=live401k-plan401;
    // Headline: liquid only — 401k excluded (user tracks liquid net worth).
    const liqDiff=impliedLiq-planLiq;
    const headlineActual=impliedLiq;
    const headlinePlan=planLiq;
    const totalDiff=headlineActual-headlinePlan;
    const ahead=totalDiff>=0;
    const needsAnchor=false;
    // ── Lumpy-year guard ───────────────────────────────────────────────────
    // The plan's annual liquid delta bakes in discrete events — chiefly the home
    // down payment, which hits at a single moment, not evenly across the year.
    // Linearly pro-rating such a year produces a meaningless "pace" (you read wildly
    // ahead before the purchase, wildly behind after), so we flag it instead.
    const isDpYear=curYr===P.homePurchaseYear;
    // A "big swing" year: this year's net liquid change is large vs the starting base
    // (e.g. a heavy deficit year drawing down savings) — pro-rating is less reliable.
    const swingRatio=jan1Liq>0?Math.abs(annualLiqGrowth)/jan1Liq:0;
    const bigSwing=!isDpYear&&swingRatio>0.5;
    const unreliable=isDpYear||bigSwing;
    // Plain-language summary
    const monthName=_now.toLocaleDateString('en-US',{month:'long'});
    let plainSummary;
    if(isDpYear){
      plainSummary=`${curYr} is your planned home-purchase year — the ${fmt(dp)} down payment lands as a one-time event, so a simple "on-pace" number isn't meaningful until the purchase clears. Use the tiles below to track liquid against the full-year plan.`;
    }else if(bigSwing){
      plainSummary=`${curYr} is a high-swing year (plan moves liquid by ${annualLiqGrowth>=0?'+':''}${fmt(annualLiqGrowth)}), so mid-year pace is approximate.`;
    }else{
      plainSummary=`You're <b style="color:${ahead?'var(--g)':'var(--r)'}">${fmt(Math.abs(totalDiff))} ${ahead?'ahead of':'behind'}</b> where your plan expected your liquid net worth to be by ${monthName} ${curYr}.`;
    }
    const syncDate=new Date(monarchSnapshot.syncedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    h+=`<div style="background:var(--a-soft);border:1px solid rgba(191,105,0,.25);border-radius:10px;padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--tx)">📍 Live Snapshot · Monarch</div>
          <div style="font-size:10px;color:var(--t2);margin-top:2px">As of ${syncDate} · vs. plan pace (${pctElapsed}% through ${curYr})</div>
        </div>
        ${unreliable?`<div style="background:var(--a-soft);border:1px solid rgba(191,105,0,.3);border-radius:6px;padding:6px 12px;text-align:center;max-width:130px">
          <div style="font-size:11px;font-weight:700;color:var(--a)">⚠ Pace N/A</div>
          <div style="font-size:8px;color:var(--t3);margin-top:2px">one-time event this year</div>
        </div>`:`<div style="background:${ahead?'var(--g-soft)':'var(--r-soft)'};border:1px solid ${ahead?'rgba(26,135,84,.2)':'rgba(205,61,100,.2)'};border-radius:6px;padding:6px 12px;text-align:center">
          <div style="font-size:11px;font-weight:700;color:${ahead?'var(--g)':'var(--r)'}">${ahead?'▲ Ahead':'▼ Behind'}</div>
          <div style="font-size:14px;font-weight:700;font-family:'SF Mono',monospace;color:${ahead?'var(--g)':'var(--r)'}">${ahead?'+':''}${fmt(totalDiff)}</div>
          <div style="font-size:8px;color:var(--t3)">liquid net worth</div>
        </div>`}
      </div>
      <div style="font-size:11px;line-height:1.5;color:var(--t2);margin-bottom:10px;padding:9px 11px;background:#fff8;border-radius:7px;border-left:3px solid ${unreliable?'var(--a)':ahead?'var(--g)':'var(--r)'}">${plainSummary}</div>
      <div style="font-size:9.5px;color:var(--t2);line-height:1.6;margin-bottom:10px;padding:8px 10px;background:#fff8;border-radius:6px">
        <div><b style="color:var(--tx)">How it's calculated</b></div>
        <div style="font-family:'SF Mono',monospace;font-size:9px;margin-top:4px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px">
          <span style="color:var(--t3)">Starting Liquid (slider)</span><span style="color:var(--tx);font-weight:600">${fmt(jan1Liq)}</span>

          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--r);margin-bottom:3px">Peak Year · ${peakTuRow.yr}</div>

let _compareDiffIdx=-1; // index into `scenarios` currently shown in the Compare tab's diff view; -1 = none
function setCompareDiff(idx){_compareDiffIdx=idx;render();}
function renderCompareTab(R,P){
  const ca=document.getElementById('chartArea');
  destroyCharts();
  if(scenarios.length===0){
    ca.innerHTML=`<div style="text-align:center;padding:50px 30px;color:var(--t2)">
      <div style="font-size:40px;margin-bottom:14px">⚖️</div>
      <div style="font-size:15px;font-weight:700;color:var(--tx);margin-bottom:8px">No scenarios to compare yet</div>

        <strong>🤖 AI Advisor</strong> in agentic mode — it can propose plan changes and save them here automatically.
      </p>
    </div>`;
    return;
  }
  const planRes=run(P);
  const cols=[
    {name:'Current Plan',params:P,res:planRes,color:'#0a2540',isCurrent:true},
    ...scenarios.map(s=>({name:s.name,params:s.params,res:run({...D,...migrateP(s.params)}),color:s.color,isCurrent:false}))
  ];
  const METRICS=[
    {label:'NW @ 2058 (ex-retirement)',get:(r,p)=>r.R[r.R.length-1].nw,fmt:fmt,b:1},
    {label:'401k @ 2058',get:(r,p)=>r.R[r.R.length-1].k401,fmt:fmt,b:1},
    {label:'Net worth @ 2058 (all)',get:(r,p)=>r.R[r.R.length-1].netWorth,fmt:fmt,b:1},
    {sep:true,label:'Risk'},
    {label:'Liquid Floor',get:(r,p)=>Math.min(...r.R.map(x=>x.liq)),fmt:fmt,b:1},
    {label:'Years Drawing On Savings',get:(r,p)=>r.drawYears,fmt:n=>n+' yrs',b:-1},
    {label:'Worst Year Net Flow',get:(r,p)=>Math.min(...r.R.map(x=>x.flow)),fmt:fmt,b:1},
    {sep:true,label:'Milestones'},
    {label:'Liquid After Home Purchase',get:(r,p)=>{const row=r.R.find(x=>x.yr===p.homePurchaseYear);return row?row.liq:0},fmt:fmt,b:1},
    {label:'Total Tuition',get:(r,p)=>r.tT,fmt:fmt,b:-1},
    {label:'Tax on Stock Sales',get:(r,p)=>r.tTx,fmt:fmt,b:-1},
    {sep:true,label:'Year 1'},
    {label:'Gross Income',get:(r,p)=>r.R[0].gross,fmt:fmt,b:0},
    {label:'Effective Tax Rate',get:(r,p)=>r.R[0].effRate,fmt:v=>(v*100).toFixed(1)+'%',b:-1},
    {label:'Net Take-Home',get:(r,p)=>r.R[0].inc,fmt:fmt,b:1},
  ];
  // ── Diff view: focused two-column deltas vs current plan for one selected scenario ──
  let diffHtml='';
  if(scenarios.length>0){
    const selOptions=scenarios.map((s,i)=>`<option value="${i}" ${i===_compareDiffIdx?'selected':''}>${advEscape(s.name)}</option>`).join('');
    diffHtml+=`<div class="glass-card" style="padding:14px 16px;margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:${_compareDiffIdx>=0?'10px':'0'}">
        <div style="font-size:12px;font-weight:700;color:var(--tx)">🔀 Diff view — Current Plan vs.</div>
        <select onchange="setCompareDiff(this.value===''?-1:parseInt(this.value))" style="font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-family:inherit">
          <option value="">Select a scenario…</option>
          ${selOptions}
        </select>
      </div>`;
    if(_compareDiffIdx>=0&&scenarios[_compareDiffIdx]){
      const s=scenarios[_compareDiffIdx];
      const sRes=run({...D,...migrateP(s.params)});
      diffHtml+=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr>
          <th style="text-align:left;padding:6px 8px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--bd)">Metric</th>
          <th style="text-align:right;padding:6px 10px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--bd)">Current</th>
          <th style="text-align:right;padding:6px 10px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${s.color};border-bottom:1px solid var(--bd)">${advEscape(s.name)}</th>
          <th style="text-align:right;padding:6px 10px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--bd)">Δ Change</th>
        </tr></thead><tbody>`;
      METRICS.forEach(m=>{
        if(m.sep){diffHtml+=`<tr><td colspan="4" style="padding:8px 8px 3px;font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);background:var(--s3)">${m.label}</td></tr>`;return;}
        const base=m.get(planRes,P),scen=m.get(sRes,s.params);
        const delta=scen-base;
        const pct=base!==0?delta/Math.abs(base)*100:null;
        const favorable=!m.b?null:(m.b===1?delta>0:delta<0);
        const dColor=delta===0?'var(--t3)':favorable===null?'var(--t2)':favorable?'var(--g)':'var(--r)';
        const dSign=delta>0?'+':'';
        diffHtml+=`<tr>
          <td style="padding:6px 8px;color:var(--t2);font-weight:500;border-bottom:1px solid var(--bd)">${m.label}</td>
          <td style="padding:6px 10px;text-align:right;font-family:'SF Mono',monospace;color:var(--tx);border-bottom:1px solid var(--bd)">${m.fmt(base)}</td>
          <td style="padding:6px 10px;text-align:right;font-family:'SF Mono',monospace;color:${s.color};font-weight:600;border-bottom:1px solid var(--bd)">${m.fmt(scen)}</td>
          <td style="padding:6px 10px;text-align:right;font-family:'SF Mono',monospace;font-weight:700;color:${dColor};border-bottom:1px solid var(--bd)">${dSign}${m.fmt(delta)}${pct!==null?` <span style="font-size:9px;opacity:.75">(${dSign}${Math.abs(pct).toFixed(1)}%)</span>`:''}</td>
        </tr>`;
      });
      diffHtml+=`</tbody></table></div>`;
    } else {
      diffHtml+=`<div style="font-size:11px;color:var(--t3);padding:6px 0">Pick a saved scenario above to see exactly what changes and by how much, metric by metric.</div>`;
    }
    diffHtml+=`</div>`;
  }
  const vals=METRICS.map(m=>m.sep?null:cols.map(c=>m.get(c.res,c.params)));
  const best=METRICS.map((m,mi)=>{
    if(m.sep||!m.b)return[];
    const v=vals[mi];
    const target=m.b===1?Math.max(...v):Math.min(...v);
    return v.map(x=>x===target?'best':'');
  });
  const worst=METRICS.map((m,mi)=>{
    if(m.sep||!m.b||cols.length<2)return[];
    const v=vals[mi];
    const target=m.b===1?Math.min(...v):Math.max(...v);
    return v.map(x=>x===target?'worst':'');
  });
  let h=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:10.5px">
  <thead><tr>
    <th style="text-align:left;padding:8px 10px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);border-bottom:2px solid var(--bd);position:sticky;left:0;background:var(--s2);min-width:160px;z-index:2">Metric</th>`;
  cols.forEach(c=>{
    h+=`<th style="padding:9px 14px;text-align:right;border-bottom:2px solid var(--bd);min-width:130px;background:var(--s2)">
      <div style="font-size:11px;font-weight:700;color:${c.color}">${advEscape(c.name)}</div>
      ${c.isCurrent?'<div style="font-size:8px;color:var(--t3);font-weight:400;margin-top:1px">live plan</div>':''}
    </th>`;
  });
  h+=`</tr></thead><tbody>`;
  METRICS.forEach((m,mi)=>{
    if(m.sep){
      h+=`<tr><td colspan="${cols.length+1}" style="padding:9px 10px 4px;font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--t3);background:var(--s3);border-bottom:1px solid var(--bd)">${m.label}</td></tr>`;
      return;
    }
    h+=`<tr>`;
    h+=`<td style="padding:7px 10px;color:var(--t2);font-weight:500;border-bottom:1px solid var(--bd);position:sticky;left:0;background:var(--s1);z-index:1">${m.label}</td>`;
    cols.forEach((c,ci)=>{
      const v=vals[mi][ci];
      const isBest=best[mi][ci]==='best';
      const isWorst=worst[mi][ci]==='worst';
      const bg=isBest?'rgba(26,135,84,.07)':isWorst?'rgba(205,61,100,.05)':'';
      const clr=isBest?'var(--g)':isWorst?'var(--r)':c.isCurrent?'var(--tx)':c.color;
      const badge=isBest?'<span style="font-size:7px;margin-left:3px;opacity:.7">▲best</span>':isWorst?'<span style="font-size:7px;margin-left:3px;opacity:.7">▼</span>':'';
      h+=`<td style="padding:7px 14px;text-align:right;border-bottom:1px solid var(--bd);font-family:'SF Mono',monospace;font-weight:${c.isCurrent?'700':'500'};background:${bg};color:${clr}">${m.fmt(v)}${badge}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  // Parameter diffs
  const PKEYS=['homePrice','downPctg','mortgageRate','homePurchaseYear','investReturn','startingLiquid','expenseInflation','nancyHourlyRate','nancyMaxClients','normCashY0','normStockY0','startingStripeEquity','stripePolicy','stripeLongTermReturn','normGrowth','pretax401k','numKids'];
  const PLABELS={childcareMonthly:'Childcare / month',homePrice:'Home Price',downPctg:'Down %',mortgageRate:'Mortgage Rate',homePurchaseYear:'Purchase Year',investReturn:'Return %',startingLiquid:'Starting Liquid',expenseInflation:'Exp Inflation',nancyHourlyRate:'Nancy $/hr',nancyMaxClients:'Nancy Max Clients',normCashY0:'Norm Cash (Y0)',normStockY0:'Stripe Grant (Y0)',startingStripeEquity:'Starting Stripe',stripePolicy:'Stripe Policy',stripeLongTermReturn:'Stripe LT Return',normGrowth:'Cash Growth',pretax401k:'401k Contrib',numKids:'# Kids'};
  const fmtPv=(k,v)=>{if(['investReturn','expenseInflation','normGrowth'].includes(k))return(v*100).toFixed(1)+'%';if(['homePrice','startingLiquid','normCashY0','normStockY0','startingStripeEquity','pretax401k'].includes(k))return fmt(v);
  if(k==='stripeLongTermReturn')return(v*100).toFixed(0)+'%';
  if(k==='stripePolicy')return String(v);if(k==='downPctg')return v+'%';if(k==='mortgageRate')return v+'%';return String(v)};
  const diffCols=cols.slice(1).filter(c=>PKEYS.some(k=>c.params[k]!==undefined&&c.params[k]!==P[k]));
  if(diffCols.length){
    h+=`<div style="margin-top:16px"><div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:8px">Parameter differences vs. current plan</div>`;
    h+=`<div style="display:flex;flex-direction:column;gap:5px">`;
    diffCols.forEach(c=>{
      const diffs=PKEYS.filter(k=>c.params[k]!==undefined&&c.params[k]!==P[k]);
      if(!diffs.length)return;
      h+=`<div style="background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:8px 11px">
        <div style="font-size:10.5px;font-weight:700;color:${c.color};margin-bottom:5px">${advEscape(c.name)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">`;
      diffs.forEach(k=>{h+=`<span style="font-size:9.5px;background:var(--s1);border:1px solid var(--bd);border-radius:4px;padding:2px 8px;white-space:nowrap"><span style="color:var(--t3)">${PLABELS[k]||k}: </span><span style="color:var(--t2);text-decoration:line-through">${fmtPv(k,P[k])}</span> <span style="color:${c.color};font-weight:600">→ ${fmtPv(k,c.params[k])}</span></span>`});
      h+=`</div></div>`;
    });
    h+=`</div></div>`;
  }
  ca.innerHTML=diffHtml+h;
  document.getElementById('summaries').innerHTML='';
}
const MORE_ACTIONS=[
  ['⬇','Download CSV','exportCSV()'],
  ['🖨','Print / save PDF','printPDF()'],

function toggleMoreMenu(e){
  if(e)e.stopPropagation();
  const m=document.getElementById('moreMenu'),b=document.getElementById('moreBtn');
  if(!m||!b)return;
  if(!m.hidden){closeMoreMenu();return}
  m.innerHTML=MORE_ACTIONS.map(([ic,lb,fn])=>
    `<button onclick="closeMoreMenu();${fn}" style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border:none;border-radius:6px;background:none;color:var(--tx);font-family:inherit;font-size:11px;cursor:pointer" onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background='none'"><span style="width:14px">${ic}</span>${lb}</button>`).join('');
  const r=b.getBoundingClientRect();
  m.style.top=(r.bottom+window.scrollY+6)+'px';
  // Right-align to the button, clamped so it can't run off a narrow screen.
  m.style.left=Math.max(8,Math.min(r.right-186,window.innerWidth-194))+'px';
  m.hidden=false;b.setAttribute('aria-expanded','true');
}
function closeMoreMenu(){
  const m=document.getElementById('moreMenu'),b=document.getElementById('moreBtn');
  if(m)m.hidden=true;
  if(b)b.setAttribute('aria-expanded','false');
}
document.addEventListener('click',e=>{
  const m=document.getElementById('moreMenu');

// ── The rail, alive ─────────────────────────────────────────────────────────
// Six nav items and then an empty column. Ambient state is what makes something feel
// like an instrument panel rather than a website, so the rail now carries the three
// things worth knowing without changing screens: what needs you, how fresh the numbers
// are, and the shape of the curve.
//
// Every figure here is read from state that already exists. Nothing is computed twice,
// and nothing is invented — when the watchlist has not loaded the badge stays hidden
// rather than showing a reassuring zero.
function renderNavLive(){
  const badge=document.getElementById('navAlertBadge');
  if(badge){
    const open=_inbox&&_inbox.counts?Number(_inbox.counts.open)||0:null;
    // A zero badge and an absent badge look the same to a reader, so only a real count
    // is ever drawn. An unloaded watchlist shows nothing at all.
    if(open){badge.hidden=false;badge.textContent=open;
      badge.setAttribute('aria-label',`${open} item${open===1?'':'s'} need your attention`);}
    else badge.hidden=true;
  }

  const rail=document.getElementById('navLive');
  if(!rail)return;
  let R;
  try{R=run(P).R}catch(e){rail.hidden=true;return}
  if(!R||!R.length){rail.hidden=true;return}

  // Freshness. The dot states which of three things is true, and the text never claims
  // more than the dot: connected and current, connected and stale, or not connected.
  const asOf=_ovw&&_ovw.asOf?new Date(_ovw.asOf):null;
  const dated=asOf&&Number.isFinite(asOf.getTime());
  const days=dated?Math.round((Date.now()-asOf.getTime())/86400000):null;
  const tone=!dated?'missing':days>7?'stale':'fresh';
  const freshness=!dated?'Accounts not connected'
    :days<=0?'Balances read today'
    :`Balances ${days} day${days===1?'':'s'} old`;

  // The curve, at the size it can honestly be read: shape only, no axis, no figures.
  const series=R.map(r=>r.netWorth);
  const lo=Math.min(...series),hi=Math.max(...series),span=(hi-lo)||1;
  const pts=series.map((v,i)=>
    `${(i/(series.length-1)*100).toFixed(1)},${(26-(v-lo)/span*24).toFixed(1)}`).join(' ');

  rail.hidden=false;
  rail.innerHTML=`
    <div class="nav-fresh" data-tone="${tone}"><span></span>${advEscape(freshness)}</div>
    <button class="nav-spark" onclick="setTab('cockpit')" aria-label="Projected wealth through ${R[R.length-1].yr}. Open the cockpit.">
      <svg viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span>${R[0].yr}<i>${UI.money(series[series.length-1])} by ${R[R.length-1].yr}</i></span>
    </button>`;
}
