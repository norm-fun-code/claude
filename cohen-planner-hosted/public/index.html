function budgetTuitionHtml(R,P){
  const act=R.filter(r=>r.tu>0);
  if(!act.length)return '';
  const first=act[0],last=act[act.length-1],peak=act.reduce((a,b)=>b.tu>a.tu?b:a);
  const total=act.reduce((t,r)=>t+r.tu,0),span=last.yr-first.yr+1;
  const births=[P.kid1Birth,P.kid2Birth,P.kid3Birth,P.kid4Birth].slice(0,P.numKids);
  const wins=births.map((b,i)=>({n:i+1,from:b+(i===0?P.kid1YeshivaStartAge:P.yeshivaStartAge),to:b+P.yeshivaEndAge}));
  const both=wins.length>=2?Math.max(0,Math.min(...wins.map(w=>w.to))-Math.max(...wins.map(w=>w.from))+1):0;
  const tile=(k,v,sub,col)=>`<div class="ps-tile"><span>${k}</span><strong style="${col?`color:${col}`:''}">${v}</strong><small>${sub}</small></div>`;
  return `<section class="cp-card bd-tuition"><div class="ps-head"><div><h3>Why the plan draws down: tuition</h3>
    <p>${first.yr}–${last.yr}, ${span} years, ${fmt(total)} in all (inflated). Heaviest in ${peak.yr}, when it is ${fmt(peak.tu)} against ${fmt(peak.liq)} of liquid assets.</p></div></div>
    <div class="bd-load" role="img" aria-label="Tuition each year">${R.map(r=>{
      const inSchool=wins.filter(w=>r.yr>=w.from&&r.yr<=w.to).length;
      return `<div title="${r.yr}: ${fmt(r.tu)}${inSchool?` · ${inSchool} in school`:''}" class="${inSchool>=2?'two':''}"><i style="height:${peak.tu>0?(r.tu/peak.tu*100).toFixed(1):0}%"></i></div>`}).join('')}</div>
    <div class="spend-caption" style="display:flex;justify-content:space-between;margin:4px 0 12px"><span>${R[0].yr}</span><span>${R[R.length-1].yr}</span></div>
    <div class="ps-tiles">${tile('First tuition',String(first.yr),`${fmt(first.tu)} that year`)}${tile('Peak',String(peak.yr),fmt(peak.tu),'var(--r)')}${tile('Average',fmt(Math.round(total/act.length)),`over ${act.length} years`)}
      ${wins.map(w=>tile(`Kid ${w.n}`,`${w.from}–${w.to}`,`${w.to-w.from+1} years in school`)).join('')}${both?tile('Both in school',`${both} yr${both===1?'':'s'}`,'the heaviest stretch','var(--a)'):''}</div>
  </section>`;
}

       +(shared?'<span class="bd-tag shared" title="The same in every scenario">Shared</span>':'')+(chk?`<span class="bd-tag chk ${chk.status}" title="${advEscape(chk.text)}">${chk.status==='low'?'Light':'High'} for the household</span>`:'');
    const added=(row.livAdds||{})[k]||0;
    const m=modelParts[k],differs=(src==='rule'||src==='pin')&&m!=null&&Math.abs(m-value)>=1;
    const seg=src==='rule'?budgetSegment(P,k,yr):null;
    // A line the model worked out says nothing: thirteen copies of the same sentence is noise, and
    // only a line someone changed has anything to explain.
    const why=src==='rule'?B.describe(P,k,yr,fmtF):src==='pin'?`Set for ${yr} only`:'';
    const inputHtml=o.readonly
      ?`<strong class="bd-fixed">${amt(value)}<small>${unitWord}</small></strong>`
      :`<span class="bd-edit"><input class="bd-input" id="bd_${k}" type="text" inputmode="decimal" value="${amt(value)}" aria-label="${advEscape(label)}, ${yr}, ${mo?'per month':'per year'}" onfocus="this.select()" onchange="budgetCommit('${k}',this.value)" onkeydown="if(event.key==='Enter')this.blur()"><small>${unitWord}</small></span>`;
    const open=o.readonly&&_budgetEdit===k;
    const actions=o.readonly?`<button type="button" class="bd-link" onclick="budgetEdit('${k}')" aria-expanded="${open}">${open?'Close':'Edit'}</button>${k==='housing'?`<button type="button" class="bd-link" onclick="budgetGo('housing')">Rent or buy →</button>`:''}`
      :`${seg&&seg.kind==='pct'?`<button type="button" class="bd-link" onclick="budgetTie('${k}',false)">Fix in dollars</button>`:(commonHousehold(P)?'':`<button type="button" class="bd-link" onclick="budgetTie('${k}',true)">Tie to income</button>`)}${src!=='model'?`<button type="button" class="bd-link" onclick="budgetReset('${k}')">Reset</button>`:''}`;
    return `<div class="bd-row" style="--tier:${o.color}">
      <div class="cl-top"><span class="cl-name">${advEscape(label)}${tag}</span>${inputHtml}</div>
      <div class="cl-track"><i style="width:${Math.max(1.5,(o.max>0?value/o.max:0)*100).toFixed(1)}%"></i></div>
      <div class="cl-sub"><span>${pct(value)} of ${basisWord} income</span>${why?`<span class="bd-why">${advEscape(why)}</span>`:''}${differs?`<span class="bd-model">model says ${amt(m)}${unitWord}</span>`:''}${added?`<span class="bd-model">includes ${amt(added)}${unitWord} from plan items</span>`:''}${chk?`<span class="bd-why">${advEscape(chk.text)}</span>`:''}<span class="bd-actions${o.readonly?' show':''}">${actions}</span></div></div>${open?`<div class="bd-panel" style="--tier:${o.color}"><div class="bd-panel-head"><strong>${advEscape(label)}${k==='housing'?' — how the home is set':''}</strong><button type="button" class="bd-link" onclick="budgetEdit('${k}')">Close</button></div>${embedControls(k==='housing'?'home':k)}</div>`:''}`;
  };
  const living=row.livFullParts||{};
  const c=IS.compute(row,'net');
  const maxLine=Math.max(...Object.values(living),row.hFull,row.ccFull,row.tuFull,1);
  const fixedExtra=[
    ['housing','Housing',row.hFull,{}],
    ['childcare','Childcare',row.ccFull,{}],
    ['tuition','Tuition',row.tuFull,{}],
  ];
  // The four buckets. Fixed costs, saving goals and guilt-free are lines you set; investing is what the
  // plan does with what is left, so it is shown, with its numbers, but not edited.
  const alloc=B.allocation(P,R,yr);
  const lineOf=(k,lbl,v,src,ro)=>line(k,lbl,v,src,{readonly:!!ro,shareKey:ro?k:undefined,color:RM_COLOR[B.bucketOf(k)],max:maxLine});
  const bucketRows=key=>{
    const b=B.BUCKETS.find(x=>x.key===key);
    if(key==='investing')return '';
    const ro=key==='fixed'?fixedExtra.filter(x=>x[2]>0||x[0]==='housing').map(x=>lineOf(x[0],x[1],x[2],'model',true)):[];
    const ks=Object.keys(living).filter(k=>B.bucketOf(k)===key&&!['housing','childcare','tuition'].includes(k)).sort((a,b2)=>living[b2]-living[a]);
    return ro.join('')+ks.map(k=>lineOf(k,LIV_LABEL[k]||k,living[k],(row.livSrc||{})[k]||'model',false)).join('');
  };
  const spendIn=key=>{
    const b=B.BUCKETS.find(x=>x.key===key);
    return b.lines.reduce((t,k)=>t+(k==='housing'?row.hFull:k==='childcare'?row.ccFull:k==='tuition'?row.tuFull:(living[k]||0)),0)
      +(key==='guilt'?Object.keys(living).filter(k=>B.bucketOf(k)==='guilt'&&!b.lines.includes(k)).reduce((t,k)=>t+living[k],0):0);
  };
  const investRows=()=>{
    const it=(label,v,sub)=>`<div class="bd-row" style="--tier:${RM_COLOR.investing}"><div class="cl-top"><span class="cl-name">${label}</span><strong class="bd-fixed">${amt(v)}<small>${unitWord}</small></strong></div><div class="cl-sub"><span>${pct(v)} of ${basisWord} income</span><span class="bd-why">${sub}</span></div></div>`;
    if(alloc.deficit>0)return `<div class="bd-row"><div class="cl-top"><span class="cl-name">Drawing down</span><strong class="bd-fixed" style="color:var(--a)">−${amt(alloc.deficit)}<small>${unitWord}</small></strong></div><div class="cl-sub"><span class="bd-why">${yr} spends more than it takes in. The shortfall is met by selling Stripe shares${alloc.drawn.stripe?` (${fmt(alloc.drawn.stripe)} here)`:''} and drawing on the portfolio — nothing is added to investments.</span></div></div>`;
    return it('Stripe shares kept',alloc.investing.stripe,'Vested shares the plan does not need to sell')+it('Added to the portfolio',alloc.investing.portfolio,alloc.saving.reserve?'After the cash reserve is topped up':'Left over after everything above')
      +`<p class="spend-caption" style="margin:4px 0 0">Plus <strong style="color:var(--t2)">${fmtF(Math.round(alloc.investing.k401/(mo?12:1)))}${unitWord}</strong> into your 401(k), taken from pay before it counts as net income.</p>`;
  };
  const bucketGroups=B.BUCKETS.map(b=>{
    const spent=b.key==='investing'?alloc.investing.total:spendIn(b.key)+(b.key==='saving'?alloc.saving.reserve:0);
    const share=den>0?spent/den:0;
    // The ruler: Ramit's range as a band, and where this year sits against it. Only meaningful against
    // take-home pay, so it is drawn for net income and not for gross.
    const scale=0.75;
    const ruler=basis==='net'?`<div class="bd-ruler" title="Ramit's range for ${advEscape(b.label.toLowerCase())}: ${Math.round(b.range[0]*100)}${b.range[0]===b.range[1]?'':'–'+Math.round(b.range[1]*100)}% of take-home"><i class="band" style="left:${(b.range[0]/scale*100).toFixed(1)}%;width:${Math.max(1.5,(b.range[1]-b.range[0])/scale*100).toFixed(1)}%"></i><i class="mark" style="left:${Math.min(100,share/scale*100).toFixed(1)}%"></i></div>`:'';
    const rows=b.key==='investing'?investRows():bucketRows(b.key)+(b.key==='saving'&&alloc.saving.reserve>0?`<div class="bd-row" style="--tier:${RM_COLOR.saving}"><div class="cl-top"><span class="cl-name">Cash reserve top-up</span><strong class="bd-fixed">${amt(alloc.saving.reserve)}<small>${unitWord}</small></strong></div><div class="cl-sub"><span class="bd-why">The reserve is below its ${fmt(alloc.reserveFloor)} floor, so surplus refills it before anything is invested</span></div></div>`:'');
    return `<div class="cl-group" style="--tier:${RM_COLOR[b.key]}"><div class="cl-ghead"><span><i></i>${advEscape(b.label)}</span><span class="cl-gtot">${_lensPct(share)} <small>${amtShort(spent)}${unitWord}</small></span></div>
      <p class="cl-gnote">${advEscape(b.note)}${basis==='net'?` · Ramit: ${Math.round(b.range[0]*100)}${b.range[0]===b.range[1]?'':'–'+Math.round(b.range[1]*100)}% of take-home`:''}</p>${ruler}<div class="cl-list">${rows}</div></div>`;
  }).join('');
  const groups=bucketGroups;
  // One-off costs have a home here whether or not this year has one: a single year's cost, not
  // repeated and not inflated, set for any year of the first eleven.
  const oneOff=`<div class="cl-group" style="--tier:${PS_COLOR.oneoff}"><div class="cl-ghead"><span><i></i>One-off costs</span><span class="cl-gtot">${row.eAdj?`${pct(Math.abs(row.eAdj))} <small>${row.eAdj<0?'−':''}${amtShort(Math.abs(row.eAdj))}${unitWord}</small>`:'<small>none in '+yr+'</small>'}</span></div>
    <div class="bd-oneoff">${embedControls('oneOff')}</div></div>`;
  const baselines=`<details class="polish-fold refine-fold"><summary>Baselines the model starts from</summary><div>
    <p class="spend-caption" style="margin:0 0 10px">The yearly figure each line starts from in the plan's first year, before children, inflation and any rule or pin above. Changing one moves the model's own figure and keeps its growth; a rule above replaces a line outright.</p>
    ${embedControls('baselines')}</div></details>`;
  const undo=_budgetUndo?`<div class="bd-undo" role="status"><span>${advEscape(_budgetUndo.label)}${_budgetUndo.notes.map(n=>` · your ${n.years.join(', ')} ${n.kind==='later-rule'?'change':'pin'}${n.years.length>1?'s':''} still apply${n.years.length>1?'':'s'}`).join('')}</span><button type="button" onclick="budgetUndoLast()">Undo</button></div>`:'';
  h+=`<section class="cp-card bd-lines"><div class="ps-head"><div><h3>${yr} · line by line</h3><p>Type a dollar figure or a percentage over any line. A percentage is worked out against ${yr}'s ${basisWord} income and then held as dollars — or tie it to income and it follows income every year.</p></div>
      <div class="ps-controls"><div class="spend-scope" role="group" aria-label="Edits apply to">${chip(_budgetScope==='onward',"budgetScope('onward')",`From ${yr} on`)}${chip(_budgetScope==='year',"budgetScope('year')",`${yr} only`)}</div>
        <div class="spend-scope" role="group" aria-label="Share of">${chip(basis==='net',"planShareBasis('net')",'Net')}${chip(basis==='gross',"planShareBasis('gross')",'Gross')}</div></div></div>
    ${undo}${groups}${oneOff}${baselines}
    ${(P.planItems||[]).length?`<div class="cl-group" style="--tier:${PS_COLOR.oneoff}"><div class="cl-ghead"><span><i></i>Plan items you've added</span></div>
      ${(P.planItems||[]).map((it,i)=>`<div class="bd-item"><div><strong>${advEscape(it.label)}</strong><small>${it.category==='oneoff'?'One-off':advEscape(LIV_LABEL[it.category]||it.category)} · ${it.from===it.to?it.from:it.from+'–'+it.to}${it.grow===false?'':' · grows with inflation'}</small></div>
        <label class="bd-sug-amt"><span class="ui-sr">Amount</span><input type="text" inputmode="decimal" value="${fmtF(it.amount)}" aria-label="${advEscape(it.label)} amount" onfocus="this.select()" onchange="budgetItemAmount(${i},this.value)" onkeydown="if(event.key==='Enter')this.blur()"><small>${it.from===it.to?'once':'/yr'}</small></label>
        <button type="button" class="bd-btn" onclick="budgetRemoveItem(${i})" aria-label="Remove ${advEscape(it.label)}">Remove</button></div>`).join('')}</div>`:''}
    <p class="spend-caption">Net income includes Stripe stock at its vest value; it is after tax, 401(k) and benefits. A rule replaces a line's whole figure, including each child's share, and "model says" shows what the plan would have used. Charity still feeds the tax deduction at its baseline.</p></section></div>`;
  ca.innerHTML=h;
  document.getElementById('summaries').innerHTML='';
}

function renderSpendingTab(R,P){
  let spendingViz=null;
  const ca=document.getElementById('chartArea');
  destroyCharts();
  if(_spend===null&&!_spendLoading){loadSpending();}
  const st=_syncStatus||{},d=_spend||{};
  const running=!!st.running;
  const money=v=>fmt(Math.round(v||0));
  const exact=v=>fmtF(Math.round(v||0));

  let h=`<div style="display:flex;flex-direction:column;gap:14px;padding:2px" class="spending-workspace">`;

  h+=paceCard(d.pace);

  // ── Freshness and coverage, before any number that depends on them ──
  const nTx=st.transactions||0;
  const syncCard=`<div class="glass-card" style="padding:14px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--tx)">💳 Spending & cash flow</div>
        <div style="font-size:10px;color:var(--t2);margin-top:3px">
          ${nTx?`${nTx.toLocaleString()} transactions · ${st.firstDate||'—'} → ${st.lastDate||'—'}${st.pending?` · ${st.pending} still pending`:''}`
               :'No transaction history imported yet.'}
          ${st.lastSyncAt?` · synced ${PlannerTime.formatTime(st.lastSyncAt)}`:''}
        </div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${running?`<span style="font-size:10px;color:var(--a);padding:5px 9px">⏳ Importing… ${(st.monthsImported||[]).length} months done</span>`
          :`<label class="polish-import">History <select id="spendImportMonths" aria-label="Months of history to import"><option value="12">12 months</option><option value="24">24 months</option><option value="36">36 months</option></select></label><button class="ui-btn" onclick="startBackfill(Number(document.getElementById('spendImportMonths').value))">Import</button>
             ${nTx?`<button onclick="runIncremental()" style="font-size:9.5px;padding:5px 10px;border-radius:5px;border:none;background:var(--accent);color:#fff;font-family:inherit;cursor:pointer">↻ Catch up</button>`:''}`}
      </div>
    </div>
    ${st.lastError?`<div style="margin-top:9px;font-size:10px;color:var(--r);background:rgba(205,61,100,.06);border-radius:6px;padding:7px 9px">Last import stopped at ${advEscape(st.lastError.window||'')}: ${advEscape(st.lastError.message||'')}. Everything imported before that point was kept.</div>`:''}
  </div>`;
  // Plumbing, not insight: with history imported it sits in the Data fold at the bottom. Until then
  // it leads, because it is the thing to do.
  if(!(st.transactions||0)||d.error)h+=syncCard;

  if(d.error){
    h+=`<div class="glass-card" style="padding:18px;text-align:center">
      <div style="font-size:12px;color:var(--tx);margin-bottom:5px">Spending data unavailable</div>
      <div style="font-size:10.5px;color:var(--t2);margin-bottom:10px">${advEscape(d.error)}</div>
      <button onclick="openMonarchDiagnostics()" style="font-size:10px;padding:6px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);font-family:inherit;cursor:pointer">🩺 Diagnose connection</button>
    </div></div>`;
    h+=renderIncomeLens(R,null);
    ca.innerHTML=h;document.getElementById('summaries').innerHTML='';return;
  }
  if(!nTx){
    h+=`<div class="glass-card" style="padding:26px;text-align:center">
      <div style="font-size:13px;font-weight:600;color:var(--tx);margin-bottom:6px">Import your history to begin</div>
      <div style="font-size:11px;color:var(--t2);line-height:1.6;max-width:520px;margin:0 auto">Transactions are read through the same Monarch connection your balances use. Nothing is written back — the import is read-only, and your own categorisations are never overwritten by a later sync.</div>
    </div></div>`;
    h+=renderIncomeLens(R,null);
    ca.innerHTML=h;document.getElementById('summaries').innerHTML='';return;
  }

  const months=d.months||[],cov=d.coverage||{},tot=d.totals||{},cnt=d.counts||{};
  const asOf=d.endDate||PlannerTime.day();
  const completeAll=months.filter(m=>m.month<asOf.slice(0,7));
  // The donut answers "where does it go", and that question has a period attached to it —
  // twelve months and last March are different questions with different answers. The month in
  // progress stays out of every scope: a category two-thirds through its month reads as a
  // fall that has not happened.
  const complete=spendScopeMonths(completeAll,asOf,months);
  // Year-to-date is the one scope that carries the month in progress. Everything measured
  // per-month or compared against a prior period works off the closed months inside the scope,
  // so a fortnight of September never stands in for a whole month on either side of a trend.
  const closedScoped=complete.filter(m=>m.month<asOf.slice(0,7));
  const partialInScope=complete.length!==closedScoped.length;
  const verifiedCount=(cov.completeMonths||[]).length;
  const closedTotal=complete.reduce((n,m)=>n+(m.expense||0),0);

  // ── What the ledger actually contained ──
  // This is the check that spending is not being double counted, shown rather than asserted:
  // transfers and card payments are large and they are deliberately not in the expense total.
  const bucket=(lbl,v,n,col,note)=>`<div class="kpi" style="border-color:var(--bd)">
    <div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:3px">${lbl}</div>
    <div style="font-size:16px;font-weight:800;font-family:'SF Mono',monospace;color:${col};letter-spacing:-.4px">${money(v)}</div>
    <div style="font-size:8.5px;color:var(--t3);margin-top:2px">${n||0} rows${note?' · '+note:''}</div></div>`;
  const classificationDetails=`<details class="polish-fold refine-fold"><summary>Transaction classification & exclusions</summary><div>
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:7px">How the ledger classified — ${cov.first||'—'} to ${cov.last||'—'}</div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      ${bucket('Spending',tot.expense,cnt.expense,'var(--tx)','net of refunds')}
      ${bucket('Income',tot.income,cnt.income,'var(--g)')}
      ${bucket('Transfers',tot.transfer,cnt.transfer,'var(--t3)','not spending')}
      ${bucket('Card payments',tot.cardPayment,cnt.cardPayment,'var(--t3)','not spending')}
      ${bucket('Investments',tot.investment,cnt.investment,'#6772e5','saved, not spent')}
      ${bucket('Refunds',tot.refund,cnt.refund,'var(--a)','netted into categories')}
      ${tot.hidden?bucket('Hidden in Monarch',tot.hidden,null,'var(--t3)','excluded there, so excluded here'):''}
      ${tot.splitParents?bucket('Split parents',tot.splitParents,null,'var(--a)','children counted instead'):''}
    </div>
    <div style="font-size:9.5px;color:var(--t3);margin-top:7px;line-height:1.5">Transfers and card payments are excluded from spending on purpose — moving money between your own accounts is not consumption, and the purchases a card payment settles are already counted.${tot.splitParents?` Split parents hold ${money(tot.splitParents)} that is counted through their children instead — if a category reads low against Monarch, this is the figure to check.`:''}${tot.hidden?` ${money(tot.hidden)} is hidden from reports in Monarch, so it is out here too.`:''}</div>
  </div></details>`;

  // ── Rolling averages, only where coverage permits ──
  const roll=d.rolling||{};
  const rollCard=(lbl,v,n)=>{const verified=v!=null;v=v??PlannerSpending.observedAverage(months,n,asOf);return `<div class="kpi"><div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:3px">${lbl}</div>
    <div style="font-size:16px;font-weight:800;font-family:'SF Mono',monospace;color:${v==null?'var(--t3)':'var(--tx)'};letter-spacing:-.4px">${v==null?'—':fmtF(Math.round(v))}</div>
    <div style="font-size:8.5px;color:var(--t3);margin-top:2px">${v==null?`needs ${n} consecutive months of records`:verified?'Per month · verified history':'Per month · imported records; coverage unverified'}</div></div>`;};
  h+=`<div>
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:7px">Average monthly spending</div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      ${rollCard('Rolling 3-month',roll.m3,3)}${rollCard('Rolling 6-month',roll.m6,6)}${rollCard('Rolling 12-month',roll.m12,12)}
    </div>
    <div style="font-size:9.5px;color:var(--t3);margin-top:7px">${completeAll.length} past month${completeAll.length===1?'':'s'} with records · ${verifiedCount} verified full months${cov.partial?` · ${cov.partial} is ${Math.round((cov.fractionElapsed||0)*100)}% elapsed and excluded from every average`:''}.</div>
  </div>`;

  // ── Where the money goes ──
  // Aggregated across COMPLETE months only. The month in progress is excluded, because a
  // category two-thirds through its month reads as a fall that has not happened.
  {
    const agg=new Map();
    for(const m of complete){
      for(const c of (m.categories||[])){
        if(!agg.has(c.id))agg.set(c.id,{id:c.id,name:c.name,net:0,gross:0,refunds:0,count:0,months:new Set()});
        const a=agg.get(c.id);
        a.net+=c.net;a.gross+=c.gross;a.refunds+=c.refunds;a.count+=c.count;a.months.add(m.month);
      }
    }
    // Per-month divides by months ELAPSED, not months listed: counting a month that is 53%
    // through as a whole one would report a run rate about half again too low.
    //
    // Except when the scope IS one month. Dividing a part-month by the share of it that has
    // passed answers "at this pace, the whole month" — the right answer for a year-to-date
    // average and the wrong one here, where the reader asked what September has cost and
    // would be shown a figure September has not spent.
    const singleMonth=_spendScope.kind==='month'&&complete.length===1;
    const n=singleMonth?1:((closedScoped.length+(partialInScope?(Number(cov.fractionElapsed)||1):0))||1);
    // Trend compares the most recent three complete months against the three before them.
    // With fewer than six there is nothing to compare, so no trend is claimed at all.
    const recent=closedScoped.slice(-3),prior=closedScoped.slice(-6,-3);
    const sumFor=(months,id)=>months.reduce((s,m)=>s+((m.categories||[]).find(c=>c.id===id)?.net||0),0);
    const canTrend=closedScoped.length>=6&&PlannerSpending.observedAverage(months,6,asOf)!=null;
    const rows=[...agg.values()].map(a=>{
      const perMonth=a.net/n;
      let trend=null;
      if(canTrend){
        const r=sumFor(recent,a.id)/3,pr=sumFor(prior,a.id)/3;
        if(pr>0||r>0)trend={recent:r,prior:pr,delta:r-pr,pct:pr>0?(r-pr)/pr:null};
      }
      return{...a,perMonth,share:closedTotal>0?a.net/closedTotal:0,trend};
    }).sort((x,y)=>y.net-x.net);
    const shown=rows.slice(0,16),rest=rows.slice(16);
    const restNet=rest.reduce((s,r)=>s+r.net,0);
    spendingViz={rows,months,asOf,verified:cov.completeMonths||[],driftWindow:_spendDriftWindow};
    // The control sits with the chart it changes. Ranges wider than the history are hidden
    // rather than shown selected-but-identical, which would imply a longer view exists.
    const scopeChip=(kind,value,label,on)=>`<button class="spend-scope-chip${on?' is-on':''}" aria-pressed="${on}" onclick="setSpendScope('${kind}',${value==null?'null':`'${value}'`})">${label}</button>`;
    const ranges=[3,6,12].filter(n=>n<=completeAll.length);
    const thisYear=spendCurrentYear(asOf);
    const closedThisYear=completeAll.filter(m=>String(m.month).slice(0,4)===thisYear).length;
    // With nothing recorded this year the YTD scope has nothing to show and falls back to
    // everything — so the chip is hidden and All is the one lit, rather than a default with no
    // chip pressed at all.
    const hasYtd=closedThisYear>0||months.some(m=>String(m.month).slice(0,4)===thisYear);
    // Every year the records touch, newest first. The CURRENT year is left out of the list:
    // "2026" and "YTD" would be the same set of closed months while 2026 is still running, and
    // two controls for one answer is worse than one.
    const years=[...new Set(completeAll.map(m=>String(m.month).slice(0,4)))]
      .filter(y=>y!==thisYear).sort().reverse();
    const scopeControl=`<div class="spend-scope" role="group" aria-label="Period for this breakdown">
      ${ranges.map(n=>scopeChip('recent',n,`${n}M`,_spendScope.kind==='recent'&&Number(_spendScope.months)===n)).join('')}
      ${hasYtd?scopeChip('ytd',null,'YTD',_spendScope.kind==='ytd'):''}
      ${scopeChip('all',null,'All',_spendScope.kind==='all'||(!hasYtd&&_spendScope.kind==='ytd'))}
      <label class="spend-scope-month"><span class="ui-sr">A year or a single month</span>
        <select onchange="setSpendScopeFromSelect(this.value)">
          <option value="">Pick a period…</option>
          ${years.length?`<optgroup label="Full year">${years.map(y=>`<option value="year:${y}"${_spendScope.kind==='year'&&String(_spendScope.year)===y?' selected':''}>${y}</option>`).join('')}</optgroup>`:''}
          <optgroup label="Single month">${months.slice().reverse().map(m=>`<option value="month:${m.month}"${_spendScope.kind==='month'&&_spendScope.month===m.month?' selected':''}>${advEscape(monthLabel(m.month))}${m.month===asOf.slice(0,7)?' · in progress':''}</option>`).join('')}</optgroup>
        </select>
      </label>
    </div>`;
    const driftWords={3:'three',6:'six',12:'twelve'},driftWord=driftWords[_spendDriftWindow];
    const driftCaption=_spendDriftWindow===3
      ?'Each point averages three months, so recent changes show quickly. Read a move as an early signal: one unusual quarter can still bend the line.'
      :_spendDriftWindow===6
        ?'Each point averages six months, balancing recent movement with enough history to soften a single unusual month.'
        :'Each point averages twelve months, so one unusual month barely moves it. This is the steadiest view of the long-term run rate.';
    const driftToggle=`<div class="spend-scope spend-drift-scope" role="group" aria-label="Averaging window for run-rate drift">
      ${[3,6,12].map(n=>`<button class="spend-scope-chip${_spendDriftWindow===n?' is-on':''}" aria-pressed="${_spendDriftWindow===n}" onclick="setSpendDriftWindow(${n})">${n}M</button>`).join('')}
    </div>`;
    const scopeNote=`Imported records for ${advEscape(spendScopeLabel(completeAll,asOf,months))}${singleMonth?'':partialInScope?' · per-month figures divide by months elapsed':(cov.partial&&!['month','year'].includes(_spendScope.kind))?' · current month excluded':''}`;


    const detailsHtml=`<details class="spend-details"><summary>Exact amounts & refunds</summary>
      <div style="font-size:10px;color:var(--t2);margin-bottom:10px">${singleMonth?`${advEscape(monthLabel(complete[0].month))} alone, net of refunds${partialInScope?` — still running, ${Math.round((Number(cov.fractionElapsed)||1)*100)}% elapsed, so these are the totals so far rather than a whole month`:''}.`:`${closedScoped.length} past month${closedScoped.length===1?'':'s'} with imported records, net of refunds${partialInScope?` · plus ${advEscape(monthLabel(cov.partial||asOf.slice(0,7)))} in progress, counted as ${Math.round((Number(cov.fractionElapsed)||1)*100)}% of a month`:cov.partial?` · ${cov.partial} excluded as partial`:''}.`} ${canTrend?'Trend compares the last 3 months with the 3 before; unverified coverage can affect the comparison.':'Six consecutive months of records are needed for a trend.'}</div>
      ${rows.length?`<div class="tw" style="max-height:none"><table style="font-size:11px">
        <thead><tr><th style="text-align:left">Category</th><th>Per month</th><th>Total</th><th>Share</th>${canTrend?'<th>Trend</th>':''}<th>Rows</th></tr></thead>
        <tbody>${shown.map(r=>{
          const t=r.trend;
          const up=t&&t.delta>0;
          const sig=t&&Math.abs(t.delta)>=Math.max(150,r.perMonth*0.15); // material, not noise
          return `<tr>
            <td style="text-align:left;font-weight:600;color:var(--tx)">${advEscape(r.name)}${r.refunds>0?` <span style="font-size:8.5px;color:var(--a)">−${fmtF(Math.round(r.refunds))} refunded</span>`:''}</td>
            <td style="font-family:'SF Mono',monospace">${fmtF(Math.round(r.perMonth))}</td>
            <td style="font-family:'SF Mono',monospace;color:var(--t2)">${fmtF(Math.round(r.net))}</td>
            <td style="color:var(--t2)">${(r.share*100).toFixed(1)}%</td>
            ${canTrend?`<td style="font-family:'SF Mono',monospace;color:${!sig?'var(--t3)':up?'var(--r)':'var(--g)'}">${t?`${t.delta>=0?'+':'−'}${fmtF(Math.round(Math.abs(t.delta)))}`:'—'}${sig?'':''}</td>`:''}
            <td style="color:var(--t3)">${r.count}</td></tr>`}).join('')}
          ${rest.length?`<tr><td style="text-align:left;color:var(--t3)">${rest.length} smaller categories</td>
            <td style="font-family:'SF Mono',monospace;color:var(--t3)">${fmtF(Math.round(restNet/n))}</td>
            <td style="font-family:'SF Mono',monospace;color:var(--t3)">${fmtF(Math.round(restNet))}</td>
            <td style="color:var(--t3)">${closedTotal>0?(restNet/closedTotal*100).toFixed(1):'0'}%</td>${canTrend?'<td></td>':''}<td></td></tr>`:''}
        </tbody></table></div>
        <div style="font-size:9.5px;color:var(--t3);margin-top:8px;line-height:1.5">Trend is a change in monthly average, not a verdict — a move can be seasonal, a one-off, or a category that simply had a busy quarter. Nothing here is flagged as waste.</div>`
      :`<div style="font-size:10.5px;color:var(--t2)">No categorised spending in the window. If transactions imported but categories did not, run Catch up — categories sync separately and the classification depends on them.</div>`}
    </details>`;
    h+=renderIncomeLens(R,{rows,complete,cov,closedTotal,scopeControl,scopeNote,detailsHtml});

    h+=`<div class="spend-visuals">
    <div class="spend-stack">
    <section class="cp-card"><div class="spend-drift-head"><div><h3>Run-rate drift</h3><p>The last twelve closed months · each point is the ${driftWord}-month average ending there</p></div>${driftToggle}</div><div class="spend-ltm-wrap"><canvas id="spendLtmChart" role="img" aria-label="Rolling ${driftWord}-month average income and spending"></canvas></div><p class="spend-caption" id="spendLtmNote">${driftCaption} Flat is a steady run rate; a rising or falling line is drift. The series breaks across gaps in the records.</p></section>
    <section class="cp-card"><h3>Income & spending</h3><p>Every imported month · current and unverified months are labeled${_spendScope.kind!=='all'?' · not narrowed by the period above':''}</p><div class="spend-trend-wrap"><canvas id="spendMonthlyChart" role="img" aria-label="Monthly recorded income and spending"></canvas></div><p class="spend-caption">Month by month, as recorded. Transfers and card payments are excluded. These are recorded transactions, not projected amounts.</p></section>
    </div></div>`;
  }

  // ── Month by month ──
  const ledgerHtml=`<details class="spend-details" style="margin-top:12px"><summary>Monthly ledger · inspect the numbers</summary><div class="tw" style="max-height:none"><table style="font-size:11px">
    <thead><tr><th style="text-align:left">Month</th><th>Spending</th><th>Income</th><th>Net</th><th>Transfers</th><th>Card pmts</th><th>Invested</th><th>Rows</th></tr></thead>
    <tbody>${months.map(m=>{
      const partial=m.month===cov.partial;
      const net=(m.income||0)-(m.expense||0);
      return `<tr style="${partial?'opacity:.65':''}">
        <td style="font-weight:700;color:var(--tx);text-align:left">${m.month}${partial?' <span style="font-weight:400;color:var(--a);font-size:9px">partial</span>':''}</td>
        <td style="font-family:'SF Mono',monospace">${exact(m.expense)}</td>
        <td style="font-family:'SF Mono',monospace;color:var(--g)">${exact(m.income)}</td>
        <td style="font-family:'SF Mono',monospace;color:${net>=0?'var(--g)':'var(--r)'};font-weight:600">${net>=0?'+':'−'}${exact(Math.abs(net))}</td>
        <td style="font-family:'SF Mono',monospace;color:var(--t3)">${exact(m.transfer)}</td>
        <td style="font-family:'SF Mono',monospace;color:var(--t3)">${exact(m.cardPayment)}</td>
        <td style="font-family:'SF Mono',monospace;color:#6772e5">${exact(m.investment)}</td>
        <td style="color:var(--t3)">${m.count}${m.pending?` <span style="color:var(--a)">+${m.pending}p</span>`:''}</td>
      </tr>`}).join('')}</tbody></table></div></details>`;


  // Everything about where the numbers came from, in one place that is out of the way.
  h+=`<details class="cp-card spend-details spend-data"><summary>Data &amp; import · ${nTx.toLocaleString()} transactions${st.lastSyncAt?` · synced ${PlannerTime.formatTime(st.lastSyncAt)}`:''}</summary>
    <div style="margin-top:12px">${syncCard}</div>${classificationDetails}${ledgerHtml}</details>`;

  h+=`</div>`;
  ca.innerHTML=h;
  if(spendingViz)mountSpendingCharts(spendingViz);
  document.getElementById('summaries').innerHTML='';
}

  // Stripe account from Monarch accounts list

  // Donut data — top 8 holdings + Stripe (if present) + Other
  const maxHoldings=stripeBalance>0?8:9;

  const otherVal=holdings.slice(maxHoldings).reduce((s,h)=>s+h.value,0);

  // Asset mix by kind of security. Answers a different question from the per-holding

  const typeTot={};
  for(const h of holdings){

  }
  const mixSeries=Object.entries(typeTot).filter(([,v])=>v>0)
    .map(([t,v])=>[(TYPE_META[t]||[t.replace(/_/g,' '),'#94a3b8'])[0],v,(TYPE_META[t]||['','#94a3b8'])[1]]);
  if(stripeBalance>0)mixSeries.push(['Stripe (private)',stripeBalance,'#6772e5']);
  mixSeries.sort((a,b)=>b[1]-a[1]);
  const mixLabels=mixSeries.map(x=>x[0]),mixData=mixSeries.map(x=>x[1]),mixColors=mixSeries.map(x=>x[2]);

      {l:'All-time Return',v:signFmt(inv.allTimeChange||0),s:signPct(inv.allTimePct||0)+' total',c:colorPct(inv.allTimeChange||0)},

    ].map(k=>`<div class="kpi"><div class="kpi-l">${k.l}</div><div class="kpi-v" style="color:${k.c};font-size:14px">${k.v}</div><div class="kpi-s">${k.s}</div></div>`).join('')}

    <div class="glass-card" style="padding:14px">
      <div class="pf-cols2">
        <div>
          <div style="font-size:8.5px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">▲ Top Gainers (period)</div>
          ${(inv.topGainers||[]).length===0?`<div style="font-size:10px;color:var(--t3)">No movers this period</div>`:(inv.topGainers||[]).map(h=>`
          <div style="display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--bd)">

            </div>
            <div style="text-align:right">
              <div style="font-size:10px;font-family:'SF Mono',monospace;font-weight:600;color:var(--g)">${signFmt(h.periodChange)}</div>

          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <details class="pf-detail glass-card"><summary>All holdings <span>${holdings.length} positions · values &amp; price changes</span></summary>
  <div class="pf-scroll">
   <div style="min-width:620px">

    ${holdings.map((h,i)=>{

          <div style="height:4px;background:rgba(10,37,64,.07);border-radius:3px;margin-top:3px;max-width:120px"><div style="height:100%;width:${Math.min(100,pct*2)}%;background:${isCash?'var(--t4)':'linear-gradient(90deg,#6e66ff,#5048d6)'};border-radius:3px"></div></div>

    const observations=[];

    // Concentration — only single-name positions (equity/crypto/option/bond) carry
    // concentration risk. A diversified fund/ETF (e.g. an S&P 500 fund) being a large
    // slice is normal allocation, not single-stock risk, so it's tracked separately.
    const isDiversified=h=>h.securityType==='etf'||h.securityType==='mutual_fund';

      else observations.push({c:'var(--g)',t:`✓ Largest single-stock position (${topSingle.ticker}) is ${topSinglePct.toFixed(0)}% — concentration is manageable.`});
    }

    const top3Single=singleNames.slice(0,3);
    const top3SinglePct=totalVal>0?top3Single.reduce((s,h)=>s+h.value,0)/totalVal*100:0;
    if(top3SinglePct>40)flags.push({c:'var(--a)',t:`Top 3 single-stock positions (${top3Single.map(h=>h.ticker).join(', ')}) = ${top3SinglePct.toFixed(0)}% of portfolio.`});

    // Cash drag
    const cashHoldings=holdings.filter(h=>h.securityType==='cash');
    const cashVal=cashHoldings.reduce((s,h)=>s+h.value,0);
    const cashPct=totalVal>0?cashVal/totalVal*100:0;
    if(cashPct>12)flags.push({c:'var(--r)',t:`Cash is ${cashPct.toFixed(0)}% of investment portfolio — potential drag on long-run returns.`});
    else if(cashPct>0)observations.push({c:'var(--t2)',t:`Cash position: ${cashPct.toFixed(0)}% — within normal range.`});

    // Stripe account
    if(stripeBalance>0){
      const stripePct=donutTotal>0?stripeBalance/donutTotal*100:0;
      observations.push({c:'#6772e5',t:`Stripe account: ${fmt(stripeBalance)} (${stripePct.toFixed(1)}% of total including accounts).`});
    }

    // Period performance
    const periodPct=inv.periodChangePct||0;
    if(Math.abs(periodPct)>5)observations.push({c:colorPct(periodPct),t:`${periodPct>0?'Strong':'Weak'} period: ${signPct(periodPct)} over ${_investPeriod}. ${periodPct>0?'Broad momentum intact.':'Monitor for continuation.'}`});

    // All-time
    const allPct=inv.allTimePct||0;
    if(allPct>0)observations.push({c:'var(--g)',t:`All-time return: ${signPct(allPct)} — portfolio is in the green overall.`});
    else if(allPct<0)flags.push({c:'var(--r)',t:`Portfolio is down ${signPct(allPct)} all-time — cost-basis is above current value.`});

    // Type diversity
    const types=[...new Set(holdings.filter(h=>h.securityType!=='cash').map(h=>h.securityType))];
    const typeNames=types.map(t=>({equity:'Equities',etf:'ETFs',mutual_fund:'Funds',bond:'Bonds',crypto:'Crypto',option:'Options'}[t]||t));
    if(types.length>=2)observations.push({c:'var(--t2)',t:`Spread across ${typeNames.join(', ')} — ${holdings.length} total positions.`});

    const allItems=[...flags,...observations];
    if(allItems.length===0)return'';
    return`<details class="polish-fold refine-fold"><summary>Portfolio context</summary><div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${allItems.map(o=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 10px;background:rgba(10,37,64,.03);border-radius:7px;border-left:2px solid ${o.c}">
          <div style="font-size:11px;color:${o.c};line-height:1.45">${o.t}</div>
        </div>`).join('')}
      </div>
    </div></details>`;
  })()}


  <div class="refine-links"><button class="ui-btn" onclick="setSubView('overview')">Manage accounts & classifications →</button></div>
  </div>`;


  if(donutData.length>0){

    if(legend)legend.innerHTML=donutLabels.map((label,i)=>{
      const value=donutData[i],pct=donutTotal>0?value/donutTotal*100:0;

}

// ── Rent or buy: the same plan run twice ────────────────────────────────────
// Housing asks "how much can I afford"; this asks "should I buy at all". The plan is run once
// buying and once renting for good, everything else identical, and the levers here move both
// runs together. They explore — nothing is saved until "Apply to my plan".
let _rbOv={},_rbLens='networth',_rbHorizon='end';
const RB_LEVERS=[
  // key, label, min, max, step, format, group
  ['investReturn','Portfolio return',0,.12,.0025,v=>(v*100).toFixed(2).replace(/\.?0+$/,'')+'%','market'],
  ['homeAppreciation','Home appreciation',-.02,.08,.0025,v=>(v*100).toFixed(2).replace(/\.?0+$/,'')+'%','market'],
  ['rentInflation','Rent increases',0,.08,.0025,v=>(v*100).toFixed(2).replace(/\.?0+$/,'')+'%/yr','market'],
  ['stripeShift','Stripe growth vs plan',-.08,.08,.005,v=>(v>0?'+':v<0?'−':'')+Math.abs(v*100).toFixed(1).replace(/\.0$/,'')+' pts','market'],
  ['homePrice','Home price',500000,4000000,50000,v=>fmt(v),'home'],
  ['downPctg','Down payment',5,100,5,v=>v+'%','home'],
  ['mortgageRate','Mortgage rate',2,9,.125,v=>v+'%','home'],
  ['homePurchaseYear','Purchase year',null,null,1,v=>String(v),'home'],
  ['nycRent','Monthly rent today',2000,15000,100,v=>fmtF(v)+'/mo','home'],
  ['sellCost','Cost to sell the home',0,.12,.005,v=>(v*100).toFixed(1).replace(/\.0$/,'')+'%','home'],
];
function rbBase(k){
  if(k==='stripeShift')return 0;
  if(k==='sellCost')return PlannerRentBuy.DEFAULT_SELL_COST;
  if(k==='rentInflation')return P.rentInflation??.03;
  return P[k];
}
function rbVal(k){return _rbOv[k]!=null?_rbOv[k]:rbBase(k)}
// The plan with every exploring lever applied. Stripe is a shift across its whole return path.
function rbParams(){
  const q={...P};
  for(const [k] of RB_LEVERS)if(_rbOv[k]!=null&&k!=='stripeShift'&&k!=='sellCost')q[k]=_rbOv[k];
  return PlannerRentBuy.withStripeShift(q,_rbOv.stripeShift||0);
}
function rbHorizonYear(R){
  const last=R[R.length-1].yr,py=rbVal('homePurchaseYear');
  return _rbHorizon==='end'?last:Math.min(last,py+Number(_rbHorizon));
}
function rbSet(k,v){
  const n=k==='homePurchaseYear'?parseInt(v,10):parseFloat(v);
  if(!Number.isFinite(n))return;
  if(Math.abs(n-rbBase(k))<1e-9)delete _rbOv[k];else _rbOv[k]=n;
  render();
}
// Dragging updates the number beside the slider; the comparison reruns when you let go.
function rbPeek(k,v){const L=RB_LEVERS.find(x=>x[0]===k),el=document.getElementById('rbv_'+k);if(L&&el)el.textContent=L[5](parseFloat(v))}
function rbLens(v){_rbLens=v;render()}
function rbHorizon(v){_rbHorizon=v;render()}
function rbReset(){_rbOv={};render()}
// Only plan inputs can be applied. The Stripe shift and the selling cost are lenses on this
// comparison, not settings the plan has, so they stay here.
function rbApply(){
  const keys=Object.keys(_rbOv).filter(k=>k!=='stripeShift'&&k!=='sellCost');
  if(!keys.length)return;
  const names=keys.map(k=>{const L=RB_LEVERS.find(x=>x[0]===k);return `${L[1].toLowerCase()} ${L[5](_rbOv[k])}`});
  const moves=keys.includes('homePurchaseYear')?'\n\nMoving the purchase year shifts the down payment, and every year of the plan after it.':'';
  if(!showConfirm(`Set your plan's ${names.join(', ')}?${moves}`))return;
  for(const k of keys){P[k]=_rbOv[k];delete _rbOv[k]}
  markDirty();buildControls();render();savePlannerState();
  showToast('Applied to your plan','green');
}

function renderRentBuyTab(R,P,host){

  if(typeof PlannerRentBuy==='undefined'){ca.innerHTML='<p>The rent-or-buy comparison did not load. Refresh to try again.</p>';return}
  const q=rbParams(),first=R[0].yr,last=R[R.length-1].yr;
  const py=q.homePurchaseYear;
  if(!(py>=first&&py<=last)){
    ca.innerHTML=`<div class="glass-card" style="padding:20px">The purchase year (${py}) is outside the plan (${first}–${last}). Move it inside to compare.</div>`;return;
  }
  const horizon=rbHorizonYear(R);
  const opts={horizonYear:horizon,sellCostPct:rbVal('sellCost'),lens:_rbLens};
  const c=PlannerRentBuy.compare(q,run,opts);
  const fl=PlannerRentBuy.flips(q,run,opts);
  const v=c.verdict,f=c.facts,cash=_rbLens==='cashflow';

      ${chip(!cash,"rbLens('networth')",'Net worth')}${chip(cash,"rbLens('cashflow')",'Cash flow')}</div>

  </div>`;

  // ── The answer ──
  const win=v.winner==='buy'?'Buying':'Renting';
  const measure=cash
    ? `less cash spent through ${horizon} — ${money(v.rentCum)} renting vs ${money(v.buyCum)} buying, counting the ${money(f.cashAtPurchase)} to close`

  const when=cash

      ${(P.housingMode||'buy')!==v.winner?`<button type="button" class="ui-btn" onclick="USel('housingMode','${v.winner}')" style="font-size:10px;padding:4px 10px">Switch plan to ${v.winner}</button>`:''}

  // ── Levers ──
  const lever=([k,label,min,max,step,fv])=>{
