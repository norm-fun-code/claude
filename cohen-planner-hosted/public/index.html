<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohen Family — Interactive Financial Planner v5</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/model.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f9fc;
  --s1:#ffffff;
  --s2:#fafbfc;
  --s3:#f0f4f8;
  --bd:#e6ebf1;
  --bd2:#d0d7de;
  --tx:#0a2540;
  --t2:#425466;
  --t3:#8898aa;
  --t4:#adbdcc;
  --accent:#635bff;
  --accent-d:#4f48cc;
  --accent-soft:#eeecff;
  --g:#1a8754;
  --g-soft:#e7f4ed;
  --r:#cd3d64;
  --r-soft:#fceaee;
  --a:#bf6900;
  --a-soft:#fdf3e3;
  --b:#0073e6;
  --b-soft:#e6f1ff;
  --c:#0891b2;
  --p:#7c3aed;
  --shadow-sm:0 1px 2px rgba(50,71,92,.04);
  --shadow:0 2px 5px rgba(50,71,92,.06),0 1px 2px rgba(50,71,92,.04);
  --shadow-lg:0 8px 20px rgba(50,71,92,.08),0 2px 6px rgba(50,71,92,.04);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);padding:14px 18px;min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv11'}
.mono{font-family:'SF Mono','Fira Code','Courier New',monospace}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:14px}
.hdr h1{font-size:16px;font-weight:600;color:var(--tx);letter-spacing:-.3px}
.hdr-right{display:flex;align-items:center;gap:10px}
.sync-pill{font-size:9px;font-family:'SF Mono',monospace;color:var(--t3);transition:color .2s}
.sync-pill.saving{color:var(--a)}
.sync-pill.synced{color:var(--g)}
.sync-pill.error{color:var(--r)}
.logout-btn{font-size:9px;padding:3px 9px;background:var(--s2);border:1px solid var(--bd);border-radius:4px;cursor:pointer;font-family:inherit;color:var(--t3);transition:all .12s}
.logout-btn:hover{border-color:var(--r);color:var(--r)}
.layout{display:grid;grid-template-columns:268px 1fr;gap:12px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;max-height:calc(100vh - 70px);overflow-y:auto;box-shadow:var(--shadow-sm)}
.panel::-webkit-scrollbar{width:5px}.panel::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.st{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin:12px 0 6px}
.sr{margin-bottom:8px}.sr .sh{display:flex;justify-content:space-between;margin-bottom:2px}
.sr .sl{font-size:10px;color:var(--t2);font-weight:500}.sr .sv{font-size:10px;color:var(--tx);font-family:'SF Mono',monospace;font-weight:600}
.sr input[type=range]{width:100%;accent-color:var(--accent);height:3px;cursor:pointer}
.kpi-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.kpi:hover{box-shadow:var(--shadow)}
.kpi-l{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:3px}
.kpi-v{font-size:16px;font-weight:700;font-family:'SF Mono',monospace;letter-spacing:-.5px;color:var(--tx)}
.kpi-s{font-size:8.5px;color:var(--t2);margin-top:2px}
.tabs{display:flex;gap:3px;margin-bottom:10px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:3px;box-shadow:var(--shadow-sm)}
.tabs button{padding:6px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:inherit;transition:all .12s}
.tabs button:hover{color:var(--tx);background:var(--s3)}
.tabs button.active{background:var(--accent);color:#fff;font-weight:600}
#mcBtn.active{background:var(--p)!important;color:#fff!important;border-color:var(--p)!important}
.snap-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.snap-chip{padding:4px 9px;border-radius:6px;font-size:9.5px;font-weight:500;cursor:pointer;border:1px solid rgba(8,145,178,.3);background:#e0f7fa;color:var(--c);display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .12s}
.snap-chip.active{background:var(--c);color:#fff}
.snap-chip .x{font-size:8px;opacity:.6;margin-left:3px}.snap-chip .x:hover{opacity:1;color:var(--r)}
@media print{
  body{padding:0;font-size:11px}
  .panel,.tabs button#mcBtn,.tabs button#inflBtn,.logout-btn,.sync-pill,.adv-input-area,.scenario-bar,.snap-bar{display:none!important}
  .tabs button:not(.active){display:none}
  .layout{grid-template-columns:1fr;display:block}
  .cc,.kpi,.sc{box-shadow:none;border-color:#ccc}
  @page{margin:1.2cm}
}
.cc{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:11px;box-shadow:var(--shadow-sm)}
.sc h3{font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:4px}
.sc p{font-size:10px;color:var(--t2);line-height:1.55}
.tw{max-height:340px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:10px;font-family:'SF Mono',monospace}
th{padding:6px 4px;text-align:right;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);border-bottom:1px solid var(--bd);font-family:'Inter',sans-serif;position:sticky;top:0;background:var(--s2);z-index:1}
td{padding:3px 4px;text-align:right;border-bottom:1px solid var(--bd);color:var(--t2)}
tr:hover td{background:var(--s2)}
.btn{padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--s1);color:var(--t2);font-size:10px;font-weight:500;cursor:pointer;width:100%;margin-top:3px;font-family:inherit;transition:all .12s}
.btn:hover{border-color:var(--bd2);color:var(--tx);background:var(--s2)}
.btn-g{border-color:rgba(99,91,255,.3);color:var(--accent);background:var(--accent-soft)}
.btn-g:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.scenario-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.scenario-chip{padding:4px 10px;border-radius:6px;font-size:9.5px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--s1);color:var(--t2);display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .12s}
.scenario-chip:hover{border-color:var(--bd2);color:var(--tx);background:var(--s2)}
.scenario-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.scenario-chip .x{font-size:8px;opacity:.5;margin-left:3px;cursor:pointer}.scenario-chip .x:hover{opacity:1;color:var(--r)}
.solo-box{background:var(--g-soft);border:1px solid rgba(26,135,84,.2);border-radius:6px;padding:8px 10px;margin:5px 0 7px;font-size:10px;color:var(--t2)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(3,1fr)}.sg{grid-template-columns:1fr}}
.adv{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:500px;background:var(--s1);border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.adv-msgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.adv-msgs::-webkit-scrollbar{width:6px}.adv-msgs::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.adv-msg{display:flex;gap:10px;max-width:760px}
.adv-msg.user{flex-direction:row-reverse;align-self:flex-end;max-width:560px}
.adv-avatar{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:'SF Mono',monospace}
.adv-avatar.ai{background:var(--accent);color:#fff}
.adv-avatar.user{background:var(--s3);color:var(--tx);border:1px solid var(--bd2)}
.adv-bubble{padding:10px 14px;border-radius:8px;font-size:12.5px;line-height:1.6;color:var(--tx)}
.adv-msg.user .adv-bubble{background:var(--accent-soft);border:1px solid rgba(99,91,255,.15);color:var(--tx)}
.adv-msg.ai .adv-bubble{background:var(--s1);border:1px solid var(--bd);box-shadow:var(--shadow-sm)}
.adv-bubble p{margin-bottom:8px}.adv-bubble p:last-child{margin-bottom:0}
.adv-bubble ul,.adv-bubble ol{margin:6px 0 6px 20px}.adv-bubble li{margin-bottom:3px}
.adv-bubble strong{color:var(--tx);font-weight:600}
.adv-bubble code{font-family:'SF Mono',monospace;background:var(--accent-soft);padding:1px 5px;border-radius:3px;font-size:11px;color:var(--accent)}
.adv-bubble pre{background:var(--bg);padding:8px 10px;border-radius:5px;overflow-x:auto;margin:6px 0;font-size:11px;border:1px solid var(--bd)}
.adv-bubble table{border-collapse:collapse;margin:8px 0;font-size:11px;width:100%}
.adv-bubble th,.adv-bubble td{padding:5px 9px;border-bottom:1px solid var(--bd);text-align:left}
.adv-bubble th{font-weight:700;font-size:9.5px;text-transform:uppercase;color:var(--t3);letter-spacing:.5px}
.adv-bubble h3{font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--tx)}
.adv-bubble h4{font-size:12px;font-weight:600;margin:8px 0 3px;color:var(--t2)}
.adv-input-area{padding:12px 18px 14px;border-top:1px solid var(--bd);background:var(--s1)}
.adv-input-wrap{display:flex;gap:6px;align-items:flex-end;background:var(--s2);border:1px solid var(--bd2);border-radius:8px;padding:6px}
.adv-input-wrap:focus-within{border-color:var(--accent)}
.adv-input{flex:1;background:transparent;border:none;color:var(--tx);font-family:inherit;font-size:12.5px;resize:none;outline:none;padding:6px;min-height:20px;max-height:140px;line-height:1.5}
.adv-send{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:5px;cursor:pointer;font-weight:600;font-size:11.5px;font-family:inherit;height:32px}
.adv-send:hover{background:var(--accent-d)}.adv-send:disabled{background:var(--bd2);cursor:not-allowed}
.adv-thinking{display:flex;gap:3px;padding:3px 0}
.adv-thinking span{width:5px;height:5px;border-radius:50%;background:var(--t3);animation:advblink 1.4s infinite}
.adv-thinking span:nth-child(2){animation-delay:.2s}.adv-thinking span:nth-child(3){animation-delay:.4s}
@keyframes advblink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.adv-welcome{padding:20px;text-align:center;color:var(--t2);font-size:13px;line-height:1.6}
.adv-welcome h3{color:var(--tx);font-size:16px;margin-bottom:8px;font-weight:700}
.adv-starters{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:14px;text-align:left;max-width:600px;margin-left:auto;margin-right:auto}
.adv-starter{padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;cursor:pointer;font-size:11.5px;color:var(--t2);line-height:1.4;transition:all .15s}
.adv-starter:hover{border-color:var(--accent);color:var(--tx)}
.adv-starter strong{display:block;color:var(--tx);font-size:12px;margin-bottom:2px}
.adv-toolbar{display:flex;gap:6px;padding:8px 18px;border-bottom:1px solid var(--bd);background:var(--s1);align-items:center}
.adv-toolbar .ctx-pill{background:var(--s2);border:1px solid var(--bd);padding:3px 8px;border-radius:4px;font-size:9.5px;color:var(--t2);font-family:'SF Mono',monospace}
.adv-toolbar .ctx-pill strong{color:var(--g)}
.adv-toolbar button{background:var(--s2);border:1px solid var(--bd);color:var(--t2);padding:4px 9px;border-radius:4px;cursor:pointer;font-size:10px;font-family:inherit;font-weight:500;margin-left:auto}
.adv-toolbar button:hover{border-color:var(--bd2);color:var(--tx)}
.adv-wrap{display:grid;grid-template-columns:240px 1fr;gap:0;height:calc(100vh - 220px);min-height:500px;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--s1)}
.adv-rail{background:var(--s2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.adv-rail-hdr{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:var(--s2)}
.adv-rail-hdr h4{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;color:var(--t3);margin:0}
.adv-rail-new{background:var(--accent);color:#fff;border:none;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10.5px;font-weight:600;font-family:inherit;transition:background .12s}
.adv-rail-new:hover{background:var(--accent-d)}
.adv-rail-list{flex:1;overflow-y:auto;padding:8px}
.adv-rail-list::-webkit-scrollbar{width:5px}.adv-rail-list::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.adv-rail-item{padding:9px 11px;border-radius:6px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;font-size:11.5px;color:var(--t2);position:relative;transition:all .12s}
.adv-rail-item:hover{background:var(--s1);border-color:var(--bd)}
.adv-rail-item.active{background:var(--s1);border-color:var(--accent)}
.adv-rail-title{font-weight:600;color:var(--tx);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:22px;font-size:11.5px;line-height:1.3}
.adv-rail-meta{font-size:9.5px;color:var(--t3);font-family:'SF Mono',monospace;display:flex;justify-content:space-between}
.adv-rail-actions{position:absolute;top:6px;right:6px;display:none;gap:2px}
.adv-rail-item:hover .adv-rail-actions{display:flex}
.adv-rail-actions button{background:var(--s2);border:1px solid var(--bd);width:20px;height:20px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;padding:0;color:var(--t2);transition:all .1s}
.adv-rail-actions button:hover{background:var(--s3);color:var(--tx)}
.adv-rail-actions button.del:hover{color:var(--r);border-color:var(--r)}
.adv-rail-empty{color:var(--t3);font-size:11px;text-align:center;padding:18px 8px;line-height:1.5}
.adv-rail-footer{padding:8px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.adv-rail-footer button{background:var(--s1);border:1px solid var(--bd);color:var(--t2);padding:6px 9px;border-radius:5px;cursor:pointer;font-size:10.5px;font-family:inherit;font-weight:500;text-align:left;transition:all .12s}
.adv-rail-footer button:hover{border-color:var(--bd2);color:var(--tx)}
.adv-main{display:flex;flex-direction:column;overflow:hidden;background:var(--s1)}
@media(max-width:900px){.adv-wrap{grid-template-columns:1fr}.adv-rail{display:none}}
</style>
</head>
<body>
<div class="hdr">
  <h1>💰 Cohen Family — Financial Planner v5</h1>
  <div class="hdr-right">
    <span class="sync-pill" id="syncStatus"></span>
    <button class="logout-btn" onclick="doLogout()">Log out</button>
  </div>
</div>
<div class="layout">
  <div class="panel" id="controls"></div>
  <div id="main"></div>
</div>
<script>
const COLORS=['#ff6b6b','#ffd43b','#ff922b','#e64980','#20c997','#845ef7','#339af0','#f783ac'];

// ═══ TAX ENGINE + PROJECTION MODEL — see /model.js (loaded above) ═══

// ═══ DEFAULTS ═══
const D={
  planStartYear:2026,
  kid1Birth:2027,kid2Birth:2030,kid3Birth:2034,kid4Birth:2037,numKids:3,
  nannyEndAge:1.5,nannyHourlyRate:30,nannyDaysPerWeek:4,daycareMonthly:2800,
  tuitionInflation:.035,yeshivaStartAge:2,yeshivaEndAge:17,kid1YeshivaStartAge:3,
  startingLiquid:1100000,nycRent:5500,
  // Norm — 4 rolling specific years (Y0=planStartYear, Y1=+1, Y2=+2, Y3=+3)
  normCashY0:280000,normCashY1:260000,normCashY2:275000,normCashY3:265000,
  normStockY0:197000,normStockY1:162000,normStockY2:153000,normStockY3:158000,
  normCashBase:275000,normGrowth:.01,normStockBase:150000,
  pretax401k:23500,pretaxBenefits:11700,
  company401kMatch:8750,
  // Nancy — 4 rolling specific W2 years (ignored once yr >= nancyRampYear)
  nancyW2Y0:130000,nancyW2Y1:80000,nancyW2Y2:100000,nancyW2Y3:75000,
  nancyHourlyRate:300,nancyRampYear:2030,nancyRampClients:5,nancyMaxClients:18,nancyRampYears:6,nancyWeeksPerYear:46,
  nancySoloPractice:1,nancyPracticeOverhead:15000,nancyQBIRate:.20,nancyHomeOfficeDeduct:8000,
  baseGroceries:7000,baseDining:14000,baseShopping:22000,baseVacations:20000,
  baseAuto:3500,baseInsurance:1500,baseMisc:10000,baseEntertainment:4500,
  baseCharity:8500,baseMedical:4500,baseTransit:4000,baseUtilsPhoneNet:5500,
  expenseInflation:.03,postKidVacations:10000,
  homePrice:2000000,downPctg:50,mortgageRate:5.0,homePurchaseYear:2030,
  propTaxBase:18000,maintBase:10000,homeAppreciation:.03,
  suburbAutoBoost:3500,suburbInsBoost:1500,suburbUtilBoost:2500,
  investReturn:.06,capGainsTaxRate:.345,costBasisPct:.55,
  k401Start:210000,
  mcVol:.14,
  taxInflation:.025,
};
let P={...D};let scenarios=[];let compareMode=false;let activeScenarioIdx=-1;

// ═══ SYNC STATUS ═══
function setSyncStatus(status){
  const el=document.getElementById('syncStatus');
  if(!el)return;
  el.className='sync-pill '+status;
  if(status==='saving')el.textContent='Saving…';
  else if(status==='synced')el.textContent='✓ Synced';
  else if(status==='error')el.textContent='⚠ Save failed';
  else el.textContent='';
}

// ═══ PERSISTENCE — backed by server API ═══
let _saveTimer=null;
function savePlannerState(){
  setSyncStatus('saving');
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{
    try{
      await fetch('/api/planner-state',{
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({state:{P,compareMode,activeTab,activeScenarioIdx}})
      });
      setSyncStatus('synced');
    }catch(e){setSyncStatus('error')}
  },500);
}

// Migrate old year-keyed format (normCash2026…) to rolling Y0-Y3 format
function migrateP(raw){
  if(raw.normCashY0!==undefined)return raw; // already new format
  const sy=raw.planStartYear||raw.startYear||2026;
  const m={...raw,planStartYear:sy};
  const oldNormCash={2026:280000,2027:260000,2028:275000,2029:265000};
  const oldNormStock={2026:197000,2027:162000,2028:153000,2029:158000};
  const oldNancyW2={2026:130000,2027:80000,2028:100000,2029:75000};
  for(let i=0;i<4;i++){
    const yr=sy+i;
    m['normCashY'+i]=raw['normCash'+yr]??oldNormCash[yr]??275000;
    m['normStockY'+i]=raw['normStock'+yr]??oldNormStock[yr]??150000;
    m['nancyW2Y'+i]=raw['nancyW2_'+yr]??oldNancyW2[yr]??100000;
  }
  m.normCashBase=raw.normCash2030Base??raw.normCashBase??275000;
  m.normStockBase=raw.normStock2030??raw.normStockBase??150000;
  return m;
}

async function loadFromServer(){
  try{
    const [stRes,scRes]=await Promise.all([
      fetch('/api/planner-state'),
      fetch('/api/scenarios')
    ]);
    if(stRes.ok){
      const d=await stRes.json();
      const s=d.state||{};
      if(s.P)P={...D,...migrateP(s.P)};
      if(s.compareMode!==undefined)compareMode=s.compareMode;
      if(s.activeTab)activeTab=s.activeTab;
      if(s.activeScenarioIdx!==undefined)activeScenarioIdx=s.activeScenarioIdx;
    }
    if(scRes.ok){
      const sc=await scRes.json();
      scenarios=sc.map((s,i)=>({
        id:s.id,name:s.name,
        color:s.color||COLORS[i%COLORS.length],
        params:migrateP(s.params||{}),
        results:run({...D,...migrateP(s.params||{})})
      }));
    }
  }catch(e){console.error('loadFromServer error:',e)}
  buildControls();render();
}

function exportJSON(){const b=new Blob([JSON.stringify({P,scenarios:scenarios.map(s=>({name:s.name,params:s.params}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cohen_planner.json';a.click()}

function rollForward(){
  const curYear=P.planStartYear||2026;const nextYear=curYear+1;
  if(!confirm(`Roll plan forward to ${nextYear}?\n\nThis will:\n• Save a dated snapshot of the ${curYear} plan (for projected-vs-actual)\n• Shift income inputs: Y1→Y0, Y2→Y1, Y3→Y2\n• Set new Y3 to base rates\n\nYou'll be prompted to update Starting Liquid.`))return;
  saveSnapshot(true); // auto-archive the plan year being closed out

  P.normCashY0=P.normCashY1;P.normCashY1=P.normCashY2;P.normCashY2=P.normCashY3;P.normCashY3=P.normCashBase;
  P.normStockY0=P.normStockY1;P.normStockY1=P.normStockY2;P.normStockY2=P.normStockY3;P.normStockY3=P.normStockBase;

  P.nancyW2Y0=P.nancyW2Y1;P.nancyW2Y1=P.nancyW2Y2;P.nancyW2Y2=P.nancyW2Y3;

let advisorChats={};
let advisorActiveChatId=null;
let advisorConversation=[];

async function loadAdvisorState(){
  try{
    const res=await fetch('/api/chats');
    if(!res.ok)return;
    const chats=await res.json();
    advisorChats={};
    chats.forEach(c=>{
      advisorChats[c.id]={
        id:c.id,title:c.title,messages:[],
        messageCount:parseInt(c.message_count)||0,
        createdAt:new Date(c.created_at).getTime(),
        updatedAt:new Date(c.updated_at).getTime()
      };
    });
    if(chats.length>0&&!advisorActiveChatId){
      advisorActiveChatId=chats[0].id;
      await advLoadMessages(advisorActiveChatId);
    }
  }catch(e){console.error('loadAdvisorState error:',e)}
}

async function advLoadMessages(id){
  if(!id||!advisorChats[id])return;
  try{
    const res=await fetch('/api/chats/'+id);
    if(res.ok){
      const data=await res.json();
      advisorChats[id].messages=data.messages||[];
      if(id===advisorActiveChatId)advisorConversation=advisorChats[id].messages;
    }
  }catch(e){}
}

function advUuid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function advEscape(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function advMarkdown(text){
  let h=text;
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre>${advEscape(c.trim())}</pre>`);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\n((?:\|.+\|\n)+)/g,(m,tbl)=>{
    const rows=tbl.trim().split('\n');if(rows.length<2)return m;
    const hdr=rows[0].split('|').slice(1,-1).map(c=>advEscape(c.trim()));
    const isSep=rows[1].match(/^[\s|:\-]+$/);
    const body=isSep?rows.slice(2):rows.slice(1);
    let t='<table><thead><tr>'+hdr.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
    body.forEach(r=>{const cells=r.split('|').slice(1,-1).map(c=>advEscape(c.trim()));t+='<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>'});
    return '\n'+t+'</tbody></table>';
  });
  h=h.replace(/^### (.+)$/gm,(m,t)=>`<h3>${advEscape(t)}</h3>`);
  h=h.replace(/^#### (.+)$/gm,(m,t)=>`<h4>${advEscape(t)}</h4>`);
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?:^|\n)((?:[\-\*] .+\n?)+)/g,(m,l)=>{const items=l.trim().split('\n').map(x=>x.replace(/^[\-\*] /,''));return '\n<ul>'+items.map(i=>`<li>${i}</li>`).join('')+'</ul>'});
  h=h.split('\n\n').map(p=>{p=p.trim();if(!p)return '';if(p.startsWith('<'))return p;return '<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('\n');
  return h;
}

  ca.innerHTML=`<div class="adv-toolbar">
    <span class="ctx-pill">Context: <strong>LIVE</strong> · ${R.length}yr plan · $${(R[R.length-1].nw/1e6).toFixed(1)}M @ ${R[R.length-1].yr}</span>
    <button onclick="advExportChats()">📥 Export</button>
    <button onclick="advImportChats()">📤 Import</button>
  </div>
  <div class="adv-wrap">
    <div class="adv-rail">
      <div class="adv-rail-hdr">
        <h4>Conversations</h4>
        <button class="adv-rail-new" onclick="advNewChat()">+ New</button>
      </div>
      <div class="adv-rail-list" id="advRailList"></div>
    </div>
    <div class="adv-main">
      <div class="adv-msgs" id="advMsgs"></div>
      <div class="adv-input-area">
        <div class="adv-input-wrap">
          <textarea class="adv-input" id="advInput" placeholder="Ask anything about your plan, portfolio, scenarios, taxes..." rows="1"></textarea>
          <button class="adv-send" id="advSend" onclick="advSend()">Send</button>
        </div>
      </div>
    </div>
  </div>`;
  const input=document.getElementById('advInput');
  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();advSend()}});
  advRenderRail();
  advRenderMessages();
}

function advRenderMessages(){
  const msgs=document.getElementById('advMsgs');
  if(!msgs)return;
  if(advisorConversation.length===0){
    msgs.innerHTML=`<div class="adv-welcome">
      <h3>Ask me anything about your plan</h3>
      <p>I have your live planner state — every slider, scenario, and projection. Try one of these or ask your own:</p>
      <div class="adv-starters">
        <div class="adv-starter" onclick="advAsk('Given my current plan, what should I prioritize in the next 12 months?')"><strong>🎯 Top priority?</strong>Next 12 months</div>
        <div class="adv-starter" onclick="advAsk('Run a stress test - what if equity returns are only 4% instead of 6%?')"><strong>📉 Stress test returns</strong>4% vs 6% returns</div>
        <div class="adv-starter" onclick="advAsk('Should I sell some Stripe RSU now to reduce concentration risk, or wait for IPO?')"><strong>⚠️ Stripe concentration</strong>Sell now or wait?</div>
        <div class="adv-starter" onclick="advAsk('How would moving from a \$2M to \$1.7M home affect my plan? Be specific.')"><strong>🏠 Home tradeoff</strong>\$2M vs \$1.7M</div>
        <div class="adv-starter" onclick="advAsk('What\\'s the single biggest risk I\\'m underweighting in this plan?')"><strong>🔍 Blind spots</strong>What am I missing?</div>
        <div class="adv-starter" onclick="advAsk('Where should I deploy my next \$25K of monthly savings - FXAIX, individual stocks, or cash?')"><strong>💰 Deploy \$25K</strong>Where to invest</div>
      </div>
    </div>`;
    return;
  }
  msgs.innerHTML='';
  advisorConversation.forEach(m=>advAddMessage(m.role==='assistant'?'ai':'user',m.content,false,msgs));
}

function advAddMessage(role,content,isThinking,container){
  const msgs=container||document.getElementById('advMsgs');
  if(!msgs)return null;
  const w=msgs.querySelector('.adv-welcome');if(w)w.remove();
  const msg=document.createElement('div');
  msg.className='adv-msg '+role;
  const avatar=document.createElement('div');
  avatar.className='adv-avatar '+role;
  avatar.textContent=role==='ai'?'AI':'N';
  const bubble=document.createElement('div');
  bubble.className='adv-bubble';
  if(isThinking){bubble.innerHTML='<div class="adv-thinking"><span></span><span></span><span></span></div>'}
  else{bubble.innerHTML=role==='ai'?advMarkdown(content):`<p>${advEscape(content).replace(/\n/g,'<br>')}</p>`}
  msg.appendChild(avatar);msg.appendChild(bubble);
  msgs.appendChild(msg);
  msgs.scrollTop=msgs.scrollHeight;
  return bubble;
}

function advAsk(q){const input=document.getElementById('advInput');if(input){input.value=q;advSend()}}

async function advNewChat(){
  const id=advUuid();
  try{
    await fetch('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,title:'New conversation'})});
  }catch(e){}
  const now=Date.now();
  advisorChats[id]={id,title:'New conversation',messages:[],messageCount:0,createdAt:now,updatedAt:now};
  advisorActiveChatId=id;
  advisorConversation=[];
  advRenderRail();
  advRenderMessages();
  const input=document.getElementById('advInput');if(input)input.focus();
}

function advRenderRail(){
  const list=document.getElementById('advRailList');
  if(!list)return;
  const sorted=Object.values(advisorChats).sort((a,b)=>b.updatedAt-a.updatedAt);
  if(sorted.length===0){
    list.innerHTML=`<div class="adv-rail-empty">No conversations yet.<br>Click "+ New" to start.</div>`;
    return;
  }
  list.innerHTML=sorted.map(c=>{
    const rel=advRelTime(c.updatedAt);
    const cnt=c.messages.length||c.messageCount||0;
    return `<div class="adv-rail-item ${c.id===advisorActiveChatId?'active':''}" onclick="advSwitchChat('${c.id}')">
      <div class="adv-rail-title">${advEscape(c.title)}</div>
      <div class="adv-rail-meta">
        <span>${cnt} msg${cnt===1?'':'s'}</span>
        <span>${rel}</span>
      </div>
      <div class="adv-rail-actions">
        <button onclick="event.stopPropagation();advRenameChat('${c.id}')" title="Rename">✎</button>
        <button class="del" onclick="event.stopPropagation();advDeleteChat('${c.id}')" title="Delete">×</button>
      </div>
    </div>`;
  }).join('');
}

function advRelTime(ts){
  const diff=Date.now()-ts;
  const min=Math.floor(diff/60000);
  if(min<1)return 'now';
  if(min<60)return min+'m';
  const hr=Math.floor(min/60);
  if(hr<24)return hr+'h';
  const d=Math.floor(hr/24);
  if(d<7)return d+'d';
  const w=Math.floor(d/7);
  if(w<4)return w+'w';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

async function advSwitchChat(id){
  if(!advisorChats[id])return;
  advisorActiveChatId=id;
  if(!advisorChats[id].messages||advisorChats[id].messages.length===0){
    await advLoadMessages(id);
  }
  advisorConversation=advisorChats[id].messages||[];
  advRenderRail();
  advRenderMessages();
}

async function advRenameChat(id){
  const c=advisorChats[id];if(!c)return;
  const t=prompt('Rename conversation:',c.title);
  if(t&&t.trim()){
    c.title=t.trim().slice(0,80);c.updatedAt=Date.now();
    fetch('/api/chats/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:c.title})}).catch(()=>{});
    advRenderRail();
  }
}

async function advDeleteChat(id){
  const c=advisorChats[id];if(!c)return;
  if(!confirm(`Delete "${c.title}"? This cannot be undone.`))return;
  fetch('/api/chats/'+id,{method:'DELETE'}).catch(()=>{});
  delete advisorChats[id];
  if(advisorActiveChatId===id){
    advisorActiveChatId=null;
    advisorConversation=[];
    advRenderMessages();
  }
  advRenderRail();
}

function advImportChats(){
  const input=document.createElement('input');
  input.type='file';input.accept='application/json,.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.chats||typeof data.chats!=='object')throw new Error('Invalid file format');
        const incoming=Object.values(data.chats);
        if(!confirm(`Import ${incoming.length} conversation${incoming.length===1?'':'s'}? Merges with existing chats.`))return;
        let imported=0;
        const promises=[];
        Object.entries(data.chats).forEach(([id,chat])=>{
          if(chat.id&&chat.messages&&Array.isArray(chat.messages)){
            const newId=advisorChats[id]?advUuid():id;
            advisorChats[newId]={...chat,id:newId,messages:chat.messages,messageCount:chat.messages.length,createdAt:chat.createdAt||Date.now(),updatedAt:chat.updatedAt||Date.now()};
            promises.push(fetch('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:newId,title:chat.title||'Imported chat'})})
              .then(()=>fetch('/api/chats/'+newId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chat.messages})}))
              .catch(()=>{}));
            imported++;
          }
        });
        Promise.all(promises).then(()=>{advRenderRail();alert(`Imported ${imported} conversation${imported===1?'':'s'}.`)});
      }catch(err){alert('Failed to import: '+err.message)}
    };
    reader.readAsText(file);
  };
  input.click();
}

function advExportChats(){
  const data={exportedAt:new Date().toISOString(),chats:advisorChats};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`advisor-chats-${new Date().toISOString().slice(0,10)}.json`;a.click();
}

async function advSend(){
  const input=document.getElementById('advInput');
  const text=input.value.trim();
  if(!text)return;
  if(!advisorActiveChatId||!advisorChats[advisorActiveChatId]){
    await advNewChat();
    if(!advisorActiveChatId)return;
  }
  input.value='';input.style.height='auto';
  document.getElementById('advSend').disabled=true;
  advAddMessage('user',text);
  advisorConversation.push({role:'user',content:text});
  const chat=advisorChats[advisorActiveChatId];
  chat.messages=advisorConversation;
  if(chat.messages.length===1){chat.title=text.slice(0,50)+(text.length>50?'…':'')}
  chat.updatedAt=Date.now();
  advRenderRail();
  const thinking=advAddMessage('ai','',true);
  const{R}=run(P);
  const liveContext=buildLiveContext(R,P);
  try{
    const res=await fetch('/api/advisor/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chatId:advisorActiveChatId,message:text,systemPrompt:liveContext,messages:advisorConversation})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||`HTTP ${res.status}`)}
    thinking.innerHTML='';
    let fullReply='';
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    outer:while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        let payload;try{payload=JSON.parse(line.slice(6))}catch{continue}
        if(payload.error)throw new Error(payload.error);
        if(payload.delta){
          fullReply+=payload.delta;
          thinking.innerHTML=advMarkdown(fullReply);
          const msgs=document.getElementById('advMsgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;
        }
        if(payload.done)break outer;
      }
    }
    const answer=fullReply||'Sorry, no response. Try again?';
    thinking.innerHTML=advMarkdown(answer);
    advisorConversation.push({role:'assistant',content:answer});
    chat.messages=advisorConversation;chat.updatedAt=Date.now();
    advRenderRail();
  }catch(err){
    thinking.innerHTML=`<p style="color:var(--r)"><strong>Error:</strong> ${advEscape(err.message)}</p><p style="font-size:11px;color:var(--t3);margin-top:4px">Check your connection and try again.</p>`;
    advisorConversation.pop();chat.messages=advisorConversation;
  }finally{
    document.getElementById('advSend').disabled=false;
    input.focus();
  }
}
