    const dpCol=dpFail==null?'var(--t3)':dpFail<10?'var(--g)':dpFail<25?'var(--a)':'var(--r)';
    const floorCol=mc.liqFloorP10>=0?'var(--g)':'var(--r)';
    const stat=(label,val,sub,col)=>`<div style="background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:9px 11px">
      <div style="font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:3px">${label}</div>
      <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:${col||'var(--tx)'}">${val}</div>
      <div style="font-size:8.5px;color:var(--t2);margin-top:1px">${sub}</div>
    </div>`;
    out.innerHTML=`<div style="margin-top:10px">
      <div style="font-size:10px;color:var(--t2);margin-bottom:8px">Net worth at ${horizon} across 800 scenarios — your single-line plan is roughly the median (P50):</div>
      <div class="pf-quad" style="margin-bottom:10px">
        ${stat('Pessimistic (P10)',fmt(mc.finalP10),'1-in-10 downside','var(--r)')}
        ${stat('Median (P50)',fmt(mc.finalP50),'expected path','var(--tx)')}
        ${stat('Optimistic (P90)',fmt(mc.finalP90),'1-in-10 upside','var(--g)')}
        ${stat('Geo. return',geomPct+'%','compounded/yr','var(--b)')}
      </div>
      <div class="pf-quad">
        ${stat('Liquid floor (P10)',fmt(mc.liqFloorP10),'lowest liquid, bad case',floorCol)}
        ${stat('Cash-crunch risk',ruin.toFixed(0)+'%',ruin<5?'very unlikely':ruin<15?'watch closely':'elevated',ruinCol)}
        ${dpFail!=null?stat('Down-payment risk',dpFail.toFixed(0)+'%',`can't cover ${P.homePurchaseYear} DP`,dpCol):stat('Down-payment risk','—','no purchase set','var(--t3)')}
        ${stat('Volatility',Math.round((mc.vol)*100)+'%','annual std dev','var(--t3)')}
      </div>
      <div style="font-size:9px;color:var(--t3);margin-top:8px;line-height:1.5">Lognormal returns calibrated so the simulated compounded growth matches your ${Math.round((P.investReturn||.06)*100)}% assumption. "Cash-crunch risk" = share of scenarios where liquid goes negative at any point; "down-payment risk" = share where liquid can't cover the down payment the year before purchase.</div>
    </div>`;
  },30);
}

function renderGoalsTab(R,P,tT){
  const ca=document.getElementById('chartArea');
  destroyCharts();
  const sy=P.planStartYear||2026;
  const now=sy; // plan start = "today" for goal countdowns

  // ── Home Purchase ──
  const dp=P.homePrice*(P.downPctg/100);
  const yearsLeft=P.homePurchaseYear-now;
  const priorRow=R.find(r=>r.yr===P.homePurchaseYear-1);
  const projLiq=priorRow?priorRow.liq:P.startingLiquid;
  const dpPct=Math.min(100,Math.round(P.startingLiquid/dp*100));
  const dpProjPct=Math.min(100,Math.round(projLiq/dp*100));
  const dpShortfall=Math.max(0,dp-projLiq);
  const dpOnTrack=projLiq>=dp;
  const dpMoNeeded=dpShortfall>0&&yearsLeft>0?Math.round(dpShortfall/yearsLeft/12):0;

  // ── Tuition ──
  const firstTuRow=R.find(r=>r.tu>0);
  const lastTuRow=[...R].reverse().find(r=>r.tu>0);
  const peakTuRow=R.reduce((a,b)=>b.tu>a.tu?b:a,R[0]);
  const yearsToTu=firstTuRow?firstTuRow.yr-now:null;
  const tuLiq=R.find(r=>r.yr===peakTuRow.yr);
  const kids=[P.kid1Birth];
  if(P.numKids>=2)kids.push(P.kid2Birth);
  if(P.numKids>=3)kids.push(P.kid3Birth);
  if(P.numKids>=4)kids.push(P.kid4Birth);

  // per-kid school windows (years only, not dollar split)
  const kidWindows=kids.map((kb,ki)=>{
    const startAge=ki===0?P.kid1YeshivaStartAge:P.yeshivaStartAge;
    const endAge=P.yeshivaEndAge;
    return{kb,startYr:kb+startAge,endYr:kb+endAge,years:endAge-startAge+1};
  });

  // ── progress bar helper ──
  function pbar(pct,color,bg){
    return `<div style="height:10px;border-radius:5px;background:${bg||'var(--s3)'};overflow:hidden;position:relative">
      <div style="height:100%;width:${pct}%;background:${color};border-radius:5px;transition:width .4s"></div>
    </div>`;
  }

  // ── surplus years liquid ladder (condensed view) ──
  const surpYrs=R.filter(r=>r.surp>=0).length;
  const defYrs=R.filter(r=>r.surp<0).length;

  // ── build HTML ──
  let h=`<div style="display:flex;flex-direction:column;gap:14px;padding:2px">`;

  // Priority action items
  const _actions=[];
  // 1. Down payment
  if(!dpOnTrack){_actions.push({icon:'🏠',color:'var(--a)',text:`Need ${fmt(dpShortfall)} more for down payment — save ~${fmt(dpMoNeeded)}/mo for ${yearsLeft} yr${yearsLeft!==1?'s':''}`});}
  else{_actions.push({icon:'🏠',color:'var(--g)',text:`Down payment funded — projected ${fmt(projLiq)} liquid covers the ${fmt(dp)} needed in ${P.homePurchaseYear}`});}
  // 2. Nancy trajectory
  const nancyMatYr=P.nancyRampYear+P.nancyRampYears;
  const nancyMatRow=R.find(r=>r.yr===nancyMatYr);
  if(nancyMatRow){_actions.push({icon:'👩‍⚕️',color:'var(--p)',text:`Nancy hits full capacity (~${fmt(Math.round(P.nancyMaxClients*P.nancyHourlyRate*P.nancyWeeksPerYear))}/yr) in ${nancyMatYr}`});}
  // 3. Liquid floor
  const minLiqRow=R.reduce((a,b)=>b.liq<a.liq?b:a,R[0]);
  if(minLiqRow.liq<500000){_actions.push({icon:'⚠️',color:'var(--r)',text:`Liquid hits floor of ${fmt(minLiqRow.liq)} in ${minLiqRow.yr} — consider increasing savings rate or deferring home purchase`});}
  else{_actions.push({icon:'💧',color:'var(--g)',text:`Liquid floor ${fmt(minLiqRow.liq)} in ${minLiqRow.yr} — above $500K safety cushion`});}
  // 4. Deficit years
  const defCount=R.filter(r=>r.surp<0).length;
  if(defCount>5){_actions.push({icon:'📉',color:'var(--r)',text:`${defCount} deficit years — plan draws down savings heavily; sensitivity to return assumptions is high`});}

  h+=`<div style="background:linear-gradient(135deg,var(--s1),var(--s2));border:1px solid var(--bd);border-radius:10px;padding:14px 16px">
    <div style="font-size:11px;font-weight:700;color:var(--tx);margin-bottom:10px;display:flex;align-items:center;gap:6px"><span>🎯</span><span>Priority Action Items</span></div>
    <div style="display:flex;flex-direction:column;gap:7px">
      ${_actions.map((a,i)=>`<div style="display:flex;align-items:flex-start;gap:8px">
        <span style="font-size:13px;flex-shrink:0;margin-top:1px">${a.icon}</span>
        <span style="font-size:11px;line-height:1.5;color:var(--t2)">${a.text}</span>
      </div>`).join('')}
    </div>
  </div>`;

  // GOAL 0: Monarch live snapshot
  if(monarchSnapshot){
    const curYr=new Date().getFullYear();
    const projRow=R.find(r=>r.yr===curYr)||R[0];
    const prevRow=R.find(r=>r.yr===curYr-1);
    const impliedLiq=monarchSnapshot.liquid;
    // The model emits year-END values, but a live snapshot is mid-year. Pro-rate the
    // plan to today: start-of-year baseline + (fraction of year elapsed) × this year's
    // projected growth. Without this, a June snapshot is measured against a Dec-31
    // finish line and always reads "behind".
    const _now=new Date(),_ys=new Date(curYr,0,1),_ye=new Date(curYr+1,0,1);
    const yrFrac=Math.min(1,Math.max(0,(_now-_ys)/(_ye-_ys)));
    const pctElapsed=Math.round(yrFrac*100);
    // Annual NW growth the plan projects for curYr — the INCREMENT only, not the absolute level.
    // This is driven purely by the plan's income/expense model for this year and is reliable
    // regardless of what starting point we use for the comparison.
    // Jan-1 baseline: always use P.startingLiquid (the user's slider input).
    // For the growth increment, use the model's prior-year row if available (multi-year plan),
    // so we capture only this year's projected change, not a stale absolute.
    const jan1Liq=P.startingLiquid||0;
    const jan1LiqBase=prevRow?prevRow.liq:jan1Liq;
    const annualLiqGrowth=projRow.liq-jan1LiqBase;
    // Pro-rated plan target: user's starting liquid + this year's pro-rated growth
    const planLiq=Math.round(jan1Liq+yrFrac*annualLiqGrowth);
    // 401k: informational only (not used in headline comparison)
    const has401k=monarchSnapshot.retirement>0;
    const live401k=has401k?monarchSnapshot.retirement:(P.k401Start||0);
    const jan1_401=prevRow?prevRow.k401:(P.k401Start||0);
    const annual401Growth=projRow.k401-jan1_401;
    const plan401=Math.round(jan1_401+yrFrac*annual401Growth);
    const diff401=live401k-plan401;
    // Headline: liquid only — 401k excluded (user tracks liquid net worth).
    const liqDiff=impliedLiq-planLiq;
    const headlineActual=impliedLiq;
    const headlinePlan=planLiq;
    const totalDiff=headlineActual-headlinePlan;
    const ahead=totalDiff>=0;
    const needsAnchor=false;
    // ── Lumpy-year guard ───────────────────────────────────────────────────
    // The plan's annual liquid delta bakes in discrete events — chiefly the home
    // down payment, which hits at a single moment, not evenly across the year.
    // Linearly pro-rating such a year produces a meaningless "pace" (you read wildly
    // ahead before the purchase, wildly behind after), so we flag it instead.
    const isDpYear=curYr===P.homePurchaseYear;
    // A "big swing" year: this year's net liquid change is large vs the starting base
    // (e.g. a heavy deficit year drawing down savings) — pro-rating is less reliable.
    const swingRatio=jan1Liq>0?Math.abs(annualLiqGrowth)/jan1Liq:0;
    const bigSwing=!isDpYear&&swingRatio>0.5;
    const unreliable=isDpYear||bigSwing;
    // Plain-language summary
    const monthName=_now.toLocaleDateString('en-US',{month:'long'});
    let plainSummary;
    if(isDpYear){
      plainSummary=`${curYr} is your planned home-purchase year — the ${fmt(dp)} down payment lands as a one-time event, so a simple "on-pace" number isn't meaningful until the purchase clears. Use the tiles below to track liquid against the full-year plan.`;
    }else if(bigSwing){
      plainSummary=`${curYr} is a high-swing year (plan moves liquid by ${annualLiqGrowth>=0?'+':''}${fmt(annualLiqGrowth)}), so mid-year pace is approximate.`;
    }else{
      plainSummary=`You're <b style="color:${ahead?'var(--g)':'var(--r)'}">${fmt(Math.abs(totalDiff))} ${ahead?'ahead of':'behind'}</b> where your plan expected your liquid net worth to be by ${monthName} ${curYr}.`;
    }
    const syncDate=new Date(monarchSnapshot.syncedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    h+=`<div style="background:var(--a-soft);border:1px solid rgba(191,105,0,.25);border-radius:10px;padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--tx)">📍 Live Snapshot · Monarch</div>
          <div style="font-size:10px;color:var(--t2);margin-top:2px">As of ${syncDate} · vs. plan pace (${pctElapsed}% through ${curYr})</div>
        </div>
        ${unreliable?`<div style="background:var(--a-soft);border:1px solid rgba(191,105,0,.3);border-radius:6px;padding:6px 12px;text-align:center;max-width:130px">
          <div style="font-size:11px;font-weight:700;color:var(--a)">⚠ Pace N/A</div>
          <div style="font-size:8px;color:var(--t3);margin-top:2px">one-time event this year</div>
        </div>`:`<div style="background:${ahead?'var(--g-soft)':'var(--r-soft)'};border:1px solid ${ahead?'rgba(26,135,84,.2)':'rgba(205,61,100,.2)'};border-radius:6px;padding:6px 12px;text-align:center">
          <div style="font-size:11px;font-weight:700;color:${ahead?'var(--g)':'var(--r)'}">${ahead?'▲ Ahead':'▼ Behind'}</div>
          <div style="font-size:14px;font-weight:700;font-family:'SF Mono',monospace;color:${ahead?'var(--g)':'var(--r)'}">${ahead?'+':''}${fmt(totalDiff)}</div>
          <div style="font-size:8px;color:var(--t3)">liquid net worth</div>
        </div>`}
      </div>
      <div style="font-size:11px;line-height:1.5;color:var(--t2);margin-bottom:10px;padding:9px 11px;background:#fff8;border-radius:7px;border-left:3px solid ${unreliable?'var(--a)':ahead?'var(--g)':'var(--r)'}">${plainSummary}</div>
      <div style="font-size:9.5px;color:var(--t2);line-height:1.6;margin-bottom:10px;padding:8px 10px;background:#fff8;border-radius:6px">
        <div><b style="color:var(--tx)">How it's calculated</b></div>
        <div style="font-family:'SF Mono',monospace;font-size:9px;margin-top:4px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px">
          <span style="color:var(--t3)">Starting Liquid (slider)</span><span style="color:var(--tx);font-weight:600">${fmt(jan1Liq)}</span>
          <span style="color:var(--t3)">Plan liq growth ${curYr}</span><span style="color:var(--tx);font-weight:600">${annualLiqGrowth>=0?'+':''}${fmt(annualLiqGrowth)} (full year)</span>
          <span style="color:var(--t3)">Pro-rated to ${pctElapsed}%</span><span style="color:var(--tx);font-weight:600">pace ${fmt(planLiq)}</span>
          <span style="color:var(--t3)">Actual liquid (Monarch)</span><span style="color:var(--tx);font-weight:600">${fmt(impliedLiq)} · <span style="color:${liqDiff>=0?'var(--g)':'var(--r)'};font-weight:700">${liqDiff>=0?'+':''}${fmt(liqDiff)}</span></span>
        </div>
      </div>
      <div class="pf-quad">
        <div style="background:#fff8;border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">Total NW</div>
          <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:var(--tx)">${fmt(monarchSnapshot.netWorth)}</div>
          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">Monarch (incl. home equity)</div>
        </div>
        <div style="background:${unreliable?'#fff8':liqDiff>=0?'var(--g-soft)':'var(--r-soft)'};border:1px solid ${unreliable?'var(--bd)':liqDiff>=0?'rgba(26,135,84,.15)':'rgba(205,61,100,.15)'};border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">Liquid (est.)</div>
          <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:var(--b)">${fmt(impliedLiq)}</div>
          ${unreliable?`<div style="font-size:8.5px;color:var(--t2);margin-top:1px">Year-end plan: ${fmt(projRow.liq)}</div>`:`<div style="font-size:8.5px;color:var(--t2);margin-top:1px">Pace: ${fmt(planLiq)} · <span style="color:${liqDiff>=0?'var(--g)':'var(--r)'};font-weight:700">${liqDiff>=0?'+':''}${fmt(liqDiff)}</span></div>`}
        </div>
        <div style="background:${diff401>=0?'var(--g-soft)':'var(--r-soft)'};border:1px solid ${diff401>=0?'rgba(26,135,84,.15)':'rgba(205,61,100,.15)'};border-radius:7px;padding:9px 11px${has401k?'':';opacity:.6'}">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">401k${has401k?'':' · not synced'}</div>
          <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:var(--p)">${fmt(live401k)}</div>
          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">${has401k?`Pace: ${fmt(plan401)} · <span style="color:${diff401>=0?'var(--g)':'var(--r)'};font-weight:700">${diff401>=0?'+':''}${fmt(diff401)}</span>`:'modeled estimate'}</div>
        </div>
        <div style="background:#fff8;border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">Home Equity (est.)</div>
          <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:var(--p)">${fmt(Math.max(0,monarchSnapshot.netWorth-(impliedLiq||0)-(live401k||0)))}</div>
          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">NW − liquid − 401k</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
        <button onclick="anchorToToday()" style="font-size:11px;font-weight:600;padding:7px 14px;background:var(--a);color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:inherit">⚓ Anchor plan to today</button>
        <span style="font-size:9.5px;color:var(--t2);line-height:1.4">Calibrates Jan-1 baseline from real Monarch data. Starting Liquid slider is not changed.</span>
      </div>
    </div>`;
  }

  // ── Risk & Confidence (Monte Carlo, on-demand) ──
  h+=`<div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px 18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-size:13px;font-weight:700;color:var(--tx)">🎲 Risk & Confidence</div>
      <button onclick="runGoalsRiskAnalysis()" style="font-size:11px;font-weight:600;padding:6px 13px;background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:inherit">Run simulation</button>
    </div>
    <div style="font-size:10.5px;color:var(--t2);line-height:1.5;margin-bottom:4px">Runs 800 market scenarios (lognormal returns, ${Math.round((P.mcVol??.14)*100)}% volatility) against your plan to show the range of outcomes — not just the single-line projection.</div>
    <div id="goalsRiskOut"></div>
  </div>`;

  // ── Planning Opportunities (advisory — does not change your plan) ──
  const _cy=new Date().getFullYear();
  const _curRow=R.find(r=>r.yr===_cy)||R[0];
  const annualExp=_curRow.totE||0;
  const ef6=Math.round(annualExp/2),ef12=Math.round(annualExp);
  const efHave=P.startingLiquid||0;
  const efOk=efHave>=ef6;
  const rothPerSpouse=7000,rothTotal=rothPerSpouse*2; // 2026 IRA limit; couple
  const ny529Deduct=10000; // NY 529 MFJ state deduction cap
  const nyMarginalState=0.0685; // approx NYS+NYC marginal for this income
  const ny529Save=Math.round(ny529Deduct*nyMarginalState);
  const totalTuition=tT||0;
  const opps=[
    {ic:'🛟',co:efOk?'var(--g)':'var(--a)',ti:'Emergency fund',
     bd:`Target <b>${fmt(ef6)}–${fmt(ef12)}</b> (6–12 mo of ${fmt(annualExp)}/yr expenses). You hold ${fmt(efHave)} liquid — ${efOk?'comfortably covered. Keep this slice in cash/T-bills, separate from invested liquid.':'consider carving out a dedicated cash reserve before investing the rest.'}`},
    {ic:'🏦',co:'var(--accent)',ti:'Backdoor Roth IRA',
     bd:`Your income is above the Roth limit, but a <b>backdoor Roth</b> lets each of you contribute <b>${fmt(rothPerSpouse)}/yr</b> (≈${fmt(rothTotal)}/yr combined) to tax-free growth. Over decades this is one of the largest tax-free buckets available to high earners.`},
    {ic:'🚀',co:'var(--p)',ti:'Mega-backdoor Roth',
     bd:`If Norm's 401k plan allows after-tax contributions + in-plan conversion, you can add up to <b>~$46k/yr</b> beyond the ${fmt(P.pretax401k||23500)} pre-tax limit, all converting to Roth. Worth confirming with the plan administrator.`},

     bd:`You're projected to pay <b>${fmt(totalTuition)}</b> in yeshiva tuition over the plan. NY 529 contributions are state-tax deductible up to <b>${fmt(ny529Deduct)}/yr</b> (~${fmt(ny529Save)}/yr saved) and grow tax-free; K-12 tuition withdrawals up to $10k/yr are federally qualified. Even short-hold 529 routing of tuition dollars captures the deduction.`},
    {ic:'📉',co:'var(--g)',ti:'Tax-loss harvesting',
     bd:`Your taxable account funds every deficit year by realizing gains (taxed at ~${Math.round((P.capGainsTaxRate||.345)*100)}%). Harvesting losses in down years banks carryforwards that offset those future gains — directly lowering the drag modeled in your deficit years.`},
    {ic:'🛡️',co:'var(--r)',ti:'Insurance gaps',
     bd:`Two dependents + a self-employed earner (Nancy) and a future suburban home argue for: <b>term life</b> on both incomes, <b>own-occupation disability</b> for Nancy's practice, and an <b>umbrella liability</b> policy. None are in the expense model — add the premiums so the plan reflects true cash flow.`},
    {ic:'🛬',co:'var(--a)',ti:'De-risk before the home purchase',
     bd:`The plan grows all liquid at a flat ${Math.round((P.investReturn||.06)*100)}% through ${P.homePurchaseYear}. Money needed for the ${fmt(dp)} down payment in ${P.homePurchaseYear} shouldn't ride the market in the final 1–2 years — shift the down-payment slice to cash/short T-bills to avoid a sequence-of-returns shortfall.`},
  ];
  h+=`<div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px 18px">
    <div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:3px">💡 Planning Opportunities</div>
    <div style="font-size:9.5px;color:var(--t3);margin-bottom:12px">Advisor-grade suggestions. These are guidance only — they don't change your plan or numbers.</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${opps.map(o=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 11px;background:var(--s2);border:1px solid var(--bd);border-left:3px solid ${o.co};border-radius:7px">
        <span style="font-size:15px;flex-shrink:0;line-height:1.3">${o.ic}</span>
        <div>
          <div style="font-size:11.5px;font-weight:700;color:var(--tx);margin-bottom:2px">${o.ti}</div>
          <div style="font-size:10.5px;color:var(--t2);line-height:1.5">${o.bd}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;

  // GOAL 1: Home purchase
  h+=`<div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px 18px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">

        <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">Projected (${P.homePurchaseYear-1})</div>

      ${pbar(dpPct,'var(--b)40','var(--s3)')}
      <div style="position:absolute;top:0;left:0;right:0;height:100%">
        <div style="height:10px;border-radius:5px;background:transparent;position:relative">

      ${dpMoNeeded>0?`<span style="color:var(--a);font-weight:600">Need ~${fmtF(dpMoNeeded)}/mo additional savings</span>`:''}
    </div>
  </div>`;

  // GOAL 2: Mortgage
  {
    const loanAmt=P.homePrice*(1-P.downPctg/100);
    const rate=P.mortgageRate/100;
    const moRate=rate/12;
    const nPmt=30*12;
    const moPmt=loanAmt>0&&moRate>0?loanAmt*(moRate*(1+moRate)**nPmt)/((1+moRate)**nPmt-1):0;

    const totalPaid=moPmt*nPmt;
    const totalInterest=totalPaid-loanAmt;
    const payoffYr=P.homePurchaseYear+30;
    // Property tax = rate × appreciating home value. Show purchase-year figure
    // in the headline (it grows with the home over time).
    const ptRate=P.propTaxRate??.012;

    const homeVal30=P.homePrice*(1+P.homeAppreciation)**30;

      const princPaid=balStart-balEnd;
      const intPaid=annPmt-princPaid;
      const hv=P.homePrice*(1+P.homeAppreciation)**y;
      mortRows.push({y,yr:P.homePurchaseYear+y,princPaid,intPaid,equity:hv-balEnd,hv});

    const eq10=mortRows[9];const eq20=mortRows[19];const eq30=mortRows[29];
    h+=`<div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px 18px">

        </div>
        <div style="text-align:right">
          <div style="font-size:20px;font-weight:700;font-family:'SF Mono',monospace;color:var(--p)">${fmtF(Math.round(moAllIn0))}/mo</div>

        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        ${[
          {l:'Principal & Interest',mo:moPmt,c:'var(--b)',s:`${P.mortgageRate}% · 30 yr`},
          {l:'Property Tax',mo:moPropTax0,c:'var(--a)',s:`${(ptRate*100).toFixed(2)}% · rises w/ value`},
          {l:'Maintenance',mo:moMaint0,c:'var(--t2)',s:'+2%/yr'},
          {l:'All-In',mo:moAllIn0,c:'var(--p)',s:`${fmtF(Math.round(moAllIn0*12))}/yr`}
        ].map(x=>`
        <div style="background:${x.l==='All-In'?'var(--s3)':'var(--s2)'};border-radius:7px;padding:9px 11px${x.l==='All-In'?';border:1px solid var(--bd)':''}">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">${x.l}</div>
          <div style="font-size:14px;font-weight:700;font-family:'SF Mono',monospace;color:${x.c}">${fmtF(Math.round(x.mo))}<span style="font-size:9px;color:var(--t3);font-weight:400">/mo</span></div>
          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">${x.s}</div>
        </div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        <div style="background:var(--s2);border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">Loan Amount</div>
          <div style="font-size:14px;font-weight:700;font-family:'SF Mono',monospace;color:var(--tx)">${fmt(loanAmt)}</div>
          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">${P.downPctg}% down</div>
        </div>
        <div style="background:var(--r-soft);border:1px solid rgba(205,61,100,.12);border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--r);margin-bottom:3px">Total Interest</div>
          <div style="font-size:14px;font-weight:700;font-family:'SF Mono',monospace;color:var(--r)">${fmt(totalInterest)}</div>
          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">${Math.round(totalInterest/P.homePrice*100)}% of price</div>
        </div>
        <div style="background:var(--s2);border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">Payoff Year</div>
          <div style="font-size:14px;font-weight:700;font-family:'SF Mono',monospace;color:var(--tx)">${payoffYr}</div>

        </div>
        <div style="background:var(--g-soft);border:1px solid rgba(26,135,84,.15);border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--g);margin-bottom:3px">Equity @ ${eq30.yr}</div>

          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">home: ${fmt(eq30.hv)}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        ${[{label:'Equity @ yr 10',r:eq10},{label:'Equity @ yr 20',r:eq20},{label:'Equity @ yr 30',r:eq30}].map(({label,r})=>`
        <div style="background:var(--s2);border-radius:6px;padding:8px 10px">
          <div style="font-size:8px;color:var(--t3);font-weight:600;margin-bottom:2px">${label} (${r.yr})</div>
          <div style="font-size:12px;font-weight:700;font-family:'SF Mono',monospace;color:var(--g)">${fmt(r.equity)}</div>

            <div style="height:100%;width:${Math.round(r.equity/maxEq*100)}%;background:var(--g);border-radius:3px"></div>
          </div>
        </div>`).join('')}
      </div>
      <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:6px">Principal vs. interest over 30 years</div>
      <div style="display:flex;gap:1px;align-items:flex-end;height:45px">
        ${mortRows.map(r=>{
          const total=r.princPaid+r.intPaid;
          const pPct=r.princPaid/total*100;
          const iPct=r.intPaid/total*100;
          return`<div title="${r.yr}: ${fmt(r.princPaid)} principal, ${fmt(r.intPaid)} interest" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%">
            <div style="width:100%;background:var(--g);height:${pPct}%;opacity:.8;border-radius:1px 1px 0 0"></div>
            <div style="width:100%;background:var(--r);height:${iPct}%;opacity:.6"></div>

      </div>
      <div style="display:flex;justify-content:space-between;font-size:8px;color:var(--t3);margin-top:3px"><span>${P.homePurchaseYear}</span><span>${payoffYr}</span></div>
      <div style="margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;font-size:8.5px;color:var(--t3)">
        <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:8px;height:8px;background:var(--g);border-radius:2px;opacity:.8"></span>Principal</span>
        <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:8px;height:8px;background:var(--r);border-radius:2px;opacity:.6"></span>Interest</span>
        <span>Hover bars for year detail</span>
        <span style="margin-left:auto">Appreciation: ${goalInlineEl('homeAppreciation',(P.homeAppreciation*100).toFixed(1)+'%/yr','pct-decimal')}</span>
      </div>
      <div style="margin-top:8px;padding:8px 10px;background:var(--s2);border-radius:7px;font-size:9px;color:var(--t2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <span>🏛 Property tax (${(ptRate*100).toFixed(2)}% of home value, grows as home appreciates)</span>
        <span style="font-family:'SF Mono',monospace"><b style="color:var(--tx)">${fmtF(Math.round(moPropTax0))}/mo</b> @ ${P.homePurchaseYear} → <b style="color:var(--tx)">${fmtF(Math.round(moPropTax30))}/mo</b> @ ${payoffYr}</span>
      </div>
    </div>`;
  }

  // GOAL 3: Tuition
  if(firstTuRow){
    const tuActive=R.filter(r=>r.tu>0);
    const tuSpan=lastTuRow.yr-firstTuRow.yr+1;
    h+=`<div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--tx)">🎓 Tuition Summit</div>
          <div style="font-size:10px;color:var(--t2);margin-top:2px">${firstTuRow.yr}–${lastTuRow.yr} · ${tuSpan} year window · ${P.numKids} kid${P.numKids!==1?'s':''} · ${goalInlineEl('yeshivaStartAge',P.yeshivaStartAge+' start age','year')}–${goalInlineEl('yeshivaEndAge',P.yeshivaEndAge+' end age','year')}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:20px;font-weight:700;font-family:'SF Mono',monospace;color:var(--r)">${fmt(tT)}</div>
          <div style="font-size:9px;color:var(--t3);margin-top:1px">total (inflated)</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
        <div style="background:var(--s2);border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">First Tuition</div>
          <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:var(--tx)">${firstTuRow.yr}</div>
          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">${yearsToTu} yrs away · ${fmt(firstTuRow.tu)}/yr</div>
        </div>
        <div style="background:var(--r-soft);border:1px solid rgba(205,61,100,.15);border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--r);margin-bottom:3px">Peak Year · ${peakTuRow.yr}</div>
          <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:var(--r)">${fmt(peakTuRow.tu)}</div>
          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">liquid then: ${fmt(tuLiq?.liq||0)}</div>
        </div>
        <div style="background:var(--s2);border-radius:7px;padding:9px 11px">
          <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">Avg Annual</div>
          <div style="font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:var(--a)">${fmt(Math.round(tT/tuActive.length))}</div>
          <div style="font-size:8.5px;color:var(--t2);margin-top:1px">over ${tuActive.length} active yrs</div>
        </div>
      </div>
      <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:7px">Annual tuition load</div>
      <div style="display:flex;gap:2px;align-items:flex-end;height:50px">
        ${R.map(r=>{
          const pct=peakTuRow.tu>0?r.tu/peakTuRow.tu*100:0;
          if(pct<=0)return`<div style="flex:1;background:transparent"></div>`;
          const numKidsInSchool=kidWindows.filter(kw=>r.yr>=kw.startYr&&r.yr<=kw.endYr).length;
          const color=numKidsInSchool>=2?'var(--r)':'var(--a)';
          return`<div title="${r.yr}: ${fmt(r.tu)}" style="flex:1;background:${color};height:${pct}%;border-radius:2px 2px 0 0;opacity:.8"></div>`;
        }).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:8px;color:var(--t3);margin-top:3px"><span>${sy}</span><span>${P.planEndYear||2058}</span></div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        ${kidWindows.map((kw,ki)=>{const bKey=['kid1Birth','kid2Birth','kid3Birth','kid4Birth'][ki];return`
        <div style="background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font-size:9.5px">
          <span style="font-weight:600;color:var(--tx)">Kid ${ki+1}</span>
          <span style="color:var(--t2)"> born ${goalInlineEl(bKey,kw.kb,'year')} · school ${kw.startYr}–${kw.endYr}</span>
          <span style="color:var(--t3)"> (${kw.years} yrs)</span>
        </div>`;}).join('')}
        ${kidWindows.length>=2?`<div style="background:var(--r-soft);border:1px solid rgba(205,61,100,.15);border-radius:6px;padding:6px 10px;font-size:9.5px;color:var(--r);font-weight:500">
          Overlap: ${Math.max(0,Math.min(...kidWindows.map(kw=>kw.endYr))-Math.max(...kidWindows.map(kw=>kw.startYr))+1)} yrs both in school
        </div>`:''}
      </div>
    </div>`;
  }

  // GOAL 4: Liquid health timeline (mini sparkline)
  h+=`<div style="background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px 18px">
    <div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:4px">💧 Liquid Health Over Time</div>
    <div style="font-size:10px;color:var(--t2);margin-bottom:12px">${surpYrs} surplus yrs · ${defYrs} deficit yrs · floor ${fmt(R.reduce((a,b)=>b.liq<a.liq?b:a).liq)} in ${R.reduce((a,b)=>b.liq<a.liq?b:a).yr}</div>
    <div style="display:flex;gap:2px;align-items:flex-end;height:60px">
      ${(()=>{const maxL=Math.max(...R.map(r=>r.liq),1);return R.map(r=>{const pct=r.liq/maxL*100;const isSurp=r.surp>=0;const color=r.liq<500000?'var(--r)':isSurp?'var(--g)':'var(--a)';return`<div title="${r.yr}: ${fmt(r.liq)} liquid${r.surp<0?' ⚠ deficit':''}" style="flex:1;background:${color};height:${Math.max(2,pct)}%;border-radius:2px 2px 0 0;opacity:.75"></div>`}).join('')})()}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:8px;color:var(--t3);margin-top:3px"><span>${sy}</span><span>${P.planEndYear||2058}</span></div>
    <div style="margin-top:6px;display:flex;gap:10px;font-size:8.5px">
      <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:8px;height:8px;background:var(--g);border-radius:2px;opacity:.75"></span>Surplus year</span>
      <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:8px;height:8px;background:var(--a);border-radius:2px;opacity:.75"></span>Deficit (selling stock)</span>
      <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:8px;height:8px;background:var(--r);border-radius:2px;opacity:.75"></span>Below $500K</span>
    </div>
  </div>`;

  h+='</div>';
  ca.innerHTML=h;
}

function renderCompareTab(R,P){
  const ca=document.getElementById('chartArea');
  destroyCharts();
  if(scenarios.length===0){
    ca.innerHTML=`<div style="text-align:center;padding:50px 30px;color:var(--t2)">
      <div style="font-size:40px;margin-bottom:14px">⚖️</div>
      <div style="font-size:15px;font-weight:700;color:var(--tx);margin-bottom:8px">No scenarios to compare yet</div>
      <p style="font-size:12.5px;line-height:1.7;max-width:420px;margin:0 auto;color:var(--t2)">
        Save a scenario using <strong>💾 Save as New</strong> in the left panel, or use the
        <strong>🤖 AI Advisor</strong> in agentic mode — it can propose plan changes and save them here automatically.
      </p>
    </div>`;
    return;
  }
  const planRes=run(P);
  const cols=[
    {name:'Current Plan',params:P,res:planRes,color:'#0a2540',isCurrent:true},
    ...scenarios.map(s=>({name:s.name,params:s.params,res:run({...D,...migrateP(s.params)}),color:s.color,isCurrent:false}))
  ];
  const METRICS=[
    {label:'NW @ 2058',get:(r,p)=>r.R[r.R.length-1].nw,fmt:fmt,b:1},
    {label:'401k @ 2058',get:(r,p)=>r.R[r.R.length-1].k401,fmt:fmt,b:1},
    {label:'Grand Total (NW + 401k)',get:(r,p)=>{const l=r.R[r.R.length-1];return l.nw+l.k401},fmt:fmt,b:1},
    {sep:true,label:'Risk'},
    {label:'Liquid Floor',get:(r,p)=>Math.min(...r.R.map(x=>x.liq)),fmt:fmt,b:1},
    {label:'Deficit Years',get:(r,p)=>r.R.filter(x=>x.surp<0).length,fmt:n=>n+' yrs',b:-1},
    {label:'Worst Year Surplus',get:(r,p)=>Math.min(...r.R.map(x=>x.surp)),fmt:fmt,b:1},
    {sep:true,label:'Milestones'},
    {label:'Liquid After Home Purchase',get:(r,p)=>{const row=r.R.find(x=>x.yr===p.homePurchaseYear);return row?row.liq:0},fmt:fmt,b:1},

async function loadAdvisorState(){

    const raw=await res.json();
    const chats=Array.isArray(raw)?raw:[];
    advisorChats={};
    chats.forEach(c=>{

async function advLoadMessages(id){

}

function advUuid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function advEscape(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function advMarkdown(text){
  // Escape the ENTIRE input first so any raw HTML in the model output or reloaded
  // chat history is inert (prevents stored XSS). Markdown tokens (* ` # | -) are
  // unaffected by escaping, so the rules below still match; inner advEscape calls
  // are no longer needed since everything is already escaped.
  let h=advEscape(text);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre>${c.trim()}</pre>`);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\n((?:\|.+\|\n)+)/g,(m,tbl)=>{
    const rows=tbl.trim().split('\n');if(rows.length<2)return m;
    const hdr=rows[0].split('|').slice(1,-1).map(c=>c.trim());
    const isSep=rows[1].match(/^[\s|:\-]+$/);
    const body=isSep?rows.slice(2):rows.slice(1);
    let t='<table><thead><tr>'+hdr.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
    body.forEach(r=>{const cells=r.split('|').slice(1,-1).map(c=>c.trim());t+='<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>'});
    return '\n'+t+'</tbody></table>';
  });
  h=h.replace(/^### (.+)$/gm,(m,t)=>`<h3>${t}</h3>`);
  h=h.replace(/^#### (.+)$/gm,(m,t)=>`<h4>${t}</h4>`);
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?:^|\n)((?:[\-\*] .+\n?)+)/g,(m,l)=>{const items=l.trim().split('\n').map(x=>x.replace(/^[\-\*] /,''));return '\n<ul>'+items.map(i=>`<li>${i}</li>`).join('')+'</ul>'});
  h=h.split('\n\n').map(p=>{p=p.trim();if(!p)return '';if(p.startsWith('<'))return p;return '<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('\n');
  return h;
}

function advAddMessage(role,content,isThinking,container){
  const msgs=container||document.getElementById('advMsgs');
  if(!msgs)return null;
  const w=msgs.querySelector('.adv-welcome');if(w)w.remove();
  const msg=document.createElement('div');
  msg.className='adv-msg '+role;
  const avatar=document.createElement('div');
  avatar.className='adv-avatar '+role;
  avatar.textContent=role==='ai'?'AI':'N';
  const bubble=document.createElement('div');
  bubble.className='adv-bubble';
  if(isThinking){bubble.innerHTML='<div class="adv-thinking"><span></span><span></span><span></span></div>'}
  else{bubble.innerHTML=role==='ai'?advMarkdown(content):`<p>${advEscape(content).replace(/\n/g,'<br>')}</p>`}
  msg.appendChild(avatar);msg.appendChild(bubble);
  msgs.appendChild(msg);
  msgs.scrollTop=msgs.scrollHeight;
  return bubble;
}

function advAsk(q){const input=document.getElementById('advInput');if(input){input.value=q;advSend()}}

async function advOptimize(){
  // Ensure agentic mode is on
  if(!advAgenticMode)advToggleAgentic();
  // Create a fresh chat for this run
  await advNewChat();
  if(!advisorActiveChatId)return;
  const prompt=`Optimize my financial plan. Follow these exact steps using your tools:

1. Call run_projection() to lock in the baseline (final NW, deficit years, worst surplus).
2. Systematically test the levers I can actually control: investReturn, normCashBase, normStockBase, nancyHourlyRate, nancyMaxClients, pretax401k, homePrice, downPctg, homePurchaseYear, expenseInflation. For each, use set_param() then run_projection() to measure the impact on final NW vs baseline.
3. Pick the top 2-3 changes with the biggest positive impact AND that are realistically achievable given my situation.
4. Apply all those changes together with set_param() calls, then run_projection() one final time to show the combined effect.
5. Call save_scenario() with a descriptive name like "Optimized: lower home + higher 401k".
6. In your final message: lead with the total NW improvement, list the 2-3 changes with individual dollar impacts, and flag any tradeoffs or risks.

Don't ask me questions — just run the analysis and deliver the recommendation.`;
  const input=document.getElementById('advInput');
  if(input){input.value=prompt;advSend();}
}

async function advAutoBrief(){
  if(!advisorActiveChatId||!advisorChats[advisorActiveChatId])return;
  const msgs=document.getElementById('advMsgs');
  if(!msgs)return;
  const thinking=advAddMessage('ai','',true);
  const{R}=run(P);
  const liveContext=buildLiveContext(R,P);
  const briefPrompt='Give me a concise quarterly check-in on my financial plan: 3-4 specific things to flag right now. Mix of what\'s on track, what needs attention, and any quick wins. Be direct and specific to my actual numbers — no generic advice.';
  const chat=advisorChats[advisorActiveChatId];
  try{
    const res=await fetch('/api/advisor/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chatId:advisorActiveChatId,message:briefPrompt,systemPrompt:liveContext,messages:[]})
    });
    if(!res.ok)throw new Error('API error '+res.status);
    thinking.innerHTML='';
    let fullReply='';
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    outer:while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        let payload;try{payload=JSON.parse(line.slice(6))}catch{continue}
        if(payload.error)throw new Error(payload.error);
        if(payload.delta){fullReply+=payload.delta;thinking.innerHTML=advMarkdown(fullReply);const m=document.getElementById('advMsgs');if(m)m.scrollTop=m.scrollHeight;}
        if(payload.done)break outer;
      }
    }
    const answer=fullReply||'(no response)';
    thinking.innerHTML=advMarkdown(answer);
    advisorConversation=[{role:'user',content:briefPrompt,hidden:true},{role:'assistant',content:answer}];
    chat.messages=advisorConversation;
    chat.title='📋 Quarterly brief';
    chat.updatedAt=Date.now();
    advRenderRail();
  }catch(e){
    if(thinking)thinking.innerHTML=`<p style="color:var(--r);font-size:11px">Couldn't connect to AI advisor. ${e.message}</p>`;
  }
}

async function advNewChat(){
  const id=advUuid();
  try{
    await fetch('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,title:'New conversation'})});
  }catch(e){}
  const now=Date.now();
  advisorChats[id]={id,title:'New conversation',messages:[],messageCount:0,createdAt:now,updatedAt:now};
  advisorActiveChatId=id;
  advisorConversation=[];
  advRenderRail();
  advRenderMessages();
  const input=document.getElementById('advInput');if(input)input.focus();
}

function advRenderRail(){
  const list=document.getElementById('advRailList');
  if(!list)return;
  const sorted=Object.values(advisorChats).sort((a,b)=>b.updatedAt-a.updatedAt);
  if(sorted.length===0){
    list.innerHTML=`<div class="adv-rail-empty">No conversations yet.<br>Click "+ New" to start.</div>`;
    return;
  }
  list.innerHTML=sorted.map(c=>{
    const rel=advRelTime(c.updatedAt);
    const cnt=c.messages.length||c.messageCount||0;
    return `<div class="adv-rail-item ${c.id===advisorActiveChatId?'active':''}" onclick="advSwitchChat('${c.id}')">
      <div class="adv-rail-title">${advEscape(c.title)}</div>
      <div class="adv-rail-meta">
        <span>${cnt} msg${cnt===1?'':'s'}</span>
        <span>${rel}</span>
      </div>
      <div class="adv-rail-actions">
        <button onclick="event.stopPropagation();advRenameChat('${c.id}')" title="Rename">✎</button>
        <button class="del" onclick="event.stopPropagation();advDeleteChat('${c.id}')" title="Delete">×</button>
      </div>
    </div>`;
  }).join('');
}

function advRelTime(ts){
  const diff=Date.now()-ts;
  const min=Math.floor(diff/60000);
  if(min<1)return 'now';
  if(min<60)return min+'m';
  const hr=Math.floor(min/60);
  if(hr<24)return hr+'h';
  const d=Math.floor(hr/24);
  if(d<7)return d+'d';
  const w=Math.floor(d/7);
  if(w<4)return w+'w';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

async function advSwitchChat(id){
  if(!advisorChats[id])return;
  advisorActiveChatId=id;
  if(!advisorChats[id].messages||advisorChats[id].messages.length===0){
    await advLoadMessages(id);
  }
  advisorConversation=advisorChats[id].messages||[];
  advRenderRail();
  advRenderMessages();
}

async function advRenameChat(id){
  const c=advisorChats[id];if(!c)return;
  const t=prompt('Rename conversation:',c.title);
  if(t&&t.trim()){
    c.title=t.trim().slice(0,80);c.updatedAt=Date.now();
    fetch('/api/chats/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:c.title})}).catch(()=>{});
    advRenderRail();
  }
}

async function advDeleteChat(id){
  const c=advisorChats[id];if(!c)return;
  if(!confirm(`Delete "${c.title}"? This cannot be undone.`))return;
  fetch('/api/chats/'+id,{method:'DELETE'}).catch(()=>{});
  delete advisorChats[id];
  if(advisorActiveChatId===id){
    advisorActiveChatId=null;
    advisorConversation=[];
    advRenderMessages();
  }
  advRenderRail();
}

function advImportChats(){
  const input=document.createElement('input');
  input.type='file';input.accept='application/json,.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.chats||typeof data.chats!=='object')throw new Error('Invalid file format');
        const incoming=Object.values(data.chats);
        if(!confirm(`Import ${incoming.length} conversation${incoming.length===1?'':'s'}? Merges with existing chats.`))return;
        let imported=0;
        const promises=[];
        Object.entries(data.chats).forEach(([id,chat])=>{
          if(chat.id&&chat.messages&&Array.isArray(chat.messages)){
            const newId=advisorChats[id]?advUuid():id;
            advisorChats[newId]={...chat,id:newId,messages:chat.messages,messageCount:chat.messages.length,createdAt:chat.createdAt||Date.now(),updatedAt:chat.updatedAt||Date.now()};
            promises.push(fetch('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:newId,title:chat.title||'Imported chat'})})
              .then(()=>fetch('/api/chats/'+newId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chat.messages})}))
              .catch(()=>{}));
            imported++;
          }
        });
        Promise.all(promises).then(()=>{advRenderRail();alert(`Imported ${imported} conversation${imported===1?'':'s'}.`)});
      }catch(err){alert('Failed to import: '+err.message)}
    };
    reader.readAsText(file);
  };
  input.click();
}

function advExportChats(){
  const data={exportedAt:new Date().toISOString(),chats:advisorChats};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`advisor-chats-${new Date().toISOString().slice(0,10)}.json`;a.click();
}

async function advSend(){
  const input=document.getElementById('advInput');
  const text=input.value.trim();
  if(!text)return;
  if(!advisorActiveChatId||!advisorChats[advisorActiveChatId]){
    await advNewChat();
    if(!advisorActiveChatId)return;
  }
  input.value='';input.style.height='auto';
  document.getElementById('advSend').disabled=true;
  advAddMessage('user',text);
  advisorConversation.push({role:'user',content:text});
  const chat=advisorChats[advisorActiveChatId];
  chat.messages=advisorConversation;
  if(chat.messages.length===1){chat.title=text.slice(0,50)+(text.length>50?'…':'')}
  chat.updatedAt=Date.now();
  advRenderRail();
  const thinking=advAddMessage('ai','',true);
  const{R}=run(P);
  const liveContext=buildLiveContext(R,P);
  if(advAgenticMode){
    await advSendAgentic(text,chat,liveContext,thinking);
  } else {
    await advSendStream(text,chat,liveContext,thinking);
  }
}

async function advSendStream(text,chat,liveContext,thinking){
  try{
    const res=await fetch('/api/advisor/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chatId:advisorActiveChatId,message:text,systemPrompt:liveContext,messages:advisorConversation})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||`HTTP ${res.status}`)}
    thinking.innerHTML='';
    let fullReply='';
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    outer:while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        let payload;try{payload=JSON.parse(line.slice(6))}catch{continue}
        if(payload.error)throw new Error(payload.error);
        if(payload.delta){
          fullReply+=payload.delta;
          thinking.innerHTML=advMarkdown(fullReply);
          const msgs=document.getElementById('advMsgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;
        }
        if(payload.done)break outer;
      }
    }
    const answer=fullReply||'Sorry, no response. Try again?';
    thinking.innerHTML=advMarkdown(answer);
    advisorConversation.push({role:'assistant',content:answer});
    chat.messages=advisorConversation;chat.updatedAt=Date.now();
    advRenderRail();
  }catch(err){
    thinking.innerHTML=`<p style="color:var(--r)"><strong>Error:</strong> ${advEscape(err.message)}</p><p style="font-size:11px;color:var(--t3);margin-top:4px">Check your connection and try again.</p>`;
    advisorConversation.pop();chat.messages=advisorConversation;
  }finally{
    document.getElementById('advSend').disabled=false;
    const inp=document.getElementById('advInput');if(inp)inp.focus();
  }
}

async function advSendAgentic(text,chat,liveContext,thinking){
  const toolLog=[]; // collected tool_call events for the proposals panel
  try{
    const res=await fetch('/api/advisor/agentic',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chatId:advisorActiveChatId,message:text,systemPrompt:liveContext,messages:advisorConversation,currentParams:{...P}})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||`HTTP ${res.status}`)}
    thinking.innerHTML='';
    let fullReply='';
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    outer:while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        let payload;try{payload=JSON.parse(line.slice(6))}catch{continue}
        if(payload.error)throw new Error(payload.error);
        if(payload.delta){
          fullReply+=payload.delta;
          thinking.innerHTML=advMarkdown(fullReply);
          const msgs=document.getElementById('advMsgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;
        }
        if(payload.tool_call){
          toolLog.push(payload.tool_call);
          advInsertToolCallBubble(payload.tool_call);
        }
        if(payload.done){
          advPendingProposals=payload.proposedChanges&&payload.proposedChanges.length>0?{changes:payload.proposedChanges,aiParams:payload.aiParams}:null;
          break outer;
        }
      }
    }
    const answer=fullReply||'';
    if(answer)thinking.innerHTML=advMarkdown(answer);
    else if(thinking.innerHTML==='')thinking.remove();
    if(advPendingProposals)advShowProposals(advPendingProposals,chat.title);
    advisorConversation.push({role:'assistant',content:answer||'[Agentic analysis complete]'});
    chat.messages=advisorConversation;chat.updatedAt=Date.now();
    advRenderRail();
  }catch(err){
    thinking.innerHTML=`<p style="color:var(--r)"><strong>Error:</strong> ${advEscape(err.message)}</p><p style="font-size:11px;color:var(--t3);margin-top:4px">Check your connection and try again.</p>`;
    advisorConversation.pop();chat.messages=advisorConversation;
  }finally{
    document.getElementById('advSend').disabled=false;
    const inp=document.getElementById('advInput');if(inp)inp.focus();
  }
}

function advInsertToolCallBubble(tc){
  const msgs=document.getElementById('advMsgs');if(!msgs)return;
  const div=document.createElement('div');div.className='adv-tool-call';
  let body='';
  if(tc.name==='set_param'){
    const old=tc.oldValue!==undefined?`<span class="tc-old">${advEscape(String(tc.oldValue))}</span> → `:'';
    body=`<strong>set_param</strong>: <code>${advEscape(tc.key)}</code> ${old}<strong>${advEscape(String(tc.value))}</strong>${tc.reason?` — <em>${advEscape(tc.reason)}</em>`:''}`;
  } else if(tc.name==='run_projection'){
    const r=tc.result||{};
    body=`<strong>run_projection</strong>: NW@2058 ${fmt(r.finalNW||0)} · Liquid${fmt(r.finalLiquid||0)} · Deficit yrs ${r.deficitYears||0}`;
  } else if(tc.name==='save_scenario'){
    body=`<strong>save_scenario</strong>: proposing "<em>${advEscape(tc.scenarioName||'')}</em>"`;
  }
  div.innerHTML=`<span class="tc-icon">🔧</span><span class="tc-body">${body}</span>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}

function advShowProposals(proposals,chatTitle){
  const msgs=document.getElementById('advMsgs');if(!msgs)return;
  const el=document.createElement('div');el.className='adv-proposals';el.id='advProposalsPanel';
  const fmtVal=(key,v)=>{
    if(['investReturn','expenseInflation','tuitionInflation','homeAppreciation','normGrowth','capGainsTaxRate'].includes(key))return(v*100).toFixed(1)+'%';
    if(['homePrice','startingLiquid','normCashBase','normStockBase','pretax401k'].includes(key))return fmt(v);
    return String(v);
  };
  const rows=proposals.changes.map(c=>`<div class="adv-proposal-row">
    <span class="adv-proposal-key">${advEscape(c.key)}</span>
    <span class="adv-proposal-old">${fmtVal(c.key,c.oldValue)}</span>
    <span class="adv-proposal-arrow">→</span>
    <span class="adv-proposal-new">${fmtVal(c.key,c.value)}</span>
    <span class="adv-proposal-reason">${advEscape(c.reason||'')}</span>
  </div>`).join('');
  const scenarioName='AI Advisor — '+(chatTitle||'analysis').slice(0,40);
  el.innerHTML=`
  <div class="adv-proposals-hdr">
    <h4>🤖 ${proposals.changes.length} proposed change${proposals.changes.length===1?'':'s'}</h4>
    <button onclick="document.getElementById('advProposalsPanel').remove()">✕</button>
  </div>
  <div class="adv-proposal-list">${rows}</div>
  <div class="adv-proposals-actions">
    <button class="adv-proposals-save" onclick="advAcceptProposals('${advEscape(scenarioName).replace(/'/g,"\\'")}')">💾 Save as scenario</button>
    <button class="adv-proposals-view" onclick="advPreviewProposals()">👁 Preview on chart</button>
  </div>`;
  msgs.appendChild(el);msgs.scrollTop=msgs.scrollHeight;
}

async function advAcceptProposals(name){
  if(!advPendingProposals)return;
  const aiP={...D,...migrateP({...advPendingProposals.aiParams})};
  const id=advUuid();
  const s={id,name,params:aiP,results:run(aiP),color:COLORS[scenarios.length%COLORS.length]};
  scenarios.push(s);
  activeScenarioIdx=scenarios.length-1;
  fetch('/api/scenarios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:s.id,name:s.name,color:s.color,params:s.params})}).catch(()=>{});
  savePlannerState();
  document.getElementById('advProposalsPanel')?.remove();
  advPendingProposals=null;
  showToast('✓ Saved advisor scenario: "'+name+'" — switch to Charts → Compare to see it','green');
  buildControls();render();
}

function advPreviewProposals(){
  if(!advPendingProposals)return;
  const aiP={...D,...migrateP({...advPendingProposals.aiParams})};
  const tmp=P;P=aiP;
  activeTab='nw';
  document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='nw'));
  render();
  P=tmp;
  showToast('Showing AI-proposed plan on chart. Your actual plan is unchanged.','green');
}
