}
function setStripeObserved(v){
  const m=parseInt(v,10);
  if(isNaN(m))delete P.stripeObservedMonth;else P.stripeObservedMonth=m;
  savePlannerState();render();
}
// ── Stripe equity dashboard ──────────────────────────────────────────────
// The private-company CFO view: what vested, what became cash, what compounded, and how
// concentrated the household has become as a result.
function renderStripeTab(R,P){
  if(stripeWorkspace!=='overview'){renderStripeWorkspace(R);return;}
  const ca=document.getElementById('chartArea');
  const sy=P.planStartYear||2026;
  const yr=(_stripeYear&&R.some(r=>r.yr===_stripeYear))?_stripeYear:sy;
  const row=R.find(r=>r.yr===yr)||R[0];
  const last=R[R.length-1];
  const tot=R.reduce((a,r)=>({n:a.n+r.sNew,s:a.s+r.sSold,k:a.k+r.sRet,h:a.h+(r.sHold||0),gt:a.gt+(r.sTotalGainTax??r.sGainTax??0)}),{n:0,s:0,k:0,h:0,gt:0});
  const basis=last.sBasis,appr=last.sEnd-basis;
  const V='#6772e5';
  const hasAny=tot.n>0||(P.startingStripeEquity||0)>0;

  // Waterfall proportions for the selected year
  const newEq=P.stripeGrants?.enabled?row.sAvailable:row.sNew,soldPct=newEq>0?row.sSold/newEq*100:0,keptPct=100-soldPct;
  // What this year's retained stock is worth at the end of the plan, compounding forward
  // at each year's own assumed rate.
  // Retained stock sits at the Feb-yr mark. Its first re-mark is Feb yr+1, which carries
  // THIS row's rate — so the window starts at this row and ends one short of the last,
  // whose own rate is only marked in the February after the plan ends.
  let fv=P.stripeGrants?.enabled?row.sAdded:row.sRet;
  for(let i=R.indexOf(row);i<R.length-1;i++)fv*=(1+R[i].sRate);

  const tile=(lbl,val,sub,col)=>`<div class="kpi" style="border-color:${col?'rgba(103,114,229,.25)':'var(--bd)'}">
    <div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:3px">${lbl}</div>
    <div style="font-size:17px;font-weight:800;font-family:'SF Mono',ui-monospace,monospace;color:${col||'var(--tx)'};letter-spacing:-.4px">${val}</div>
    ${sub?`<div style="font-size:8.5px;color:var(--t3);margin-top:2px">${sub}</div>`:''}
  </div>`;

  let h=stripeWorkspaceNav()+stripeGrantIntro();
  if(!hasAny){
    h+=`<div class="sc" style="margin-bottom:12px;border-color:rgba(103,114,229,.25)">
      <h3>◆ No Stripe equity in this plan</h3>
      <p style="line-height:1.6">Your plan currently models no existing Stripe holdings and no stock grants. Add a grant under <strong>Norm — Compensation</strong>, or set <strong>Existing Stripe equity</strong> in the Stripe panel.<br>
      <em style="font-size:8px;color:var(--t3)">If your Stripe balance is already inside Starting Liquid, use the reclassify action in that panel — it moves the money without changing your net worth.</em></p>
    </div>`;
  }

  h+=`<header class="ui-head ui-rise"><div>
      <span class="ui-eyebrow">CONCENTRATED POSITION</span>
      <h2>Your Stripe equity.</h2>
    </div><div class="ui-head-actions">
      <label class="sq-year">Year
        <select onchange="setStripeYear(this.value)">
          ${R.map(r=>`<option value="${r.yr}"${r.yr===yr?' selected':''}>${r.yr}</option>`).join('')}
        </select></label>
    </div></header>`;

  // Stripe has no continuous price: it is marked at the February tender and holds that mark
  // until the next one. Saying so on the dashboard is what makes the arithmetic add up in
  // the eyes of someone who knows their own vesting calendar.
  const MONTH_NAMES=['','January','February','March','April','May','June','July','August','September','October','November','December'];
  const obsMonth=P.stripeObservedMonth;
  const obsLabel=obsMonth?MONTH_NAMES[obsMonth]+' '+sy:'Feb '+sy;
  if(yr===sy&&row.sInOpening>0){
    h+=`<div class="sc" style="margin-bottom:10px;border-color:rgba(103,114,229,.3);background:rgba(103,114,229,.04)">
      <p style="line-height:1.6;font-size:10px">Your position was observed in <strong>${obsLabel}</strong>, so it already contains
      <strong>${fmt(row.sInOpening)}</strong> of ${sy}'s vest from vests already received. Only the
      <strong>${fmt(row.sAdded)}</strong> still to vest is added on top; counting the whole ${fmt(row.sNew)} grant again
      would double-count what you already hold. The full grant is still taxed as ${sy} income.</p>
    </div>`;
  }
  // Thirteen figures of equal weight is a spreadsheet, not a dashboard. Three lead —
  // what you hold, how concentrated that makes you, and what the next tender marks it at
  // — and the rest becomes the definition list it always was underneath.
  h+=`<section class="sq-lead ui-rise ui-rise-2">
    <div class="sq-figure">
      <span class="ui-eyebrow">Position${yr>sy?' · start of '+yr:' · as observed'}</span>
      <strong class="ui-num">${UI.money(row.sBeg)}</strong>
      <small>${yr>sy?'carried in from '+(yr-1):'at the '+obsLabel+' mark'}</small>
    </div>
    <div class="sq-figure"${row.sPct>0.5?' data-tone="warn"':''}>
      <span class="ui-eyebrow">Share of net worth</span>
      <strong class="ui-num">${UI.pct(row.sPct,0)}</strong>
      <small>${UI.money(row.sEnd)} of ${UI.money(row.nw)}${row.sPct>0.5?' · one company, most of your wealth':''}</small>
    </div>
    ${(()=>{
      // sEnd is the position at THIS February's mark: the year's vests have landed and any
      // sales have executed, but the year's performance has not been marked yet — a private
      // position only re-prices at a tender. So the next tender's value is sEnd grown by
      // this year's return. Showing sEnd here labelled "after X% return" printed the
      // pre-bump number under a post-bump caption.
      const next=Math.round(row.sEnd*(1+row.sRate));
      return `<div class="sq-figure">
      <span class="ui-eyebrow">At the next tender</span>
      <strong class="ui-num">${UI.money(next)}</strong>
    </div>`;})()}
  </section>`;

  h+=`<details class="polish-fold"><summary>Vest details · ${yr}</summary><dl class="sq-facts">
    <div><dt>Stock income in ${yr}</dt><dd class="ui-num">${UI.money(row.sGross)}</dd></div>
    <div><dt>Withheld at vest</dt><dd class="ui-num">${UI.money(row.sVestTax)} <em>${(row.sVestRate*100).toFixed(0)}%</em></dd></div>
    <div><dt>Reached your account</dt><dd class="ui-num">${UI.money(row.sNew)}${P.stripeGrants?.enabled?' <em>tender value</em>':''}</dd></div>
    <div><dt>Sold at tender value</dt><dd class="ui-num">${UI.money(row.sSold)}${row.sNew>0?` <em>${soldPct.toFixed(0)}% of the vest</em>`:''}</dd></div>
    <div><dt>Added to holdings</dt><dd class="ui-num">${UI.money(row.sAdded??row.sRet)}</dd></div>
    ${row.sInOpening>0?`<div><dt>Already in the opening balance</dt><dd class="ui-num">${UI.money(row.sInOpening)}</dd></div>`:''}
  </dl></details>`;
  if(row.sHold>0){
    h+=`<div class="sc" style="margin-bottom:12px;border-color:rgba(103,114,229,.3)">
      <h3>◆ Held shares sold in ${yr}</h3>
      <p style="line-height:1.6">This year's vest and the portfolio (down to its ${fmt(P.liquidReserveFloor??D.liquidReserveFloor)} reserve floor) still left ${fmt(row.need-row.sSold)} uncovered, so <strong style="color:#6772e5">${fmt(row.sHold)}</strong> of Stripe you already held was sold — realising <strong>${fmt(row.sGainTax)}</strong> of capital-gains tax, just <strong>${(row.sGainTax/row.sHold*100).toFixed(1)}%</strong> of the proceeds.
      <br><br>That rate is low because the sale takes your <em>least appreciated</em> lots first: the newest shares carry almost no gain above their vest price, so they cost almost nothing in tax to sell. A sale at the vest-date FMV has no additional gain; this is the next cheapest thing.</p>
    </div>`;
  }

  // ── Waterfall ──
  if(row.sNew>0){
    // The bar this replaces had one segment in most years, and a chart of a single value
    // is decoration rather than information. The sentence was always the better artefact:
    // it reads as arithmetic, and every figure in it is checkable. The strip beneath it
    // carries the proportion without pretending to be a chart of its own.
    h+=`<section class="sq-flow">
      <span class="ui-eyebrow">Where ${yr}’s vest went</span>
      <p class="sq-sentence">
        <b class="ui-num">${UI.money(row.sNew)}</b> reached your account${P.stripeGrants?.enabled&&row.sInOpening>0?` (${UI.money(row.sAvailable)} still to vest)`:""}
        <i>→</i> <b class="ui-num" data-tone="spend">${UI.money(row.sSold)}</b> covered ${row.need>0?`a ${UI.money(row.need)} cash need`:'cash needs'}
        <i>→</i> <b class="ui-num" data-tone="keep">${UI.money(P.stripeGrants?.enabled?row.sAdded:row.sRet)}</b> kept
        ${row.sRet>0&&R.indexOf(row)<R.length-1?`<i>→</i> worth <b class="ui-num">${UI.money(Math.round(fv))}</b> by ${last.yr}`:''}
      </p>
      ${row.sSold>0||row.sRet>0?`<div class="sq-split" role="img" aria-label="${soldPct.toFixed(0)} per cent taken as cash, ${keptPct.toFixed(0)} per cent retained">
        ${row.sSold>0?`<span data-tone="spend" style="flex:${soldPct}"></span>`:''}
        ${row.sRet>0?`<span data-tone="keep" style="flex:${keptPct}"></span>`:''}
      </div>`:''}
      ${row.sNewSaleTax>0?`<p class="sq-note">${UI.money(row.sNewSaleTax)} estimated capital-gains tax on new shares sold; net cash proceeds ${UI.money(row.sSold-row.sNewSaleTax)}.</p>`:''}
      ${row.dpOut>0?`<p class="sq-note">Includes the ${UI.money(row.dpOut)} down payment — a real cash outflow, so vesting stock helps fund it.</p>`:''}
      ${row.sold>0?`<p class="sq-note" data-tone="warn">The year’s vest wasn’t enough — a further ${UI.money(row.sold)} came out of the diversified portfolio.</p>`:''}
    </section>`;
  }

  // ── Cumulative ──
  // Lifetime totals are reference, not headline. Colour is reserved for the two figures
  // where it means something — appreciation is a gain, tax on it is a cost — so the rest
  // read as the neutral facts they are.
  h+=`<details class="sq-totals polish-fold">
    <summary>Lifetime totals · ${sy}–${last.yr}</summary>
    <dl class="sq-facts">
      <div><dt>Stock received</dt><dd class="ui-num">${UI.money(tot.n)}</dd></div>
      <div><dt>Sold for cash</dt><dd class="ui-num">${UI.money(tot.s)}${tot.n>0?` <em>${(tot.s/tot.n*100).toFixed(0)}% of all vesting</em>`:''}</dd></div>
      <div><dt>Retained</dt><dd class="ui-num">${UI.money(tot.k)} <em>at vest-date value</em></dd></div>
      <div><dt>Appreciation</dt><dd class="ui-num" data-tone="gain">${UI.money(appr)} <em>above ${UI.money(basis)} of basis</em></dd></div>
      <div><dt>Sold from holdings</dt><dd class="ui-num">${UI.money(tot.h)} <em>${tot.h>0?'to defend the liquid floor':'never needed'}</em></dd></div>
      <div><dt>Tax on those gains</dt><dd class="ui-num"${tot.gt>0?' data-tone="cost"':''}>${UI.money(tot.gt)}</dd></div>
      <div><dt>Position at ${last.yr}</dt><dd class="ui-num">${UI.money(last.sEnd)} <em>${UI.pct(last.sPct,0)} of net worth</em></dd></div>
    </dl>
  </details>`;

  // The waterfall never auto-sells previously retained or pre-existing Stripe. That is
  // deliberate, but it means a plan CAN drive the diversified pool below zero while a large
  // Stripe balance sits untouched — an implicit unlimited overdraft. Say so plainly rather
  // than letting a negative "liquid floor" sit quietly next to an eight-figure equity line.
  const broke=R.filter(r=>r.liq<0);
  if(broke.length){
    const worst=R.reduce((a,b)=>b.liq<a.liq?b:a);
    h+=`<div class="sc" style="margin-bottom:12px;border-color:rgba(205,61,100,.45);background:rgba(205,61,100,.06)">
      <h3 style="color:#cd3d64">⚠️ The plan runs out of spendable money</h3>
      <p style="line-height:1.6">Diversified liquid goes negative in <strong>${broke.length}</strong> ${broke.length===1?'year':'years'}, bottoming at <strong>${fmt(worst.liq)}</strong> in ${worst.yr}.
      <br><br>This only happens once the vest, the portfolio and every Stripe share you hold have all been exhausted — so it is genuine insolvency, not a modelling artefact. Raise cash comp, cut spending, or move the home purchase.</p>
    </div>`;
  }

  if(row.sPct>0.5){
    h+=`<div class="sc" style="margin-bottom:12px;border-color:rgba(205,61,100,.3);background:rgba(205,61,100,.04)">
      <h3 style="color:#cd3d64">⚠️ Concentration</h3>
      <p style="line-height:1.6">Stripe is <strong>${(row.sPct*100).toFixed(0)}%</strong> of net worth in ${yr}. That is a single private position you cannot freely sell, priced off assumptions you set yourself — not a diversified holding. Compare a <em>Sell a fixed %</em> or <em>Maintain a liquid floor</em> policy to see the tradeoff.</p>
    </div>`;
  }

  // ── Auditable year-by-year ledger ──
  h+=`<details class="polish-fold refine-fold"><summary>Annual equity ledger · ${sy}–${last.yr}</summary><div class="tw"><table><thead><tr>${['Year','Beginning','New equity','Vest sold','Held sold','Gains tax','Appreciation','Ending','% of NW','Return'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${
    R.map(r=>`<tr style="background:${r.yr===yr?'rgba(103,114,229,.07)':''}">
      <td style="font-weight:700;color:var(--tx)">${r.yr}</td>
      <td>${fmt(r.sBeg)}</td>
      <td style="color:${V}">${r.sNew>0?fmt(r.sNew):'—'}</td>
      <td style="color:${r.sSold>0?'#cd3d64':'var(--t3)'}">${r.sSold>0?fmt(r.sSold):'—'}</td>
      <td style="color:${r.sHold>0?'#cd3d64':'var(--t3)'};font-weight:${r.sHold>0?600:400}">${r.sHold>0?fmt(r.sHold):'—'}</td>
      <td style="color:${(r.sTotalGainTax??r.sGainTax)>0?'var(--r)':'var(--t3)'}">${(r.sTotalGainTax??r.sGainTax)>0?fmt(r.sTotalGainTax??r.sGainTax):'—'}</td>
      <td style="color:${r.sAppr>=0?'var(--g)':'var(--r)'}">${r.sAppr>=0?'+':'−'}${fmt(Math.abs(r.sAppr))}</td>
      <td style="color:${V};font-weight:600">${fmt(r.sEnd)}</td>
      <td>${(r.sPct*100).toFixed(0)}%</td>
      <td style="color:var(--t3)">${(r.sRate*100).toFixed(0)}%</td>
    </tr>`).join('')}</tbody></table></div></details>`;

  ca.innerHTML=h;
  document.getElementById('summaries').innerHTML=`<details class="polish-fold refine-fold"><summary>Vesting, tax & valuation assumptions</summary><p>Manual stock compensation is gross value at vesting. Withholding and sales reduce the stock retained; the remainder enters your holdings once. Stripe growth is marked at the following February tender. Diversified investments use their separate return assumption.</p></details>`;
}

// Actual synced Stripe balance vs. the plan's assumption. Synced values are shown, never
// silently written — the planning input stays under the user's control.

// Monarch's "liquid" total sums every non-retirement account, which INCLUDES the Stripe
// brokerage account. The plan now splits that same money into a diversified pool and a
// Stripe pool, so the like-for-like plan figure is the two added back together. Comparing
// against r.liq alone would show the household as wildly ahead of plan.
function planLiquidComparable(r){return (r?r.liq:0)+(r?r.sEnd:0)}

// Shared donut builder. The portfolio already had one hand-rolled doughnut; every pie added
// since routes through here so legends, tooltips and in-slice labels stay consistent.
function makeDonut(canvasId,labels,data,colors,fmtVal,showLegend){
  const el=document.getElementById(canvasId);
  if(!el||!data.length)return null;
  const total=data.reduce((a,b)=>a+b,0);
  const pctOf=v=>total>0?v/total*100:0;
  return new Chart(el.getContext('2d'),{
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors.slice(0,data.length),borderWidth:2,borderColor:'rgba(255,255,255,.85)'}]},
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'60%',
      plugins:{
        // Off where the card already lists each slice with its dollar value — two legends
        // for one chart is noise, and the itemised one carries strictly more information.
        legend:{display:showLegend===true,position:'bottom',labels:{font:{size:9.5,family:"'Inter',sans-serif"},color:'#c8d5e8',padding:12,
          usePointStyle:true,pointStyle:'circle',boxWidth:7,boxHeight:7,
          generateLabels:chart=>{const ds=chart.data.datasets[0];
            return chart.data.labels.map((lbl,i)=>({text:`${lbl} ${pctOf(ds.data[i]).toFixed(0)}%`,
              fillStyle:ds.backgroundColor[i],strokeStyle:'transparent',hidden:false,index:i}));}}},
        tooltip:{..._GLASS_TOOLTIP,callbacks:{label:ctx=>`  ${ctx.label}: ${(fmtVal||fmt)(ctx.raw)} (${pctOf(ctx.raw).toFixed(1)}%)`}},
        datalabels:{color:'#fff',font:{size:9.5,weight:'bold',family:"'Inter',sans-serif"},
          formatter:v=>pctOf(v)>=7?pctOf(v).toFixed(0)+'%':'',anchor:'center',align:'center'},
      }
    },
    plugins:[ChartDataLabels]
  });
}

// ── Spending & cash flow ─────────────────────────────────────────────────
// Reads the synced transaction ledger through the shared accounting model, so the browser
// and the server can never disagree about what counts as spending. Everything here leads
// with coverage: a number computed over four months of history is not the same claim as one
// computed over twelve, and the view says which it is making.
// ── Overview: the two-minute read ────────────────────────────────────────
// Every figure is labelled with what kind of claim it is. An observed balance, a fact you
// confirmed, and a model projection are three different things, and rendering them
// identically is misleading even when each number is right.
let _ovw=null,_ovwLoading=false,_hist=null;
const PROV={
  observed:{icon:'◉',label:'Observed',color:'var(--b)',hint:'read from your accounts'},
  entered:{icon:'✎',label:'You confirmed',color:'var(--a)',hint:'entered or confirmed by you'},
  projected:{icon:'◇',label:'Projected',color:'var(--p)',hint:'produced by the plan model'},
};
function provChip(kind,asOf,compact=false){
  const p=PROV[kind];if(!p)return'';
  const when=asOf?PlannerTime.formatDate(asOf,{month:'short',day:'numeric'}):null;
  const text=compact?`${p.icon} ${when||p.label}`:`${p.icon} ${p.label}${when?' · '+when:''}`;
  return `<span class="overview-provenance" title="${p.hint}${when?' · '+when:''}" style="--prov:${p.color}">${text}</span>`;
}

async function loadOverview(){
  if(_demoMode)return;
  if(_ovwLoading)return;_ovwLoading=true;
  try{
    const [r,hr]=await Promise.all([fetch('/api/accounts/overview',{signal:AbortSignal.timeout(20000)}),fetch('/api/wealth/history',{signal:AbortSignal.timeout(20000)}).catch(()=>null)]);
    if(_demoMode){_ovwLoading=false;return}
    _ovw=r.ok?await r.json():{error:(await r.json().catch(()=>({}))).error||'unavailable'};
    _hist=hr?.ok?await hr.json().catch(()=>null):null;
  }catch(e){_ovw={error:e.message};}
  _ovwLoading=false;
  syncOpeningFromAccounts();
  if(activeTab==='cockpit'||(activeTab==='today'&&_todayView==='overview'))render();
}

// The opening figures follow the accounts rather than being typed twice. This runs whenever
// a fresh reading arrives; every rule about when it must NOT follow lives in opening.js, so
// this only has to decide what to do about the answer.
function syncOpeningFromAccounts(){
  if(!window.PlannerOpening||!_planLoaded)return;
  const d=_ovw,sm=d&&d.summary;
  const available=!!sm&&!d.error&&d.capabilities?.balances?.available===true;
  const out=PlannerOpening.syncOpening(P,sm,available);
  if(!out.dirty)return;
  // Writing into P rather than overlaying at render time, so every screen, scenario and
  // saved snapshot reads one number. It is not silent: each field says where it came from
  // and when, and any of them can be taken back by hand.
  P=out.P;
  // The balances were true on the date the accounts were READ, which is not necessarily
  // today — a week-old snapshot stamped with today would claim currency it does not have,
  // and would shorten the stub year by the days in between.
  if(d&&d.asOf){
    const iso=String(d.asOf).slice(0,10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)&&Number(iso.slice(0,4))===(P.planStartYear||2026))P.observedOn=iso;
  }
  // Deliberately NOT markDirty(). This is an observation refreshing itself, not an edit to
  // the case's assumptions — and since the opening figures now re-read on every load,
  // marking dirty here would leave "unsaved edits" showing permanently, for a change the
  // reader never made. That is how an indicator stops meaning anything.
  rebuildScenarioResults();
  buildControls();savePlannerState();
  const names=out.changed.map(c=>c.label).join(', ');
  showToast(`Opening balances updated from your accounts: ${names}`,'green');
}
async function takeWealthSnapshot(){
  // Pressing this while presenting used to post a real snapshot of the real balances.
  if(_demoMode){showToast('Snapshots are off in the demo — nothing is saved.','amber');return}
  const r=await fetch('/api/wealth/snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){showToast(d.error||'Could not take a snapshot','red');return}
  showToast(d.complete?'Snapshot saved':'Snapshot saved, but marked incomplete — a balance was unknown','green');
  _ovw=null;loadOverview();
}
// Taking a figure back by hand, or handing it to the accounts again. Switching to auto does
// not write on the spot — the next reading does, under all the same guards.
function setOpeningMode(key,m){
  if(!window.PlannerOpening)return;
  P=PlannerOpening.setMode(P,key,m);
  if(m!=='manual'){
    const d=_ovw,sm=d&&d.summary;
    const available=!!sm&&!d.error&&d.capabilities?.balances?.available===true;
    const out=PlannerOpening.syncOpening(P,sm,available);
    P=out.P;
    const r=out.rows.find(x=>x.key===key);
    showToast(r&&r.following?'Now following your accounts':(r&&r.reason)||'Now following your accounts',
      r&&r.following?'green':'amber');
  } else showToast('This figure is yours now — it will not track your accounts','green');
  markDirty();buildControls();render();savePlannerState();
}
async function confirmAccountBalance(id,name,raw){
  const v=prompt(`Confirm the balance for "${name}".\n\nMonarch returned no value for this account. What you enter is recorded as YOUR confirmation, dated today — it will never be shown as an observed balance, and a real balance from Monarch will supersede it automatically.`,'0');
  if(v===null)return;
  const num=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  if(!isFinite(num)){showToast('That is not a number','red');return}
  const r=await fetch(`/api/accounts/${encodeURIComponent(id)}/confirm-balance`,{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({balance:num,accountName:name,rawMissing:raw==null?null:String(raw),note:'confirmed in the planner'})});
  if(!r.ok){showToast('Could not save confirmation','red');return}
  showToast(`Recorded ${fmtF(num)} for ${name}, dated today`,'green');
  _ovw=null;loadOverview();
}
async function setAccountClass(id,cls){
  // "Vested Stripe equity" is a private holding with a marker, so the reconciliation can
  // find it without the account happening to have "Stripe" in its name.
  const stripeKind=cls==='private:stripe'?'vested':null;
  if(cls==='private:stripe')cls='private';
  const r=await fetch(`/api/accounts/${encodeURIComponent(id)}/class`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({class:cls,stripeKind})});
  if(!r.ok){showToast('Could not save classification','red');return}
  _ovw=null;loadOverview();
}
// Hiding an account is reversible and, when the balance is zero, purely cosmetic. When it
// is NOT zero it changes net worth, so the toast says what was excluded instead of letting
// the totals quietly shrink — the same rule the reconciliation panel follows.
async function setAccountHidden(id,hidden,name){
  const r=await fetch(`/api/accounts/${encodeURIComponent(id)}/hidden`,{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({hidden,name:name||null})});
  if(!r.ok){showToast(hidden?'Could not hide that account':'Could not restore that account','red');return}
  const out=await r.json().catch(()=>({}));
  const ex=out.excluded;
  if(!hidden)showToast('Account restored.','green');
  else if(ex&&(ex.hiddenNet!==0||ex.hiddenUnknown>0))
    // A funded account was hidden: say the consequence out loud, in the toast, now.
    showToast(`Hidden. ${ex.note||''}`,'amber');
  else showToast('Hidden. It held nothing, so your totals are unchanged.','green');
  _ovw=null;loadOverview();
}

// Reconciliation applies one line at a time, on an explicit click, and marks the plan edited
// so it is never mistaken for something the plan always said.
function applyReconcileLine(key,value){
  const current=Number(P[key]||0);
  // Replacing a real figure with zero is almost never what someone means to do from a
  // reconciliation screen — it usually means the matching account was never classified.
  // It gets its own, blunter confirmation rather than the routine one.
  if(value===0&&current>0){
    if(!showConfirm(`This would set ${key} to ZERO, replacing ${fmt(current)}.\n\nYour accounts show nothing in this bucket. That is usually because the right account has not been classified yet, not because the money is gone.\n\nErase ${fmt(current)} from your plan?`))return;
  } else if(!showConfirm(`Set ${key} to ${fmt(value)} in your plan?\n\nThis changes a planning assumption to match what your accounts currently show. Nothing else is altered.`))return;
  P[key]=value;markDirty();buildControls();render();savePlannerState();
  showToast(`Plan updated: ${key} → ${fmt(value)}`,'green');
}

// ── Watchlist ────────────────────────────────────────────────────────────
// The proactive surface. Three rules it exists to honour:
//   1. At most three priorities. Attention is the scarce resource; eleven warnings is zero.
//   2. Every item shows its evidence, so the headline can be checked rather than trusted.
//   3. What was NOT checked is as prominent as what was. "Nothing to report" and "nothing
//      was looked at" are opposite messages, and a panel that renders them identically is
//      worse than one that renders nothing.
let _inbox=null,_inboxLoading=false,_inboxError=null,_briefing=null;

async function loadInbox(force){
  if(_demoMode)return;
  if(_inboxLoading)return;
  if(_inbox&&!force)return;
  _inboxLoading=true;_inboxError=null;
  try{
    const [i,b]=await Promise.all([
      fetch('/api/inbox').then(r=>r.ok?r.json():r.json().then(j=>Promise.reject(new Error(j.error||('HTTP '+r.status))))),
      fetch('/api/briefings/latest').then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    _inbox=i;_briefing=b;
  }catch(e){
    // A failed load is reported as a failure. Falling back to an empty list would read as
    // "all clear", which is the one thing it definitely does not mean.
    _inboxError=e.message||'Could not load the watchlist.';_inbox=null;
  }finally{_inboxLoading=false;if(activeTab==='cockpit'||(activeTab==='today'&&_todayView==='watch'))render()}
}

async function setAlertState(key,state,until){
  try{
    const res=await fetch('/api/alerts/'+encodeURIComponent(key)+'/state',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({state,until,alert:(_inbox&&[..._inbox.priorities,..._inbox.more].find(a=>a.key===key))||null})});
    if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.error||('HTTP '+res.status))}
    showToast(state==='snoozed'?'Snoozed until '+String(until).slice(0,10)
      :state==='open'?'Reopened.':state==='resolved'?'Marked resolved.':'Dismissed.','green');
    await loadInbox(true);
  }catch(e){showToast(e.message,'red')}
}
function snoozeAlert(key,days){
  const until=new Date(Date.now()+days*86400000).toISOString();
  setAlertState(key,'snoozed',until);
}

// An alert card speaks the cockpit's language: a quiet severity dot, a real headline, the
// evidence as a ledger, and exactly ONE primary action. The old card gave five buttons
// equal weight and let a bordered "FOR INFORMATION" badge outshout the title it labelled.
const SEV_LABEL={critical:'Critical',warning:'Needs attention',info:'For information'};

function alertCard(a){
  const e=advEscape;
  return `<article class="wl-alert" data-sev="${a.severity}">
    <header>
      <span class="ui-sev" data-sev="${a.severity}">${e(SEV_LABEL[a.severity]||a.severity)}</span>
      ${a.occurrences>1?`<span class="wl-repeat">Seen on ${a.occurrences} checks</span>`:''}
    </header>
    <h3>${e(a.title)}</h3>
    <p class="wl-why">${e(a.significance)}</p>
    <div class="wl-evidence">
      <span class="ui-eyebrow">The numbers behind this</span>
      ${a.evidence.map(x=>`<div class="wl-row">
        <span>${e(x.label)}</span>
        <span><strong class="ui-num">${e(String(x.value))}</strong><small>${e(x.source)}</small></span>
      </div>`).join('')}
    </div>
    <p class="wl-do"><strong>What to do</strong>${e(a.action)}</p>
    <footer>
      <button class="ui-btn ui-btn-primary" onclick="askAboutAlert('${a.key}')">${UI.icon('spark')}Ask the advisor</button>
      <button class="ui-btn" onclick="setAlertState('${a.key}','resolved')">${UI.icon('check')}Resolved</button>
      <button class="ui-btn ui-btn-quiet" onclick="snoozeAlert('${a.key}',30)">Snooze 30d</button>
      <button class="ui-btn ui-btn-quiet" onclick="snoozeAlert('${a.key}',90)">Snooze 90d</button>
      <button class="ui-btn ui-btn-quiet" onclick="setAlertState('${a.key}','dismissed')">Dismiss</button>
    </footer>
  </article>`;
}

function askAboutAlert(key){
  const a=(_inbox&&[..._inbox.priorities,..._inbox.more].find(x=>x.key===key));
  if(!a)return;
  setTab('advisor');
  const input=document.getElementById('advInput');
  if(input){
    input.value=`Explain this watchlist item and what you would actually do about it: "${a.title}". `+
      `Call get_alerts to see the detection output and its evidence before answering, and tell me what was NOT checked. `+
      `If a change to the plan would help, use propose_changes rather than describing it.`;
    input.style.height='120px';input.focus();
    input.scrollIntoView({block:'center',behavior:_reduceMotion()?'auto':'smooth'});
    showToast('Question prepared. Review it, then press Send.','green');
  }
}

// ── Tax-loss harvesting: a signal to act on, so it lives with the other signals ────────────────
// It used to sit under Holdings, where nothing about it was urgent. A position below its cost basis
// is a thing to be told about, with what acting on it is worth — which is what the Watchlist is for.
function taxLossHtml(){
  const inv=monarchInvestments;
  if(inv===null){if(!_investLoading&&!_demoMode)loadMonarchInvestments();return ''}
  if(!inv||inv===false)return '';
  const holdings=inv.holdings||[];
  // allTimeChange is the unrealised gain or loss against cost basis.
  const losing=holdings.filter(h=>h.securityType!=='cash'&&(h.allTimeChange||0)<0).sort((a,b)=>a.allTimeChange-b.allTimeChange);
  if(!losing.length)return '';
  const rate=P.capGainsTaxRate??.345,total=losing.reduce((t,h)=>t+h.allTimeChange,0),save=Math.abs(total)*rate;
  const totalVal=Number(inv.totalValue)>0?Number(inv.totalValue):holdings.reduce((a,h)=>a+(Number(h.value)||0),0);
  return `<section class="wl-tax"><span class="ui-eyebrow">Tax-loss harvesting</span>
    <p class="ps-headline" style="margin:6px 0 10px">${losing.length} position${losing.length===1?' is':'s are'} below cost basis. Realising ${losing.length===1?'it':'them'} would book <strong>${fmt(Math.abs(total))}</strong> of losses and save about <strong style="color:var(--g)">${fmt(save)}</strong> at your ${(rate*100).toFixed(1)}% capital-gains rate.</p>
    <div class="bd-items">${losing.map(h=>`<div class="bd-item"><div><strong>${advEscape(h.ticker||'')}</strong><small>${totalVal>0?(h.value/totalVal*100).toFixed(1)+'% of the portfolio':''}</small></div>
      <div style="text-align:right"><strong style="color:var(--r)">${fmt(h.allTimeChange)}</strong><small>about ${fmt(Math.abs(h.allTimeChange)*rate)} saved</small></div></div>`).join('')}</div>
    <p class="spend-caption" style="margin-top:8px">Unrealised loss against cost basis, all-time. A loss only helps when it offsets gains elsewhere, and the wash-sale rule disallows it if you buy the same or a substantially identical security within 30 days either side of the sale.</p></section>`;
}

        :`${provChip(a.balanceSource==='user'?'entered':'observed',a.balanceAsOf)}<span class="acct-bal ui-num">${UI.money(a.balance)}</span>`}
      <select onchange="setAccountClass('${advEscape(a.id)}',this.value)" title="Classification is stored against this account's stable id">
        ${order.map(c=>`<option value="${c}"${a.cls===c&&a.stripeKind!=='vested'?' selected':''}>${LBL[c]}</option>`).join('')}
        <option value="private:stripe"${a.stripeKind==='vested'?' selected':''}>Vested Stripe equity</option>
      </select>
      <button class="acct-hide" onclick="setAccountHidden('${advEscape(a.id)}',true,${JSON.stringify(a.name||'').replace(/"/g,'&quot;')})"
        title="Hide this account" aria-label="Hide ${advEscape(a.name||a.id)}">×</button>
    </div>`;

    // The full account list runs long, so it folds. Collapsed it still carries the count and
    // the net figure — a section that hides what it was telling you is just a section you
    // then have to open again.
    const shownGroups=order.filter(k=>(cls[k]||{accounts:[]}).accounts.length);
    const nShown=shownGroups.reduce((n,k)=>n+cls[k].accounts.length,0);
    const acctOpen=!_collapsedSections.has('acct-list');
    h+=`<section class="accounts-card">
      <button type="button" class="accounts-toggle" aria-expanded="${acctOpen}" aria-controls="acctList"
        onclick="toggleSection('acct-list',true)">
        <span class="ui-eyebrow">Where the money sits</span>

        <em aria-hidden="true">${acctOpen?'▾':'▸'}</em>
      </button>
      <div id="acctList"${acctOpen?'':' hidden'}>
      ${shownGroups.map(k=>`
        <div class="acct-group">
          <div class="acct-group-hdr"><span>${LBL[k]}</span><span class="ui-num">${UI.money(cls[k].total)}</span></div>
          ${cls[k].accounts.map(acctRow).join('')}
        </div>`).join('')}
      <p class="acct-note">Classification is saved against each account's stable id, so renaming an account in Monarch will not move it. A Stripe 401(k) is retirement money, not company stock.</p>
      </div>
    </section>`;

    // ── Hidden accounts ──────────────────────────────────────────────────
    // Folded away, never gone. Hiding is only cosmetic at a zero balance, so the summary
    // line states what was excluded rather than letting the totals quietly shrink.
    if(sum.hiddenCount){
      h+=`<details class="accounts-hidden"${sum.hiddenIsCosmetic?'':' open'}>
        <summary>${sum.hiddenCount} hidden account${sum.hiddenCount===1?'':'s'}
          <em data-tone="${sum.hiddenIsCosmetic?'ok':'warn'}">${advEscape(sum.hiddenNote||'')}</em></summary>
        <div>${sum.hidden.map(a=>`<div class="acct" data-hidden="1">

    }

    // ── Reconciliation: proposed, never applied ──
    const rec=(window.PlannerAccounts?PlannerAccounts.reconcile(sum,P):{lines:[]});
    const material=rec.lines.filter(l=>Math.abs(l.delta)>1000);
    h+=`<details class="polish-fold refine-fold" ${material.length||!rec.complete?'open':''}><summary>Plan vs. accounts · ${material.length} differences to review</summary><div>
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:3px">Plan vs. your accounts</div>
      <div style="font-size:10px;color:var(--t2);margin-bottom:9px">Nothing here changes your plan until you click Apply. Each line is one assumption.</div>
      ${rec.lines.map(l=>`<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--bd);flex-wrap:wrap">
        <div style="flex:1;min-width:150px">
          <div style="font-size:10.5px;color:var(--tx);font-weight:600">${l.label}</div>
          <div style="font-size:9px;color:var(--t3)">${advEscape(l.note)}</div>
        </div>
        <div style="text-align:right"><div style="font-size:8px;color:var(--t3)">plan ${PROV.projected.icon}</div>
          <div style="font-family:'SF Mono',monospace;font-size:10.5px">${money(l.planValue)}</div></div>
        <div style="text-align:right"><div style="font-size:8px;color:var(--t3)">actual ${PROV.observed.icon}</div>
          <div style="font-family:'SF Mono',monospace;font-size:10.5px;color:var(--b)">${money(l.actual)}</div></div>
        <div style="text-align:right;min-width:78px"><div style="font-size:8px;color:var(--t3)">difference</div>
          <div style="font-family:'SF Mono',monospace;font-size:10.5px;font-weight:700;color:${Math.abs(l.delta)>1000?(l.delta>0?'var(--g)':'var(--r)'):'var(--t3)'}">${l.delta>=0?'+':'−'}${money(Math.abs(l.delta))}</div></div>
        ${l.applicable===false
          ? `<span title="${advEscape(l.blockedReason||'')}" style="font-size:9px;color:var(--a);max-width:170px;text-align:right;line-height:1.35">⚠ nothing classified here</span>`
          : Math.abs(l.delta)>1000
            ? `<button onclick="applyReconcileLine('${l.key}',${l.actual})" style="font-size:9px;padding:4px 9px;border-radius:5px;border:none;background:var(--accent);color:#fff;font-family:inherit;cursor:pointer">Apply</button>`
            : '<span style="font-size:9px;color:var(--g)">matches</span>'}
      </div>${l.applicable===false?`<div style="font-size:9.5px;color:var(--a);padding:0 0 7px;line-height:1.5">${advEscape(l.blockedReason)}</div>`:''}`).join('')}
      ${!rec.complete?`<div style="font-size:9.5px;color:var(--a);margin-top:8px">Incomplete: ${rec.blocked.map(advEscape).join(', ')} ${rec.blocked.length===1?'has':'have'} no balance, so these comparisons are missing that amount.</div>`:''}
    </div></details>`;

    // ── Double counting ──
    if((d.doubleCounting||[]).length){
      h+=`<div class="glass-card" style="padding:13px 15px;border-color:rgba(205,61,100,.35);background:rgba(205,61,100,.04)">
        <div style="font-size:10.5px;font-weight:700;color:var(--r);margin-bottom:5px">Possible double counting</div>
        ${d.doubleCounting.map(i=>`<div style="font-size:10px;color:var(--t2);line-height:1.55">${advEscape(i.name)}: balance ${money(i.balance)} vs holdings ${money(i.holdingsTotal)}. ${advEscape(i.message)}</div>`).join('')}</div>`;
    }
  }

  // ── What changed since the last snapshot ──
  // Per-class movement is observation and always safe to show. The decomposition of WHY is
  // shown only as far as the transaction ledger reaches; beyond that it stays a residual.
  {
    const H=_hist||{},snaps=H.snapshots||[],ch=H.change;
    h+=`<div class="glass-card" style="padding:14px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3)">What changed</div>
        <button onclick="takeWealthSnapshot()" style="font-size:9px;padding:4px 9px;border-radius:5px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);font-family:inherit;cursor:pointer">📸 Take a snapshot</button>
      </div>`;
    if(snaps.length<2){
      h+=`<div style="font-size:10.5px;color:var(--t2);line-height:1.6">${snaps.length?'One snapshot recorded. Take another later and the change between them can be explained.':'No snapshots yet. Take one to start a dated history — changes are explained by comparing two of them.'}</div>`;
    } else if(ch&&ch.blocked){
      h+=`<div style="font-size:10.5px;color:var(--a);line-height:1.6">Cannot compare: the ${advEscape(ch.reason)}. Differencing it would attribute that gap to something real.</div>`;
    } else if(ch){
      const d=ch.delta;
      h+=`<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:3px">
        <span style="font-size:20px;font-weight:800;font-family:'SF Mono',monospace;color:${d>=0?'var(--g)':'var(--r)'};letter-spacing:-.5px">${d>=0?'+':'−'}${money(Math.abs(d))}</span>
        <span style="font-size:10px;color:var(--t3)">since ${PlannerTime.formatDate(ch.from)}${ch.days?` · ${ch.days} days`:''}</span></div>`;
      if(!ch.components.length){
        h+=`<div style="font-size:10.5px;color:var(--t2);line-height:1.6;background:var(--s2);border-radius:6px;padding:9px 11px;margin-top:6px">
          <strong style="color:var(--tx)">${advEscape(ch.residual.label)}.</strong> ${advEscape(ch.residual.detail)}</div>`;
      } else {
        h+=`<div style="margin-top:6px">
          ${ch.components.filter(c=>c.key!=='netFlow').map(c=>`<div style="display:flex;justify-content:space-between;font-size:10.5px;padding:4px 0;border-bottom:1px solid var(--bd)">
            <span style="color:var(--t2)">${advEscape(c.label)} <span style="font-size:8.5px;color:var(--t3)">· ${advEscape(c.detail)}</span></span>
            <span style="font-family:'SF Mono',monospace;color:${c.amount>=0?'var(--g)':'var(--tx)'}">${c.amount>=0?'+':'−'}${money(Math.abs(c.amount))}</span></div>`).join('')}
          <div style="display:flex;justify-content:space-between;font-size:10.5px;padding:6px 0 0">
            <span style="color:var(--t2)">${advEscape(ch.residual.label)}</span>
            <span style="font-family:'SF Mono',monospace;font-weight:700;color:${ch.residual.amount>=0?'var(--g)':'var(--r)'}">${ch.residual.amount>=0?'+':'−'}${money(Math.abs(ch.residual.amount))}</span></div>
          <div style="font-size:9.5px;color:var(--t3);line-height:1.5;margin-top:4px">${advEscape(ch.residual.detail)}</div>

      }

        h+=`<div style="margin-top:9px;padding-top:8px;border-top:1px solid var(--bd)">
          <div style="font-size:8.5px;color:var(--t3);margin-bottom:4px">Where it landed — an observation, not an explanation</div>
          ${ch.classDeltas.map(r=>`<div style="display:flex;justify-content:space-between;font-size:10px;padding:2px 0">
            <span style="color:var(--t2);text-transform:capitalize">${advEscape(r.cls)}</span>
            <span style="font-family:'SF Mono',monospace;color:${r.delta>=0?'var(--g)':'var(--r)'}">${r.delta>=0?'+':'−'}${money(Math.abs(r.delta))}</span></div>`).join('')}</div>`;
      }
    }
    h+=`</div>`;
  }

  // ── What the connection can and cannot do ──
  const capRow=(k,lbl)=>{const c=caps[k]||{available:false,detail:''};
    return `<div style="display:flex;align-items:center;gap:7px;font-size:9.5px;padding:3px 0">
      <span style="color:${c.available?'var(--g)':'var(--t3)'};font-weight:700">${c.available?'✓':'—'}</span>
      <span style="color:var(--tx);min-width:92px">${lbl}</span>
      <span style="color:var(--t3);flex:1">${advEscape(String(c.detail||''))}</span></div>`;};
  h+=`<details class="polish-fold refine-fold"><summary>Connection details & data labels</summary><div>
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:6px">What this connection provides</div>
    ${capRow('balances','Balances')}${capRow('holdings','Holdings')}${capRow('transactions','Transactions')}${capRow('taxLots','Tax lots')}
    ${(d.blocked||[]).length?`<div style="font-size:9.5px;color:var(--t3);margin-top:6px;line-height:1.5">Unavailable data disables only what depends on it: ${d.blocked.map(b=>advEscape(b.feature)).join(' · ')}.</div>`:''}
  </div>`;

  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:9px;color:var(--t3);padding:0 2px">
    ${Object.keys(PROV).map(k=>`<span>${provChip(k)} ${PROV[k].hint}</span>`).join('')}</div>`;

  h+=`</details></div>`;
  ca.innerHTML=h;
  document.getElementById('summaries').innerHTML='';
}

let _spend=null,_spendLoading=false,_syncStatus=null,_syncPoll=null;
// The drift view is independent of the category period above it. Keep the chosen smoothing
// window while the user moves around the app, without turning it into a plan assumption.
let _spendDriftWindow=12;

function setSpendDriftWindow(months){
  const n=Number(months);
  if(![3,6,12].includes(n)||n===_spendDriftWindow)return;
  _spendDriftWindow=n;
  render();
}

async function loadSpending(){
  if(_demoMode)return;
  if(_spendLoading)return;
  _spendLoading=true;
  try{
    const [a,b]=await Promise.all([
      // Three years, not one. Twelve months is exactly one trailing twelve-month window, so
      // the drift line had a single point and nothing to join it to — and a year-over-year
      // comparison had no year to compare against. The rollup is one row per month either way;
      // what widens is the ledger read behind it, and the import itself tops out at 36 months.
      fetch('/api/monarch/spending?months=36').then(r=>r.ok?r.json():r.json().then(e=>({error:e.error||'unavailable'}))),
      fetch('/api/monarch/sync/status').then(r=>r.ok?r.json():({error:'unavailable'})),
    ]);
    if(_demoMode){_spendLoading=false;return}
    _spend=a;_syncStatus=b;
  }catch(e){_spend={error:e.message};}
  _spendLoading=false;
  if(activeTab==='today'&&_todayView==='spending')render();
}

async function startBackfill(months){
  const r=await fetch('/api/monarch/sync/backfill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({months})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){showToast(d.error||'Could not start import','red');return}
  showToast(`Importing ${months} months of history…`,'blue');
  pollSync();
}
// A backfill runs detached on the server, so the only honest progress signal is polling the
// status it writes as each month completes.
function pollSync(){
  clearInterval(_syncPoll);
  _syncPoll=setInterval(async()=>{
    try{
      const r=await fetch('/api/monarch/sync/status');
      _syncStatus=await r.json();
      if(activeTab==='today'&&_todayView==='spending')render();
      if(!_syncStatus.running){clearInterval(_syncPoll);_syncPoll=null;loadSpending();}
    }catch(e){clearInterval(_syncPoll);_syncPoll=null;}
  },2500);
}
async function runIncremental(){
  showToast('Catching up…','blue');
  const r=await fetch('/api/monarch/sync/incremental',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  const d=await r.json().catch(()=>({}));
  showToast(d.error?('Sync: '+d.error):`Synced ${d.written||0} transactions`,d.error?'red':'green');
  loadSpending();
}

// ── Discretionary pace ──────────────────────────────────────────────────────
// Is this month's controllable spending running hot, and what is driving it?
//
// The card leads with a VERDICT rather than a number, because "$4,248" means nothing on
// its own and "running well above what is normal for you" means something immediately.
// Underneath it, two bars on a shared scale: this month against the range this household
// actually occupies by this day of the month.
function paceCard(p){
  if(!p)return '';
  const e=advEscape,m=v=>UI.money(v),M=v=>UI.money(v,{exact:true});

  // Nothing is judged without enough history to judge it against, and the card says what
  // it is waiting for rather than showing a hedged verdict.
  if(p.status!=='ok'){
    return `<section class="pace" data-tone="unknown">
      <span class="ui-eyebrow">This month</span>
      <h3>Not enough history to judge the pace yet.</h3>
      <ul class="pace-needs">${(p.needs||[]).map(n=>`<li>${e(n.why)}</li>`).join('')}</ul>
      <p class="pace-foot">${e(p.note||'')}</p>
    </section>`;
  }

  const TONE={good:'good',neutral:'neutral',warn:'warn',bad:'bad'}[p.tone]||'neutral';
  const headline=p.tone==='neutral'
    ? 'Discretionary spending is running about normal'
    : `Discretionary spending is running ${e(p.verdict)} your usual pace`;

  // Both bars share one scale so their lengths are comparable. The scale is the larger of
  // the two plus the top of the normal band, so the normal marker always has somewhere
  // to sit and a big month does not push it off the end.
  const scale=Math.max(p.mtd,p.normalHigh,1)*1.06;
  const pctOf=v=>Math.max(0,Math.min(100,v/scale*100));
  const lastPct=p.lastMonth&&p.lastMonth.deltaPct;

  return `<section class="pace ui-rise" data-tone="${TONE}">
    <header>
      <span class="ui-eyebrow">This month · through the ${p.day}${ordinal(p.day)}</span>
      <h3>${headline}</h3>
    </header>

    <div class="pace-figure">
      <strong class="ui-num">${M(p.mtd)}</strong>
      <span>so far</span>
    </div>
    <p class="pace-sub">
      Normal for you by this day is <b>${m(p.normalLow)}–${m(p.normalHigh)}</b>${
        p.over>0?`, so you are <b>${m(p.over)}</b> above typical`
                :p.over<-1?`, and you are <b>${m(-p.over)}</b> below typical`:''}.
      ${p.monthsAbove!=null&&p.monthsCompared?`This month is running above <b>${p.monthsAbove} of your last ${p.monthsCompared}</b> at the same point.`:''}
      ${lastPct!=null?`Last month by the same day: <b>${M(p.lastMonth.atDay)}</b>.`:''}
    </p>

    <div class="pace-bars">
      <div class="pace-bar">
        <span>This month<b class="ui-num">${M(p.mtd)}</b></span>
        <div><i style="width:${pctOf(p.mtd)}%"></i></div>
      </div>
      <div class="pace-bar" data-kind="typical">
        <span>Typical at this point<b class="ui-num">${M(p.typical)}</b></span>
        <div>
          <i style="width:${pctOf(p.typical)}%"></i>
          <u style="left:${pctOf(p.normalLow)}%;width:${pctOf(p.normalHigh)-pctOf(p.normalLow)}%"></u>
        </div>
      </div>
    </div>

    ${p.headlineDriver?`<p class="pace-headline-driver">${e(p.headlineDriver.label)}</p>`:''}

    ${p.flagged.length?`<div class="pace-drivers">
      <span class="ui-eyebrow">What is driving it</span>
      ${p.flagged.slice(0,4).map(d=>`<div class="pace-driver">
        <span>${e(d.category)}</span>
        <span><b class="ui-num">${M(d.mtd)}</b><small>usually ${M(d.typical)} by now · <em>${m(d.over)} more</em></small></span>
        ${d.explain?`<small class="pace-why" data-kind="${e(d.explain.kind)}">${e(d.explain.sentence)}</small>`:''}
      </div>`).join('')}
    </div>`:`<p class="pace-clear">No single category is out of its usual range.</p>`}

    <footer class="pace-foot">
      Same day of your last ${p.monthsCompared} month${p.monthsCompared===1?'':'s'}${
        p.bandPct?` · the range is where the middle ${Math.round((p.bandPct[1]-p.bandPct[0])*100)}% of them landed`:''}
      · committed costs excluded by ${e(p.committedRule)}
      · ${UI.prov('observed','from your transactions')}
    </footer>
  </section>`;
}
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return s[(v-20)%10]||s[v]||s[0]};

// ── The period the donut is answering for ────────────────────────────────
// "Where does my money go" has a period attached to it, and twelve months and last March are
// different questions. `_spendScope` is a rolling window in months, or one named month.
//
// It opens on year to date. Averaging every month on record answers a question nobody is
// asking — two years ago is a different household — whereas "what has this year cost so far"
// is the one the screen is usually opened to settle. With no records for this year at all it
// falls back to everything rather than showing an empty donut.
let _spendScope={kind:'ytd'};
// The calendar year the data is standing in, taken from the observation date rather than
// inferred from the last complete month. In January the most recent complete month is
// December of the year before, and reading YTD off that would quietly report last year.
function spendCurrentYear(asOf){return String(asOf||'').slice(0,4)||String(PlannerTime.year())}
// `all` is the closed months; `every` is the full history including the month in progress.
// Year-to-date and a NAMED month read from `every` — the full history including the month in
// progress. "So far this year" that stops at the end of last month is not what the phrase
// means, and picking "September 2026" from a list and being shown August or the whole of
// history instead is worse still: the one month you cannot ask about was the one you are
// living in.
//
// The rolling windows (3M, 6M, 12M) and All still keep the partial month out, because those
// are averages, and a category two-thirds through its month reads there as a fall that has
// not happened.
function spendScopeMonths(all,asOf,every){
  const rows=all||[];
  if(_spendScope.kind==='month'){
    const src=(every&&every.length?every:rows);
    const hit=src.filter(m=>m.month===_spendScope.month);
    // A month that has dropped out of the loaded history falls back to everything rather than
    // rendering an empty donut that looks like a month with no spending.
    return hit.length?hit:rows;
  }
  if(_spendScope.kind==='year'){
    const hit=rows.filter(m=>String(m.month).slice(0,4)===String(_spendScope.year));
    return hit.length?hit:rows;
  }
  if(_spendScope.kind==='ytd'){
    const src=(every&&every.length?every:rows);
    const hit=src.filter(m=>String(m.month).slice(0,4)===spendCurrentYear(asOf));
    // With no records at all for this year, showing everything is honest; showing nothing
    // would read as a year with no spending.
    return hit.length?hit:rows;
  }
  if(_spendScope.kind==='recent'){
    const n=Math.max(1,Number(_spendScope.months)||0);
    return rows.slice(-n);
  }
  return rows;
}
// What the current scope is called, for the caption and the chart's own label.
function spendScopeLabel(all,asOf,every){
  const rows=all||[];
  if(_spendScope.kind==='month'){
    const src=(every&&every.length?every:rows);
    if(src.some(m=>m.month===_spendScope.month)){
      // A month that has not finished is not a month's spending, and the label is the only
      // place that can say so before someone compares it with the twelve beside it.
      const running=String(asOf||'').slice(0,7)===_spendScope.month;
      return monthLabel(_spendScope.month)+(running?' so far':'');
    }
  }
  if(_spendScope.kind==='year'&&rows.some(m=>String(m.month).slice(0,4)===String(_spendScope.year)))return String(_spendScope.year);
  if(_spendScope.kind==='ytd'){
    const y=spendCurrentYear(asOf),partial=String(asOf||'').slice(0,7);
    const n=rows.filter(m=>String(m.month).slice(0,4)===y).length;
    const hasPartial=(every||[]).some(m=>m.month===partial)&&partial.slice(0,4)===y;
    const name=monthLabel(partial).replace(/\s+\d{4}$/,'');
    if(!n&&hasPartial)return `${y} so far — ${name} in progress`;   // "0 closed months plus" says nothing
    if(n)return `${y} so far — ${n} closed month${n===1?'':'s'}`+(hasPartial?` plus ${name} in progress`:'');
  }
  if(_spendScope.kind==='recent'){
    const n=Math.min(Math.max(1,Number(_spendScope.months)||0),rows.length);
    return `the last ${n} month${n===1?'':'s'}`;
  }
  return `${rows.length} past month${rows.length===1?'':'s'}`;
}
function setSpendScope(kind,value){
  _spendScope=kind==='month'?{kind:'month',month:value}
    :kind==='year'?{kind:'year',year:String(value)}
    :kind==='ytd'?{kind:'ytd'}
    :kind==='recent'?{kind:'recent',months:Number(value)}:{kind:'all'};
  // Not persisted: this is a question being asked now, not a setting. Calling savePlannerState
  // here would write nothing and imply it survives a reload.
  render();
}
// One dropdown carries both years and months, so `year:2025` and `month:2025-03` arrive on the
// same channel and are split here rather than needing two controls side by side.
function setSpendScopeFromSelect(v){
  const [kind,value]=String(v||'').split(':');
  if(!kind)return setSpendScope('all');
  setSpendScope(kind,value);
}
// "2026-01" → "January 2026". Used by the donut's scope control and the trend chart's axis,
// so a month is written the same way wherever it appears.
function monthLabel(ym,{short=false}={}){
  const m=/^(\d{4})-(\d{2})$/.exec(String(ym||''));
  if(!m)return String(ym||'');
  return PlannerTime.formatDate(`${m[1]}-${m[2]}-01`,{month:short?'short':'long',year:'numeric'});
}

// ── Categories against your income — what was, and what the plan says will be ──
// One card, one visual language, two sources. ACTUAL reads the imported records for the period
// chosen above; PLAN reads any year of the projection and groups it the way the decision is made:
// fixed commitments, everyday essentials, discretionary, one-offs, and what is left.
//
// Each line is a share of net income, gross income or spending — one sets the bars, the other two
// sit beneath. Net is the default: tax is not spent, so a share of take-home is the one that
// answers "can we afford this". The basis is shared with the Trajectory table's expense rows.
//
// The plan's lines are grouped and the ledger's are not, on purpose. Monarch's categories are the
// bank's, not the plan's — "Auto & Transport" is a lease and a tank of petrol — and guessing at
// which are fixed would put a confident label on a guess.
let _planShareYear=null,_planShareBasis='net',_lensMode='actual';
const PS_COLOR={tax:'#6b7a90',pretax:'#8ebfff',fixed:'#8278ee',essential:'#8bdded',choice:'#ecc183',oneoff:'#b6a8ff',left:'#7ae3c3',short:'#ff9caf'};
function planShareSet(y){_planShareYear=Number(y);render()}
function planShareStep(d,first,last){_planShareYear=Math.min(last,Math.max(first,(_planShareYear??first)+d));render()}
function planShareBasis(b){_planShareBasis=b;render()}
function lensMode(m){_lensMode=m;render()}
const _lensWord={spend:'of spending',net:'of net income',gross:'of gross income'};
const _lensPct=x=>x>=0.1?(x*100).toFixed(0)+'%':(x*100).toFixed(1)+'%';
function _lensRow(name,value,sh,basis,max,color,extra){
  const others=['spend','net','gross'].filter(b=>b!==basis&&sh[b]!=null);
  return `<div class="cl-row${extra&&extra.muted?' cl-muted':''}"${color?` style="--tier:${color}"`:''}>
    <div class="cl-top"><span class="cl-name">${advEscape(name)}</span><span class="cl-pct">${_lensPct(sh[basis])}<small>${_lensWord[basis]}</small></span></div>
    <div class="cl-track"><i style="width:${Math.max(1.5,sh[basis]/max*100).toFixed(1)}%"></i></div>
    <div class="cl-sub"><span>${fmt(value)}</span>${extra&&extra.perMonth!=null?`<span class="cl-mo">${fmtF(Math.round(extra.perMonth))}/mo</span>`:''}${others.map(b=>`<span>${_lensPct(sh[b])} ${_lensWord[b]}</span>`).join('')}${extra&&extra.note?`<span class="cl-then">${extra.note}</span>`:''}</div>
  </div>`;
}
function renderIncomeLens(R,actual){
  if(typeof PlannerIncomeShare==='undefined'||!R||!R.length)return '';
  const IS=PlannerIncomeShare,first=R[0].yr,last=R[R.length-1].yr;
  const mode=actual?_lensMode:'plan';
  const basisWanted=_planShareBasis;
  let body='',headline='',foot='',haveIncome=true,ctl='',actualExtra=null;

  if(mode==='actual'){
    const {rows,complete,cov,closedTotal}=actual;
    actualExtra={scopeControl:actual.scopeControl||'',scopeNote:actual.scopeNote||'',detailsHtml:actual.detailsHtml||''};
    const inc=IS.periodIncome(complete,R,{partial:cov.partial,fraction:cov.fractionElapsed});
    haveIncome=inc.ok;
    const basis=haveIncome?basisWanted:'spend';
    const share=net=>({spend:net/closedTotal,net:haveIncome?net/inc.net:null,gross:haveIncome?net/inc.gross:null});
    const pos=rows.filter(r=>r.net>0);
    const list=[...pos.slice(0,12).map(r=>({name:r.name,net:r.net,perMonth:r.perMonth})),...(pos.length>12?[{name:'Everything smaller',net:pos.slice(12).reduce((t,r)=>t+r.net,0),perMonth:pos.slice(12).reduce((t,r)=>t+r.perMonth,0),muted:true}]:[])];
    const perMonthAll=rows.reduce((t,r)=>t+(r.perMonth||0),0);
    const max=Math.max(...list.map(l=>share(l.net)[basis]),1e-9);
    body=`<div class="cl-list">${list.map(l=>_lensRow(l.name,l.net,share(l.net),basis,max,null,{muted:l.muted,perMonth:l.perMonth})).join('')}</div>`;
    headline=haveIncome
      ?`Over this period you spent <strong>${fmt(closedTotal)}</strong> (<strong>${fmtF(Math.round(perMonthAll))}</strong> a month) — <strong>${_lensPct(closedTotal/inc.net)}</strong> of net income, <strong>${_lensPct(closedTotal/inc.gross)}</strong> of gross.`
      :`Over this period you spent <strong>${fmt(closedTotal)}</strong> (<strong>${fmtF(Math.round(perMonthAll))}</strong> a month). Income shares need the plan to cover these months.`;
    foot=haveIncome
      ?'Net of refunds. Income is the plan\'s figure for the same months, not your deposits — the ledger records what landed in accounts, not gross pay or Stripe vests. Net is after tax, 401(k) and benefits.'
      :'The plan does not cover every month in this period, so income-based shares are hidden rather than guessed.';
  }else{
    const yr=Math.min(last,Math.max(first,_planShareYear??(PlannerTime.year()+1)));
    const row=R.find(r=>r.yr===yr);
    const basis=basisWanted;
    const c=IS.compute(row,basis);
    if(!c)return '';
    const cNet=IS.compute(row,'net'),cGross=IS.compute(row,'gross');
    const baseRow=yr!==first?R[0]:null,bc=baseRow&&IS.compute(baseRow,basis);
    const sh=v=>({spend:c.spend>0?v/c.spend:null,net:cNet?v/cNet.denom:null,gross:cGross?v/cGross.denom:null});
    const all=c.tiers.flatMap(t=>t.lines);
    const max=Math.max(...all.map(l=>sh(l.value)[basis]),c.oneOff?Math.abs(sh(c.oneOff)[basis]):0,1e-9);
    const then=(tierKey,key)=>{
      if(!bc)return '';
      const l=bc.tiers.find(t=>t.key===tierKey).lines.find(x=>x.key===key);
      return l?`${_lensPct(l.share)} in ${first}`:'';
    };
    // The year's shape in one bar, then each group opened beneath it.
    const total=c.segments.reduce((t,s)=>t+s.value,0)||1;
    const segs=c.segments.filter(s=>s.value>0);
    const bar=`<div class="ps-bar" role="img" aria-label="${yr} split: ${segs.map(s=>s.label+' '+_lensPct(s.share)).join(', ')}">${segs.map(s=>`<span style="width:${(s.value/total*100).toFixed(3)}%;background:${PS_COLOR[s.key]}" title="${advEscape(s.label)} · ${_lensPct(s.share)}"></span>`).join('')}${c.overspent?`<i class="ps-income-mark" style="left:${(c.denom/total*100).toFixed(2)}%" title="Income ends here"></i>`:''}</div>
      <div class="cl-legend">${segs.map(s=>`<span><i style="background:${PS_COLOR[s.key]}"></i>${advEscape(s.label)} <b>${_lensPct(s.share)}</b></span>`).join('')}</div>`;
    const groups=c.tiers.map(t=>{
      const lines=t.lines.slice().sort((a,b)=>b.value-a.value);
      if(!lines.length)return '';
      const tsh=sh(t.value);
      return `<div class="cl-group" style="--tier:${PS_COLOR[t.key]}">
        <div class="cl-ghead"><span><i></i>${advEscape(t.label)}</span><span class="cl-gtot">${_lensPct(tsh[basis])} <small>${fmt(t.value)}</small></span></div>
        <p class="cl-gnote">${advEscape(t.note)}</p>
        <div class="cl-list">${lines.map(l=>_lensRow(l.label,l.value,sh(l.value),basis,max,PS_COLOR[t.key],{note:then(t.key,l.key),perMonth:l.value/12})).join('')}</div></div>`;
    }).join('');
    const one=c.oneOff?`<div class="cl-group" style="--tier:${PS_COLOR.oneoff}"><div class="cl-ghead"><span><i></i>One-off</span><span class="cl-gtot">${_lensPct(Math.abs(sh(c.oneOff)[basis]))} <small>${c.oneOff<0?'−':''}${fmt(Math.abs(c.oneOff))}</small></span></div></div>`:'';
    const leftover=basis==='spend'?'':`<div class="cl-left ${c.overspent?'is-short':''}"><span>${c.overspent?'Beyond income — from savings or Stripe':'Left over'}</span><strong>${_lensPct(Math.abs(c.left)/c.denom)} <small>${_lensWord[basis]} · ${fmt(Math.abs(c.left))}</small></strong></div>`;
    body=bar+groups+one+leftover;
    const fx=c.tiers.find(t=>t.key==='fixed'),es=c.tiers.find(t=>t.key==='essential'),ch=c.tiers.find(t=>t.key==='choice');
    headline=basis==='spend'
      ?`In ${yr} the plan spends <strong>${fmt(c.spend)}</strong> (<strong>${fmtF(Math.round(c.spend/12))}</strong> a month): <strong>${_lensPct(fx.share)}</strong> fixed, <strong>${_lensPct(es.share)}</strong> essentials, <strong>${_lensPct(ch.share)}</strong> discretionary.`
      :c.overspent
        ?`In ${yr} the plan spends <strong>${fmt(-c.left)}</strong> more than it takes in — <strong>${_lensPct(-c.left/c.denom)}</strong> ${_lensWord[basis]} comes from savings or Stripe. Spending is <strong>${fmtF(Math.round(c.spend/12))}</strong> a month.`
        :`In ${yr}, <strong>${_lensPct(fx.share)}</strong> ${_lensWord[basis]} is fixed commitments, <strong>${_lensPct(es.share)}</strong> essentials and <strong>${_lensPct(ch.share)}</strong> discretionary${c.left>0?` — leaving <strong>${_lensPct(c.left/c.denom)}</strong>`:''}. Spending is <strong>${fmtF(Math.round(c.spend/12))}</strong> a month.`;
    foot=`Projected, not imported. Income counts Stripe stock at its vest value; net is after tax, 401(k) and benefits.${bc?` The small figure on each line is its share in ${first}, the plan's first year.`:''} Which lines count as fixed is a judgement — each group lists what is in it.${c.overspent?' The marker on the bar is where income ends.':''}`;
    const yrOptions=R.map(r=>`<option value="${r.yr}"${r.yr===yr?' selected':''}>${r.yr}</option>`).join('');
    ctl=`<div class="ps-year" role="group" aria-label="Year to look at">
      <button type="button" onclick="planShareStep(-1,${first},${last})" aria-label="Previous year"${yr<=first?' disabled':''}>‹</button>
      <label><span class="ui-sr">Year</span><select onchange="planShareSet(this.value)">${yrOptions}</select></label>
      <button type="button" onclick="planShareStep(1,${first},${last})" aria-label="Next year"${yr>=last?' disabled':''}>›</button></div>`;
  }
  const eff=mode==='actual'&&!haveIncome?'spend':basisWanted;
  const chip=(b,l)=>`<button type="button" class="spend-scope-chip${eff===b?' is-on':''}" aria-pressed="${eff===b}"${mode==='actual'&&!haveIncome&&b!=='spend'?' disabled':''} onclick="planShareBasis('${b}')">${l}</button>`;
  const modeChip=(m,l)=>`<button type="button" class="spend-scope-chip${mode===m?' is-on':''}" aria-pressed="${mode===m}"${m==='actual'&&!actual?' disabled title="Import transactions to see actuals"':''} onclick="lensMode('${m}')">${l}</button>`;
  return `<section class="cp-card cl-card">
    <div class="ps-head"><div><h3>Categories against your income</h3><p>${mode==='actual'?(actualExtra.scopeNote||'What your records show'):'What the plan says a year will cost'}</p></div>
      <div class="ps-controls"><div class="spend-scope" role="group" aria-label="Actual or plan">${modeChip('actual','Actual')}${modeChip('plan','Plan')}</div>${ctl}</div></div>
    <div class="cl-measure"><span>Measured against</span><div class="spend-scope" role="group" aria-label="Measure each line as a share of">${chip('net','Net income')}${chip('gross','Gross income')}${chip('spend','Spending')}</div></div>
    ${mode==='actual'&&actualExtra.scopeControl?`<div class="cl-measure"><span>Period</span>${actualExtra.scopeControl}</div>`:''}
    <p class="ps-headline">${headline}</p>
    ${body}
    <p class="spend-caption">${foot}</p>
    ${mode==='actual'?actualExtra.detailsHtml:''}
  </section>`;
}

// ── Budget ───────────────────────────────────────────────────────────────────
// Every living line in one place, in the year being looked at: type a dollar figure or a
// percentage, choose whether it is for this year or this year on, and see at once what the
// plan can still afford. The figures live in the plan (budget rules, and the per-year pins the
// Trajectory table writes), so scenarios, Compare and the advisor all see them.
//
// There is no savings target here, on purpose. This household saves hard early and draws down
// later — tuition makes that the plan, not a failure — so the measure of a budget is HEADROOM:
// how much more could be spent with liquid assets never below the reserve floor in any year.
let _budgetYear=null,_budgetUnit='month',_budgetScope='onward',_budgetUndo=null,_budgetHead=null,_budgetEdit=null;
function budgetEdit(k){_budgetEdit=_budgetEdit===k?null:k;render()}
const RM_COLOR={fixed:'#8278ee',investing:'#7ae3c3',saving:'#8bdded',guilt:'#ecc183',oneoff:'#b6a8ff',tax:'#6b7a90',pretax:'#8ebfff',short:'#ff9caf'};
const BD_COLOR={cash:'#7ae3c3',stock:'#8278ee',savings:'#ecc183',left:'#8bdded',save:'#7ae3c3',draw:'#ecc183'};
function budgetYearSet(y){_budgetYear=Number(y);render()}
function budgetYearStep(d,first,last){_budgetYear=Math.min(last,Math.max(first,(_budgetYear??PlannerTime.year())+d));render()}
function budgetUnit(u){_budgetUnit=u;render()}
function budgetScope(s){_budgetScope=s;render()}
function budgetBasisKey(){return _planShareBasis==='gross'?'gross':'net'}
function budgetApply(e,label){
  _budgetUndo={label,before:e.before,notes:e.notes||[]};
  P.budgetRules=e.budgetRules;
  for(const [k,v] of Object.entries(e.pins)){if(v===null||v===undefined)delete P[k];else P[k]=v}
  markDirty();buildControls();render();savePlannerState();
}
function budgetUndoLast(){
  if(!_budgetUndo)return;
  const b=_budgetUndo.before;
  if(b.budgetRules!==undefined)P.budgetRules=b.budgetRules;
  for(const [k,v] of Object.entries(b.pins||{})){if(v===undefined)delete P[k];else P[k]=v}
  if(b.planItems!==undefined)P.planItems=b.planItems;
  if(b.budgetDismissed!==undefined)P.budgetDismissed=b.budgetDismissed;
  for(const [k,v] of Object.entries(b.params||{})){if(v===undefined)delete P[k];else P[k]=v}
  _budgetUndo=null;markDirty();buildControls();render();savePlannerState();
}
// Items, dismissals and single-parameter changes share the same undo as rule edits: take a
// snapshot of exactly what is about to change, change it, and keep the snapshot.
function budgetChange(label,before,mutate){
  _budgetUndo={label,before,notes:[]};
  mutate();
  markDirty();buildControls();render();savePlannerState();
}
function budgetSuggestion(id){const yr=_budgetYear??PlannerTime.year();return PlannerSuggest.events(P,yr,40).find(e=>e.id===id)}
function budgetAddItem(id){
  const e=budgetSuggestion(id);if(!e||!e.item)return;
  const el=document.getElementById('sg_'+id);
  const n=el?PlannerBudget.parseInput(el.value,'year'):null;
  if(!n||n.kind!=='amount'){showToast('Enter a dollar amount.','red');return}
  const item={...e.item,amount:n.annual,sid:e.id};
  budgetChange(`${e.item.label} added — ${fmtF(n.annual)}${e.perYear?'/yr':''}`,{planItems:structuredClone(P.planItems||[])},()=>{P.planItems=[...(P.planItems||[]),item]});
}
function budgetDismiss(id){
  budgetChange('Suggestion hidden',{budgetDismissed:[...(P.budgetDismissed||[])]},()=>{P.budgetDismissed=[...(P.budgetDismissed||[]),id]});
}
function budgetSetParam(id){
  const e=budgetSuggestion(id);if(!e||!e.param)return;
  const k=e.param.key;
  budgetChange(`${k==='maintBase'?'Home upkeep':k} set to ${fmtF(e.param.value)}`,{params:{[k]:P[k]},budgetDismissed:[...(P.budgetDismissed||[])]},()=>{P[k]=e.param.value;P.budgetDismissed=[...(P.budgetDismissed||[]),id]});
}
function budgetRemoveItem(i){
  const it=(P.planItems||[])[i];if(!it)return;
  budgetChange(`${it.label} removed`,{planItems:structuredClone(P.planItems||[]),budgetDismissed:[...(P.budgetDismissed||[])]},()=>{
    P.planItems=P.planItems.filter((_,j)=>j!==i);
    // Removed on purpose, so it is not offered straight back.
    if(it.sid)P.budgetDismissed=[...(P.budgetDismissed||[]),it.sid];
  });
}
function budgetItemAmount(i,text){
  const it=(P.planItems||[])[i],n=PlannerBudget.parseInput(text,'year');
  if(!it||!n||n.kind!=='amount'){render();return}
  if(n.annual===it.amount){render();return}
  budgetChange(`${it.label} → ${fmtF(n.annual)}`,{planItems:structuredClone(P.planItems)},()=>{P.planItems=P.planItems.map((x,j)=>j===i?{...x,amount:n.annual}:x)});
}
function budgetCurrent(cat){
  const yr=_budgetYear??PlannerTime.year();
  const R=run(P).R,row=R.find(r=>r.yr===yr);
  return{yr,row,R,annual:row?(row.livFullParts||{})[cat]||0:0,src:row&&row.livSrc?row.livSrc[cat]:'model'};
}
function budgetCommit(cat,text){
  const cur=budgetCurrent(cat);
  const input=PlannerBudget.parseInput(text,_budgetUnit);
  if(input===null){showToast('Enter a dollar figure (1650 or 24k) or a percentage (8%).','red');render();return}
  // Typing back the figure already shown is not an edit, and must not turn a model line into a rule.
  if(input.kind==='amount'&&Math.abs(input.annual-cur.annual)<=(_budgetUnit==='month'?6:0.5)){render();return}
  const e=PlannerBudget.edit(P,{category:cat,year:cur.yr,scope:_budgetScope,input,basis:budgetBasisKey(),income:{net:cur.row.netTC,gross:cur.row.gross}});
  if(!e.ok){showToast(e.error,'red');render();return}
  const word=input.kind==='clear'?'back to the model':input.kind==='pct'?`${(input.pct*100).toFixed(1).replace(/\.0$/,'')}% of ${budgetBasisKey()} income`:fmtF(_budgetUnit==='month'?Math.round(input.annual/12):input.annual)+(_budgetUnit==='month'?'/mo':'/yr');
  budgetApply(e,`${LIV_LABEL[cat]||cat} → ${word}, ${_budgetScope==='year'?cur.yr+' only':'from '+cur.yr}`);
}
// Tie a line to income (it then moves with income every year), or fix it in dollars (it then
// grows only with inflation). Either way from the year in view, at what it is now.
function budgetTie(cat,tied){
  if(tied&&commonHousehold(P)){showToast('Shared budgets stay in dollars so cases have identical spending','green');return}
  const cur=budgetCurrent(cat),basis=budgetBasisKey(),base=basis==='gross'?cur.row.gross:cur.row.netTC;
  const input=tied?{kind:'pct',pct:cur.annual/base,tied:true}:{kind:'amount',annual:cur.annual};
  const e=PlannerBudget.edit(P,{category:cat,year:cur.yr,scope:'onward',input,basis,income:{net:cur.row.netTC,gross:cur.row.gross}});
  if(e.ok)budgetApply(e,`${LIV_LABEL[cat]||cat} ${tied?'tied to '+basis+' income':'fixed in dollars'} from ${cur.yr}`);
}
function budgetReset(cat){
  const cur=budgetCurrent(cat);
  const e=PlannerBudget.edit(P,{category:cat,year:cur.yr,scope:cur.src==='pin'?'year':'onward',input:{kind:'clear'},basis:budgetBasisKey(),income:{net:cur.row.netTC,gross:cur.row.gross}});
  if(e.ok)budgetApply(e,`${LIV_LABEL[cat]||cat} → back to the model${cur.src==='pin'?', '+cur.yr+' only':', from '+cur.yr}`);
}
function budgetGo(where){if(where==='housing'){_homeView='housing';setTab('home')}}
// The headroom solve runs the plan a few dozen times, so it is worth keeping until the plan or the year changes.
function budgetHeadroom(yr){
  const key=yr+'|'+JSON.stringify(P);
  if(!_budgetHead||_budgetHead.key!==key)_budgetHead={key,val:PlannerBudget.headroom(P,run,yr)};
  return _budgetHead.val;
}
// ── Same in every scenario ───────────────────────────────────────────────────
// Some bills are not a choice and are the same in every future being compared. A group marked
// shared lives in the live plan only; every saved case reads it from there. Turning one on can
// overwrite what a case holds, so it says exactly what would change and asks first. Turning one off
// freezes the current figures into every case, so no projection moves because a switch did.
async function persistScenarioParams(s){
  if(_demoMode||!s.id)return;
  try{
    const r=await fetch('/api/scenarios/'+s.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({params:s.params,results:s.results})});
    if(!r.ok)throw new Error('HTTP '+r.status);
  }catch(e){console.error('persist scenario failed:',e);setSyncStatus('error')}
}
// A figure as it should read in the confirmation: dollars as dollars, rates as percentages.
function sharedFmt(key,v){
  if(typeof v!=='number')return String(v);
  if(/^(base|childcareMonthly|nycRent|homePrice|maintBase|propTaxBase|rentCap|moving|closing)/.test(key))return fmtF(v);
  if(/Inflation|Rate|Share|Appreciation/.test(key)&&Math.abs(v)<1)return (v*100).toFixed(1).replace(/\.0$/,'')+'%';
  return String(v);
}
function sharedDiffText(d){
  const head=d.slice(0,4).map(x=>x.kind==='value'?`${x.label} ${sharedFmt(x.key,x.scenario)} → ${sharedFmt(x.key,x.live)}`:x.kind==='rules'?`${x.label} rule`:x.label);
  return head.join(', ')+(d.length>4?` and ${d.length-4} more`:'');
}
function sharedSetConfig(groups){
  P.sharedLines={groups};
  markDirty();rebuildScenarioResults();buildControls();render();savePlannerState();
}
function sharedToggle(key,on){
  const cfg=PlannerShared.config(P),groups={...cfg.groups};
  const g=PlannerShared.GROUPS.find(x=>x.key===key);
  if(on){
    // What each saved case holds that would be replaced by the live plan's figures.
    const lines=[];
    for(const s of scenarios){
      const d=PlannerShared.differences(s.params,P,[key],D);
      if(d.length)lines.push(`${s.name}: ${sharedDiffText(d)}`);
    }
    if(lines.length&&!showConfirm(`Share ${g.label.toLowerCase()} across every scenario?\n\nThese saved cases hold different figures, and would use your current plan's instead:\n\n${lines.join('\n')}`))return;
    groups[key]=true;
    sharedSetConfig(groups);
    showToast(`${g.label} now the same in every scenario`,'green');
  }else{
    // Freeze this group's figures into each case before it stops being shared.
    for(const s of scenarios){s.params=PlannerShared.attach(s.params,P,[key]);persistScenarioParams(s)}
    groups[key]=false;
    sharedSetConfig(groups);
    for(const s of scenarios)persistScenarioParams(s);
    showToast(`${g.label} can differ by scenario again — each keeps today's figures`,'green');
  }
}
function sharedRecommended(){
  const cfg=PlannerShared.config(P),groups={...cfg.groups};
  const keys=PlannerShared.GROUPS.filter(g=>g.recommended&&!groups[g.key]).map(g=>g.key);
  if(!keys.length)return;
  const lines=[];
  for(const s of scenarios){
    const d=PlannerShared.differences(s.params,P,keys,D);
    if(d.length)lines.push(`${s.name}: ${sharedDiffText(d)}`);
  }
  if(lines.length&&!showConfirm(`Share fixed lines, essentials, childcare and tuition across every scenario?\n\nThese saved cases hold different figures, and would use your current plan's instead:\n\n${lines.join('\n')}`))return;
  keys.forEach(k=>groups[k]=true);
  sharedSetConfig(groups);

}
function budgetNYCApply(){
  const categories=['groceries','dining','shopping','clothing','vacations','misc','entertainment'];
  const values={nycFamilyBudget:true,baseGroceries:14400,baseDining:14400,baseShopping:12000,clothingShare:.4,
    baseVacations:18000,postKidVacations:18000,baseMisc:6000,baseEntertainment:375*12,expenseInflation:.03};
  // Keep a stable reference for legacy income-linked rules. New shared edits are dollar budgets.
  values.sharedBudgetIncome=Object.fromEntries(run(P).R.map(r=>[r.yr,{net:r.netTC,gross:r.gross}]));
  values.sharedLines={groups:Object.fromEntries(PlannerShared.GROUPS.map(g=>[g.key,g.key!=='housing']))};
  const pins={};
  for(const k of Object.keys(P))if(categories.includes(PlannerShared.catOfPin(k)))pins[k]=P[k];
  const before={params:Object.fromEntries(Object.keys(values).map(k=>[k,P[k]])),pins,budgetRules:JSON.parse(JSON.stringify(P.budgetRules||{}))};
  budgetChange('NYC family budget shared across cases',before,()=>{

// The long stretch of deficit years is tuition. It used to be a card on the Goals tab; it belongs
