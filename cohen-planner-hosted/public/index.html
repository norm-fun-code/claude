<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohen Family — Interactive Financial Planner v6</title>
<meta name="theme-color" content="#635bff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%237d76ff'/><stop offset='.55' stop-color='%235048d6'/><stop offset='1' stop-color='%237c3aed'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='url(%23g)'/><path d='M6 21L13 14L17 18L26 8' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='26' cy='8' r='2.4' fill='%23fff'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="/model.js"></script>
<script src="/plan-migrate.js"></script>
<script src="/decisions.js"></script>
<script src="/decision-room.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f9fc;
  --s1:#ffffff;
  --s2:#fafbfc;
  --s3:#f0f4f8;
  --bd:#e6ebf1;
  --bd2:#d0d7de;
  --tx:#0a2540;
  --t2:#425466;
  --t3:#8898aa;
  --t4:#adbdcc;
  --accent:#635bff;
  --accent-d:#4f48cc;
  --accent-soft:#eeecff;
  --g:#1a8754;
  --g-soft:#e7f4ed;
  --r:#cd3d64;
  --r-soft:#fceaee;
  --a:#bf6900;
  --a-soft:#fdf3e3;
  --b:#0073e6;
  --b-soft:#e6f1ff;
  --c:#0891b2;
  --p:#7c3aed;
  --shadow-sm:0 1px 2px rgba(50,71,92,.04);
  --shadow:0 2px 5px rgba(50,71,92,.06),0 1px 2px rgba(50,71,92,.04);
  --shadow-lg:0 8px 20px rgba(50,71,92,.08),0 2px 6px rgba(50,71,92,.04);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);padding:14px 18px;min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv11'}
.mono{font-family:'SF Mono','Fira Code','Courier New',monospace}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:14px}
.hdr h1{font-size:16px;font-weight:600;color:var(--tx);letter-spacing:-.3px}
.hdr-right{display:flex;align-items:center;gap:10px}
.sync-pill{font-size:9px;font-family:'SF Mono',monospace;color:var(--t3);transition:color .2s}
.sync-pill.saving{color:var(--a)}
.sync-pill.synced{color:var(--g)}
.sync-pill.error{color:var(--r)}
.logout-btn{font-size:10px;padding:5px 11px;background:rgba(255,255,255,.55);border:1px solid var(--bd);border-radius:7px;cursor:pointer;font-family:inherit;color:var(--t3);transition:all .14s}
.logout-btn:hover{border-color:var(--r);color:var(--r)}
.layout{display:grid;grid-template-columns:268px 1fr;gap:12px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;max-height:calc(100vh - 70px);overflow-y:auto;box-shadow:var(--shadow-sm)}
.panel::-webkit-scrollbar{width:5px}.panel::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.st{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin:12px 0 6px}
.sr{margin-bottom:8px}.sr .sh{display:flex;justify-content:space-between;margin-bottom:2px}
.sr .sl{font-size:10px;color:var(--t2);font-weight:500}.sr .sv{font-size:10px;color:var(--tx);font-family:'SF Mono',monospace;font-weight:600}
.sr input[type=range]{width:100%;accent-color:var(--accent);height:3px;cursor:pointer}
.kpi-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.kpi:hover{box-shadow:var(--shadow)}
.kpi-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px}
.kpi-v{font-size:16px;font-weight:700;font-family:'SF Mono',monospace;letter-spacing:-.5px;color:var(--tx)}
.kpi-s{font-size:9.5px;color:var(--t2);margin-top:2px}
.tabs{display:flex;gap:3px;margin-bottom:10px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:3px;box-shadow:var(--shadow-sm)}
.tabs button{padding:6px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:inherit;transition:all .12s}
.tabs button:hover{color:var(--tx);background:var(--s3)}
.tabs button.active{background:linear-gradient(135deg,#6e66ff,#5048d6);color:#fff;font-weight:600}
.snap-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.snap-chip{padding:4px 9px;border-radius:6px;font-size:9.5px;font-weight:500;cursor:pointer;border:1px solid rgba(8,145,178,.3);background:#e0f7fa;color:var(--c);display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .12s}
.snap-chip.active{background:var(--c);color:#fff}
.snap-chip .x{font-size:8px;opacity:.6;margin-left:3px}.snap-chip .x:hover{opacity:1;color:var(--r)}
@media print{
  body{padding:0;font-size:11px}
  .panel,#subToggle,#moreBtn,#moreMenu,.logout-btn,.sync-pill,.adv-input-area,.scenario-bar,.snap-bar{display:none!important}
  .tabs button:not(.active){display:none}
  .layout{grid-template-columns:1fr;display:block}
  .cc,.kpi,.sc{box-shadow:none;border-color:#ccc}
  @page{margin:1.2cm}
}
.cc{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:11px;box-shadow:var(--shadow-sm)}
.sc h3{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:4px}
.sc p{font-size:10.5px;color:var(--t2);line-height:1.55}
.tw{max-height:340px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:10px;font-family:'SF Mono',monospace}
th{padding:6px 4px;text-align:right;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--t3);border-bottom:1px solid var(--bd);font-family:'Inter',sans-serif;position:sticky;top:0;background:var(--s2);z-index:1}
td{padding:3px 4px;text-align:right;border-bottom:1px solid var(--bd);color:var(--t2)}
tr:hover td{background:var(--s2)}
.btn{padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--s1);color:var(--t2);font-size:10px;font-weight:500;cursor:pointer;width:100%;margin-top:3px;font-family:inherit;transition:all .12s}
.btn:hover{border-color:var(--bd2);color:var(--tx);background:var(--s2)}
.btn-g{border-color:rgba(99,91,255,.3);color:var(--accent);background:var(--accent-soft)}
.btn-g:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.scenario-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.scenario-chip{padding:4px 10px;border-radius:6px;font-size:9.5px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--s1);color:var(--t2);display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .12s}
.scenario-chip:hover{border-color:var(--bd2);color:var(--tx);background:var(--s2)}
.scenario-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.scenario-chip .x{font-size:8px;opacity:.5;margin-left:3px;cursor:pointer}.scenario-chip .x:hover{opacity:1;color:var(--r)}
.solo-box{background:var(--g-soft);border:1px solid rgba(26,135,84,.2);border-radius:6px;padding:8px 10px;margin:5px 0 7px;font-size:10px;color:var(--t2)}
/* Norm's per-year comp grid: year | cash | stripe stock | derived total */
.comp-grid{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:3px;align-items:center;margin-bottom:3px}
.comp-head{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);margin-bottom:4px}
.comp-head span:last-child{text-align:right}
.comp-yr{font-size:8.5px;font-weight:600;color:var(--t3);font-variant-numeric:tabular-nums}
.comp-in{width:100%;min-width:0;padding:4px 5px;border:1px solid var(--bd);border-radius:5px;background:var(--s1);color:var(--tx);font-family:'SF Mono',ui-monospace,monospace;font-size:9.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.comp-in:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(99,91,255,.12)}
/* Stripe keeps a distinct violet identity everywhere it appears, so equity never reads
   as part of the diversified portfolio. */
.comp-in.comp-stock{border-color:rgba(103,114,229,.35);background:rgba(103,114,229,.05);color:#4c3fd6}
.comp-in.comp-stock:focus{border-color:#6772e5;box-shadow:0 0 0 2px rgba(103,114,229,.15)}
.comp-tot{font-size:8.5px;font-weight:600;color:var(--t2);text-align:right;font-variant-numeric:tabular-nums}
.stripe-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(103,114,229,.08);border:1px solid rgba(103,114,229,.25);border-radius:5px;padding:5px 7px;font-size:8px;line-height:1.45;color:var(--t2);width:100%;margin-bottom:4px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(3,1fr)}.sg{grid-template-columns:1fr}}
@media(max-width:640px){
  body{padding:8px 10px}
  .hdr{flex-direction:column;align-items:flex-start;gap:6px;padding-bottom:8px;margin-bottom:8px}
  .hdr h1{font-size:13px}
  .hdr-right{flex-wrap:wrap;gap:5px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:8px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;padding:5px 8px;font-size:10px}
  .layout{display:block}
  .panel{display:none;margin-bottom:10px;max-height:70vh;overflow-y:auto}
  .panel.mob-open{display:block}
  #mobileControlsToggle{display:flex}
  .tw{overflow-x:auto}
  .cc{padding:10px}
  .snap-bar{gap:4px}
  .scenario-bar{gap:4px}
}
@media(min-width:641px){#mobileControlsToggle{display:none}}
.adv{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:500px;background:var(--s1);border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.adv-msgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.adv-msgs::-webkit-scrollbar{width:6px}.adv-msgs::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.adv-msg{display:flex;gap:10px;max-width:760px}
.adv-msg.user{flex-direction:row-reverse;align-self:flex-end;max-width:560px}
.adv-avatar{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:'SF Mono',monospace}
.adv-avatar.ai{background:linear-gradient(135deg,#6e66ff,#5048d6);color:#fff;box-shadow:0 3px 8px -2px rgba(80,72,214,.5)}
.adv-avatar.user{background:var(--s3);color:var(--tx);border:1px solid var(--bd2)}
.adv-bubble{padding:10px 14px;border-radius:8px;font-size:12.5px;line-height:1.6;color:var(--tx)}
.adv-msg.user .adv-bubble{background:linear-gradient(135deg,rgba(99,91,255,.12),rgba(99,91,255,.06));border:1px solid rgba(99,91,255,.18);color:var(--tx)}
.adv-msg.ai .adv-bubble{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.65);box-shadow:0 1px 1px rgba(10,37,64,.04),0 10px 26px -18px rgba(10,37,64,.3)}
.adv-bubble p{margin-bottom:8px}.adv-bubble p:last-child{margin-bottom:0}
.adv-bubble ul,.adv-bubble ol{margin:6px 0 6px 20px}.adv-bubble li{margin-bottom:3px}
.adv-bubble strong{color:var(--tx);font-weight:600}
.adv-bubble code{font-family:'SF Mono',monospace;background:var(--accent-soft);padding:1px 5px;border-radius:3px;font-size:11px;color:var(--accent)}
.adv-bubble pre{background:var(--bg);padding:8px 10px;border-radius:5px;overflow-x:auto;margin:6px 0;font-size:11px;border:1px solid var(--bd)}
.adv-bubble table{border-collapse:collapse;margin:8px 0;font-size:11px;width:100%}
.adv-bubble th,.adv-bubble td{padding:5px 9px;border-bottom:1px solid var(--bd);text-align:left}
.adv-bubble th{font-weight:700;font-size:9.5px;text-transform:uppercase;color:var(--t3);letter-spacing:.5px}
.adv-bubble h3{font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--tx)}
.adv-bubble h4{font-size:12px;font-weight:600;margin:8px 0 3px;color:var(--t2)}
.adv-input-area{padding:12px 18px 14px;border-top:1px solid var(--bd);background:var(--s1)}
.adv-input-wrap{display:flex;gap:6px;align-items:flex-end;background:var(--s2);border:1px solid var(--bd2);border-radius:8px;padding:6px}
.adv-input-wrap{transition:border-color .15s ease,box-shadow .15s ease}
.adv-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,91,255,.14)}
.adv-input{flex:1;background:transparent;border:none;color:var(--tx);font-family:inherit;font-size:12.5px;resize:none;outline:none;padding:6px;min-height:20px;max-height:140px;line-height:1.5}
.adv-send{background:linear-gradient(135deg,#6e66ff,#5048d6);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:11.5px;font-family:inherit;height:32px;box-shadow:0 4px 12px -4px rgba(80,72,214,.6);transition:transform .12s ease,box-shadow .12s ease}
.adv-send:hover{transform:translateY(-1px);box-shadow:0 7px 16px -5px rgba(80,72,214,.7)}.adv-send:disabled{background:var(--bd2);cursor:not-allowed;box-shadow:none;transform:none}
.adv-agentic-btn{background:var(--s2);border:1px solid var(--bd);color:var(--t2);padding:5px 9px;border-radius:5px;cursor:pointer;font-size:11px;font-family:inherit;height:32px;transition:all .12s;white-space:nowrap}
.adv-agentic-btn:hover{border-color:var(--p);color:var(--p)}
.adv-agentic-btn.active{background:var(--p);color:#fff;border-color:var(--p)}
.adv-tool-call{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;background:#f3f0ff;border:1px solid rgba(124,58,237,.2);border-radius:6px;font-size:10.5px;color:var(--p);margin:4px 0}
.adv-tool-call .tc-icon{font-size:13px;flex-shrink:0}
.adv-tool-call .tc-body{flex:1;line-height:1.45}
.adv-tool-call strong{color:var(--p)}
.adv-proposals{background:var(--s1);border:1px solid rgba(124,58,237,.3);border-radius:8px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 8px rgba(124,58,237,.08)}
.adv-proposals-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.adv-proposals-hdr h4{font-size:11px;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:.5px;margin:0}
.adv-proposals-hdr button{background:transparent;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:0;line-height:1}
.adv-proposals-hdr button:hover{color:var(--tx)}
.adv-proposal-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.adv-proposal-row{display:flex;align-items:center;gap:6px;font-size:11px;padding:5px 8px;background:var(--s2);border-radius:5px}
.adv-proposal-key{font-family:'SF Mono',monospace;color:var(--tx);font-weight:600;min-width:110px}
.adv-proposal-arrow{color:var(--t3);font-size:9px}
.adv-proposal-old{color:var(--t3);text-decoration:line-through}
.adv-proposal-new{color:var(--p);font-weight:600}
.adv-proposal-reason{color:var(--t2);font-size:9.5px;margin-left:auto;text-align:right;max-width:200px}
.adv-proposals-target{display:flex;gap:6px;margin-bottom:8px}
.adv-proposals-target select,.adv-proposals-target input{font-size:11px;padding:6px 8px;border-radius:5px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-family:inherit}
.adv-proposals-target select{flex:0 0 auto;min-width:130px}
.adv-proposals-target input{flex:1;min-width:0}
.adv-proposals-actions{display:flex;gap:6px;flex-wrap:wrap}
.adv-proposals-actions button{padding:6px 11px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.adv-proposals-apply{background:var(--g);color:#fff;border:none;box-shadow:0 3px 9px -3px rgba(26,135,84,.6)}
.adv-proposals-apply:hover{background:#158049}
.adv-proposals-save{background:var(--p);color:#fff;border:none}
.adv-proposals-save:hover{background:#6d28d9}
.adv-proposals-view{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}
.adv-proposals-view:hover{border-color:var(--bd2)}
.adv-thinking{display:flex;gap:3px;padding:3px 0}
.adv-thinking span{width:5px;height:5px;border-radius:50%;background:var(--t3);animation:advblink 1.4s infinite}
.adv-thinking span:nth-child(2){animation-delay:.2s}.adv-thinking span:nth-child(3){animation-delay:.4s}
@keyframes advblink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.adv-welcome{padding:20px;text-align:center;color:var(--t2);font-size:13px;line-height:1.6}
.adv-welcome h3{color:var(--tx);font-size:20px;margin-bottom:8px;font-weight:800;letter-spacing:-.4px}
.adv-starters{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:14px;text-align:left;max-width:600px;margin-left:auto;margin-right:auto}
.adv-starter{padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;cursor:pointer;font-size:11.5px;color:var(--t2);line-height:1.4;transition:all .15s}
.adv-starter{transition:border-color .15s ease,color .15s ease,transform .15s cubic-bezier(.22,1,.36,1),box-shadow .15s ease}
.adv-starter:hover{border-color:var(--accent);color:var(--tx);transform:translateY(-2px);box-shadow:0 12px 26px -16px rgba(99,91,255,.55)}
.adv-starter strong{display:block;color:var(--tx);font-size:12px;margin-bottom:2px}
.adv-toolbar{display:flex;gap:6px;padding:8px 18px;border-bottom:1px solid var(--bd);background:var(--s1);align-items:center}
.adv-toolbar .ctx-pill{background:var(--s2);border:1px solid var(--bd);padding:3px 8px;border-radius:4px;font-size:9.5px;color:var(--t2);font-family:'SF Mono',monospace}
.adv-toolbar .ctx-pill strong{color:var(--g)}
.adv-toolbar button{background:var(--s2);border:1px solid var(--bd);color:var(--t2);padding:4px 9px;border-radius:4px;cursor:pointer;font-size:10px;font-family:inherit;font-weight:500;margin-left:auto}
.adv-toolbar button:hover{border-color:var(--bd2);color:var(--tx)}
.adv-toolbar button.adv-tb-new{background:linear-gradient(135deg,#6e66ff,#5048d6);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 3px 9px -3px rgba(80,72,214,.6)}
.adv-toolbar button.adv-tb-new:hover{color:#fff;transform:translateY(-1px);box-shadow:0 6px 13px -4px rgba(80,72,214,.7)}
.adv-toolbar button.adv-tb-chats{margin-left:0;display:none}/* only shown on mobile, where the rail is hidden */
.adv-wrap{display:grid;grid-template-columns:240px 1fr;gap:0;height:calc(100vh - 220px);min-height:500px;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--s1)}
.adv-rail{background:var(--s2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.adv-rail-hdr{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:var(--s2)}
.adv-rail-hdr h4{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;color:var(--t3);margin:0}
.adv-rail-new{background:linear-gradient(135deg,#6e66ff,#5048d6);color:#fff;border:none;padding:4px 11px;border-radius:6px;cursor:pointer;font-size:10.5px;font-weight:600;font-family:inherit;box-shadow:0 3px 9px -3px rgba(80,72,214,.6);transition:transform .12s ease,box-shadow .12s ease}

/* ═══════════════════════════════════════════════════════════════
   NEXT-GEN VISUAL FOUNDATION — glass / spatial design system
   (1) ambient mesh canvas  (2) glass material + elevation
   (3) typographic scale + tabular numerals  (4) motion layer
   (5) hero net-worth band
   ═══════════════════════════════════════════════════════════════ */

/* (1) Ambient gradient-mesh canvas behind everything ─────────── */
body{background:transparent}
.mesh-bg{position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 42% at 10% 2%, rgba(99,91,255,.16), transparent 62%),
    radial-gradient(34% 40% at 96% 6%, rgba(8,145,178,.13), transparent 60%),
    radial-gradient(40% 42% at 82% 96%, rgba(230,73,128,.09), transparent 62%),
    radial-gradient(42% 46% at 22% 100%, rgba(124,58,237,.10), transparent 64%),
    linear-gradient(180deg,#f7f9fd 0%,#eef2f9 100%);
  filter:saturate(112%);will-change:transform;
  animation:meshDrift 26s ease-in-out infinite alternate}
@keyframes meshDrift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(0,-2.2%,0) scale(1.05)}}

/* (2) Glass material — frosted surfaces + layered elevation ──── */
.panel,.cc,.kpi,.sc,.tabs,.tw,.adv,.adv-wrap{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px) saturate(165%);
  -webkit-backdrop-filter:blur(18px) saturate(165%);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 1px 1px rgba(10,37,64,.04), 0 14px 32px -20px rgba(10,37,64,.28);
}
.kpi{transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s ease, border-color .2s ease}
.kpi:hover{transform:translateY(-3px);
  box-shadow:0 1px 1px rgba(10,37,64,.04), 0 22px 44px -22px rgba(99,91,255,.45);
  border-color:rgba(99,91,255,.28)}
.cc{transition:box-shadow .25s ease}
.cc:hover{box-shadow:0 1px 1px rgba(10,37,64,.04), 0 22px 48px -26px rgba(10,37,64,.34)}
.tabs button.active{box-shadow:0 6px 16px -6px rgba(99,91,255,.6)}
/* Secondary buttons & chips lift subtly on hover */
.btn,.scenario-chip,.snap-chip,.logout-btn{transition:transform .15s cubic-bezier(.22,1,.36,1),box-shadow .15s ease,border-color .15s ease,background .15s ease,color .15s ease}
.btn:hover,.scenario-chip:hover,.snap-chip:hover{transform:translateY(-1px)}
.btn-g:hover{box-shadow:0 8px 18px -8px rgba(99,91,255,.7)}

/* (3) Typographic scale + tabular numerals ──────────────────── */
.kpi-v,.hero-v,.sv,.mono,table,td,th,.adv-rail-meta,.sync-pill{font-variant-numeric:tabular-nums;font-feature-settings:'tnum','ss01','cv11'}
.kpi-v{font-size:17px}
.hdr{position:relative;border-bottom:none;padding-bottom:12px}
.hdr::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--accent) 0%,rgba(8,145,178,.5) 35%,rgba(230,73,128,.25) 70%,transparent 100%)}
/* Cohesive thin scrollbars across the app */
*{scrollbar-width:thin;scrollbar-color:rgba(10,37,64,.18) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(10,37,64,.16);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(99,91,255,.4);background-clip:padding-box}
/* Brand lockup — gradient mark + wordmark */
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#7d76ff 0%,#5048d6 55%,#7c3aed 100%);
  box-shadow:0 7px 18px -5px rgba(80,72,214,.65),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease}
.brand:hover .brand-mark{transform:translateY(-1px) rotate(-3deg);box-shadow:0 10px 22px -5px rgba(80,72,214,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.brand-text h1{font-size:19px;font-weight:800;letter-spacing:-.6px;line-height:1.02;
  background:linear-gradient(95deg,#0a2540 0%,#5048d6 110%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#5048d6}
.brand-sub{font-size:9.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1.3px;margin-top:3px;display:flex;align-items:center;gap:7px}
.brand-ver{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;font-size:8.5px;letter-spacing:.6px;font-weight:700}
@media(max-width:640px){.brand-mark{width:32px;height:32px;border-radius:9px}.brand-text h1{font-size:15px}.brand-sub{font-size:8.5px;letter-spacing:1px}}
.logout-btn,#monarchSyncBtn,#monarchConnectBtn{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* (4) Motion layer — entrance, count-up, tab cross-fade ─────── */
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.reveal{animation:riseIn .6s cubic-bezier(.22,1,.36,1) both}
.tab-fade{animation:fadeIn .4s ease both}

/* (5) Hero net-worth band ───────────────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 26px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  background:linear-gradient(118deg, rgba(99,91,255,.13) 0%, rgba(8,145,178,.07) 55%, rgba(230,73,128,.06) 100%);
  border:1px solid rgba(255,255,255,.6);
  backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:0 1px 1px rgba(10,37,64,.05), 0 26px 56px -30px rgba(99,91,255,.5)}
.hero::before{content:'';position:absolute;top:-60%;right:-10%;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,91,255,.22),transparent 68%);pointer-events:none}
.hero-main{position:relative;z-index:1}
.hero-eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);
  margin-bottom:8px;display:flex;align-items:center;gap:7px}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(26,135,84,.18);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero-v{font-size:48px;font-weight:800;letter-spacing:-1.8px;line-height:.95;color:var(--tx)}
.hero-sub{font-size:12.5px;color:var(--t2);margin-top:10px;line-height:1.5}
.hero-sub b{color:var(--tx);font-weight:600}
.hero-spark{position:relative;z-index:1;flex-shrink:0}
@media(max-width:640px){.hero{flex-direction:column;align-items:flex-start;padding:18px 18px}.hero-v{font-size:36px;letter-spacing:-1.2px}.hero-spark{width:100%}.hero-spark svg{width:100%}}

/* (6) Premium range sliders — the whole control rail ────────── */
.sr input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;width:100%;cursor:pointer;margin:2px 0}
.sr input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:6px;background:rgba(10,37,64,.11)}
.sr input[type=range]::-moz-range-track{height:5px;border-radius:6px;background:rgba(10,37,64,.11)}
.sr input[type=range]::-moz-range-progress{height:5px;border-radius:6px;background:linear-gradient(90deg,#6e66ff,#5048d6)}
.sr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#8079ff,#5048d6);
  box-shadow:0 1px 3px rgba(80,72,214,.5),0 0 0 3px rgba(99,91,255,.12);transition:transform .12s ease,box-shadow .12s ease}
.sr input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#8079ff,#5048d6);box-shadow:0 1px 3px rgba(80,72,214,.5),0 0 0 3px rgba(99,91,255,.12)}
.sr input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
.sr input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15);box-shadow:0 2px 5px rgba(80,72,214,.6),0 0 0 5px rgba(99,91,255,.2)}
.sr input[type=range]:focus{outline:none}
.sr input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 1px 3px rgba(80,72,214,.5),0 0 0 4px rgba(99,91,255,.3)}

/* (7) Command palette (⌘K) ───────────────────────────────────── */
#cmdPalette{position:fixed;inset:0;background:rgba(10,37,64,.45);z-index:9999;display:flex;align-items:flex-start;justify-content:center;padding-top:11vh;animation:fadeIn .15s ease both}
.cmdk-panel{width:100%;max-width:560px;margin:0 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 1px rgba(10,37,64,.05),0 40px 80px -20px rgba(10,37,64,.5);
  animation:riseIn .18s cubic-bezier(.22,1,.36,1) both}
.cmdk-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(10,37,64,.08)}
.cmdk-icon{font-size:15px;color:var(--accent)}
.cmdk-input-wrap input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:var(--tx)}
.cmdk-input-wrap input::placeholder{color:var(--t3)}
.cmdk-esc{font-size:9.5px;font-weight:600;color:var(--t3);background:rgba(10,37,64,.06);padding:2px 6px;border-radius:4px;font-family:'SF Mono',monospace}
.cmdk-list{max-height:min(50vh,420px);overflow-y:auto;padding:6px}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--t2)}
.cmdk-item:hover,.cmdk-item.active{background:linear-gradient(135deg,rgba(99,91,255,.12),rgba(99,91,255,.05))}
.cmdk-item-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.cmdk-item-label{flex:1;color:var(--tx);font-weight:500}
.cmdk-item-hint{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.cmdk-empty{padding:24px;text-align:center;color:var(--t3);font-size:12px}
.cmdk-trigger{font-size:9.5px;font-weight:500;padding:5px 9px;background:rgba(255,255,255,.55);border:1px solid var(--bd);border-radius:7px;cursor:pointer;font-family:inherit;color:var(--t2);display:flex;align-items:center;gap:5px;transition:all .14s}
.cmdk-trigger kbd{font-family:'SF Mono',monospace;font-size:9px;background:rgba(10,37,64,.07);padding:1px 4px;border-radius:3px}

/* (8) Story mode — milestone walkthrough ─────────────────────── */
#storyOverlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;

.story-close{position:absolute;top:20px;right:24px;width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:rgba(255,255,255,.7);color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.story-close:hover{background:#fff;color:var(--tx)}
.story-dots{display:flex;gap:6px;margin-bottom:22px}
.story-dot{width:7px;height:7px;border-radius:50%;background:rgba(10,37,64,.15);cursor:pointer;transition:all .2s;border:none;padding:0}
.story-dot.active{background:var(--accent);width:22px;border-radius:4px}
.story-stage{width:100%;max-width:420px;display:flex;justify-content:center}
.story-card{background:rgba(255,255,255,.78);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:32px 30px;width:100%;text-align:center;
  box-shadow:0 1px 1px rgba(10,37,64,.05),0 40px 80px -24px rgba(99,91,255,.5)}
.story-icon{font-size:38px;margin-bottom:8px}
.story-year{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.story-title{font-size:22px;font-weight:800;color:var(--tx);letter-spacing:-.4px;margin-bottom:8px}
.story-sub{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:18px}
.story-spark{margin-bottom:18px;display:flex;justify-content:center}
.story-stats{display:flex;justify-content:center;gap:28px}
.story-stat-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px}
.story-stat-v{font-size:17px;font-weight:700;font-family:'SF Mono',monospace;color:var(--tx)}
.story-nav{display:flex;gap:10px;margin-top:26px}
.story-nav button{padding:9px 20px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--bd);background:rgba(255,255,255,.7);color:var(--t2);transition:all .15s}
.story-nav button:hover{border-color:var(--bd2);color:var(--tx)}
.story-nav button:disabled{opacity:.4;cursor:not-allowed}
#storyNext{background:linear-gradient(135deg,#6e66ff,#5048d6);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(80,72,214,.6)}
#storyNext:hover{color:#fff}
@media(max-width:640px){.story-card{padding:26px 20px}.story-title{font-size:19px}.story-stats{gap:18px}}

/* (9) Milestone celebration confetti ──────────────────────────── */
@keyframes confettiFall{
  0%{transform:translate(0,0) rotate(0deg);opacity:1}
  100%{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:0}
}

/* Respect reduced-motion preference ─────────────────────────── */
@media(prefers-reduced-motion:reduce){
  .mesh-bg,.hero-eyebrow .dot{animation:none}
  .reveal,.tab-fade{animation:none}
  .kpi{transition:none}
}

// ═══ SYNC STATUS ═══
function setSyncStatus(status){
  const el=document.getElementById('syncStatus');
  if(!el)return;
  el.className='sync-pill '+status;
  if(status==='saving')el.textContent='Saving…';
  else if(status==='synced')el.textContent='✓ Synced';
  else if(status==='error')el.textContent='⚠ Save failed';
  else el.textContent='';
}

// ═══ PERSISTENCE — backed by server API ═══
let _saveTimer=null;
let _saveQueue=Promise.resolve();
let _saveRevision=0;
let _planLoaded=false;
function savePlannerState(){
  if(!_planLoaded){setSyncStatus('error');return;}
  setSyncStatus('saving');
  const revision=++_saveRevision;
  const payload=JSON.stringify({state:{P,compareMode,activeTab,_projView,_todayView,_homeView,activeScenarioIdx,scenarioDirty,monarchSnapshot,experienceVersion:6}});
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    // Serialize writes so a slower earlier request cannot overwrite newer state.
    _saveQueue=_saveQueue.catch(()=>{}).then(async()=>{
      try{
        const response=await fetch('/api/planner-state',{
          method:'PUT',headers:{'Content-Type':'application/json'},body:payload
        });
        if(!response.ok)throw new Error('HTTP '+response.status);
        if(revision===_saveRevision)setSyncStatus('synced');
      }catch(e){
        if(revision===_saveRevision)setSyncStatus('error');
      }
    });
  },500);
}

// Saved-state migration lives in /plan-migrate.js so it can be unit-tested in Node and
// shared with roll-forward. See that file for the generation-by-generation chain.
function migrateP(raw){return PlanMigrate.migrateP(raw)}

async function loadFromServer(){
  try{
    const [stRes,scRes]=await Promise.all([
      fetch('/api/planner-state'),
      fetch('/api/scenarios')
    ]);
    if(stRes.ok){
      const d=await stRes.json();
      const s=d.state||{};
      if(s.P)P={...D,...migrateP(s.P)};
      if(s.compareMode!==undefined)compareMode=s.compareMode;
      if(s.experienceVersion>=6&&s.activeTab)activeTab=s.activeTab;
      _planLoaded=true;
      if(s._projView!==undefined)_projView=s._projView;
      if(s._todayView!==undefined)_todayView=s._todayView;
      if(s._homeView!==undefined)_homeView=s._homeView;
      if(s.activeScenarioIdx!==undefined)activeScenarioIdx=s.activeScenarioIdx;
      if(s.scenarioDirty!==undefined)scenarioDirty=!!s.scenarioDirty;
      if(PlannerDecisions.usableSnapshot(s.monarchSnapshot)&&!monarchSnapshot)monarchSnapshot=s.monarchSnapshot; // don't clobber a fresh auto-sync
    }else{
      showToast('⚠️ Could not load plan state (HTTP '+stRes.status+')','red');
    }
    if(scRes.ok){
      const sc=await scRes.json();
      scenarios=sc.map((s,i)=>{
        const params=migrateP(s.params||{});
        let results;
        try{results=run({...D,...params});}
        catch(e){console.warn('scenario rehydrate failed:',s.name,e);results=run({...D});}
        return{id:s.id,name:s.name,color:s.color||COLORS[i%COLORS.length],params,results};
      });
      console.log('Loaded',scenarios.length,'scenarios from server');
    }else{
      showToast('⚠️ Could not load scenarios (HTTP '+scRes.status+')','red');
    }
  }catch(e){
    console.error('loadFromServer error:',e);
    showToast('⚠️ Network error loading data: '+e.message,'red');
  }
  if(!_planLoaded){
    document.getElementById('controls').innerHTML='';
    document.getElementById('chartArea').innerHTML='<div role="alert" style="padding:24px">Could not load your saved plan. Saving is disabled to protect your data. <button class="btn" onclick="location.reload()">Reload saved plan</button></div>';
    return;
  }
  buildControls();render();
  checkMonarchStatus();
}

function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.P)P={...D,...d.P};if(d.scenarios)scenarios=d.scenarios.map((s,i)=>({...s,color:COLORS[i%COLORS.length],results:run({...D,...s.params})}));buildControls();render()}catch(err){alert('Invalid file')}};r.readAsText(f)};i.click()}

async function loadMonarchInvestments(period){
  if(_investLoading)return; // prevent concurrent fetches causing jump/flicker
  if(period){_investPeriod=period;monarchInvestments=null;}
  _investLoading=true;
  // Don't call render() here — the caller (renderPortfolioTab) already shows loading state
  try{

    if(!r.ok){const e=await r.json().catch(()=>({}));monarchInvestments=false;showToast('Investments: '+(e.error||'failed'),'red');}

async function syncMonarch({quiet=false}={}){
  if(_monarchSyncInFlight)return;
  _monarchSyncInFlight=true;
  const btn=document.getElementById('monarchSyncBtn');
  if(btn){btn.textContent='⟳ Syncing…';btn.disabled=true;}
  try{
    const r=await fetch('/api/monarch-snapshot',{cache:'no-store'});
    if(r.status===401)throw new Error('Your planner session expired. Sign in again.');
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'HTTP '+r.status);}
    const d=await r.json();
    const nw=d.netWorth?.value;
    const ret=d.retirement?.value??0;
    const nextSnapshot={
      netWorth:nw,
      liquid:d.liquid?.value??(nw-ret),
      retirement:ret,
      assets:d.assets?.value,
      liabilities:d.liabilities?.value,
      accountCount:d.accounts?.length||0,
      syncedAt:d.netWorth?.updatedAt,
      source:d.source,stale:d.stale,warning:d.warning,partial:!!d.partial,missingAccounts:d.missingAccounts||[],
    };
    if(!nextSnapshot.accountCount||!PlannerDecisions.usableSnapshot({...nextSnapshot,partial:false}))throw new Error('No verified balances returned. Previous data retained.');
    if(monarchSnapshot&&Date.parse(nextSnapshot.syncedAt)<Date.parse(monarchSnapshot.syncedAt))throw new Error('Source returned older balances. Previous data retained.');
    monarchSnapshot=nextSnapshot;
    monarchAccounts=d.accounts;
    const freshness=document.getElementById('monarchFreshness');
    if(freshness){freshness.textContent=(d.partial?'Incomplete totals · ':d.stale||d.warning?'Older balances · ':'Observed · ')+new Date(nextSnapshot.syncedAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});freshness.title=d.partial?`${d.missingAccounts.length} account(s) have no balance in Monarch. Totals include available balances only.`:d.warning||'Latest balance observation from NormOS. Bank refresh times may differ.';}
    if(btn){btn.textContent=d.partial?'📍 Refresh available balances':d.partial?'📍 Refresh available balances':d.stale||d.warning?'📍 Check sync':'📍 Refresh balances';btn.disabled=false;btn.style.display='';}
    const connBtn=document.getElementById('monarchConnectBtn');if(connBtn)connBtn.style.display='none';
    if(!quiet)showToast((d.partial?`${d.accounts.length} accounts synced; ${d.missingAccounts.length} balance unavailable. Totals are incomplete.`:null)||d.warning||(d.stale?'Showing older balances from NormOS. Run the Monarch sync to update them.':`Monarch via NormOS · Liquid ${fmt(monarchSnapshot.liquid)} · 401k ${fmt(monarchSnapshot.retirement)}`),d.stale||d.warning?'red':'green');
    savePlannerState(); // persist last sync so it shows instantly next open
    render();
  }catch(e){
    if(btn){btn.textContent='📍 Sync Monarch';btn.disabled=false;}
    const freshness=document.getElementById('monarchFreshness');
    if(freshness){freshness.textContent='Sync unavailable · previous balances retained';freshness.title=e.message;}
    if(!quiet)showToast('Monarch sync failed: '+e.message,'red');
  }finally{_monarchSyncInFlight=false;}
}

function anchorToToday(){

  if(monarchSnapshot.partial){showToast('Totals are incomplete. Review the missing account in Portfolio before comparing with your plan.','red');return;}
  const curYr=new Date().getFullYear();
  const todayLiq=monarchSnapshot.liquid;
  const totalNw=monarchSnapshot.netWorth;
  const ret=monarchSnapshot.retirement;
  const syncDate=new Date(monarchSnapshot.syncedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  // Pro-rate plan's liquid target to today for comparison
  let planLiqToday=null;
  try{
    const{R}=run(P);
    const row=R.find(x=>x.yr===curYr)||R[0];
    const prev=R.find(x=>x.yr===curYr-1);
    const jan1=prev?planLiquidComparable(prev):((P.startingLiquid||0)+(P.startingStripeEquity||0));

async function saveSnapshot(silent,labelOverride){
  const RES=run(P);const{R,tT}=RES;const last=R[R.length-1];
  const def=RES.drawYears;
  const dflt=`${P.planStartYear||2026} plan · ${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;

  snapshots.push({...snap,plan_year:snap.planYear,created_at:new Date().toISOString()});

async function deleteSnapshot(id){

// Synced Stripe balance vs. the planning assumption. A synced value NEVER overwrites a
// planning input on its own — this only ever offers the move, and the reclassify itself is
// value-neutral: it shifts dollars from startingLiquid to startingStripeEquity so total
// starting net worth is unchanged to the dollar.
function syncedStripeBalance(){
  const a=(monarchAccounts||[]).find(x=>x&&typeof x.name==='string'&&x.name.toLowerCase().includes('stripe'));
  return a&&a.balance>0?Math.round(a.balance):0;
}
function renderReclassifyRow(){
  const actual=syncedStripeBalance();
  if(!actual)return'';
  const planned=Math.round(P.startingStripeEquity||0);
  if(Math.abs(actual-planned)<1000){
    return`<div class="stripe-chip">✓ Matches your synced Stripe balance of ${fmt(actual)}.</div>`;
  }
  const move=actual-planned;
  const room=Math.round(P.startingLiquid||0);
  const canMove=move<=0||room>=move;
  return`<div class="stripe-chip" style="flex-direction:column;align-items:flex-start;gap:3px">
    <div>Monarch shows <strong style="color:#4c3fd6">${fmt(actual)}</strong> in Stripe; your plan assumes <strong>${fmt(planned)}</strong>.</div>
    ${canMove
      ? `<button onclick="reclassifyStripe(${actual})" style="background:#6772e5;color:#fff;border:none;border-radius:5px;padding:4px 8px;font-family:inherit;font-size:8px;font-weight:600;cursor:pointer">${move>0?`Move ${fmtF(move)} from Starting Liquid → Stripe`:`Move ${fmtF(-move)} from Stripe → Starting Liquid`}</button>`
      : `<span style="color:var(--t3)">Starting Liquid (${fmt(room)}) is too small to reclassify ${fmtF(move)} without inventing wealth — adjust it first.</span>`}
  </div>`;
}
function reclassifyStripe(actual){
  const planned=Math.round(P.startingStripeEquity||0);
  const move=actual-planned;
  const before=Math.round((P.startingLiquid||0)+planned);
  if(move>0&&(P.startingLiquid||0)<move){showToast('Starting Liquid is too small to reclassify that amount','red');return}
  if(!showConfirm(`Reclassify ${fmtF(Math.abs(move))} ${move>0?'from Starting Liquid into Stripe equity':'from Stripe equity back into Starting Liquid'}?\n\nYour total starting net worth stays exactly ${fmt(before)} — this only changes which pool it sits in.`))return;
  P.startingLiquid=Math.round((P.startingLiquid||0)-move);
  P.startingStripeEquity=actual;
  markDirty();buildControls();render();savePlannerState();
  showToast(`Reclassified — starting net worth unchanged at ${fmt(before)}`,'green');
}

    <div style="font-size:10.5px;color:#425466;margin-bottom:14px;line-height:1.6">
      This will:<br>
      • Auto-save a snapshot of your ${curYear} plan<br>

      • Advance plan start year to ${nextYear}
    </div>
    <label style="display:block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#8898aa;margin-bottom:5px">Diversified liquid Jan ${nextYear} <span style="text-transform:none;letter-spacing:0;font-weight:400">(excludes Stripe)</span></label>

      onkeydown="if(event.key==='Enter')confirmRollForward(this.closest('div[style*=fixed]'),${curYear},${nextYear});if(event.key==='Escape')this.closest('div[style*=fixed]').remove()">

      style="width:100%;padding:9px 11px;border:1px solid rgba(103,114,229,.55);border-radius:7px;font-size:13px;font-family:'SF Mono',monospace;color:#4c3fd6;outline:none;margin-bottom:6px"
      onkeydown="if(event.key==='Enter')confirmRollForward(this.closest('div[style*=fixed]'),${curYear},${nextYear});if(event.key==='Escape')this.closest('div[style*=fixed]').remove()">
    ${(()=>{const a=syncedStripeBalance();return a?`<div style="font-size:9.5px;color:#425466;margin-bottom:12px">Monarch shows <strong style="color:#4c3fd6">${fmt(a)}</strong> — <button type="button" onclick="document.getElementById('rfStripeInput').value=(${a}).toLocaleString()" style="background:none;border:none;padding:0;color:#635bff;font-family:inherit;font-size:9.5px;font-weight:600;cursor:pointer;text-decoration:underline">use actual</button></div>`:'<div style="margin-bottom:12px"></div>'})()}
    <div style="display:flex;gap:8px">
      <button onclick="confirmRollForward(this.closest('div[style*=fixed]'),${curYear},${nextYear})"
        style="flex:1;background:#0891b2;color:#fff;border:none;padding:10px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit">Roll Forward</button>
      <button onclick="this.closest('div[style*=fixed]').remove()"
        style="flex:1;background:#f0f4f8;color:#425466;border:1px solid #e6ebf1;padding:10px;border-radius:7px;cursor:pointer;font-size:13px;font-family:inherit">Cancel</button>

async function confirmRollForward(overlay,curYear,nextYear){
  const inp=document.getElementById('rfLiqInput');
  const liqStr=inp?inp.value:'';
  const stripeEl=document.getElementById('rfStripeInput');
  const stripeStr=stripeEl?stripeEl.value:'';
  if(overlay)overlay.remove();
  await saveSnapshot(true,`${curYear} plan · rolled forward ${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`);
  // Every rolling window (Norm's two comp streams, the Stripe return curve, Nancy's W2
  // years) shifts together — see /plan-migrate.js, which is unit-tested for exactly this.
  P=PlanMigrate.rollForwardParams(P);
  const v=parseFloat(String(liqStr).replace(/[,$\s]/g,''));
  if(!isNaN(v)&&v>0)P.startingLiquid=v;
  // Stripe accepts 0 (unlike liquid) — "I hold none" is a legitimate answer here.
  const sv=parseFloat(String(stripeStr).replace(/[,$\s]/g,''));
  if(!isNaN(sv)&&sv>=0)P.startingStripeEquity=sv;
  buildControls();render();savePlannerState();
  showToast(`✓ Rolled forward to ${nextYear}`,'green');
}

// Tween a formatted number element ("$1.2M", "34.5%", "+$450K") from 0 → its value
function _animEl(el){
  if(!el)return;
  const final=el.textContent.trim();
  const m=final.match(/^([^\d-]*)(-?[\d,]*\.?\d+)(.*)$/);
  if(!m||_reduceMotion()){return}
  const prefix=m[1],numStr=m[2],suffix=m[3];
  const grouped=numStr.includes(',');
  const decimals=(numStr.split('.')[1]||'').length;
  const target=parseFloat(numStr.replace(/,/g,''));
  if(!isFinite(target))return;
  const fmtNum=v=>{let s=v.toFixed(decimals);if(grouped)s=Number(s).toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});return prefix+s+suffix};
  const dur=850,t0=performance.now();
  function step(now){const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,3);el.textContent=fmtNum(target*e);if(p<1)requestAnimationFrame(step);else el.textContent=final}
  requestAnimationFrame(step);
}
// Crisp inline sparkline (bespoke, no Chart.js) for the hero band
function _sparkSVG(vals,w,h,color){
  if(!vals||vals.length<2)return'';
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1,pad=4;
  const pts=vals.map((v,i)=>[pad+i/(vals.length-1)*(w-2*pad), h-pad-((v-min)/rng)*(h-2*pad)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${(w-pad).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
  const lastPt=pts[pts.length-1],gid='sp'+(''+color).replace(/[^a-z0-9]/gi,'');
  return `<svg class="hero-spark-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

// ═══ MILESTONE CELEBRATIONS — real (Monarch-synced) net-worth crossings ═══
const _MILESTONE_KEY='cohenPlannerNWMilestone';
function _milestoneThresholds(){
  const th=[];
  for(let v=250000;v<1e6;v+=250000)th.push(v);
  for(let v=1e6;v<=10e6;v+=1e6)th.push(v);
  for(let v=15e6;v<=50e6;v+=5e6)th.push(v);
  return th;
}
function _checkMilestone(nw){
  if(nw==null||!isFinite(nw))return;
  const thresholds=_milestoneThresholds();
  let hit=null;
  for(const t of thresholds){if(nw>=t)hit=t;else break}
  if(hit==null)return;
  let stored=NaN;
  try{stored=parseFloat(localStorage.getItem(_MILESTONE_KEY));}catch(e){}
  if(!isFinite(stored)){
    // First time ever checking on this browser — seed silently, don't celebrate
    // whatever the number already happens to be on first load.
    try{localStorage.setItem(_MILESTONE_KEY,String(hit));}catch(e){}
    return;
  }
  if(hit>stored){
    try{localStorage.setItem(_MILESTONE_KEY,String(hit));}catch(e){}
    _celebrateMilestone(hit);
  }
}
function _celebrateMilestone(v){

    const x=30+Math.random()*40;

    const color=colors[i%colors.length];

      const bg=r.yr===P.homePurchaseYear?'rgba(191,105,0,.06)':r.tu>150000?'rgba(205,61,100,.04)':'';

        `<td style="font-weight:700;color:var(--tx)">${r.yr}</td>`+

        `<td style="color:#6772e5">${dash(r.normStock)}</td>`+
        `<td style="font-weight:600" title="Cash + stock — the W-2 figure taxes are computed on">${fmt(r.normG)}</td>`+
        `<td style="color:var(--p)">${fmt(r.nancyG)}</td>`+
        `<td>${fmt(r.gross)}</td>`+
        `<td style="color:var(--r)">${fmt(r.tax)}</td>`+
        `<td style="color:var(--a)">${(r.effRate*100).toFixed(1)}%</td>`+
        `<td style="color:var(--g)">${fmt(r.inc)}</td>`+
        `<td>${fmt(r.totE)}</td>`+
        `<td style="color:${r.gap>0?'var(--a)':'var(--t3)'}" title="Shortfall against cash pay alone — how much of the year's vest must be sold">${r.gap>0?'−'+fmt(r.gap):'—'}</td>`+`<td style="color:${r.incGap>0?'var(--r)':'var(--t3)'};font-weight:${r.incGap>0?600:400}" title="Still short after selling every vesting share — this is what draws on savings">${r.incGap>0?'−'+fmt(r.incGap):'—'}</td>`+
        `<td style="color:#6772e5">${dash(r.sSold)}</td>`+
        `<td style="color:#6772e5;font-weight:600">${dash(r.sRet)}</td>`+
        `<td style="color:var(--b)">${fmt(r.liq)}</td>`+
        `<td style="color:#6772e5;font-weight:600">${dash(r.sEnd)}</td>`+
        `<td style="color:var(--p)">${dash(r.eq)}</td>`+
        `<td style="color:var(--g);font-weight:600">${fmt(r.nw)}</td>`+
      `</tr>`}).join('')}</tbody></table></div>`;return}
  if(!reuseChart)ca.innerHTML='<canvas id="cv" style="height:300px"></canvas>';
  const ctx=document.getElementById('cv').getContext('2d');const opts=chartOpts();
  // Prepend planStartYear-1 as a synthetic starting point showing initial liquid
  const sy0=P.planStartYear||2026;
  const nwLabels=[String(sy0-1),...labels];
  const startLiqK=Math.round(P.startingLiquid/1000);
  const startLiqPlusStripeK=Math.round(((P.startingLiquid||0)+(P.startingStripeEquity||0))/1000);
  // Monarch actual dot — added to each chart dataset array below
  const _mSnap=monarchSnapshot;
  const _mDotIdx=_mSnap?nwLabels.indexOf(String(new Date().getFullYear())):-1;
  const _mImpliedLiqK=_mSnap?Math.round(_mSnap.liquid/1000):0; // includes Stripe — compare to liquid+Stripe, not the ex-Stripe line
  const _mTotalK=_mSnap?Math.round(_mSnap.netWorth/1000):0;
  const _mRetK=_mSnap?Math.round(_mSnap.retirement/1000):0;
  function _mDotDs(yK,label){
    if(!_mSnap||_mDotIdx<0)return null;
    return{label,data:nwLabels.map((_,i)=>i===_mDotIdx?yK:null),
      borderColor:'#f59e0b',backgroundColor:'#f59e0b',
      pointRadius:nwLabels.map((_,i)=>i===_mDotIdx?8:0),
      pointHoverRadius:12,borderWidth:0,fill:false,tension:0,spanGaps:false,
      pointStyle:'circle'};
  }
  if(_projView==='nw'){
    const po=posOpts();
    const ds=[{label:'Total NW'+(inflationView?' (real)':''),data:[startLiqK,...R.map(r=>deflK(r.nw,r.yr))],borderColor:'#635bff',backgroundColor:_areaGrad('#635bff',.24,0),fill:true,tension:.35,pointRadius:0,pointHoverRadius:5,pointBackgroundColor:'#635bff',pointBorderColor:'#fff',borderWidth:2.5,borderCapStyle:'round'},{label:'Liquid (ex-Stripe)'+(inflationView?' (real)':''),data:[startLiqK,...R.map(r=>deflK(r.liq,r.yr))],borderColor:'#0073e6',backgroundColor:_areaGrad('#0073e6',.14,0),fill:true,tension:.35,pointRadius:0,pointHoverRadius:5,pointBackgroundColor:'#0073e6',pointBorderColor:'#fff',borderWidth:2,borderCapStyle:'round'},{label:'Stripe'+(inflationView?' (real)':''),data:[Math.round((P.startingStripeEquity||0)/1000),...R.map(r=>deflK(r.sEnd,r.yr))],borderColor:'#6772e5',backgroundColor:_areaGrad('#6772e5',.16,0),fill:true,tension:.35,pointRadius:0,pointHoverRadius:5,pointBackgroundColor:'#6772e5',pointBorderColor:'#fff',borderWidth:2,borderCapStyle:'round'},{label:'Home equity'+(inflationView?' (real)':''),data:[0,...R.map(r=>deflK(r.eq,r.yr))],borderColor:'#7c3aed',fill:false,tension:.35,pointRadius:0,pointHoverRadius:5,pointBackgroundColor:'#7c3aed',pointBorderColor:'#fff',borderWidth:1.5,borderDash:[4,3]},{label:'401(k)'+(inflationView?' (real)':''),data:[Math.round((P.k401Start||0)/1000),...R.map(r=>deflK(r.k401,r.yr))],borderColor:'#0f9b6c',fill:false,tension:.35,pointRadius:0,pointHoverRadius:5,pointBackgroundColor:'#0f9b6c',pointBorderColor:'#fff',borderWidth:1.5,borderDash:[2,3],hidden:true}];
    if(_stressMode){
      const bear=run({...P,investReturn:Math.max(.02,P.investReturn-.02),expenseInflation:Math.min(.06,P.expenseInflation+.01)});
      const bull=run({...P,investReturn:Math.min(.12,P.investReturn+.02),expenseInflation:Math.max(.01,P.expenseInflation-.005)});
      ds.push({label:'Upside NW (+2% return, −0.5% spend)',data:[startLiqK,...bull.R.map(r=>deflK(r.nw,r.yr))],borderColor:'rgba(26,135,84,.5)',backgroundColor:'rgba(99,91,255,.08)',fill:'+1',tension:.3,pointRadius:0,borderWidth:1.5,borderDash:[3,3]});
      ds.push({label:'Downside NW (−2% return, +1% spend)',data:[startLiqK,...bear.R.map(r=>deflK(r.nw,r.yr))],borderColor:'rgba(205,61,100,.5)',fill:false,tension:.3,pointRadius:0,borderWidth:1.5,borderDash:[3,3]});
    }
    if(_bandMode){
      if(_cachedBand&&_cachedBand.sig===_bandParamSig()){
        const{p10,p50,p90}=_cachedBand.band;const toK=v=>Math.round(v/1000);
        const src=_cachedBand.mode==='historical'?'historical':'synthetic';
        ds.push({label:`P90 upside (${src})`,data:[startLiqK,...p90.map(toK)],borderColor:'rgba(26,135,84,.55)',backgroundColor:'rgba(99,91,255,.06)',fill:'+2',tension:.3,pointRadius:0,borderWidth:1.3,borderDash:[2,2]});
        ds.push({label:'P50 median',data:[startLiqK,...p50.map(toK)],borderColor:'rgba(10,37,64,.55)',fill:false,tension:.3,pointRadius:0,borderWidth:1.5,borderDash:[5,3]});
        ds.push({label:'P10 downside',data:[startLiqK,...p10.map(toK)],borderColor:'rgba(205,61,100,.55)',fill:false,tension:.3,pointRadius:0,borderWidth:1.3,borderDash:[2,2]});
      } else {
        // Cache is stale (a slider moved since the last simulation) — don't render a band
        // that no longer matches the current assumptions; refresh it in the background
        // instead of blocking every render on an 500-trial Monte Carlo.
        _scheduleBandRefresh();
      }
    }
    if(compareMode)scenarios.forEach(s=>{const sLiq=Math.round((s.params.startingLiquid||P.startingLiquid)/1000);ds.push({label:s.name+' Liquid',data:[sLiq,...s.results.R.map(r=>deflK(r.liq,r.yr))],borderColor:s.color,fill:false,tension:.3,pointRadius:3,pointBackgroundColor:s.color,borderWidth:3.5})});
    // Snapshot overlay — compare a saved projection against the current plan.
    // Map by calendar year (not array position): the snapshot's own planStartYear can
    // differ from the live plan's (e.g. after any roll-forward since it was saved), and
    // Chart.js plots array data positionally against the shared `nwLabels` — plotting
    // sr.R by index silently shifted the whole snapshot line by N years whenever the two
    // start years didn't match.
    if(overlaySnapId){
      const sn=snapshots.find(x=>x.id===overlaySnapId);
      if(sn&&sn.params){
        const sr=run({...D,...migrateP(sn.params)});
        const snSy=sn.params.planStartYear||sy0;
        const byYr={};sr.R.forEach(r=>{byYr[r.yr]=deflK(r.nw,r.yr)});
        byYr[snSy-1]=Math.round((sn.params.startingLiquid||P.startingLiquid)/1000);
        const snData=nwLabels.map(lbl=>{const v=byYr[parseInt(lbl,10)];return v===undefined?null:v});
        ds.push({label:'📸 '+sn.label+' (NW)',data:snData,borderColor:'#bf6900',fill:false,tension:.3,pointRadius:0,borderWidth:2,borderDash:[6,3],spanGaps:false});
      }
    }
    // The dot is Monarch's liquid total (which includes Stripe), so pair it with a
    // matching plan series rather than leaving it hovering next to the ex-Stripe line.
    if(_mSnap)ds.push({label:'Liquid + Stripe'+(inflationView?' (real)':''),data:[startLiqPlusStripeK,...R.map(r=>deflK(planLiquidComparable(r),r.yr))],borderColor:'#8b93f0',fill:false,tension:.35,pointRadius:0,pointHoverRadius:5,borderWidth:1.5,borderDash:[5,4]});
    const _mNwDot=_mDotDs(_mImpliedLiqK,'📍 Actual liquid + Stripe (Monarch)');if(_mNwDot)ds.push(_mNwDot);
    if(!reuseChart||!_updateChart(ds,nwLabels)){if(!reuseChart)ca.innerHTML='<canvas id="cv" style="height:300px"></canvas>';const ctx2=document.getElementById('cv').getContext('2d');charts.main=new Chart(ctx2,{type:'line',data:{labels:nwLabels,datasets:ds},options:po})}
  } else {
    if(_projView==='cashflow'){
      const dsCF=[{label:'Surplus',data:R.map(r=>Math.round(r.surp/1000)),backgroundColor:R.map(r=>r.surp>=0?'rgba(26,135,84,.78)':'rgba(205,61,100,.78)'),borderRadius:4,borderSkipped:false,maxBarThickness:26}];
      if(compareMode)scenarios.forEach(s=>{dsCF.push({label:s.name,data:s.results.R.map(r=>Math.round(r.surp/1000)),type:'line',borderColor:s.color,fill:false,tension:.3,pointRadius:2,pointBackgroundColor:s.color,borderWidth:3})});
      if(!reuseChart||!_updateChart(dsCF,labels))charts.main=new Chart(ctx,{type:'bar',data:{labels,datasets:dsCF},options:opts});
    } else {
      const dsInc=[{label:'Norm Gross',data:R.map(r=>Math.round(r.normG/1000)),backgroundColor:_barGrad('#0073e6',.85,.5),borderRadius:4,borderSkipped:false},{label:'Nancy Gross',data:R.map(r=>Math.round(r.nancyG/1000)),backgroundColor:_barGrad('#7c3aed',.85,.5),borderRadius:4,borderSkipped:false},{label:'Tax',data:R.map(r=>-Math.round(r.tax/1000)),backgroundColor:_barGrad('#cd3d64',.7,.4),borderRadius:4,borderSkipped:false}];
      if(!reuseChart||!_updateChart(dsInc,labels))charts.main=new Chart(ctx,{type:'bar',data:{labels,datasets:dsInc},options:{...opts,scales:{x:{stacked:true,...opts.scales.x},y:{stacked:true,...opts.scales.y,ticks:{...opts.scales.y.ticks,callback:v=>fmtK(v)}}}}});
    }
  }
  document.getElementById('summaries').innerHTML=`
    <div class="sc"><h3>🏠 Home</h3><p><span class="mono" style="font-weight:600;color:var(--tx)">${fmt(P.homePrice)}</span> in ${P.homePurchaseYear}<br>${P.downPctg}% down · <span class="mono">${fmt(mm)}/mo</span> at ${P.mortgageRate}%</p></div>
    <div class="sc"><h3>📊 Tax Engine</h3><p>Fed MFJ 2026 + NYS + NYC + FICA<br>SALT $40.4K w/ phaseout above $505K<br>CTC $2.2K/kid w/ AGI phaseout<br>${P.nancySoloPractice?'Nancy: QBI + home office + SE':'Nancy: W2'}</p></div>
    <div class="sc"><h3>💡 Per-Kid Costs</h3><p>Infant +$9K · School +$10K · Teen +$14K/yr<br><em style="font-size:7.5px;color:var(--t3)">${(P.expenseInflation*100).toFixed(1)}%/yr inflation · ${P.numKids} kids</em></p></div>`;
}

let _stripeYear=null;

// ── Stripe equity dashboard ──────────────────────────────────────────────
// The private-company CFO view: what vested, what became cash, what compounded, and how
// concentrated the household has become as a result.
function renderStripeTab(R,P){
  const ca=document.getElementById('chartArea');
  const sy=P.planStartYear||2026;
  const yr=(_stripeYear&&R.some(r=>r.yr===_stripeYear))?_stripeYear:sy;
  const row=R.find(r=>r.yr===yr)||R[0];
  const last=R[R.length-1];
  const tot=R.reduce((a,r)=>({n:a.n+r.sNew,s:a.s+r.sSold,k:a.k+r.sRet,h:a.h+(r.sHold||0),gt:a.gt+(r.sGainTax||0)}),{n:0,s:0,k:0,h:0,gt:0});
  const basis=last.sBasis,appr=last.sEnd-basis;
  const V='#6772e5';
  const hasAny=tot.n>0||(P.startingStripeEquity||0)>0;

  // Waterfall proportions for the selected year
  const newEq=row.sNew,soldPct=newEq>0?row.sSold/newEq*100:0,keptPct=100-soldPct;
  // What this year's retained stock is worth at the end of the plan, compounding forward
  // at each year's own assumed rate.
  let fv=row.sRet;
  for(let i=R.indexOf(row)+1;i<R.length;i++)fv*=(1+R[i].sRate);

  const tile=(lbl,val,sub,col)=>`<div class="kpi" style="border-color:${col?'rgba(103,114,229,.25)':'var(--bd)'}">
    <div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:3px">${lbl}</div>
    <div style="font-size:17px;font-weight:800;font-family:'SF Mono',ui-monospace,monospace;color:${col||'var(--tx)'};letter-spacing:-.4px">${val}</div>
    ${sub?`<div style="font-size:8.5px;color:var(--t3);margin-top:2px">${sub}</div>`:''}
  </div>`;

  let h='';
  if(!hasAny){
    h+=`<div class="sc" style="margin-bottom:12px;border-color:rgba(103,114,229,.25)">
      <h3>◆ No Stripe equity in this plan</h3>
      <p style="line-height:1.6">Your plan currently models no existing Stripe holdings and no stock grants. Add a grant under <strong>Norm — Compensation</strong>, or set <strong>Existing Stripe equity</strong> in the Stripe panel.<br>
      <em style="font-size:8px;color:var(--t3)">If your Stripe balance is already inside Starting Liquid, use the reclassify action in that panel — it moves the money without changing your net worth.</em></p>
    </div>`;
  }

  h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
    <span style="font-size:11px;font-weight:700;color:var(--tx)">◆ Stripe Equity</span>
    <span style="font-size:9px;color:var(--t3)">Year</span>
    <select onchange="setStripeYear(this.value)" style="padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--s1);color:var(--tx);font-family:inherit;font-size:10px;outline:none">
      ${R.map(r=>`<option value="${r.yr}"${r.yr===yr?' selected':''}>${r.yr}</option>`).join('')}
    </select>
  </div>`;

  h+=`<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
    ${tile('Stripe equity · start of '+yr,fmt(row.sBeg),'carried in from '+(yr>sy?yr-1:'today'),V)}
    ${tile('New equity in '+yr,fmt(row.sNew),'vests in 4 quarterly lots',V)}
    ${tile('Cash taken',fmt(row.sSold),row.sNew>0?soldPct.toFixed(0)+'% of the year’s vest':'—','#cd3d64')}
    ${tile('Equity retained',fmt(row.sRet),row.sNew>0?keptPct.toFixed(0)+'% kept':'—','#1a8754')}
    ${tile('Projected value · end '+yr,fmt(row.sEnd),'after '+(row.sRate*100).toFixed(0)+'% assumed return',V)}
    ${tile('Stripe % of net worth',(row.sPct*100).toFixed(0)+'%',fmt(row.sEnd)+' of '+fmt(row.nw),row.sPct>0.5?'#cd3d64':V)}
  </div>`;
  if(row.sHold>0){
    h+=`<div class="sc" style="margin-bottom:12px;border-color:rgba(103,114,229,.3)">
      <h3>◆ Held shares sold in ${yr}</h3>
      <p style="line-height:1.6">This year's vest and the portfolio (down to its ${fmt(P.liquidReserveFloor??500000)} reserve floor) still left ${fmt(row.need-row.sSold)} uncovered, so <strong style="color:#6772e5">${fmt(row.sHold)}</strong> of Stripe you already held was sold — realising <strong>${fmt(row.sGainTax)}</strong> of capital-gains tax, just <strong>${(row.sGainTax/row.sHold*100).toFixed(1)}%</strong> of the proceeds.
      <br><br>That rate is low because the sale takes your <em>least appreciated</em> lots first: the newest shares carry almost no gain above their vest price, so they cost almost nothing in tax to sell. Selling at vest is still free; this is the next cheapest thing.</p>
    </div>`;
  }

  // ── Waterfall ──
  if(row.sNew>0){
    h+=`<div class="sc" style="margin-bottom:12px">
      <h3>💧 Where ${yr}’s vest went</h3>
      <div style="display:flex;height:34px;border-radius:7px;overflow:hidden;margin:10px 0 6px;border:1px solid var(--bd)">
        ${row.sSold>0?`<div style="width:${soldPct}%;background:linear-gradient(135deg,#e0577f,#cd3d64);display:flex;align-items:center;justify-content:center;color:#fff;font-size:9.5px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap">${soldPct>16?fmt(row.sSold)+' → cash':''}</div>`:''}
        ${row.sRet>0?`<div style="width:${keptPct}%;background:linear-gradient(135deg,#7c85ea,#6772e5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:9.5px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap">${keptPct>16?fmt(row.sRet)+' retained':''}</div>`:''}
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:10.5px;color:var(--t2);line-height:1.7">
        <strong style="color:${V};font-family:'SF Mono',monospace">${fmt(row.sNew)}</strong> vested
        <span style="color:var(--t3)">→</span>
        <strong style="color:#cd3d64;font-family:'SF Mono',monospace">${fmt(row.sSold)}</strong> covered ${row.need>0?`a ${fmt(row.need)} cash need`:'cash needs'}
        <span style="color:var(--t3)">→</span>
        <strong style="color:#1a8754;font-family:'SF Mono',monospace">${fmt(row.sRet)}</strong> kept
        ${row.sRet>0&&R.indexOf(row)<R.length-1?`<span style="color:var(--t3)">→</span> worth <strong style="color:${V};font-family:'SF Mono',monospace">${fmt(Math.round(fv))}</strong> by ${last.yr}`:''}
      </div>
      ${row.dpOut>0?`<div style="font-size:8.5px;color:var(--t3);margin-top:6px;font-style:italic">Includes the ${fmt(row.dpOut)} down payment — a real cash outflow, so vesting stock helps fund it.</div>`:''}
      ${row.sold>0?`<div style="font-size:8.5px;color:var(--a);margin-top:4px">The year’s vest wasn’t enough — a further ${fmt(row.sold)} came out of the diversified portfolio.</div>`:''}
    </div>`;
  }

  // ── Cumulative ──
  h+=`<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
    ${tile('Total stock received',fmt(tot.n),sy+'–'+last.yr,V)}
    ${tile('Total sold for cash',fmt(tot.s),tot.n>0?(tot.s/tot.n*100).toFixed(0)+'% of everything vested':'—','#cd3d64')}
    ${tile('Total retained',fmt(tot.k),'at vest-date value','#1a8754')}
    ${tile('Cumulative appreciation',fmt(appr),'above '+fmt(basis)+' of basis',V)}
    ${tile('Sold from holdings',fmt(tot.h),tot.h>0?'to defend the liquid floor':'never needed','#cd3d64')}
    ${tile('Tax on Stripe gains',fmt(tot.gt),tot.gt>0?'realised on held shares sold':'no held shares ever sold','var(--t3)')}
    ${tile('Stripe at '+last.yr,fmt(last.sEnd),(last.sPct*100).toFixed(0)+'% of net worth',V)}
  </div>`;

  // The waterfall never auto-sells previously retained or pre-existing Stripe. That is
  // deliberate, but it means a plan CAN drive the diversified pool below zero while a large
  // Stripe balance sits untouched — an implicit unlimited overdraft. Say so plainly rather
  // than letting a negative "liquid floor" sit quietly next to an eight-figure equity line.
  const broke=R.filter(r=>r.liq<0);
  if(broke.length){
    const worst=R.reduce((a,b)=>b.liq<a.liq?b:a);
    h+=`<div class="sc" style="margin-bottom:12px;border-color:rgba(205,61,100,.45);background:rgba(205,61,100,.06)">
      <h3 style="color:#cd3d64">⚠️ The plan runs out of spendable money</h3>
      <p style="line-height:1.6">Diversified liquid goes negative in <strong>${broke.length}</strong> ${broke.length===1?'year':'years'}, bottoming at <strong>${fmt(worst.liq)}</strong> in ${worst.yr}.
      <br><br>This only happens once the vest, the portfolio and every Stripe share you hold have all been exhausted — so it is genuine insolvency, not a modelling artefact. Raise cash comp, cut spending, or move the home purchase.</p>
    </div>`;
  }

  if(row.sPct>0.5){
    h+=`<div class="sc" style="margin-bottom:12px;border-color:rgba(205,61,100,.3);background:rgba(205,61,100,.04)">
      <h3 style="color:#cd3d64">⚠️ Concentration</h3>
      <p style="line-height:1.6">Stripe is <strong>${(row.sPct*100).toFixed(0)}%</strong> of net worth in ${yr}. That is a single private position you cannot freely sell, priced off assumptions you set yourself — not a diversified holding. Compare a <em>Sell a fixed %</em> or <em>Maintain a liquid floor</em> policy to see the tradeoff.</p>
    </div>`;
  }

  // ── Auditable year-by-year ledger ──
  h+=`<div class="tw"><table><thead><tr>${['Year','Beginning','New equity','Vest sold','Held sold','Gains tax','Appreciation','Ending','% of NW','Return'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${
    R.map(r=>`<tr style="background:${r.yr===yr?'rgba(103,114,229,.07)':''}">
      <td style="font-weight:700;color:var(--tx)">${r.yr}</td>
      <td>${fmt(r.sBeg)}</td>
      <td style="color:${V}">${r.sNew>0?fmt(r.sNew):'—'}</td>
      <td style="color:${r.sSold>0?'#cd3d64':'var(--t3)'}">${r.sSold>0?fmt(r.sSold):'—'}</td>

// Actual synced Stripe balance vs. the plan's assumption. Synced values are shown, never
// silently written — the planning input stays under the user's control.
function renderStripeReconcile(actual){
  actual=Math.round(actual);
  const planned=Math.round(P.startingStripeEquity||0);
  if(!actual)return'';
  if(Math.abs(actual-planned)<1000){
    return`<div style="font-size:8.5px;color:var(--g);padding:0 10px 5px">✓ Plan matches this balance.</div>`;
  }
  const move=actual-planned;
  const affordable=move<=0||(P.startingLiquid||0)>=move;
  return`<div style="padding:6px 10px 7px;margin:-2px 0 5px;background:rgba(103,114,229,.05);border:1px solid rgba(103,114,229,.18);border-top:none;border-radius:0 0 6px 6px;font-size:8.5px;line-height:1.5;color:var(--t2)">
    Plan assumes <strong>${fmt(planned)}</strong> of Stripe equity ${planned===0?'(your Stripe balance is probably still counted inside Starting Liquid)':''}.
    ${affordable
      ? `<button onclick="reclassifyStripe(${actual})" style="display:inline-block;margin-top:3px;background:#6772e5;color:#fff;border:none;border-radius:5px;padding:3px 7px;font-family:inherit;font-size:8px;font-weight:600;cursor:pointer">Reclassify ${fmtF(Math.abs(move))} ${move>0?'Liquid → Stripe':'Stripe → Liquid'}</button>`
      : `<span style="color:var(--t3)">Starting Liquid is too small to reclassify this without inventing wealth.</span>`}
  </div>`;
}

// Monarch's "liquid" total sums every non-retirement account, which INCLUDES the Stripe
// brokerage account. The plan now splits that same money into a diversified pool and a
// Stripe pool, so the like-for-like plan figure is the two added back together. Comparing
// against r.liq alone would show the household as wildly ahead of plan.
function planLiquidComparable(r){return (r?r.liq:0)+(r?r.sEnd:0)}

// Shared donut builder. The portfolio already had one hand-rolled doughnut; every pie added
// since routes through here so legends, tooltips and in-slice labels stay consistent.
function makeDonut(canvasId,labels,data,colors,fmtVal,showLegend){
  const el=document.getElementById(canvasId);
  if(!el||!data.length)return null;
  const total=data.reduce((a,b)=>a+b,0);
  const pctOf=v=>total>0?v/total*100:0;
  return new Chart(el.getContext('2d'),{
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors.slice(0,data.length),borderWidth:2,borderColor:'rgba(255,255,255,.85)'}]},
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'60%',
      plugins:{
        // Off where the card already lists each slice with its dollar value — two legends
        // for one chart is noise, and the itemised one carries strictly more information.
        legend:{display:showLegend===true,position:'bottom',labels:{font:{size:9.5,family:"'Inter',sans-serif"},color:'#425466',padding:8,
          usePointStyle:true,pointStyle:'circle',boxWidth:7,boxHeight:7,
          generateLabels:chart=>{const ds=chart.data.datasets[0];
            return chart.data.labels.map((lbl,i)=>({text:`${lbl} ${pctOf(ds.data[i]).toFixed(0)}%`,
              fillStyle:ds.backgroundColor[i],strokeStyle:'transparent',hidden:false,index:i}));}}},
        tooltip:{..._GLASS_TOOLTIP,callbacks:{label:ctx=>`  ${ctx.label}: ${(fmtVal||fmt)(ctx.raw)} (${pctOf(ctx.raw).toFixed(1)}%)`}},
        datalabels:{color:'#fff',font:{size:9.5,weight:'bold',family:"'Inter',sans-serif"},
          formatter:v=>pctOf(v)>=7?pctOf(v).toFixed(0)+'%':'',anchor:'center',align:'center'},
      }
    },
    plugins:[ChartDataLabels]
  });
}
