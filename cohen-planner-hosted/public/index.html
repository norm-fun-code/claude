let _cachedBand=null; // {mode, sig, band:{p10,p50,p90}} — last-computed band, avoids recompute on every render
// Signature of every P field the projection actually reads. runMonteCarlo()/run() depend on
// nearly all of P (return rate, vol, home price/down/rate/year, income assumptions, etc.), so
// keying staleness on just {mode, planStartYear} let the band silently go stale — and stay
// stale looking authoritative — the moment any OTHER slider (e.g. Investment Return) moved.

function _recomputeBandIfStale(){
  const sig=_bandParamSig();
  if(!_cachedBand||_cachedBand.sig!==sig){
    showToast('Running 500 market scenarios for confidence band…','blue');
    setTimeout(()=>{
      try{const mc=runMonteCarlo(P,500,_mcMode);_cachedBand={sig,mode:_mcMode,band:mc.band};}
      catch(e){showToast('Simulation failed: '+e.message,'red');_bandMode=false;}
      render();
    },30);
    return true; // async recompute kicked off
  }
  return false;
}

let _bandRefreshTimer=null;

  clearTimeout(_bandRefreshTimer);

// ═══ STORY MODE — scroll/click-through walkthrough of the plan's milestones ═══
function _storyMilestones(R,P){
  const sy=P.planStartYear||2026;
  const kids=[P.kid1Birth];
  if(P.numKids>=2)kids.push(P.kid2Birth);
  if(P.numKids>=3)kids.push(P.kid3Birth);
  if(P.numKids>=4)kids.push(P.kid4Birth);
  const ms=[];
  ms.push({yr:sy,icon:'🚀',title:'Today',sub:`Starting liquid: ${fmt(P.startingLiquid)}`});
  // Two adults plus the children born so far. `i+2` counted the first child as a household
  // of two, which is the parents' own number with the baby standing in for one of them.
  kids.forEach((kb,i)=>{if(kb>=sy)ms.push({yr:kb,icon:'👶',title:`Kid ${i+1} born`,
    sub:`A household of ${i+3} — two of you and ${i+1===1?'a baby':`${i+1} children`}`})});
  if(P.homePurchaseYear>=sy)ms.push({yr:P.homePurchaseYear,icon:'🏠',title:'Home purchase',sub:`${fmt(P.homePrice*(P.downPctg/100))} down on a ${fmt(P.homePrice)} home`});
  const firstTu=R.find(r=>r.tu>0);
  if(firstTu)ms.push({yr:firstTu.yr,icon:'🎓',title:'Tuition begins',sub:`First year of school costs: ${fmt(firstTu.tu)}`});
  const peakTu=R.reduce((a,b)=>b.tu>a.tu?b:a,R[0]);
  if(peakTu&&peakTu.tu>0)ms.push({yr:peakTu.yr,icon:'📚',title:'Peak tuition year',sub:`${fmt(peakTu.tu)}/yr — the most expensive school year`});
  const nancyMatYr=P.nancyRampYear+P.nancyRampYears;
  const nancyRow=R.find(r=>r.yr===nancyMatYr);
  if(nancyRow)ms.push({yr:nancyMatYr,icon:'💼',title:"Nancy's practice matures",sub:`Full client roster reached — ${fmt(nancyRow.nancyG)}/yr gross`});
  const last=R[R.length-1];
  ms.push({yr:last.yr,icon:'🏁',title:'End of plan',
    sub:`${fmt(last.nwExRetHome)} outside retirement and the house — ${fmt(last.k401)} more sits in retirement`});
  const seen=new Set();
  return ms.filter(m=>{if(seen.has(m.yr))return false;seen.add(m.yr);return true})
    .sort((a,b)=>a.yr-b.yr)
    // "Today" (yr===sy) is the true starting point, before any year of growth or spending,
    // so it uses the opening figures directly rather than R[0], which is already the
    // year-END value. Net worth is the WHOLE opening position: reading startingLiquid into
    // both slots printed the same number twice and quietly dropped Stripe and retirement.
    // The walkthrough tracks what is actually yours to move: no retirement, no home equity.
    // `nwExRetHome` is the engine's own name for that, so the card, the sparkline and the
    // closing milestone cannot drift onto three different definitions of the same word.
    .map(m=>({...m,row:m.yr===sy
      ?{nwExRetHome:Math.round((P.startingLiquid||0)+(P.startingStripeEquity||0)
          -Math.abs(Number(P.otherDebt||0))),liq:Math.round(P.startingLiquid||0)}
      :(R.find(r=>r.yr===m.yr)||R[0])}));
}
// Like _sparkSVG, but highlights a specific index (not just the last point) with a guide line.
function _sparkSVGAt(vals,w,h,color,idx){
  if(!vals||vals.length<2)return'';
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1,pad=4;
  const pts=vals.map((v,i)=>[pad+i/(vals.length-1)*(w-2*pad), h-pad-((v-min)/rng)*(h-2*pad)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${(w-pad).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
  const hi=idx>=0&&idx<pts.length?pts[idx]:pts[pts.length-1];
  const gid='sa'+(''+color).replace(/[^a-z0-9]/gi,'');
  return `<svg class="story-spark-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${hi[0].toFixed(1)}" y1="${pad}" x2="${hi[0].toFixed(1)}" y2="${h-pad}" stroke="${color}" stroke-width="1" stroke-dasharray="2,2" opacity=".4"/>
    <circle cx="${hi[0].toFixed(1)}" cy="${hi[1].toFixed(1)}" r="4.5" fill="${color}"/>
    <circle cx="${hi[0].toFixed(1)}" cy="${hi[1].toFixed(1)}" r="8" fill="${color}" opacity=".2"/>
  </svg>`;
}

  if(dots)dots.innerHTML=milestones.map((_,i)=>`<span class="story-dot ${i===idx?'active':''}" onclick="_storyState.idx=${i};_renderStory()"></span>`).join('');

    const chats=Array.isArray(raw)?raw:[];

async function advLoadMessages(id){

      advisorChats[id].messages=data.messages||[];

    }
  }catch(e){}
}

function advUuid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function advEscape(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function advMarkdown(text){
  // Escape the ENTIRE input first so any raw HTML in the model output or reloaded
  // chat history is inert (prevents stored XSS). Markdown tokens (* ` # | -) are
  // unaffected by escaping, so the rules below still match; inner advEscape calls
  // are no longer needed since everything is already escaped.
  let h=advEscape(text);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre>${c.trim()}</pre>`);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\n((?:\|.+\|\n)+)/g,(m,tbl)=>{
    const rows=tbl.trim().split('\n');if(rows.length<2)return m;
    const hdr=rows[0].split('|').slice(1,-1).map(c=>c.trim());
    const isSep=rows[1].match(/^[\s|:\-]+$/);
    const body=isSep?rows.slice(2):rows.slice(1);
    let t='<table><thead><tr>'+hdr.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
    body.forEach(r=>{const cells=r.split('|').slice(1,-1).map(c=>c.trim());t+='<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>'});
    return '\n'+t+'</tbody></table>';
  });
  h=h.replace(/^### (.+)$/gm,(m,t)=>`<h3>${t}</h3>`);
  h=h.replace(/^#### (.+)$/gm,(m,t)=>`<h4>${t}</h4>`);
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?:^|\n)((?:[\-\*] .+\n?)+)/g,(m,l)=>{const items=l.trim().split('\n').map(x=>x.replace(/^[\-\*] /,''));return '\n<ul>'+items.map(i=>`<li>${i}</li>`).join('')+'</ul>'});
  h=h.split('\n\n').map(p=>{p=p.trim();if(!p)return '';if(p.startsWith('<'))return p;return '<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('\n');
  return h;
}

function advToggleRail(force){
  const rail=document.getElementById('advRail'),btn=document.getElementById('advRailBtn');
  const scrim=document.getElementById('advScrim');
  if(!rail)return;
  const open=force!=null?force:rail.hidden;
  rail.hidden=!open;
  if(scrim)scrim.hidden=!open;
  if(btn)btn.setAttribute('aria-expanded',String(open));
  document.body.classList.toggle('adv-sheet-open',open);
  if(open){
    advRenderRail();
    // Focus moves into the sheet so a keyboard or screen-reader user lands where the
    // content now is, and Escape closes it from anywhere.
    const first=rail.querySelector('.adv-rail-item,button');
    if(first&&typeof first.focus==='function')first.focus({preventScroll:true});
  } else if(btn&&typeof btn.focus==='function')btn.focus({preventScroll:true});
}

function advRenderRail(){

    return `<div class="adv-rail-item ${c.id===advisorActiveChatId?'active':''}" onclick="advSwitchChat('${c.id}')">

      </div>
    </div>`;

function advRelTime(ts){
  const diff=Date.now()-ts;
  const min=Math.floor(diff/60000);
  if(min<1)return 'now';
  if(min<60)return min+'m';
  const hr=Math.floor(min/60);
  if(hr<24)return hr+'h';
  const d=Math.floor(hr/24);
  if(d<7)return d+'d';
  const w=Math.floor(d/7);
  if(w<4)return w+'w';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function advImportChats(){

  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;

    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.chats||typeof data.chats!=='object')throw new Error('Invalid file format');
        const incoming=Object.values(data.chats);
        if(!confirm(`Import ${incoming.length} conversation${incoming.length===1?'':'s'}? Merges with existing chats.`))return;

async function advSendStream(text,chat,liveContext,thinking){
  try{
    const res=await fetch('/api/advisor/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chatId:advisorActiveChatId,message:text,systemPrompt:liveContext,messages:advisorConversation})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||`HTTP ${res.status}`)}
    thinking.innerHTML='';
    let fullReply='';let toolNote='';const structuredResults=[];
    const _renderBubble=()=>{thinking.innerHTML=toolNote+advMarkdown(fullReply);const m=document.getElementById('advMsgs');if(m)m.scrollTop=m.scrollHeight;};
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    outer:while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        let payload;try{payload=JSON.parse(line.slice(6))}catch{continue}
        if(payload.error)throw new Error(payload.error);
        if(payload.tool_call){
          const nm=(payload.tool_call.name||'').replace(/^monarch_/,'');
          toolNote=`<div class="adv-tool">${advEscape(nm)}</div>`;
          _renderBubble();
        }
        if(payload.tool_result)structuredResults.push(payload.tool_result);
        if(payload.delta){
          fullReply+=payload.delta;
          _renderBubble();
        }
        if(payload.done)break outer;
      }
    }
    const answer=fullReply||'Sorry, no response. Try again?';
    thinking.innerHTML=(fullReply?'':toolNote)+advMarkdown(answer);
    advisorConversation.push({role:'assistant',content:answer,structuredResults});
    advRestoreStructured(structuredResults);
    chat.messages=advisorConversation;chat.updatedAt=Date.now();
    advRenderRail();
  }catch(err){
    thinking.innerHTML=`<p style="color:var(--r)"><strong>Error:</strong> ${advEscape(err.message)}</p><p style="font-size:11px;color:var(--t3);margin-top:4px">Check your connection and try again.</p>`;
    advisorConversation.pop();chat.messages=advisorConversation;
  }finally{
    document.getElementById('advSend').disabled=false;
    const inp=document.getElementById('advInput');if(inp)inp.focus();
  }
}

// Applies just the AI's specific proposed changes onto the TARGET scenario's own params —
// not the AI's full sandbox. The sandbox is always seeded from the LIVE plan (see
// advSendAgentic's currentParams:{...P}), so replacing a scenario's params with it wholesale
// would silently revert every field that scenario legitimately differs on (e.g. a distinct
// home price) back to the live plan's value, keeping only the one field the AI touched.
async function advUpdateExistingScenario(i){
  if(!advPendingProposals||!scenarios[i])return;
  const delta={};advPendingProposals.changes.forEach(c=>{delta[c.key]=c.value});
  const aiP={...D,...migrateP({...scenarios[i].params,...delta})};
  scenarios[i].params=aiP;
  scenarios[i].results=run(aiP);
  const s=scenarios[i];
  activeScenarioIdx=i;scenarioDirty=false;
  document.getElementById('advProposalsPanel')?.remove();
  advPendingProposals=null;
  showToast('✓ Updated scenario: "'+s.name+'"','green');
  buildControls();render();savePlannerState();
  try{
    const r=await fetch('/api/scenarios/'+s.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({params:s.params,results:s.results})});
    if(!r.ok)throw new Error('HTTP '+r.status);
  }catch(e){console.error('advUpdateExistingScenario failed:',e);setSyncStatus('error')}
}

// Applies the AI's proposed changes directly to the live plan — the only destination that
// actually changes Norm's real numbers, so it requires an explicit confirm on top of the
// explicit button click (the diff was already reviewed in the panel above).
function advApplyToLivePlan(){
  if(!advPendingProposals||!advProposalIsCurrent())return;
  const n=advPendingProposals.changes.length;
  if(!showConfirm(`Apply ${n} change${n===1?'':'s'} directly to your live plan? This updates your actual numbers, not just a scenario.`))return;
  // Apply just the specific changed keys onto the CURRENT live plan (not the AI's possibly-
  // stale sandbox snapshot) — if the user tweaked other sliders while this proposal was
  // pending, those edits are preserved instead of silently reverted.
  const delta={};advPendingProposals.changes.forEach(c=>{delta[c.key]=c.value});
  P={...D,...migrateP({...P,...delta})};
  // Stay inside whatever case is loaded and mark it edited, rather than ejecting. The
  // changes are applied either way; this just preserves the option to save them back into
  // the case instead of forcing "save as new".
  markDirty();
  document.getElementById('advProposalsPanel')?.remove();
  advPendingProposals=null;
  showToast('✓ Applied to your live plan','green');
  buildControls();render();savePlannerState();
}

function advPreviewProposals(){
  if(!advPendingProposals)return;
  const aiP={...D,...migrateP({...advPendingProposals.aiParams})};
  const tmp=P;P=aiP;
  activeTab='nw';
  document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='nw'));
  render();
  P=tmp;
  showToast('Showing AI-proposed plan on chart. Your actual plan is unchanged.','green');
}

// ═══ INIT ═══
loadAdvisorState();
// Handle OAuth redirect results
(()=>{
  const p=new URLSearchParams(window.location.search);
  if(p.has('monarch_connected')){showToast('✓ Monarch connected!','green');history.replaceState({},'','/');setTimeout(syncMonarch,500);}
  if(p.has('monarch_error')){showToast('Monarch error: '+p.get('monarch_error'),'red');history.replaceState({},'','/');}
})();
loadSnapshots().then(()=>{loadFromServer()});

window.onerror=function(msg,src,line,col,err){
  showToast('JS Error: '+msg+' (line '+line+')','red');
  console.error('Global error:',err||msg);
};
</script>
