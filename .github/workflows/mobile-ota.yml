name: Mobile OTA Update

# Auto-publish an over-the-air EAS Update whenever mobile JS/TS lands on main, so
# app changes reach installed devices without a rebuild or App Store review.
# Native changes (new modules, permissions, version bumps) still need a full
# `eas build` — those aren't shippable via OTA and aren't handled here.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ota.yml'

# Don't pile up overlapping update publishes; let the latest win.
concurrency:
  group: mobile-ota
  cancel-in-progress: true

jobs:
  ota:
    runs-on: ubuntu-latest
    # Skip entirely if no Expo token is configured, so the repo doesn't fail
    # for anyone who hasn't set up EAS. (Set EXPO_TOKEN in repo secrets.)
    if: ${{ github.repository == 'norm-fun-code/claude' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile deps
        working-directory: mobile
        run: npm install --no-audit --no-fund

      # Typecheck before publishing — never push a broken bundle to phones.
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update (production channel)
        working-directory: mobile
        # These EXPO_PUBLIC_* vars get baked into the JS bundle, exactly like the
        # native build does via eas.json. Without them the OTA bundle ships with an
        # empty API base/token → every API call 401s on reopen ("couldn't save").
        env:
          EXPO_PUBLIC_API_BASE: ${{ vars.EXPO_PUBLIC_API_BASE || 'https://backend-production-0902.up.railway.app' }}
          EXPO_PUBLIC_API_TOKEN: ${{ secrets.EXPO_PUBLIC_API_TOKEN }}
          # Pass the commit message via env (not inline ${{ }}) so dashes,
          # newlines, or quotes in it can't be parsed as eas CLI flags — a
          # message starting a line with "- " previously made `eas update` think
          # it was given options and fail.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_TOKEN" ]; then
            echo "::error::EXPO_PUBLIC_API_TOKEN secret is not set — refusing to publish a token-less OTA bundle (would 401 on every request)."
            exit 1
          fi
          # First line only, and pass with = + quotes so it's never treated as flags.
          MSG="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          eas update --branch production --message="$MSG" --non-interactive
