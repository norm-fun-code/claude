# Daily scraper for Noah Kahan @ Citi Field tickets.
#
# Setup
# -----
# 1. Add repository secrets (Settings → Secrets and variables → Actions):
#      GMAIL_ADDRESS         your Gmail address (e.g. you@gmail.com)
#      GMAIL_APP_PASSWORD    16-char App Password — myaccount.google.com →
#                            Security → 2-Step Verification → App Passwords
#      NOTIFY_EMAIL          address to receive alerts (can equal GMAIL_ADDRESS)
#      SEATGEEK_CLIENT_ID    optional — free from https://seatgeek.com/account/develop
#      TICKETMASTER_API_KEY  optional — free from https://developer-acct.ticketmaster.com
# 2. Ensure Actions has write permissions for issues:
#      Settings → Actions → General → Workflow permissions → "Read and write".
# 3. Subscribe to the `noah-kahan-ticket-alert` label so you get notified.
#
# Filter
# ------
#   - Sections 1–9 or 100–139 at Citi Field (field/lower bowl)
#   - At least 2 tickets in the same listing
#   - Under $300 per ticket
#
# Behavior
# --------
#   - Runs daily at 14:00 UTC (~10am ET) and on manual dispatch.
#   - Opens one GitHub issue per matching listing, deduped by fingerprint.
#   - Opens a single "scraper-health" issue if EVERY source returns zero.

name: Noah Kahan ticket watcher

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      event_date:
        description: "Event date (YYYY-MM-DD)"
        required: false
        default: "2026-07-19"
      max_price:
        description: "Max price per ticket (raise temporarily for testing)"
        required: false
        default: "300"

permissions:
  contents: read
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ticket_scraper/requirements.txt

      - run: pip install -r ticket_scraper/requirements.txt

      - name: Run filter tests
        run: python -m ticket_scraper.test_filter

      - name: Scrape and alert
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_DATE: ${{ inputs.event_date || '2026-07-19' }}
          MAX_PRICE_PER_TICKET: ${{ inputs.max_price || '300' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python -m ticket_scraper.scrape
